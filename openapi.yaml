                $ref: '#/components/schemas/ErrorResponse'

  /generate/inpaint/video:
    post:
      tags: [generation]
      summary: Video temporal inpaint (regenerate a time range of a clip, MiniMax-H3)
      description: |
        Regenerates the frames in
        `[regenerate_start_frame, regenerate_end_frame)` of an uploaded `video`
        clip and preserves the rest. The output is the same length as the
        TRIMMED input, which is why there is no `num_frames`/`total_frames`
        field.

        **Mechanism, in one sentence each.** The clip is VAE-encoded once and
        the latent frames OUTSIDE the range are pinned at the model's
        conditioning noise level and never denoised, so the selected range is
        generated against the rest of the clip. **Preserved frames are the
        input's own pixels, pasted back after decode**; the model conditions on
        their re-encoded latents while generating the selected range. The paste
        is unconditional and is what makes "preserved" true: without it the kept
        frames come back through a VAE round trip.

        Between the pasted and the generated pixels there is a cut at the range
        edges, the same kind `/generate/outpaint` carries. Exactness is claimed
        of the returned frames and of an FFV1 encode (`video_lossless`); the
        default H.264 mp4 is lossy for preserved and generated frames alike.

        **Granularity.** The video VAE stores frames in groups of up to 4
        (MiniMax-H3's temporal chunking is `(1, 4, 4, 4, 4)` repeating), and a
        group is regenerated or preserved as a whole. A requested range is
        therefore expanded OUTWARD to group boundaries -- never shrunk, so the
        caller's "regenerate this" wins over "keep that" at a boundary -- and
        the effective pixel span is reported in the response's `warnings[]` when
        the expansion changed the request.

        **Length.** Temporal inpaint samples the WHOLE clip, so the TRIMMED
        input must itself be a valid clip length (`17n + 5`, at least 124
        frames on MiniMax-H3). There is no enforced maximum: 362 frames is the
        model's DOCUMENTED trained-range top, not a decoder limit, so a longer
        on-grid trimmed clip is accepted with an untested-range `warnings[]`
        entry rather than refused. It is never snapped -- snapping a clip
        length means silently deleting frames the caller said to keep -- so an
        off-grid or too-short length is a 400 naming the nearest valid lengths
        and the trim that reaches them. This is the inverse of
        `/generate/outpaint/video`, where the grid binds the GENERATED span,
        and is why the two are separate endpoints.

        Since the trimmed clip is decoded and sampled in full, an upload whose
        RAW DECODE would exceed a fixed RAM budget (`width * height * 3` bytes
        per frame) is refused BEFORE decoding, with a cheap ffprobe-only check
        naming the resolution, frame count and budget -- this is a resource
        limit, not a length limit, and is unrelated to the 362-frame
        documented range above.

        **Range shape.** One contiguous range per request. The measured shape is
        one span with two boundaries; a multi-range request is a different
        object and is not expressed by this API.

        **Audio (`inpaint_video_audio_mode`, only relevant when `audio_enable`
        is true).**
        - `preserve_input` (the MiniMax-H3 default): the clip's own track is
          pinned as conditioning across the whole clip -- the same mechanism
          `/generate/img2vid`'s `input_audio` uses -- and muxed back verbatim,
          so the regenerated span has the original soundtrack both to condition
          on and in the output. Falls back to `regenerate`, with a warning, when
          the uploaded clip has no audio stream. The exactness of the muxed
          track is of the handoff: the mp4 encodes AAC unless `video_lossless`
          asks for FLAC.
        - `regenerate`: the audio rows are generated for the whole clip, so the
          preserved video span carries generated audio that need not match its
          visuals.
        - `regenerate_range`: the audio outside the regenerate range is
          pinned as conditioning (the same mechanism `preserve_input` uses),
          so the audio inside the range is generated with the surrounding
          original track as context. The preserved spans are then spliced
          back from the input clip's own audio after decode, with a short
          crossfade at the two boundaries, the same way the pixel path pastes
          preserved frames over a pin that has already been through the VAE.
          The pinned/free boundary snaps to the audio latent grid, which is
          finer than the video latent-group grid, so it can differ from the
          pixel range by up to one audio latent per side. Falls back to
          `regenerate`, with a warning, when the uploaded clip has no audio
          stream or when the regenerate range covers the whole clip (there is
          nothing to pin).

        **Spatial mask (optional).** Supply `spatial_mask_manifest` together
        with repeated `spatial_mask_ids` and `spatial_mask_files` to generate
        only selected image regions inside the temporal range. IDs are paired
        by position with the uploaded PNGs; upload filenames are ignored. The
        route decodes the manifest and PNGs and runs a cheap, keyframe-only
        pre-check before acquiring a GPU slot; the full, per-frame-exact check
        (rasterizing and max-pooling every frame of the regenerate range) runs
        once more, in the backend pipeline, before any GPU compute happens but
        after the slot is already reserved. A manifest that passes the route's
        pre-check can still be refused at that later point. The current
        pipeline consumes the validated timeline and decoded arrays through
        explicit keyword arguments.
        The manifest's `composite_feather_px` may be 0..128 pixels; feathering
        is applied only inside the selected temporal span. A full-clip
        temporal range is allowed when the spatial mask both generates and
        preserves at least one latent video token, evaluated over the
        aggregate of the whole regenerate range rather than any single
        keyframe. A manifest accepts at most 128 keyframes and 64 unique PNG
        assets. `composite_feather_px` at the edge of a preserved region is
        not bit-exact with the corresponding source pixels even inside the
        nominally preserved area, because feathering blends preserved and
        generated content across that band by design.

        **Outside the model card.** MiniMax documents `fl2va` for first- and
        last-frame conditioning with up to two images; pinning frames at
        interior positions uses the same mechanism and is not covered by the
        card. Every request through this endpoint therefore carries one
        `warnings[]` entry with code `minimax_h3_undocumented_conditioning`.

        **Requirements:**
        - A MiniMax-H3 `fl2va` model must be loaded. Every other NAMED variant
          is refused (the mid-clip pin is measured on `fl2va`: `ref2va` reads
          reference blocks instead, and a `hybrid` transformer generates on no
          endpoint), and so is every other architecture -- LTX-2.3's conditions
          carry whole clips at latent indices rather than pinning frames of the
          target itself.
        - `width`/`height` divisible by 32 and inside the model's envelope
          (short edge ≤ 768, long edge ≤ 1344).
        - Without a spatial mask, the range must leave something preserved. A
          full-clip range is allowed with a spatial mask only when it both
          generates and preserves at least one latent video token.
      operationId: generateInpaintVideo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InpaintVideoRequest'
            encoding:
              spatial_mask_files:
                style: form
                explode: true
              spatial_mask_ids:
                style: form
                explode: true
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 4242
                warnings:
                  - code: minimax_h3_undocumented_conditioning
                    message: >-
                      This request conditions MiniMax-H3 outside the documented shape
                      (frames of the clip pinned at interior positions while a range
                      between them is regenerated).
                image:
                  id: 91
                  filename: "inpaint_vid_20260808_120000_4242.mp4"
                  generation_type: "inpaint_vid"
        '400':
          description: >-
            Invalid parameters, or no MiniMax-H3 fl2va model loaded. Also
            returned when the TRIMMED clip is off-grid or shorter than the
            model's floor (it is never snapped -- there is no enforced
            maximum length to be too long against) -- when the upload's raw
            decode would exceed the RAM budget for its resolution and frame
            count, refused before decoding with a message naming both --
            when the range is empty or outside the clip, or when the range
            leaves nothing preserved (unless a spatial mask leaves at least
            one token preserved). It also covers an invalid spatial mask
            manifest, a manifest canvas that does not match the resolved
            output canvas, a malformed or empty mask PNG, and any mismatch or
            duplicate in the repeated `spatial_mask_ids`/`spatial_mask_files`
            mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            A model load or component switch is changing the loaded model.
            Generation is refused while the components are being replaced;
            retry once the switch completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The loaded model is degraded: a component switch or a failed load
            left the live components incomplete. Reload the model to recover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /video-mask/preview:
    post:
      tags: [video-mask]
      summary: Rasterize a spatial mask timeline into a downscaled preview sprite
      description: |
        Rasterizes the SAME spatial-mask-timeline manifest `/generate/inpaint/video`
        accepts, for an explicit list of frame numbers, and returns one
        downscaled grayscale PNG strip holding every requested frame side by
        side plus the metadata to slice it back apart. Exists so a UI can
        preview `hold`/`affine`/`sdf` interpolation without reimplementing
        `sdf`'s distance-transform morph in the browser -- this endpoint does
        no generation and loads no model.

        **Wire format**, identical to `/generate/inpaint/video`'s spatial mask
        fields: `spatial_mask_manifest` (required here; a preview has nothing
        to rasterize without one), plus for every unique `mask_id` the
        manifest references, EITHER a PNG in `spatial_mask_files` with its ID
        in `spatial_mask_ids`, OR a previously-uploaded asset's
        `temp_img://` reference in `spatial_mask_refs` with its ID in
        `spatial_mask_ref_ids` -- never both for the same ID. The ref form
        lets a debounced re-fetch (the common case: scrubbing the timeline,
        not redrawing a mask) send a few hundred bytes instead of
        re-uploading a PNG that has not changed. The manifest's own
        `canvas.width`/`canvas.height` define the mask's coordinate space;
        there is no separate width/height field.

        **`frames`**: the exact frame numbers (repeated form field) to
        rasterize, at most 64 per request and with no duplicates. A frame
        outside every keyframe's span still resolves through the manifest's
        own hold-past-the-last-keyframe behavior, but the total span the
        request implies (every keyframe's frame number union every requested
        frame) is bounded by an explicit RAM budget, since the rasterizer
        holds the whole implied span as one float32 buffer PER FRAME at the
        manifest's own canvas size -- a manifest with two widely separated
        keyframes cannot be used to force a huge rasterization by requesting
        one frame near each end. The budget is
        `MASK_PREVIEW_RASTER_BUDGET_BYTES` (2 GiB;
        `core/inference/video_mask_preview.py`) divided by the manifest
        canvas's own per-frame byte count, so a larger canvas allows a
        shorter span and a smaller canvas allows a longer one -- there is no
        fixed frame-count cap independent of canvas size.

        **`max_size`**: the longest edge, in pixels, of the returned per-frame
        tile (16..1024, default 256); the manifest canvas is downscaled to it
        with a Lanczos filter, preserving its aspect ratio. This is smaller
        than the canvas the actual generation rasterizes at, so an edge that
        looks sharp in this preview is not a claim about the exact per-pixel
        boundary a generation call with the same manifest produces.

        **Response**: the PNG sprite strip itself as the raw `image/png`
        response body (not base64-in-JSON -- a JSON body would cost the usual
        +33% base64 overhead on top of an already-repeated request), with
        every other field `VideoMaskPreviewResponse` describes packed as JSON
        into the `X-Mask-Preview-Meta` response header. All returned frames
        share one `frame_width`/`frame_height` (every frame in a timeline
        shares one canvas), and `frames[]` lists each requested frame's
        `x_offset` into the strip in ascending, de-duplicated frame order
        (not necessarily the order they were requested in).

        Applies the exact same upload-size and asset-count validation as
        `/generate/inpaint/video`'s spatial mask handling (at most 64 unique
        mask assets total across `spatial_mask_files` and `spatial_mask_refs`
        combined, each bounded by the manifest canvas's own uncompressed byte
        count) -- being a read-only preview does not relax it.

        **Caching**: identical requests (same manifest, frame list, max_size,
        and every referenced asset's own PNG content) are served from a
        bounded in-memory LRU without re-rasterizing, so repeated scrubbing
        over an unchanged mask costs no server-side work past the first
        fetch.
      operationId: previewVideoMask
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VideoMaskPreviewRequest'
            encoding:
              spatial_mask_files:
                style: form
                explode: true
              spatial_mask_ids:
                style: form
                explode: true
              spatial_mask_ref_ids:
                style: form
                explode: true
              spatial_mask_refs:
                style: form
                explode: true
              frames:
                style: form
                explode: true
      responses:
        '200':
          description: >-
            Preview rasterized successfully. The body is the raw PNG sprite
            strip; every other field of VideoMaskPreviewResponse is JSON in
            the X-Mask-Preview-Meta header.
          headers:
            X-Mask-Preview-Meta:
              description: JSON-encoded VideoMaskPreviewResponse (the PNG bytes themselves are the response body, not part of this header).
              schema:
                $ref: '#/components/schemas/VideoMaskPreviewResponse'
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            Invalid spatial_mask_manifest, a malformed or empty mask PNG, a
            mismatch or duplicate in the repeated spatial_mask_ids/
            spatial_mask_files or spatial_mask_ref_ids/spatial_mask_refs
            mapping, an ID used in both the upload and ref lists, too many
            unique mask assets, an empty or oversized frames list, a
            duplicate frame number, max_size outside 16..1024, a
            keyframe+requested-frame span whose rasterization would exceed
            this endpoint's 2 GiB preview RAM budget at the manifest's own
            canvas size (see `frames`' own description above for how that
            budget maps to a frame count), or a spatial_mask_refs entry that
            DID resolve but whose file exceeds the same per-asset byte cap a
            direct upload is held to -- unlike an unresolved ref (409 below),
            retrying this with the same file uploaded directly would fail
            the identical cap again, so it is reported as an invalid request
            rather than something a client should retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            One or more spatial_mask_refs entries could not be resolved at
            all (e.g. the temp file expired or was swept -- NOT the oversized
            case above, which is a 400). `detail` is a JSON object,
            `{"unresolved_ref_ids": [...]}`, naming the affected manifest
            mask IDs (not the refs themselves) -- retry the SAME request with
            exactly those IDs' assets moved to spatial_mask_ids/
            spatial_mask_files instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Video mask ref unresolved"
                detail: '{"unresolved_ref_ids": ["subject"]}'
                status_code: 409
                timestamp: "2026-08-12T12:00:00.000Z"
                path: "/api/v1/video-mask/preview"
        '500':
          description: Preview rasterization failed unexpectedly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/outpaint:
    post:
      tags: [generation]
      summary: Outpaint (spatially extend) an image onto a larger canvas
      description: |
        Places `image` (optionally trimmed via `input_crop_*` and resized to
        `place_width`x`place_height`) inside a larger `canvas_width`x`canvas_height`
        canvas at (`place_x`, `place_y`), fills the rest of the canvas per
        `outpaint_fill_mode`, and generates everything outside the placed
        rectangle according to the prompt. Internally delegates to the same
        all-architecture inpaint machinery as `/generate/inpaint` (no mask
        upload -- the mask is built server-side from the placement rect).

        **Strict preservation guarantee:** the placed input rectangle in the
        returned image is BYTE-IDENTICAL to the (cropped + resized) input,
        regardless of the loaded architecture or `denoising_strength`. This
        is enforced by an unconditional final pixel paste performed AFTER
        generation (see `core/inference/outpaint_utils.py`), independent of
        any per-architecture inpaint compositing.

        **Key parameters:**
        - `image`: Input image to place on the canvas (PNG/JPEG, binary file upload)
        - `canvas_width` / `canvas_height`: Output canvas size (rounded to a
          16px grid -- a fixed point for every supported architecture's own
          internal resolution rounding)
        - `place_x` / `place_y` / `place_width` / `place_height`: Placed
          rectangle on the canvas. `place_width`/`place_height` = 0 means
          "use the (cropped) input's native size"
        - `input_crop_x` / `input_crop_y` / `input_crop_w` / `input_crop_h`:
          Optional trim of the input BEFORE placement (0 width/height = to
          the input's edge)
        - `outpaint_fill_mode`: How the canvas outside the placed rect is
          pre-filled before denoising: `replicate` | `reflect` | `mean` | `noise`
        - `mask_blur`: Gaussian blur radius for the generation-boundary
          transition. Unlike `/generate/inpaint`, this blur is OUTWARD-ONLY
          (the softened band lies entirely outside the preserved rect)
        - `denoising_strength`: Defaults to 1.0 (full-strength generation of
          the surrounding canvas; the placed region is preserved regardless
          via the final pixel paste, not via this parameter)
      operationId: generateOutpaint
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OutpaintRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 5555555555
                warnings: []
                image:
                  id: 87
                  filename: "outpaint_20260715_123456_5555555555.png"
                  generation_type: "outpaint"
        '400':
          description: >-
            Invalid parameters (including degenerate placement geometry). Refused with a 4xx when the loaded model is not an image
            model: a video model (LTX-2.3, MiniMax-H3) or an audio model
            (ACE-Step) is rejected here by architecture, each with its own
            reason and the endpoint to use instead. The suggested endpoint matches the
            request shape of the route that was called (img2img -> /generate/img2vid
            or /generate/aud2aud, inpaint -> /generate/inpaint/video on MiniMax-H3
            or /generate/aud2aud, outpaint -> /generate/outpaint/video or
            /generate/outpaint/audio), not always the text-only one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            A model load or component switch is changing the loaded model.
            Generation is refused while the components are being replaced;
            retry once the switch completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The loaded model is degraded: a component switch or a failed load
            left the live components incomplete. Reload the model to recover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/outpaint/video:
    post:
      tags: [generation]
      summary: Video temporal outpaint (place a clip at an offset in a longer timeline, LTX-2.3 / MiniMax-H3)
      description: |
        Places a (optionally trimmed) input `video` clip at a frame offset
        inside a LONGER `total_frames` output timeline and generates the
        frames before/after with a loaded video model.

        **On LTX-2.3** this delegates to the stock
        `diffusers.LTX2ConditionPipeline` (`LTX2VideoCondition`) -- no new
        denoise loop, no mask upload -- and the clip may be placed at ANY
        offset, because that pipeline's condition addresses an arbitrary latent
        frame.

        **On MiniMax-H3 the placement is restricted to the timeline's
        boundaries**, and the restriction is architectural rather than a
        limitation of this endpoint: MiniMax-H3 conditions on the FIRST and/or
        LAST frame of the span it generates and has no index-addressable
        conditioning and no denoising-strength video-to-video path. The three
        placements it serves are
        * **extend-forward** (`input_offset_frames = 0`): the input's LAST
          frame becomes the first-frame anchor and the generated span is
          appended after the input;
        * **extend-backward**
          (`input_offset_frames + placed_frames = total_frames`): the mirror --
          the input's FIRST frame becomes the last-frame anchor and the
          generated span is prepended;
        * **bridge** (a second `bridge_video` upload, with
          `input_offset_frames = 0`): `video` is preserved at the head,
          `bridge_video` at the tail, and the gap between them is generated
          from the head clip's last frame (first-frame anchor) and the tail
          clip's first frame (last-frame anchor).

        Any other `input_offset_frames` is refused with a 400 whose message is
        that reason. It is not silently approximated by a nearby placement.

        The anchor frame is the SAME instant as the preserved frame it is taken
        from, so it is not emitted twice: an extend produces
        `placed + generated - 1` frames and a bridge produces
        `head + generated + tail - 2`. `total_frames` is therefore a REQUESTED
        output length on MiniMax-H3 -- the generated span alone must be a valid
        `17n + 5` length in the model's production range, so the endpoint solves
        for that span, rounds it UP to the grid, and returns the effective
        output length in the response's `warnings[]` when it differs from the
        request. Conditioning uses boundary frames only; interior source motion
        is not provided to the model.

        **Strict preservation guarantee:** the placed input frames in the
        returned video are BYTE-IDENTICAL to the (trimmed + preprocessed)
        input clip, over the EFFECTIVE placed span (which may be shorter
        than the full trimmed clip if it runs past `total_frames` -- see
        `input_offset_frames`). This is enforced by an unconditional
        frame-exact paste performed AFTER generation on LTX-2.3, and by
        construction on MiniMax-H3, which never generates over the preserved
        span at all. In both cases the returned frames are exact; only an
        FFV1 encode (`video_lossless`) keeps them exact through the FILE as
        well, since H.264 is lossy.

        On LTX-2.3, when the (trimmed) clip has more frames than fit between
        `input_offset_frames` and `total_frames` (after rounding down to the
        8k+1 conditioning grid), the excess tail frames are dropped from the
        preserved span rather than silently discarded from the upload: a
        `warnings[]` entry with code `outpaint_video_tail_frames_dropped`
        names the dropped count and the effective preserved frame range. The
        whole (trimmed) clip is always decoded first -- this endpoint never
        bounds the decode by `total_frames` -- so the drop reflects the
        clip's true length, not a length already truncated before this
        warning could see it.

        **÷32 preprocessing:** every frame in one output video shares one
        resolution (`width`x`height`, both required ÷32 like
        `/generate/txt2vid`). A clip whose native resolution or aspect ratio
        does not match is center-cropped and LANCZOS-resized ONCE to that
        resolution -- the PREPROCESSED frames (not the raw upload) become
        the exact-preserved content, mirroring `/generate/outpaint`'s
        placed-image RESIZE convention.

        **Placement:** `input_offset_frames` is a desired PIXEL frame offset
        into the output timeline. On LTX-2.3, because
        `LTX2VideoCondition.index` addresses a LATENT frame (temporal
        compression 8x), it is snapped server-side to the nearest valid pixel
        start ({0, 1, 9, 17, ..., 8m+1}) -- a `warnings[]` entry with code
        `outpaint_video_offset_snapped` is returned when snapping changes the
        requested offset. On MiniMax-H3 it
        selects the placement (see above) and is not snapped: a value that is
        neither boundary is a 400. `input_trim_start_frames` /
        `input_trim_end_frames` trim the UPLOADED clip itself (in the clip's
        own pixel frames) before placement. `GET /schema/arch-capabilities`'s
        `video_constraints[arch].outpaint_placements` states which placements
        the loaded architecture accepts.

        **Audio (`outpaint_video_audio_mode`, only relevant when
        `audio_enable` is true). The default is PER-ARCHITECTURE:
        `regenerate` on LTX-2.3, `preserve_input` on MiniMax-H3 (see
        `outpaint_video_arch_overlays` of GET /schema/generation-defaults) —
        because the two modes do not have the same consequence on the two
        architectures:**
        - `regenerate`: use the model's own generated audio as-is.
          The input clip's own audio is NOT preserved. On LTX-2.3 that
          generated track spans the WHOLE timeline, so the preserved span
          still has sound and this is the harmless default there. On
          MiniMax-H3 it spans only the GENERATED frames -- that architecture
          produces audio jointly with video and cannot produce audio for
          frames it does not generate -- so the preserved span is left SILENT
          and a warning says so. That is why it is not the default there;
          asking for it by name on MiniMax-H3 means asking for a silent
          preserved span.
        - `preserve_input`: after generation, mux the input clip's ORIGINAL
          audio over its placed span, keeping the model-generated audio
          outside that span, with a ~50ms crossfade confined to the
          GENERATED side of each boundary so every input audio sample stays
          exact. Falls back to `regenerate` (with a warning) if the
          uploaded clip has no audio stream.

        **Requirements:**
        - An LTX-2.3 or MiniMax-H3 model must be loaded (otherwise 400).
        - `width`/`height` divisible by the loaded architecture's
          `pixel_align` (32 for both) and inside its `max_pixel_hw` envelope
          where it has one (MiniMax-H3: short edge ≤ 768, long edge ≤ 1344).
        - LTX-2.3: `total_frames` must satisfy `(total_frames - 1) % 8 == 0`.
          MiniMax-H3: the GENERATED span implied by `total_frames` and the
          placed clip length must be a valid `17n + 5` length, at least 124
          (there is no enforced maximum -- a span past the documented 362
          trained-range top is accepted with an untested-range warning, not
          clamped); it is rounded up to the grid, with a `warnings[]` entry
          (code `outpaint_video_total_frames_adjusted`) naming the effective
          output length, when it is not already on it.
        - The uploaded clip(s) are decoded in full (not bounded by
          `total_frames`) so a too-long upload is never silently cropped
          before this endpoint's own fit/drop logic runs (see the strict
          preservation guarantee above); a pre-decode size check still
          refuses (400) a clip whose raw RGB frame data would exceed this
          endpoint's per-clip decode budget, naming the frame count,
          resolution, and the budget in GiB.
        - **Partition/placement gate (MiniMax-H3):** `fl2va` serves every
          placement and refuses `reference_images` with a 400 (that
          partition was never trained to read reference rows). `ref2va`
          serves ONLY `extend_forward`, where the preserved clip's own
          trailing frames become an automatic video reference (soundtrack
          excluded) and `reference_images` add optional image references on
          top -- both compose through the same anchor + placement machinery,
          and the preservation/concatenation guarantee below is unchanged.
          `extend_backward` and `bridge` are refused on `ref2va` (400,
          unmeasured shape), as is a generated span shorter than 22 frames
          (the reference video floor). A `hybrid` transformer is refused on
          every placement, with or without `reference_images` (it generates on
          no endpoint). No configuration on this endpoint
          regenerates the input; a refused request is never rerouted to
          `/generate/ref2vid`.
      operationId: generateOutpaintVideo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OutpaintVideoRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 1234567890
                image:
                  id: 88
                  filename: "outpaint_vid_20260715_120000_1234567890.mp4"
                  generation_type: "outpaint_vid"
        '400':
          description: >-
            Invalid parameters, or no video model loaded. Also returned when
            the requested `input_offset_frames` is not a placement the loaded
            architecture supports (MiniMax-H3: anything other than the start,
            the end, or a bridge), when `bridge_video` is sent to an
            architecture that has no bridge placement, when `reference_images`
            is sent to a non-MiniMax-H3 model or a loaded `fl2va` transformer,
            or when a `ref2va` transformer is asked for `extend_backward`,
            `bridge`, or a generated span shorter than 22 frames (see the
            partition/placement gate above). A `hybrid` transformer is refused
            on every placement, with or without `reference_images`, before the
            upload is decoded. Also returned, before either
            upload is decoded, when `video` or `bridge_video` would need more
            than this endpoint's per-clip decode budget of raw RGB frame data
            to decode ("the input clip is too long/high-resolution to
            decode" / "the bridge clip is too long/high-resolution to
            decode"), naming the clip's probed frame count/resolution and the
            budget. Also returned for an incomplete or malformed chain
            provenance stamp (see `chain_id`), which is refused rather than
            dropped so a row never records provenance that leads nowhere.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            A model load or component switch is changing the loaded model.
            Generation is refused while the components are being replaced;
            retry once the switch completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The loaded model is degraded: a component switch or a failed load
            left the live components incomplete. Reload the model to recover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/upscale:
    post:
      tags: [generation]
      summary: Upscale an image
      description: |
        Upscales an input image using one of four backends: a plain PIL
        resample, a spandrel super-resolution model, RTX Video Super
        Resolution (nvvfx), or a diffusion tile upscale (img2img per tile
        with the currently loaded model).

        **Key parameters:**
        - `upscaler_backend`: `pil` | `spandrel` | `rtx_vsr` | `diffusion`
        - `upscaler_model`: filename under `models/upscalers/`, required when `upscaler_backend=spandrel`, or when `upscaler_backend=diffusion` and `diffusion_pre_upscale_mode=model`
        - `scale_factor`: 1.0-8.0; output dimensions = round(input dimensions * scale_factor)
        - `image`: input image (PNG/JPEG, binary file upload)
      operationId: generateUpscale
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpscaleRequest'
      responses:
        '200':
          description: Upscale successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 0
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            A model load or component switch is changing the loaded model.
            Generation is refused while the components are being replaced;
            retry once the switch completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The loaded model is degraded: a component switch or a failed load
            left the live components incomplete. Reload the model to recover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Upscale failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/txt2img/training-preview:
    post:
      tags: [training]
      summary: Preview txt2img using the in-training model
      description: |
        Generates a preview image using the CURRENT (in-progress) weights of
        an active LoRA / Full-FT training run, rather than a saved
        checkpoint. Body is the same shape as generation params (prompt,
        steps, cfg_scale, seed, width/height, sampler, schedule_type,
        optional loras/controlnets) plus `run_id` (optional; required to
        disambiguate when multiple training runs are active) and
        `save_to_gallery` (optional; when true, also persists the PNG under
        outputs/ and inserts a GeneratedImage row tagged
        `training-preview:<run>@step<N>`). Requires an active training
        process (404/409 otherwise). Returns the PNG bytes directly, with
        `X-Preview-*` metadata headers.
      operationId: previewTxt2ImgTraining
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GenerationParams'
                - type: object
                  properties:
                    run_id:
                      type: integer
                      nullable: true
                      description: Target training run when multiple are active
                    save_to_gallery:
                      type: boolean
                      default: false
                      description: Persist the preview PNG into the regular gallery
      responses:
        '200':
          description: Preview PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: No active training run (or run_id not active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Zero or multiple active training runs and run_id not given
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Preview generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Preview request timed out (training busy or stopped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /generate/img2img/training-preview:
    post:
      tags: [training]
      summary: Preview img2img using the in-training model
      description: |
        Same as `/generate/txt2img/training-preview` but adds an init image.
        Body is JSON (not multipart) with `init_image_base64` (raw or
        data-URL encoded PNG/JPEG) and `denoising_strength`, plus the fields
