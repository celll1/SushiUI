  /tags/resolve-categories:
    post:
      tags: [tags]
      summary: Resolve Danbooru categories for tags
      description: |
        Resolve the Danbooru-style category for each supplied tag using the
        server-side canonical resolver. Intended for API clients that do not run
        the frontend (which resolves categories via
        frontend/src/utils/tagSuggestions.ts).

        Resolution uses the shared backend resolver
        (TagGroupManager in backend/core/training/tag_group_utils.py, backed by
        the TaglistCache singleton): taglist category lookup plus the hardcoded
        Rating/Quality special tags. Matching normalizes tags by removing
        backslash escapes, converting underscores to spaces, and lowercasing,
        matching the frontend normalization.

        A maximum of 1000 tags is accepted per request.
      operationId: resolveTagCategories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveCategoriesRequest'
      responses:
        '200':
          description: Resolved categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveCategoriesResponse'
              example:
                results:
                  - tag: "1girl"
                    category: "General"
                    normalized: "1girl"
                  - tag: "hatsune_miku"
                    category: "Character"
                    normalized: "hatsune miku"
                  - tag: "masterpiece"
                    category: "Quality"
                    normalized: "masterpiece"
                  - tag: "zzz_not_a_tag"
                    category: "Unknown"
                    normalized: "zzz not a tag"
        '400':
          description: Too many tags (limit 1000)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Resolution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

