        '404':
          description: No active training run (or run_id not active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Zero or multiple active training runs and run_id not given
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Preview generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Preview request timed out (training busy or stopped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /generate/inpaint/training-preview:
    post:
      tags: [training]
      summary: Preview inpaint using the in-training model
      description: |
        Same as `/generate/img2img/training-preview` but additionally
