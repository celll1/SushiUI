openapi: 3.0.3
info:
  title: SushiUI - Stable Diffusion WebUI API
  description: |
    Backend API for SushiUI, a Stable Diffusion web interface with advanced features.

    Features:
    - Multiple generation modes (txt2img, img2img, inpaint)
    - LoRA support
    - ControlNet integration
    - TIPO tag generation
    - Image tagging
    - Quantization support (FP8)

    WebSocket progress protocol (`/api/v1/ws/progress`) is documented separately in backend/api/WS_PROTOCOL.md.
  version: 1.0.0
  contact:
    name: SushiUI GitHub
    url: https://github.com/celll1/SushiUI

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server (API v1)

tags:
  - name: generation
    description: Image generation endpoints
  - name: images
    description: Image management and gallery
  - name: models
    description: Model management and loading
  - name: controlnet
    description: ControlNet preprocessors and detection
  - name: tags
    description: Tag suggestions and autocomplete
  - name: tipo
    description: TIPO tag generation AI
  - name: prompt-assist
    description: MiniMax-H3 prompt templates and local-LLM rewriting
  - name: tagger
    description: Image tag prediction
  - name: settings
    description: Application settings
  - name: system
    description: System control and monitoring
  - name: auth
    description: Authentication (if enabled)
  - name: datasets
    description: Dataset management, scanning, and structure detection
  - name: training
    description: LoRA/Full-FT training run and preset management
  - name: tagger-training
    description: Tagger (vision encoder) training run management
  - name: logs
    description: Backend console log retrieval
  - name: video-mask
    description: Spatial mask timeline rasterization for UI preview (no model load, no generation)
  - name: video-chain
    description: Long-form video chain planning and manifest validation (no model load, no generation)
  - name: debug
    description: Developer-mode diagnostics (VRAM inspection)

paths:
  /health:
    get:
      summary: Backend liveness check
      description: |
        Minimal liveness probe for the backend API. Returns a fixed status
        string and the running API version.
      tags: [system]
      responses:
        '200':
          description: Backend is up and responding
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 0.1.0
              example:
                status: ok
                version: 0.1.0
  /schema/timestep-defaults-by-arch:
    get:
      summary: Per-architecture default timestep_sampling configs
      description: |
        Returns a map of model architecture -> default `timestep_sampling` config.
        The frontend applies the selected model's entry when the base model changes
        (user edits win). Most architectures default to uniform; only MiniT2I differs
        (logit_normal mean=-0.8/std=0.8). The `_default` key is the global fallback.
      tags: [Schema]
      responses:
        '200':
          description: Map of architecture name to timestep sampling config
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/TimestepSamplingConfig'
              example:
                _default: { distribution: uniform, min_timestep: 0.0, max_timestep: 1.0 }
                minit2i: { distribution: logit_normal, mean: -0.8, std: 0.8, min_timestep: 0.0, max_timestep: 1.0 }
                krea2: { distribution: uniform, min_timestep: 0.0, max_timestep: 1.0 }
  /schema/bundle-vae-defaults-by-arch:
    get:
      summary: Per-architecture default bundle_vae values
      description: |
        Returns a map of model architecture -> default `bundle_vae` boolean for
        full-parameter training saves. sd15/sdxl/deus default `true` (their
        comfy-layout checkpoints are consumed by A1111/ComfyUI, which require the
        `first_stage_model.*` VAE section); other architectures default `false`.
        The `_default` key is the global fallback. The frontend applies the selected
        model's entry when the base model changes (user edits win).
      tags: [Schema]
      responses:
        '200':
          description: Map of architecture name to default bundle_vae boolean
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
              example:
                _default: false
                sd15: true
                sdxl: true
                deus: true
  /schema/arch-capabilities:
    get:
      summary: Per-architecture table of generation features that have no effect
      description: |
        Returns the capability matrix the backend already uses to emit
        `unsupported_param` warnings after a generation
        (`backend/api/arch_capabilities.py`), so a client can hide a control on
        an architecture that would ignore it instead of maintaining a second,
        divergent arch list.

        * `unsupported` — architecture name -> feature name -> a one-line
          factual reason the feature has no effect there. An architecture absent
          from the map, or a feature absent from its entry, honors the feature.
        * `feature_params` — feature name -> the request parameter keys that arm
          it, so a parameter name can be mapped back to its feature.
        * `feature_labels` — feature name -> the human-readable label used in the
          warning message.
        * `runtime_int8_archs` — the architectures that honor
          `unet_quantization: "int8"` (the in-place weight-only INT8 conversion).
          Cannot be derived from `unsupported`/`supported_values`, because an
          architecture that honors `unet_quantization` outright has no entry in
          either map.
        * `quantized_linear_archs` — the architectures whose loaders swap in the
          quantized Linear classes, i.e. the ones `quantized_gemm_mode` applies
          to.
        * `training_unsupported` — architecture name -> TRAINING METHOD name ->
          a one-line factual reason that method cannot be run for that
          architecture, so a client can filter its training-method dropdown
          from the same table the backend refuses on.
        * `video_constraints` — architecture name -> the temporal/spatial
          generation constraints of a VIDEO architecture (`frame_multiple`,
          `frame_offset`, `min_frames`, `max_frames` (the ENFORCED production
          top; null = unbounded), `trained_max_frames` (an ADVISORY
          documented-range top past which a request is accepted and warned as
          untested rather than refused or clamped; null when the arch has
          none narrower than `max_frames`), `min_decodable_frames`,
          `fps_fixed`, `max_pixel_hw` — `[short_edge, long_edge]`, not
          `[height, width]` —, `pixel_align`, `snap_invalid_length`,
          `suggested_frames`, `min_inference_steps`,
          `steps_are_sigma_grid_points`, `outpaint_placements`,
          `latent_chunk_pattern`), so a client can generate a valid clip-length
          list, a valid step count, a valid temporal-outpaint placement and a
          valid temporal-inpaint range instead of hardcoding them.
          Absent for non-video architectures.
        * `chain_context` — architecture name (and, under `variants`, loaded
          transformer variant) -> what a long-form video CHAIN's continuation
          segments receive from their predecessor: the `continuation_mode`s
          advertised, the default one, how many pixel frames of the preceding
          segment the model is conditioned on, and whether sparse motion
          anchors, a reference video or a pixel-exact preserved prefix are
          available. `POST /video-chain/plan` and `POST /video-chain/validate`
          refuse an unadvertised mode with a 400 against this same table, so a
          client chooses a mode from here rather than from a checkpoint name.
          Absent for non-video architectures.
      tags: [Schema]
      responses:
        '200':
          description: Capability matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchCapabilities'
              example:
                unsupported:
                  sdxl:
                    quantized_gemm: "this architecture's checkpoints hold plain floating-point Linear weights; the quantized-GEMM path selection applies only to the weight-only quantized Linear layers used by ACE-Step, Anima, FLUX.2, Ideogram 4, Krea 2, LTX-2.3, MiniMax H3 and Z-Image"
                  krea2:
                    unet_quantization: "FP8 quantization on this architecture is selected by checkpoint format at load time (bf16 or weight-only FP8 checkpoints); the only per-generation unet_quantization value applied is 'int8', which converts an unquantized transformer in place once per model load"
                supported_values:
                  krea2:
                    unet_quantization: [int8]
                feature_params:
                  quantized_gemm: [quantized_gemm_mode]
                  unet_quantization: [unet_quantization]
                feature_labels:
                  quantized_gemm: "quantized_gemm_mode (quantized GEMM path)"
                  unet_quantization: "unet_quantization"
                runtime_int8_archs: [anima, krea2, flux2, ideogram4, ltx2, acestep, zimage]
                quantized_linear_archs: [acestep, anima, flux2, ideogram4, krea2, ltx2, minimax_h3, zimage]
  /schema/generation-defaults:
    get:
      summary: Get default parameter values for txt2img/img2img/inpaint generation
      description: |
        Single source of truth for generation defaults
        (`backend/api/param_defaults.py` `GENERATION_DEFAULTS`, split per mode).
        The frontend fetches this at startup and applies it when no localStorage
        override is present.

        `video_arch_overlays` carries the PER-ARCHITECTURE video overrides
        (`VIDEO_GEN_ARCH_OVERLAYS`): architecture name -> the subset of video
        keys that differ from the base `txt2vid`/`img2vid`/`outpaint_vid`
        defaults for that architecture. A client resolves a video default as
        `base | video_arch_overlays[arch]`, which is exactly what the video
        routes do server-side for every field a request omits. An architecture
        absent from the map takes the base values unchanged.

        `outpaint_video_arch_overlays` carries the same thing for the keys that
        exist ONLY on `POST /generate/outpaint/video`
        (`OUTPAINT_VIDEO_ARCH_OVERLAYS`) — `total_frames`, whose base
        value (121) is on LTX-2.3's `8k+1` grid and is not a length MiniMax-H3
        can produce, and `outpaint_video_audio_mode`, whose base `regenerate`
        leaves the preserved span silent on an architecture that generates
        audio only for the frames it generates (MiniMax-H3 overlays
        `preserve_input`). A client resolves an outpaint-video default as
        `outpaint_vid | video_arch_overlays[arch] | outpaint_video_arch_overlays[arch]`,
        in that order, which is what the route does.

        `inpaint_video_arch_overlays` is the same mechanism for
        `POST /generate/inpaint/video` (`INPAINT_VIDEO_ARCH_OVERLAYS`):
        `inpaint_video_audio_mode`, whose base `regenerate` would hand back a
        preserved span with a soundtrack drawn against a regenerated timeline,
        so MiniMax-H3 overlays `preserve_input`. `inpaint_vid` carries no
        clip-length key at all — that endpoint's output is as long as the
        trimmed input.
      tags: [Schema]
      responses:
        '200':
          description: Defaults grouped by generation mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  txt2img:
                    type: object
                    additionalProperties: true
                  img2img:
                    type: object
                    additionalProperties: true
                  inpaint:
                    type: object
                    additionalProperties: true
                  outpaint:
                    type: object
                    additionalProperties: true
                  outpaint_vid:
                    type: object
                    additionalProperties: true
                  inpaint_vid:
                    type: object
                    additionalProperties: true
                  outpaint_aud:
                    type: object
                    additionalProperties: true
                  studio_render:
                    type: object
                    description: >-
                      `STUDIO_RENDER_DEFAULTS` from `backend/api/param_defaults.py`
                      -- renderer policy defaults and limits (audio/fit-mode
                      defaults, size/duration/asset-count ceilings, decode and
                      output pixel-frame budgets, disk-space margin, render
                      timeout) for `POST /studio/render-jobs`.
                    additionalProperties: true
                  video_arch_overlays:
                    type: object
                    description: >-
                      Architecture name -> the video default keys that differ
                      from the base video defaults on that architecture.
                    additionalProperties:
                      type: object
                      additionalProperties: true
                    example:
                      minimax_h3:
                        width: 1344
                        height: 768
                        num_frames: 124
                        frame_rate: 24.0
                        num_inference_steps: 20
                  outpaint_video_arch_overlays:
                    type: object
                    description: >-
                      Architecture name -> the outpaint-video-only default keys
                      that differ from the base ones on that architecture,
                      applied on top of `video_arch_overlays`.
                    additionalProperties:
                      type: object
                      additionalProperties: true
                    example:
                      minimax_h3:
                        total_frames: 248
                        outpaint_video_audio_mode: preserve_input
                  inpaint_video_arch_overlays:
                    type: object
                    description: >-
                      Architecture name -> the inpaint-video-only default keys
                      that differ from the base ones on that architecture,
                      applied on top of `video_arch_overlays`.
                    additionalProperties:
                      type: object
                      additionalProperties: true
                    example:
                      minimax_h3:
                        inpaint_video_audio_mode: preserve_input
                  param_bounds:
                    type: object
                    description: >-
                      User-overridable slider/number-input UPPER BOUNDS
                      registry (`PARAM_BOUNDS` in
                      `backend/api/param_defaults.py`). Keyed by bound name;
                      each entry's `builtin` is today's literal, and
                      `floor`/`ceiling` are the range a user override
                      (`UserSettings.slider_bounds`, `GET/POST
                      /settings/generation`) may fall within. Consumed by the
                      frontend's `resolveBound()` (never hardcoded per panel).
                    additionalProperties:
                      type: object
                      properties:
                        builtin:
                          type: number
                        floor:
                          type: number
                        ceiling:
                          type: number
                        family:
                          type: string
                        label:
                          type: string
                    example:
                      steps_max:
                        builtin: 150
                        floor: 20
                        ceiling: 1000
                        family: sampling
                        label: Sampling steps slider max
  /schema/prompt-assist-defaults:
    get:
      tags: [Schema]
      summary: Get MiniMax-H3 prompt-assistant defaults
      operationId: getPromptAssistDefaults
      responses:
        '200':
          description: Provider, inference, and cache defaults
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /schema/training-defaults:
    get:
      summary: Get default parameter values for LoRA / Full-FT training
      description: |
        Single source of truth for LoRA/Full-FT training defaults
        (`backend/api/param_defaults.py` `TRAINING_DEFAULTS`). The frontend
        fetches this at startup and applies it when no localStorage override
        is present, so the UI and backend never diverge on default values.
      tags: [Schema]
      responses:
        '200':
          description: Map of training parameter name to default value
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /schema/tagger-training-defaults:
    get:
      summary: Get default parameter values for tagger training
      description: |
        Single source of truth for tagger training defaults
        (`backend/api/param_defaults.py` `TAGGER_TRAINING_DEFAULTS`). The
        frontend fetches this at startup and applies it when no localStorage
        override is present.
      tags: [Schema]
      responses:
        '200':
          description: Map of tagger training parameter name to default value
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /schema/vae-training-defaults:
    get:
      summary: Get default parameter values for VAE (decoder-only) training
      description: |
        Single source of truth for VAE training defaults
        (`backend/api/param_defaults.py` `VAE_TRAINING_DEFAULTS`). Backs training
        runs created with `training_method: "vae_decoder"`, which produce a YAML
        config whose `network.type` is `vae_decoder`.

        **Where each key ends up in the generated YAML:**
        - `batch_size` … `max_step_saves_to_keep` are written into the shared
          `process.train` / `process.save` sections, so the existing start /
          stop / resume / checkpoint-keep plumbing keeps owning them.
        - everything from `vae_source` onwards is written into a dedicated
          `process.vae` section read by
          `core/training/vae/vae_config.resolve_vae_training_config`.

        **Refused combinations** (the config is rejected before training starts):
        `train_encoder: true` (Phase 2 — it moves the latent distribution and
        invalidates every latent cache / LoRA trained against this VAE),
        `train_decoder: false` with `train_encoder: false` (nothing to train),
        `latent_encoding_mode: pre_encoded_cache` (VAE training is a live
        encode→decode forward on raw pixels), `dtype: fp16` (SD1.5/SDXL-family
        activation overflow, and no gradient scaler for the other families),
        all loss weights 0, and `lpips_weight > 0` with the `lpips` package not
        installed.
      tags: [Schema]
      responses:
        '200':
          description: Map of VAE training parameter name to default value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaeTrainingDefaults'
  /generate/txt2img:
    post:
      tags: [generation]
      summary: Generate image from text prompt
      description: |
        Text-to-image generation using Stable Diffusion.

        **Key parameters:**
        - `prompt`: Main generation prompt (required)
        - `steps`: Number of inference steps (1-150, default: 28)
        - `cfg_scale`: Classifier-free guidance scale (1.0-30.0, default: 7.0)
        - `controlnet_images`: Optional ControlNet images for direct upload (multipart)

        **ControlNet usage:**
        - Can upload images directly via `controlnet_images` field
        - Or use base64 encoding in `controlnets` JSON parameter
      operationId: generateTxt2Img
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Txt2ImgRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 1234567890
                warnings: []
                image:
                  id: 42
                  filename: "txt2img_20251128_123456_1234567890.png"
                  generation_type: "txt2img"
                  seed: 1234567890
        '400':
          description: >-
            Invalid parameters. Refused with a 4xx when the loaded model is not an image
            model: a video model (LTX-2.3, MiniMax-H3) or an audio model
            (ACE-Step) is rejected here by architecture, each with its own
            reason and the endpoint to use instead. The suggested endpoint matches the
            request shape of the route that was called (img2img -> /generate/img2vid
            or /generate/aud2aud, inpaint -> /generate/inpaint/video on MiniMax-H3
            or /generate/aud2aud, outpaint -> /generate/outpaint/video or
            /generate/outpaint/audio), not always the text-only one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            A model load or component switch is changing the loaded model.
            Generation is refused while the components are being replaced;
            retry once the switch completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The loaded model is degraded: a component switch or a failed load
            left the live components incomplete. Reload the model to recover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/txt2vid:
    post:
      tags: [generation]
      summary: Generate video from text prompt (LTX-2.3, MiniMax-H3)
      description: |
        Text-to-video generation using a loaded video model. Produces an
        H.264 mp4 (with an audio track when `audio_enable` is true) and a
        gallery row.

        **Requirements:**
        - An LTX-2.3 or MiniMax-H3 model must be loaded (otherwise 400).

        **Per-architecture defaults.** Any field omitted from the request body
        is filled from the loaded architecture's resolved video defaults, i.e.
        `video_arch_overlays` of `GET /schema/generation-defaults` merged over
        the base `txt2vid` defaults. The declared defaults below are the base
        (LTX-2.3-shaped) values; an omitted field on MiniMax-H3 resolves to the
        MiniMax-H3 overlay instead.

        **LTX-2.3 constraints (validated before generation):**
        - `width` and `height` must both be divisible by 32.
        - `num_frames` must satisfy (num_frames - 1) % 8 == 0 (e.g. 9, 17, ..., 121).
        - Distilled defaults: num_inference_steps=8, guidance_scale=1.0,
          num_frames=121, frame_rate=24.0, height=512, width=768.

        **MiniMax-H3 constraints (validated before generation):**
        - `width` and `height` must both be divisible by 32. SushiUI
          additionally restricts the canvas to a short edge <= 768 and a long
          edge <= 1344. That restriction is SushiUI policy, not a model limit:
          MiniMax's own implementation enforces only the divisibility rule for
          an explicit width/height, and applies its 768 short edge / 768*1344
          area budget only when both are omitted.
        - `num_frames` must be of the form `17 * n + 5` with `n >= 1` (the
          video VAE's chunking; its shortest decodable clip is 22 frames), and
          must be at least 124. There is no enforced maximum: 362 is the
          model's DOCUMENTED trained-range top (`trained_max_frames`), not a
          decoder limit, so a longer on-grid value is accepted with an
          untested-range warning rather than refused or clamped. An off-grid
          or below-124 value is SNAPPED — rounded UP to the next valid length,
          as MiniMax-H3's own reference implementation does — and a
          `warnings[]` entry states the rule, including when the value came
          from the client.
        - `frame_rate` is fixed at 24.0; any other value is forced to 24.0 with
          a warning.
        - `guidance_scale` and `negative_prompt` are ignored: guidance is
          distilled into the weights and the sampler takes no guidance scale.
          A warning is emitted when either is set to a NON-DEFAULT value (the
          default itself never warns, because the UI always sends the full
          parameter object).
        - The soundtrack is generated jointly with the video in one packed
          sequence. `audio_enable: false` skips the audio decode and the mux;
          the audio rows still participate in generation and still influence
          the video through self-attention.
        - There is no official step count for this model. The shipped default
          of 20 is a community baseline.
      operationId: generateTxt2Vid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Txt2VidRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 1234567890
                image:
                  id: 43
                  filename: "txt2vid_20260708_120000_1234567890.mp4"
                  generation_type: "txt2vid"
        '400':
          description: >-
            Invalid parameters; no video model loaded (neither LTX-2.3 nor
            MiniMax-H3); or a loaded MiniMax-H3 transformer whose variant is
            named and is neither `fl2va` nor `ref2va` (both released partitions
            serve a prompt-only request; the `hybrid` variant — an `fl2va` base
            carrying `ref2va` AdaLN blocks — generates on no endpoint).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            A model load or component switch is changing the loaded model.
            Generation is refused while the components are being replaced;
            retry once the switch completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The loaded model is degraded: a component switch or a failed load
            left the live components incomplete. Reload the model to recover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/img2vid:
    post:
      tags: [generation]
      summary: Generate video from still-image keyframes (LTX-2.3 or MiniMax-H3)
      description: |
        Video generation from uploaded media: keyframe images and/or (on
        MiniMax-H3) an `input_audio` track. The uploaded `image` is a
        conditioning anchor — the first frame by default — and the remaining
        frames are generated. Produces an H.264 mp4 (with an audio track when
        `audio_enable` is true) and a gallery row.

        **Requirements:**
        - An LTX-2.3 or MiniMax-H3 model must be loaded (otherwise 400).
        - Sent as multipart/form-data with the uploaded file(s) plus the
          txt2vid parameters as form fields.
        - At least one conditioning medium: `image`, or `input_audio` on
          MiniMax-H3, or both. `image` is required on LTX-2.3, whose
          image-to-video pipeline has no other conditioning input. A request
          with no media at all is a 400 pointing at `/generate/txt2vid`.

        **Per-architecture defaults.** Any field omitted from the form is filled
        from the loaded architecture's resolved video defaults, i.e.
        `video_arch_overlays` of `GET /schema/generation-defaults` merged over
        the base `img2vid` defaults. The declared defaults below are the base
        (LTX-2.3-shaped) values; an omitted field on MiniMax-H3 resolves to the
        MiniMax-H3 overlay instead.

        **LTX-2.3 constraints (validated before generation):**
        - `width` and `height` must both be divisible by 32.
        - `num_frames` must satisfy (num_frames - 1) % 8 == 0 (e.g. 9, 17, ..., 121).
        - `last_frame_image` is ignored (LTX-2.3 conditions on the first frame
          only); sending it emits an `unsupported_param` warning.

        **MiniMax-H3 constraints (the `fl2va` workflow, validated before
        generation):**
        - `image` is a conditioning anchor placed at `input_image_frame_index`
          (0 by default, i.e. the first frame); `keyframe_images` /
          `keyframe_frame_indices` add more anchors at their own frames, and
          `last_frame_image` is the equivalent of a keyframe at frame index
          `-1`. Each anchor is VAE-encoded as a single-frame conditioning row
          block, held at the model's own `keyframe_noise_aug` level for every
          step, and is never overwritten by the sampler. An anchor's rows are
          pinned at its frame's rotary position
          (`num_text_tokens + (5/3) * frame_index`).
        - Anchors are packed in ASCENDING frame order regardless of upload
          order, and a request whose anchors resolve to `{0}` or `{0, last}`
          produces exactly the layout it produced before placement existed.
        - Two resolved indices may not collide, and every index must fall in
          `[0, num_frames - 1]` AFTER `num_frames` has been snapped to the
          `17n + 5` grid. Because the server does that snapping, `-1` is the
          only way to name the last frame reliably.
        - The anchor at frame 0, if there is one, is STRETCHED onto
          (`width`, `height`); every other anchor is aspect-preserving
          centre-cover-cropped. This mirrors both reference implementations,
          where the first keyframe is the geometry anchor and later ones are
          followers.
        - This endpoint serves the `fl2va` transformer partition. Every other
          NAMED variant answers 400: with `ref2va` loaded, keyframe
          conditioning combined with reference conditioning is not offered here
          (see `/generate/ref2vid`); a `hybrid` transformer generates on no
          endpoint at all.
        - MiniMax's model card documents this workflow for first- and
          last-frame conditioning with up to two images. A request that places
          an anchor at an intermediate frame, or sends more than two anchors,
          also returns a `minimax_h3_undocumented_conditioning` entry in
          `warnings[]` naming that scope.
        - `width` and `height` must both be divisible by 32. SushiUI
          additionally restricts the canvas to a short edge <= 768 and a long
          edge <= 1344. That restriction is SushiUI policy, not a model limit.
        - `num_frames` must be of the form `17 * n + 5` with `n >= 1` and must
          be at least 124; there is no enforced maximum (362 is a DOCUMENTED
          trained-range top, not a decoder limit — a longer on-grid value is
          accepted with an untested-range warning instead). An off-grid or
          below-124 value is SNAPPED (rounded up) with a `warnings[]` entry
          stating the rule.
        - `frame_rate` is fixed at 24.0; any other value is forced with a warning.
        - `num_inference_steps` counts sigma schedule grid points with the
          terminal 0 included, so it drives `num_inference_steps - 1` model
          evaluations; values below 2 are refused with 400. There is no official
          step count for this model — the shipped default of 20 is a community
          baseline.
        - `guidance_scale` and `negative_prompt` are ignored (guidance is
          distilled into the weights). A warning is emitted when either is set
          to a NON-DEFAULT value.
        - The soundtrack is generated jointly with the video in one packed
          sequence; `audio_enable: false` skips the audio decode and the mux.
        - `input_audio` inverts that: the supplied track's rows are pinned at
          t = 1.0 across the WHOLE clip and the video is generated against
          them, and the uploaded samples are handed to the muxer unchanged
          (the mp4's AAC track is a lossy encoding of them, as it is for a
          generated soundtrack).
          Partial-timeline placement is not supported — the condition count is
          a prefix and the audio rows are channel-major, so pinning "half" the
          timeline would pin one stereo channel's whole track. A shorter track
          is a 400 rather than a pad. See the `input_audio` field.
        - With `input_audio` present, `image` may be omitted: the clip is then
          conditioned on the prompt and the audio alone.
        - The video noise draw is unaffected by `input_audio`: all three noise
          draws still happen in the recorded order and the audio draw is
          discarded, so the same seed produces the same video noise with and
          without a pinned track.

        The keyframes are resized to (`width`, `height`) before conditioning. A
        `source_image_hash` of the first uploaded keyframe is stored on the
        gallery row (null when the request sends no image).
      operationId: generateImg2Vid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Img2VidRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 1234567890
                image:
                  id: 44
                  filename: "img2vid_20260708_120000_1234567890.mp4"
                  generation_type: "img2vid"
        '400':
          description: >-
            Invalid parameters; no video model loaded (neither LTX-2.3 nor
            MiniMax-H3); or a loaded MiniMax-H3 transformer whose variant is
            named and is not `fl2va` (`ref2va`, or the `hybrid` variant, which
            generates on no endpoint).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            A model load or component switch is changing the loaded model.
            Generation is refused while the components are being replaced;
            retry once the switch completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The loaded model is degraded: a component switch or a failed load
            left the live components incomplete. Reload the model to recover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/ref2vid:
    post:
      tags: [generation]
      summary: Generate video from omni-references (MiniMax-H3 ref2va only)
      description: |
        Omni-reference video generation: the prompt is conditioned on an ordered
        list of reference media — up to 9 images, 3 videos (each optionally
        carrying its own soundtrack) and 3 audio clips, at most 12 files in
        total. Produces an H.264 mp4 (with an audio track when `audio_enable`
        is true) and a gallery row, exactly like `/generate/txt2vid`.

        **Requirements:**
        - A MiniMax-H3 model whose transformer variant is `ref2va` must be
          loaded (otherwise 400). This is the second of the two released
          MiniMax-H3 transformer partitions: the `fl2va` file that serves
          `/generate/txt2vid` and `/generate/img2vid` was never trained to read
          reference rows, and the two files are otherwise indistinguishable, so
          a mismatch is refused by name rather than run. `GET /models/current`
          reports the loaded variant as `model_info.variant`.
        - No other architecture implements this workflow; unlike
          `/generate/img2vid` this endpoint serves ONE architecture.
        - Sent as multipart/form-data with the reference files plus the txt2vid
          parameters as form fields.

        **Why this is not `/generate/img2vid` with more files.** An img2vid
        request conditions on 1-2 keyframes that are placed at fixed ends of the
        generated clip and share its canvas. A ref2va request conditions on up
        to 12 heterogeneous files of three modalities, encoded at their own
        resolutions and rates, whose ORDER is semantic. They are different
        requests with different validation.

        **The reference order is semantic, twice over.** It fixes the
        `<Picture i>` / `<Audio j>` / `<Video k>` labels the prompt can refer to,
        and it lays the references out on the packed sequence's shared rotary
        clock. The packed order is: every `reference_images` entry in upload
        order, then every `reference_videos` entry (each preceded by its own
        `reference_video_audios` soundtrack when one is sent), then every
        `reference_audios` entry. Referring to a reference by its label in the
        prompt (for example "the woman in `<Picture 1>` walks through the room
        from `<Video 1>`") is how the released model was prompted.

        **Limits (the model's, validated server-side, 400 with the reason):**
        - at most 9 image, 3 video and 3 audio references, and at most 12 in
          total;
        - an audio reference cannot be the only kind sent: a standalone
          soundtrack never reaches the conditioner, so a request built from
          audio alone conditions the vision stream on nothing;
        - a `reference_video_audios` entry must be positionally paired with a
          `reference_videos` entry;
        - a reference video must run at least 22 frames once resampled to
          24 fps and truncated to the generated duration.

        **Normalisation applied to every reference (MiniMax-H3's own):**
        - an image reference is put on a short edge of its own — 2048 for the
          released checkpoint, upscaling included and with no area cap — under
          the default `reference_image_size: max`; `match` instead scales it
          down to the generation's pixel area, which shortens the packed
          sequence because reference rows ride through every sampling step;
        - a video reference is resampled to 24 fps by dropping and duplicating
          whole frames, truncated to the generated duration, and put on the
          canvas its OWN aspect ratio resolves to;
        - a soundtrack is truncated to the generated duration and resampled to
          the audio VAE's 32 kHz, mono upmixed to stereo.

        **The same MiniMax-H3 constraints as `/generate/txt2vid` apply**:
        `width`/`height` divisible by 32 with SushiUI's short edge <= 768 /
        long edge <= 1344 policy restriction; `num_frames` of the form
        `17 * n + 5`, at least 124 with no enforced maximum (362 is
        `trained_max_frames`, DOCUMENTED not enforced), snapped with a
        `warnings[]` entry; `frame_rate` fixed at 24.0; `num_inference_steps`
        counting sigma grid
        points, so it drives `num_inference_steps - 1` model evaluations and
        values below 2 are refused; `guidance_scale` / `negative_prompt`
        ignored, with a warning when set to a non-default value.

        **Optional keyframe anchors** (`keyframe_images` /
        `keyframe_frame_indices`, same positional-pair convention as
        `/generate/img2vid`): additional visual anchors placed on the
        generated clip AFTER every reference block, each pinned at its own
        pixel frame's rotary position (`-1` = the clip's resolved last frame).
        References remain content conditioning (read by the prompt) and
        anchors remain placement conditioning (pinned to a frame); combining
        them is beyond MiniMax's model card and always emits a `warnings[]`
        entry (`minimax_h3_undocumented_conditioning`) naming the combination.
      operationId: generateRef2Vid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Ref2VidRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 1234567890
                image:
                  id: 47
                  filename: "ref2vid_20260807_120000_1234567890.mp4"
                  generation_type: "ref2vid"
        '400':
          description: >-
            Invalid parameters; no MiniMax-H3 model loaded; a MiniMax-H3 model
            loaded from the `fl2va` transformer variant instead of `ref2va`; or
            a reference list that exceeds the model's limits (>9 images,
            >3 videos, >3 audio, >12 total, audio-only, an unpaired video
            soundtrack, or a reference video shorter than 22 frames at 24 fps).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            A model load or component switch is changing the loaded model.
            Generation is refused while the components are being replaced;
            retry once the switch completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The loaded model is degraded: a component switch or a failed load
            left the live components incomplete. Reload the model to recover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

