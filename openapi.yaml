  /cancel:
    post:
      tags: [generation]
      summary: Cancel current generation
      description: Cancels the currently running generation task
      operationId: cancelGeneration
      responses:
        '200':
          description: Cancellation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /generation/status:
    get:
      tags: [generation]
      summary: Poll current image-generation status
      description: |
        Returns a snapshot of the most recent txt2img/img2img/inpaint
        generation state, kept in an in-memory store on the backend
        process.

        This complements the WebSocket `/api/v1/ws/progress` channel
        (see `backend/api/WS_PROTOCOL.md`) for clients that do not want to
        hold a WebSocket connection open. The WS channel is a global,
        unfiltered broadcast with no dedicated `complete`/`error` message
        type — a WS-only client can only infer completion or failure from
        the REST POST response of the request that started the
        generation. This endpoint instead exposes that same
        start/step/complete/error lifecycle as a pollable snapshot,
        updated from the same per-step progress callback that feeds the
        WebSocket broadcast.

        The snapshot is process-local, single-worker, and reset on
        backend restart. It reflects only the most recently started
        generation; if multiple generations were requested concurrently,
        this endpoint cannot distinguish between them (same limitation as
        the WS channel).
      operationId: getGenerationStatus
      responses:
        '200':
          description: Current generation status snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStatusResponse'
              example:
                status: "running"
                generation_type: "txt2img"
                current_step: 15
                total_steps: 28
                phase: "Step 15/28"
                started_at: "2026-07-04T14:24:28.618027+00:00"
                updated_at: "2026-07-04T14:24:29.102003+00:00"
                last_error: null
                last_result: null

  /studio/render-jobs:
    post:
      tags: [studio]
      summary: Queue a Studio timeline render
      description: |
        Stage the active Studio timeline media and render the complete project
        timeline with FFmpeg. Gallery assets are referenced by Gallery id inside
        the JSON manifest; browser-imported assets are supplied as multipart
        files keyed positionally by `asset_ids`. URLs, local filesystem paths,
        and blob URLs are not accepted. The endpoint returns immediately with
        a persistent single-worker render job. The completed video is inserted
        into the normal Gallery as `generation_type: studio_render`.
      operationId: createStudioRenderJob
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudioRenderRequest'
      responses:
        '202':
          description: Render job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioRenderJob'
        '422':
          description: Invalid manifest or media asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Another Studio render is already queued or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Render job could not be staged or queued (server-side failure; see backend log)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /studio/render-jobs/{job_id}:
    get:
      tags: [studio]
      summary: Get Studio timeline render status
      operationId: getStudioRenderJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current render status; completed jobs include the Gallery image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioRenderJob'
        '404':
          description: Render job not found or no longer retained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error while reading the job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [studio]
      summary: Cancel a Studio timeline render
      description: |
        Requests cancellation of a queued or running render. A `queued` job is
        cancelled immediately and its staged inputs are discarded. A
        `running` job is moved to `cancel_requested` and its FFmpeg process
        is killed; the worker thread then finalizes the row to `cancelled`.
        Calling this on a job that is already in a terminal state
        (`cancelled`, `completed`, `failed`) is a no-op that returns that
        state.
      operationId: cancelStudioRenderJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancellation requested or job already terminal
          content:
            application/json:
              schema:
                type: object
                required: [success, job_id, state]
                properties:
                  success:
                    type: boolean
                  job_id:
                    type: string
                  state:
                    type: string
                    enum: [queued, running, cancel_requested, cancelled, completed, failed]
              example:
                success: true
                job_id: "3f2a1c9e8b7d4a6f9c0e1b2a3d4e5f60"
                state: cancel_requested
        '404':
          description: Render job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error while requesting cancellation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /images:
    get:
      tags: [images]
      summary: List generated images
      description: |
        Returns a page of gallery rows as `GeneratedImageSummary` objects
        (the light projection -- no `parameters`, no `mask_data`). Fetch
        `GET /images/{image_id}` for the full `GeneratedImage` record.
        Rows are ordered by `created_at` descending.
      operationId: listImages
      parameters:
        - name: skip
          in: query
          description: Number of rows to skip (offset into the ordered result set).
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          description: Maximum number of rows to return.
          schema:
            type: integer
            default: 50
        - name: search
          in: query
          description: Substring match against the prompt, negative prompt, or filename.
          schema:
            type: string
        - name: generation_types
          in: query
          description: Comma-separated list of generation types to include.
          schema:
            type: string
          example: txt2img,img2img
        - name: date_from
          in: query
          description: Lower bound on `created_at`, ISO 8601.
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          description: Upper bound on `created_at`, ISO 8601.
          schema:
            type: string
            format: date-time
        - name: width_min
          in: query
          description: Lower bound on image width in pixels.
          schema:
            type: integer
        - name: width_max
          in: query
          description: Upper bound on image width in pixels.
          schema:
            type: integer
        - name: height_min
          in: query
          description: Lower bound on image height in pixels.
          schema:
            type: integer
        - name: height_max
          in: query
          description: Upper bound on image height in pixels.
          schema:
            type: integer
      responses:
        '200':
          description: List of images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'

  /images/{image_id}:
    get:
      tags: [images]
      summary: Get image by ID
      description: |
        Returns the full gallery record, including the complete `parameters`
        JSON and any `mask_data` that `GET /images` omits.
      operationId: getImage
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Image details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedImage'
        '404':
          description: |
            No gallery row with this id. Raised as a bare `HTTPException`, so
            the body is FastAPI's `{"detail": "Image not found"}` rather than
            an `ErrorResponse`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Image not found

    delete:
      tags: [images]
      summary: Delete a gallery row, with or without its files
      description: |
        `delete_files=true` (default): deletes the DB row AND every artefact
        it owns -- media file, sidecar JSON, poster/waveform PNG, both
        thumbnail variants, and the lossless-proxy `preview_filename` when
        present. Files are removed with the media file last, so if a later
        file fails to delete, the DB row (left intact, see 500 response)
        still points at a file that still exists on retry.

        `delete_files=false`: deletes only the DB row; all files stay on
        disk and become invisible to the gallery.
      operationId: deleteImage
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: integer
        - name: delete_files
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: |
            true = remove the DB row and every file it owns. false = remove
            only the DB row and leave all files on disk.
          example: true
      responses:
        '200':
          description: Image deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  delete_files:
                    type: boolean
                    description: Echoes the requested mode.
                  deleted_files:
                    type: array
                    items:
                      type: string
                    description: |
                      Labels of the files actually removed (`sidecar`,
                      `poster`, `thumbnail_png`, `thumbnail_webp`,
                      `preview_proxy`, `media`); empty when
                      `delete_files=false`. `poster` is omitted for plain
                      image rows, where it is the same path as `media`.
                example:
                  success: true
                  delete_files: true
                  deleted_files: [sidecar, poster, thumbnail_png, thumbnail_webp, media]
        '404':
          description: No gallery row with this id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Image not found
        '500':
          description: |
            `delete_files=true` and one or more files could not be removed
            (e.g. locked/permission-denied). The DB row was NOT deleted.
            Raised as a bare `HTTPException`, so the body is FastAPI's
            `{"detail": "..."}` rather than an `ErrorResponse`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

  /images/by-hash/{hash}:
    get:
      tags: [images]
      summary: Find a gallery row by its image_hash
      description: |
        Looks up a gallery row whose `image_hash` column equals `hash` and
        returns the same full record shape as `GET /images/{image_id}`
        (`GeneratedImage.to_dict()`), plus a `match_count` field.

        This is the resolver behind the gallery's clickable
        `source_image_hash` link: a still image's `source_image_hash` is a
        pixel-PNG hash (`calculate_image_hash`) and a video/audio row's is a
        raw-file-bytes hash (`calculate_bytes_hash`) -- either way, the value
        a client is resolving was copied from some OTHER row's `image_hash`
        at generation time, so this is a straight equality lookup, never a
        fuzzy/nearest match.

        `image_hash` is **not unique**: the same seed can be re-run (an
        identical PNG hashes identically), or the same uploaded file can be
        hashed twice across two different requests. When more than one row
        matches, this returns the **oldest** (`created_at` ascending) as the
        most plausible original source, and reports how many rows matched in
        `match_count` so a client can decide whether to disambiguate further
        (e.g. by also showing `match_count` in the UI).

        Video/audio rows saved before this endpoint existed (`hash_kind`
        absent from `parameters`) always carried `image_hash=""` and can
        never be resolved TO; a `source_image_hash` pointing at one of them
        will keep 404ing here until that row's `image_hash` is populated,
        which does not happen automatically for a pre-existing row.
      operationId: getImageByHash
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
          description: |
            The `image_hash` (or, when following a `source_image_hash` /
            `source_audio_hash` / ControlNet reference hash link, that value)
            to resolve to a gallery row.
          example: "b031b5d473385505b42bfc1715592e1769f9fd7eea86c08cb3d988e761e7aaed"
      responses:
        '200':
          description: The oldest gallery row whose image_hash matches, plus match_count.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GeneratedImage'
                  - type: object
                    required: [match_count]
                    properties:
                      match_count:
                        type: integer
                        description: |
                          Total number of gallery rows whose image_hash equals
                          `hash`. The returned row is the oldest of these
                          (`created_at` ascending); the rest are not returned.
                        example: 1
        '404':
          description: No gallery row has this image_hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /images/{image_id}/preview:
    get:
      tags: [images]
      summary: Get a sized WebP preview of a gallery image
      description: |
        Returns a medium-resolution WebP re-encode of the full-resolution
        output file (longest side snapped to a fixed bucket, default 1024px),
        generated lazily on first request and cached on disk
        (`cache/previews/`) keyed by (filename, width bucket). Subsequent
        requests for the same (image, width) serve the cached file directly.

        Intended for the gallery detail/lightbox view, which does not need
        the full lossless output PNG. The full-size popup and Download action
        keep using `GET /outputs/{filename}` (the original file).

        Only applies to image generations; rows flagged as video/audio return
        404 (their detail view uses the poster thumbnail + range-streamed
        original instead).
      operationId: getImagePreview
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: integer
        - name: w
          in: query
          description: Requested long-side width in pixels. Snapped to the nearest supported bucket (1024/1600/2048).
          schema:
            type: integer
            default: 1024
            example: 1024
      responses:
        '200':
          description: WebP preview image (cached on disk after first generation)
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Image row not found, source file missing on disk, or the row is a video/audio generation (no preview)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /temp-images/upload:
