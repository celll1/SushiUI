                video_frame_slider_max:
                  type: integer
                  nullable: true
                  description: |
                    Upper bound for the video frame-count slider TRACK. `null`
                    clears the setting (reverts to the built-in track reach). Does
                    not bound the paired number box.
                  example: 600
                slider_bounds:
                  type: object
                  additionalProperties:
                    type: number
                    nullable: true
                  description: |
                    Partial update of slider-bound overrides, keyed by bound name
                    (see PARAM_BOUNDS in backend/api/param_defaults.py). Only the
                    keys present are changed; a `null` value for a key resets that
                    one bound to its builtin. Unknown keys or values outside that
                    bound's [floor, ceiling] are rejected with 400.
                  example:
                    steps_max: 300
      responses:
        '200':
          description: Settings saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  settings:
                    type: object
                    properties:
                      inpaint_use_dedicated_model:
                        type: boolean
                      video_frame_slider_max:
                        type: integer
                        nullable: true
                      slider_bounds:
                        type: object
                        additionalProperties:
                          type: number
        '400':
          description: Unknown slider bound key, or a value outside its [floor, ceiling]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to save settings
