  /system/fp8-scaled-mm:
    get:
      tags: [system]
      summary: Get the FP8 W8A8 scaled-GEMM state
      description: |
        Report whether FP8 (e4m3) weight-only `Linear` layers run the W8A8
        `torch._scaled_mm` path or the dequantized matmul, for THIS backend
        process.

        The setting is per-process: it is initialized from the
        `SUSHI_FP8_SCALED_MM` environment variable at import (default off) and
        can be changed at runtime with the POST form of this endpoint. It is not
        persisted across restarts.

        `resolved_modes` reports the cached per-(device, activation dtype) probe
        results, so the case "enabled, but the probe found no usable scaling
        mode and every layer runs the dequantized matmul" is visible rather than
        inferred. An empty object means no FP8 `Linear` forward has reached the
        probe yet in this process.

        Applies only to architectures whose checkpoints carry weight-only FP8
        Linear weights (Ideogram 4, Krea 2, Anima). Training processes are always
        on the dequantized matmul, independently of this setting.
      operationId: getFp8ScaledMm
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fp8ScaledMmState'
              example:
                enabled: true
                origin: api
                resolved_modes:
                  "cuda:0/bfloat16": tensorwise
        '500':
          description: Could not read the state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [system]
      summary: Set the FP8 W8A8 scaled-GEMM state
      description: |
        Turn the W8A8 `torch._scaled_mm` path on or off for this backend process.

        Both directions clear the cached per-(device, activation dtype) probe, so
        the next FP8 `Linear` forward re-probes.

        The two paths are numerically different (the W8A8 path additionally
        quantizes the activation), so the endpoint REFUSES with 409 while an
        image generation or a training run is active: flipping mid-run would make
        the recorded metadata describe a path that produced only part of the
        result.

        Modules that declared themselves dequant-only (every trainer-side loader
        does) are unaffected: this setting cannot re-enable them.
      operationId: setFp8ScaledMm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fp8ScaledMmRequest'
            example:
              enabled: true
      responses:
        '200':
          description: State applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fp8ScaledMmState'
              example:
                enabled: true
                origin: api
                resolved_modes: {}
        '409':
          description: A generation or training run is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Could not read or change the state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /system/int8-mm:
    get:
      tags: [system]
      summary: Get the INT8 W8A8 integer-GEMM state
      description: |
        Report whether INT8 weight-only `Linear` layers run the W8A8
        `torch._int_mm` path or the dequantized matmul, for THIS backend
        process.

        The INT8 sibling of `/system/fp8-scaled-mm`. The setting is per-process:
        it is initialized from the `SUSHI_INT8_MM` environment variable at import
        (default off) and can be changed at runtime with the POST form of this
        endpoint. It is not persisted across restarts.

        `resolved_modes` reports the cached per-device probe result, so the case
        "enabled, but `torch._int_mm` was found unusable and every layer runs the
        dequantized matmul" is visible rather than inferred. An empty object
        means no INT8 `Linear` forward has reached the probe yet in this process.
        The key is a device (not device + activation dtype, as the FP8 endpoint
        uses): both GEMM operands are int8 whatever the activation dtype is.

        Even while enabled and resolved, individual layers still fall back to the
        dequantized matmul when a shape cannot use the integer GEMM
        (`torch._int_mm` requires m > 16, k % 8 == 0, n % 8 == 0) or is too small
        or too thin for the path to pay for its activation quantizer and
        epilogue. That per-layer decision is not reported here; the resolved
        metadata label recorded with each image (`fp8_gemm`) is the record of
        what ran.

        Applies only to architectures whose checkpoints carry weight-only INT8
        Linear weights. The Krea 2, Anima, FLUX.2 and Ideogram 4 loaders all swap
        `Int8Linear` (Ideogram 4 additionally reads weight-only FP8 and nf4, which
        its published checkpoints ship). This setting
        is a no-op for every other architecture. Training processes are always on
        the dequantized matmul, independently of this setting.
      operationId: getInt8Mm
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int8MmState'
              example:
                enabled: true
                origin: api
                resolved_modes:
                  "cuda:0": int_mm
        '500':
          description: Could not read the state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [system]
      summary: Set the INT8 W8A8 integer-GEMM state
      description: |
        Turn the W8A8 `torch._int_mm` path on or off for this backend process.

        Both directions clear the cached per-device probe, so the next INT8
        `Linear` forward re-probes.

        The two paths are numerically different (the W8A8 path additionally
        quantizes the activation), so the endpoint REFUSES with 409 while an
        image generation or a training run is active: flipping mid-run would make
        the recorded metadata describe a path that produced only part of the
        result.

        Modules that declared themselves dequant-only (every trainer-side loader
        does) are unaffected: this setting cannot re-enable them.

        Independent of `/system/fp8-scaled-mm`. A checkpoint produced by the int8
        conversion tool is MIXED -- layers whose per-row crest factor makes int8
        worse than e4m3 fall back to e4m3 in the same file -- so a model can own
        both module types and each toggle governs only its own.
      operationId: setInt8Mm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Int8MmRequest'
            example:
              enabled: true
      responses:
        '200':
          description: State applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int8MmState'
              example:
                enabled: true
                origin: api
                resolved_modes: {}
        '409':
          description: A generation or training run is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Could not read or change the state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

