    # ========================================
    # Training Schemas
    # ========================================

    TrainingRunCreateRequest:
      type: object
      required:
        - training_method
        - base_model_path
      properties:
        training_method:
          type: string
          enum: ["lora", "relora", "full_finetune", "controlnet", "vae_decoder"]
          description: |
            Training method to use. Selects which YAML generator runs, and
            therefore the `network.type` written into `config_yaml`, which is
            what `core/training/train_runner.py` branches on:

            | training_method | network.type | trains |
            |---|---|---|
            | `lora` | `lora` | LoRA adapters on the denoiser (+ optionally TEs) |
            | `relora` | `relora` | LoRA with periodic merge-and-restart |
            | `full_finetune` | `full_finetune` | all denoiser parameters |
            | `controlnet` | `controlnet` | a ControlNet / ControlNet-LLLite |
            | `vae_decoder` | `vae_decoder` | the VAE decoder only, encoder frozen |

            `vae_decoder` is a non-diffusion modality: no denoiser, no scheduler,
            no text encoder and no latent cache. Its options come from the
            `vae_config` field below (defaults at
            `GET /schema/vae-training-defaults`).
          example: "lora"
        base_model_path:
          type: string
          description: Path to the base model file
          example: "M:/models/animagine-xl-3.1.safetensors"
        vae_config:
          type: object
          nullable: true
          description: |
            VAE decoder fine-tune options. Only read when
            `training_method == "vae_decoder"`; ignored otherwise. Omitted keys
            fall back to `VAE_TRAINING_DEFAULTS`; unknown keys are rejected with
            a 500 listing the valid key set. See
            `#/components/schemas/VaeTrainingDefaults`.
          allOf:
            - $ref: '#/components/schemas/VaeTrainingDefaults'
          example:
            vae_source: "model"
            resolution: 512
            lpips_weight: 0.1
            ycbcr_dc_weight: 0.1
        dataset_id:
          type: integer
          nullable: true
          description: Single dataset ID (legacy form)
        dataset_configs:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
          description: Per-dataset configuration objects (dataset_id, caption settings, etc.)
        learning_rate:
          type: number
          format: float
          default: 0.0001
          description: Base learning rate
          example: 0.0001
        total_steps:
          type: integer
          nullable: true
          description: Total training steps (mutually exclusive with epochs)
          example: 1000
        epochs:
          type: integer
          nullable: true
          description: Number of epochs (mutually exclusive with total_steps)
          example: 10
        batch_size:
          type: integer
          default: 1
          description: Training batch size
          example: 1
        optimizer:
          type: string
          default: "adamw"
          description: |
            Optimizer type, resolved by
            `core/training/optimizer_factory.OptimizerFactory`: `adamw`,
            `adamw8bit`, `adamw8bit_ringbuffer`, `adafactor`, `lion8bit`,
            `lion8bit_ringbuffer`, `paged_adamw`, `paged_adamw8bit`,
            `paged_lion8bit`.

            Paging (bitsandbytes CPU offload of the optimizer state) is
            selected by the TYPE NAME alone — pick one of the `paged_*`
            entries. There is no separate boolean for it; the training panel
            offers the non-paged names only, so a paged run is configured
            through this field via the API or a hand-written YAML.

            **Block swap.** With `blocks_to_swap > 0`, parameters are on the CPU
            when `optimizer.step()` runs, and every bitsandbytes optimizer
            raises on a CPU-resident parameter. `adafactor`, `adamw8bit`,
            `adamw8bit_ringbuffer` and `lion8bit_ringbuffer` get a
            per-parameter fused backward pass instead and run; `adamw` (torch)
            updates CPU parameters itself. `lion8bit`, `paged_adamw`,
            `paged_adamw8bit` and `paged_lion8bit` have neither, so that
            combination is refused when training starts, with a message naming
            the alternatives. See also `num_optimizer_groups`, which refuses a
            wider set for the same reason.

            Note that `adamw8bit` under block swap is **no longer 8-bit**: its
            fused backward pass is a per-parameter AdamW that allocates its two
            moments in the parameter's own dtype, so optimizer state costs
            4 bytes per element instead of 2. `adamw8bit_ringbuffer` /
            `lion8bit_ringbuffer` keep their 8-bit state under block swap.

            **`lion8bit_ringbuffer` does not support `optimizer_schedule_free`**
            and refuses that combination at startup: its Schedule-Free kernel
            stores Lion's momentum EMA into the parameter instead of the
            Schedule-Free position sequence, which replaces the weights with the
            momentum buffer within a few steps. Use `adamw8bit_ringbuffer` for a
            Schedule-Free run.
          example: "adamw"
        lr_scheduler:
          type: string
          default: "constant"
          description: |
            Learning rate scheduler type. Includes the diffusers scheduler types
            (`constant`, `linear`, `cosine`, `cosine_with_restarts`, `polynomial`,
            `constant_with_warmup`, ...) plus `plateau_cosine_floor`: warmup, then a
            plateau at the base LR, then a cosine decay down to a floor
            (`lr_floor_ratio` of the base LR) that is held for the remainder of
            training (see `lr_decay_start_ratio` / `lr_floor_ratio`).
          example: "cosine"
        lr_warmup_steps:
          type: integer
          default: 0
          description: Number of LR warmup steps
          example: 100
        lr_decay_start_ratio:
          type: number
          format: float
          default: 0.85
          description: |
            Only consumed when `lr_scheduler` is `plateau_cosine_floor`. Fraction of
            total training steps (0-1) at which the plateau ends and the cosine decay
            to `lr_floor_ratio` begins.
          example: 0.85
        lr_floor_ratio:
          type: number
          format: float
          default: 0.25
          description: |
            Only consumed when `lr_scheduler` is `plateau_cosine_floor`. Fraction of
            the base learning rate the cosine decay settles at and holds for the
            remainder of training (never decays to 0).
          example: 0.25
        use_ema:
          type: boolean
          default: false
          description: |
            Enable an exponential moving average (EMA) of the trainable weights. When
            enabled, a separate, fully loadable checkpoint of the EMA-averaged weights
            is saved alongside (not instead of) each normal checkpoint, under a
            run_name with an `_ema` suffix.
          example: false
        ema_decay:
          type: number
          format: float
          default: 0.9999
          description: Only consumed when `use_ema` is true. EMA decay factor.
          example: 0.9999
        ema_update_every:
          type: integer
          default: 1
          minimum: 1
          description: |
            Only consumed when `use_ema` is true. Apply the EMA update every N
            optimizer steps instead of every step (reduces per-step overhead). The
            decay used for each applied update is raised to the power N, so the EMA's
            effective averaging horizon stays approximately constant regardless of N.
          example: 1
        ema_device:
          type: string
          enum: ["cpu", "cuda"]
          default: "cpu"
          description: |
            Only consumed when `use_ema` is true. Where the EMA shadow tensors live.
            `cpu` avoids extra VRAM usage (one GPU->CPU sync per applied update);
            `cuda` keeps the shadow on the parameter's own device (no sync, uses
            roughly one extra copy of the trainable parameters in VRAM).
          example: "cpu"
        # Attention backend selector (training)
        attention_backend:
          type: string
          enum: ["native", "flash", "tq"]
          default: "native"
          description: |
            Attention backend used during training.
            - `native`: PyTorch scaled_dot_product_attention (SDPA).
            - `flash`: FlashAttention.
            - `tq`: Triton-Quantized attention (trainable, with a real backward). Effective
              only on conduit-routed architectures (Z-Image/Lens/MiniT2I/Anima) that train
              through the unified dispatch. Diffusers-based training (SDXL/FLUX.2, which use
              `set_attention_backend`) has no tq entry and falls back to `native`. tq
              supports head_dim of 64 or 128 only; other head dims fall back to `native`.

            `sage` (SageAttention) is inference-only: it has no backward kernel, so it is
            refused for training and downgraded to `native` by the trainer's
            `resolve_backend` guard even if forced via a hand-edited YAML/preset.

            This string key is authoritative and supersedes the deprecated
            `use_flash_attention` boolean. When omitted, the trainer derives the backend
            from `use_flash_attention` (`true` -> `flash`, `false` -> `native`) for
            backward compatibility with existing presets.
          example: "native"
        attention_impl:
          type: string
          enum: ["conduit", "diffusers"]
          default: "conduit"
          description: |
            Attention implementation registry used during training. Selects WHICH
            registry executes the attention kernel; orthogonal to `attention_backend`
            (which selects WHICH kernel).
            - `conduit`: routes through the unified `backend/core/attention` dispatch
              (new default). Enables the `tq` backend in SDXL/SD1.5 training.
            - `diffusers`: reproduces the pre-migration `set_attention_backend` path
              byte-for-byte.

            TRAINING-ONLY this pass; affects SDXL/SD1.5 training (FLUX.2/Ideogram4 are
            not yet migrated and ignore this flag). Backward-compat: a fresh run
            defaults to `conduit`; a resume whose saved config lacks this key defaults
            to `diffusers` to reproduce prior numerics, and the resolved value is
            persisted back into the run config.
          example: "conduit"
        bundle_vae:
          type: boolean
          nullable: true
          default: null
          description: |
            Full-parameter training only: also embed the VAE weights into the saved
            single-file checkpoint. `null` (default) resolves to the per-architecture
            default: `true` for sd15/sdxl/deus (their comfy-layout checkpoints are
            consumed by A1111/ComfyUI, which require the `first_stage_model.*` VAE
            section), `false` for all other architectures (their loaders fall back to
            the default VAE resolution when the section is absent). An explicit
            boolean always wins. Ignored for LoRA and for pixel-space MiniT2I (no VAE).
          example: null
        use_flash_attention:
          type: boolean
          default: false
          deprecated: true
          description: |
            DEPRECATED compat mirror of `attention_backend`. Kept so existing YAML/presets
            that only set the boolean still enable FlashAttention (`true` maps to
            `attention_backend='flash'`). Prefer `attention_backend`. When both are supplied,
            `attention_backend` wins.
          example: false
        # LoRA parameters (used by lora and relora methods)
        lora_rank:
          type: integer
          default: 16
          description: LoRA rank (used when training_method is lora or relora)
          example: 16
        lora_alpha:
          type: integer
          default: 16
          description: LoRA alpha (used when training_method is lora or relora)
          example: 16
        lora_dtype:
          type: string
          enum: ["fp32", "fp16", "bf16"]
          default: "fp32"
          description: LoRA weight dtype
          example: "fp32"
        # ReLoRA-specific parameters
        relora_merge_every:
          type: integer
          default: 500
          description: Interval between merge-reinit cycles (in steps or epochs)
          example: 500
        relora_merge_unit:
          type: string
