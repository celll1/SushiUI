openapi: 3.0.3
info:
  title: SushiUI - Stable Diffusion WebUI API
  description: |
    Backend API for SushiUI, a Stable Diffusion web interface with advanced features.

    Features:
    - Multiple generation modes (txt2img, img2img, inpaint)
    - LoRA support
    - ControlNet integration
    - TIPO tag generation
    - Image tagging
    - Quantization support (FP8, UINT)
  version: 1.0.0
  contact:
    name: SushiUI GitHub
    url: https://github.com/celll1/SushiUI

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server (API v1)

tags:
  - name: generation
    description: Image generation endpoints
  - name: images
    description: Image management and gallery
  - name: models
    description: Model management and loading
  - name: controlnet
    description: ControlNet preprocessors and detection
  - name: tags
    description: Tag suggestions and autocomplete
  - name: tipo
    description: TIPO tag generation AI
  - name: tagger
    description: Image tag prediction
  - name: settings
    description: Application settings
  - name: system
    description: System control and monitoring
  - name: auth
    description: Authentication (if enabled)
  - name: datasets
    description: Dataset management, scanning, and structure detection

paths:
  /schema/timestep-defaults-by-arch:
    get:
      summary: Per-architecture default timestep_sampling configs
      description: |
        Returns a map of model architecture -> default `timestep_sampling` config.
        The frontend applies the selected model's entry when the base model changes
        (user edits win). Most architectures default to uniform; only MiniT2I differs
        (logit_normal mean=-0.8/std=0.8). The `_default` key is the global fallback.
      tags: [Schema]
      responses:
        '200':
          description: Map of architecture name to timestep sampling config
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/TimestepSamplingConfig'
              example:
                _default: { distribution: uniform, min_timestep: 0.0, max_timestep: 1.0 }
                minit2i: { distribution: logit_normal, mean: -0.8, std: 0.8, min_timestep: 0.0, max_timestep: 1.0 }
  /generate/txt2img:
    post:
      tags: [generation]
      summary: Generate image from text prompt
      description: |
        Text-to-image generation using Stable Diffusion.

        **Key parameters:**
        - `prompt`: Main generation prompt (required)
        - `steps`: Number of inference steps (1-150, default: 28)
        - `cfg_scale`: Classifier-free guidance scale (1.0-30.0, default: 7.0)
        - `controlnet_images`: Optional ControlNet images for direct upload (multipart)

        **ControlNet usage:**
        - Can upload images directly via `controlnet_images` field
        - Or use base64 encoding in `controlnets` JSON parameter
      operationId: generateTxt2Img
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Txt2ImgRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                image_path: "/outputs/2025-11-28/txt2img_20251128_123456_001.png"
                image_id: 42
                seed: 1234567890
                metadata:
                  prompt: "1girl, beautiful anime character, detailed face, long hair, standing in garden, cherry blossoms"
                  model_name: "animagine-xl-3.1"
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/img2img:
    post:
      tags: [generation]
      summary: Generate image from image and prompt
      description: |
        Image-to-image generation. Transforms an input image according to the prompt.

        **Key parameters:**
        - `denoising_strength`: Controls how much the image is changed (0.0-1.0). Lower = closer to original.
        - `image`: Input image (PNG/JPEG, binary file upload)
      operationId: generateImg2Img
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Img2ImgRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                image_path: "/outputs/2025-11-28/img2img_20251128_123456_001.png"
                image_id: 43
                seed: 9876543210
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/inpaint:
    post:
      tags: [generation]
      summary: Inpaint image with mask
      description: |
        Inpainting generation. Fills masked areas of an image according to the prompt.

        **Key parameters:**
        - `image`: Original image (PNG/JPEG, binary file upload)
        - `mask`: Mask image (PNG/JPEG, white = inpaint area, black = keep original)
        - `denoising_strength`: Controls strength of generation (0.0-1.0)
        - `mask_blur`: Blur radius for mask edge smoothing (default: 4)
      operationId: generateInpaint
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InpaintRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                image_path: "/outputs/2025-11-28/inpaint_20251128_123456_001.png"
                image_id: 44
                seed: 5555555555
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cancel:
    post:
      tags: [generation]
      summary: Cancel current generation
      description: Cancels the currently running generation task
      operationId: cancelGeneration
      responses:
        '200':
          description: Cancellation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /images:
    get:
      tags: [images]
      summary: List generated images
      description: Get list of generated images with optional filtering
      operationId: listImages
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: generation_type
          in: query
          schema:
            type: string
            enum: [txt2img, img2img, inpaint]
        - name: model_name
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'

  /images/{image_id}:
    get:
      tags: [images]
      summary: Get image by ID
      operationId: getImage
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Image details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedImage'

    delete:
      tags: [images]
      summary: Delete image
      operationId: deleteImage
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Image deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /temp-images/upload:
    post:
      tags: [images]
      summary: Upload temporary image
      description: Upload image for img2img/inpaint (stored temporarily)
      operationId: uploadTempImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum: [img2img, inpaint_image, inpaint_mask]
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_id:
                    type: string
                  url:
                    type: string

  /temp-images/{image_id}:
    get:
      tags: [images]
      summary: Get temporary image
      operationId: getTempImage
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Temporary image
          content:
            image/png:
              schema:
                type: string
                format: binary

    delete:
      tags: [images]
      summary: Delete temporary image
      operationId: deleteTempImage
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image deleted

  /temp-images/cleanup:
    post:
      tags: [images]
      summary: Cleanup old temporary images
      description: Delete temporary images older than specified hours
      operationId: cleanupTempImages
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hours_old:
                  type: number
                  default: 24
      responses:
        '200':
          description: Cleanup successful

  /models:
    get:
      tags: [models]
      summary: List available models
      description: Get list of all available Stable Diffusion models
      operationId: listModels
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelInfo'

  /models/load:
    post:
      tags: [models]
      summary: Load a model
      description: |
        Load a Stable Diffusion model into memory for generation.

        **Supported formats:**
        - `.safetensors` (recommended)
        - `.ckpt` (legacy)
        - Diffusers format (directory)

        **Note:** Loading a new model will unload the currently loaded model and clear VRAM.
      operationId: loadModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_path]
              properties:
                model_path:
                  type: string
                  description: Relative path to model file from models directory
                  example: "animagine-xl-3.1.safetensors"
      responses:
        '200':
          description: Model loaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Model loaded successfully"
                  model_hash:
                    type: string
                    example: "a1b2c3d4e5f6"

  /models/upload:
    post:
      tags: [models]
      summary: Upload new model
      description: Upload a new model file (safetensors)
      operationId: uploadModel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Model uploaded successfully

  /models/current:
    get:
      tags: [models]
      summary: Get currently loaded model
      operationId: getCurrentModel
      responses:
        '200':
          description: Current model info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfo'

  /loras:
    get:
      tags: [models]
      summary: List available LoRAs
      operationId: listLoras
      responses:
        '200':
          description: List of LoRAs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoRAListResponse'

  /loras/{lora_name}:
    get:
      tags: [models]
      summary: Get LoRA info
      operationId: getLoraInfo
      parameters:
        - name: lora_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: LoRA information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoRAInfo'

  /samplers:
    get:
      tags: [models]
      summary: List available samplers
      operationId: listSamplers
      responses:
        '200':
          description: List of samplers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamplerListResponse'

  /schedule-types:
    get:
      tags: [models]
      summary: List scheduler types
      operationId: listScheduleTypes
      responses:
        '200':
          description: List of scheduler types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTypeListResponse'

  /tokenize:
    post:
      tags: [models]
      summary: Tokenize prompt
      description: Count tokens in a prompt using loaded model's tokenizer
      operationId: tokenizePrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                prompt_chunking_mode:
                  type: string
                  enum: [a1111, sd_scripts, nobos]
                  default: a1111
      responses:
        '200':
          description: Token count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeResponse'

  /controlnets:
    get:
      tags: [controlnet]
      summary: List available ControlNets
      operationId: listControlNets
      responses:
        '200':
          description: List of ControlNets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlNetListResponse'

  /controlnets/{controlnet_path}/info:
    get:
      tags: [controlnet]
      summary: Get ControlNet info
      operationId: getControlNetInfo
      parameters:
        - name: controlnet_path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ControlNet information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlNetInfo'

  /controlnet/detect-preprocessor:
    get:
      tags: [controlnet]
      summary: Detect preprocessor from ControlNet name
      operationId: detectPreprocessor
      parameters:
        - name: controlnet_name
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detected preprocessor
          content:
            application/json:
              schema:
                type: object
                properties:
                  preprocessor:
                    type: string

  /controlnet/preprocessors:
    get:
      tags: [controlnet]
      summary: List available preprocessors
      operationId: listPreprocessors
      responses:
        '200':
          description: List of preprocessors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreprocessorListResponse'

  /controlnet/preprocess-image:
    post:
      tags: [controlnet]
      summary: Preprocess image with ControlNet preprocessor
      operationId: preprocessImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, preprocessor]
              properties:
                image:
                  type: string
                  format: binary
                preprocessor:
                  type: string
                resolution:
                  type: integer
                  default: 512
      responses:
        '200':
          description: Preprocessed image
          content:
            image/png:
              schema:
                type: string
                format: binary

  /taglist/{category}:
    get:
      tags: [tags]
      summary: Get tag list for category
      description: Get autocomplete tag suggestions for specified category
      operationId: getTagList
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [general, character, artist, copyright, meta, model]
      responses:
        '200':
          description: Tag list
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer

  /tagother/tag_other_names:
    get:
      tags: [tags]
      summary: Get tag aliases (other names)
      description: Get tag aliases in different languages
      operationId: getTagOtherNames
      responses:
        '200':
          description: Tag aliases
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

  /taglist/timestamps:
    get:
      tags: [tags]
      summary: Get tag file modification timestamps
      description: Get modification timestamps for all tag files to check if cache is stale
      operationId: getTagFileTimestamps
      responses:
        '200':
          description: Modification timestamps for tag files
          content:
            application/json:
              schema:
                type: object
                properties:
                  general:
                    type: number
                    description: Unix timestamp (ms) of General.json
                  character:
                    type: number
                    description: Unix timestamp (ms) of Character.json
                  artist:
                    type: number
                    description: Unix timestamp (ms) of Artist.json
                  copyright:
                    type: number
                    description: Unix timestamp (ms) of Copyright.json
                  meta:
                    type: number
                    description: Unix timestamp (ms) of Meta.json
                  model:
                    type: number
                    description: Unix timestamp (ms) of Model.json
                  other_names:
                    type: number
                    description: Unix timestamp (ms) of tag_other_names.json
                example:
                  general: 1733270400000
                  character: 1733270400000
                  artist: 1733270400000
                  copyright: 1733270400000
                  meta: 1733270400000
                  model: 1733270400000
                  other_names: 1733270400000

  /tipo/load-model:
    post:
      tags: [tipo]
      summary: Load TIPO model
      description: Load TIPO tag generation model
      operationId: loadTipoModel
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model_name:
                  type: string
                  default: KBlueLeaf/TIPO-500M
      responses:
        '200':
          description: Model loaded

  /tipo/generate:
    post:
      tags: [tipo]
      summary: Generate tags with TIPO
      description: Generate tags from image using TIPO
      operationId: generateTipoTags
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                tag_length:
                  type: string
                  enum: [short, long, very_long]
                  default: short
                nl_length:
                  type: string
                  enum: [short, long]
                  default: short
                categories:
                  type: array
                  items:
                    type: string
                temperature:
                  type: number
                  default: 0.5
                top_p:
                  type: number
                  default: 0.9
                top_k:
                  type: integer
                  default: 40
                max_new_tokens:
                  type: integer
                  default: 256
      responses:
        '200':
          description: Generated tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: string

  /tipo/status:
    get:
      tags: [tipo]
      summary: Get TIPO model status
      operationId: getTipoStatus
      responses:
        '200':
          description: Model status
          content:
            application/json:
              schema:
                type: object
                properties:
                  loaded:
                    type: boolean
                  model_name:
                    type: string

  /tipo/unload:
    post:
      tags: [tipo]
      summary: Unload TIPO model
      operationId: unloadTipoModel
      responses:
        '200':
          description: Model unloaded

  /tagger/load-model:
    post:
      tags: [tagger]
      summary: Load tagger model
      description: Load image tagging model
      operationId: loadTaggerModel
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model_name:
                  type: string
      responses:
        '200':
          description: Model loaded

  /tagger/predict:
    post:
      tags: [tagger]
      summary: Predict tags from image
      description: Predict tags using loaded tagger model
      operationId: predictTags
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                threshold:
                  type: number
                  default: 0.35
      responses:
        '200':
          description: Predicted tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: object
                    additionalProperties:
                      type: number

  /tagger/status:
    get:
      tags: [tagger]
      summary: Get tagger model status
      operationId: getTaggerStatus
      responses:
        '200':
          description: Model status
          content:
            application/json:
              schema:
                type: object
                properties:
                  loaded:
                    type: boolean

  /tagger/unload:
    post:
      tags: [tagger]
      summary: Unload tagger model
      operationId: unloadTaggerModel
      responses:
        '200':
          description: Model unloaded

  /settings/directories:
    get:
      tags: [settings]
      summary: Get directory settings
      operationId: getDirectorySettings
      responses:
        '200':
          description: Directory settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  outputs_dir:
                    type: string
                  models_dir:
                    type: string
                  lora_dir:
                    type: string
                  controlnet_dir:
                    type: string

    post:
      tags: [settings]
      summary: Update directory settings
      operationId: updateDirectorySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outputs_dir:
                  type: string
                models_dir:
                  type: string
                lora_dir:
                  type: string
                controlnet_dir:
                  type: string
      responses:
        '200':
          description: Settings updated

  /system/restart-backend:
    post:
      tags: [system]
      summary: Restart backend server
      operationId: restartBackend
      responses:
        '200':
          description: Restart initiated

  /system/restart-frontend:
    post:
      tags: [system]
      summary: Restart frontend dev server
      operationId: restartFrontend
      responses:
        '200':
          description: Restart initiated

  /system/gpu-stats:
    get:
      tags: [system]
      summary: Get GPU statistics
      description: Get current GPU memory usage and statistics
      operationId: getGpuStats
      responses:
        '200':
          description: GPU statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  gpu_name:
                    type: string
                  total_memory:
                    type: number
                  used_memory:
                    type: number
                  free_memory:
                    type: number
                  utilization:
                    type: number

  /port-info:
    get:
      tags: [system]
      summary: Get port information
      description: Get backend port number
      operationId: getPortInfo
      responses:
        '200':
          description: Port information
          content:
            application/json:
              schema:
                type: object
                properties:
                  port:
                    type: integer

  /auth/status:
    get:
      tags: [auth]
      summary: Get authentication status
      operationId: getAuthStatus
      responses:
        '200':
          description: Auth status

  /auth/login:
    post:
      tags: [auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /auth/verify:
    get:
      tags: [auth]
      summary: Verify token
      operationId: verifyToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token valid

  /download/{filename}:
    get:
      tags: [system]
      summary: Download generated image
      description: Download image file by filename
      operationId: downloadFile
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File download
          content:
            image/*:
              schema:
                type: string
                format: binary

  /datasets/{dataset_id}/suffix-config:
    patch:
      tags: [datasets]
      summary: Update dataset suffix configuration
      description: |
        Update the suffix configuration for dataset structure detection.
        Controls how files are grouped into reference/target pairs during scanning.

        After updating, re-scan the dataset to apply the new configuration.
      operationId: updateDatasetSuffixConfig
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetSuffixUpdateRequest'
      responses:
        '200':
          description: Suffix configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TimestepSamplingConfig:
      type: object
      description: |
        Training timestep sampling distribution. Drawn once per step by the shared
        TimestepSampler. The sampler emits t in [0,1]; each model interprets the
        convention (e.g. MiniT2I uses t=1=data, flow models use t=1=noise), so the
        sign/meaning of `mean` is architecture-dependent.
      properties:
        distribution:
          type: string
          enum: [uniform, normal, logit_normal, beta, custom]
          default: uniform
          description: 'Sampling distribution. "logit_normal" = sigmoid(N(mean,std)) (FLUX/SD3 style).'
          example: logit_normal
        min_timestep:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.0
          example: 0.0
        max_timestep:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 1.0
          example: 1.0
        mean:
          type: number
          description: Mean of the underlying normal (normal / logit_normal only).
          example: -0.8
        std:
          type: number
          description: Std of the underlying normal (normal / logit_normal only).
          example: 0.8
        alpha:
          type: number
          description: Beta distribution alpha (beta only).
          example: 2.0
        beta:
          type: number
          description: Beta distribution beta (beta only).
          example: 2.0
        custom_weights:
          type: array
          items:
            type: number
          description: Per-bin weights (custom distribution only).
      example:
        distribution: logit_normal
        mean: -0.8
        std: 0.8
        min_timestep: 0.0
        max_timestep: 1.0
    GenerationParams:
      type: object
      required:
        - prompt
        - sampler
        - schedule_type
        - steps
        - cfg_scale
        - width
        - height
      properties:
        prompt:
          type: string
        negative_prompt:
          type: string
          default: ""
        sampler:
          type: string
          example: "euler_a"
        schedule_type:
          type: string
          example: "karras"
        steps:
          type: integer
          minimum: 1
          maximum: 150
          default: 20
        cfg_scale:
          type: number
          minimum: 0
          maximum: 30
          default: 7.0
        seed:
          type: integer
          default: -1
        ancestral_seed:
          type: integer
          default: -1
        width:
          type: integer
          multipleOf: 8
          default: 1024
        height:
          type: integer
          multipleOf: 8
          default: 1024
        loras:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              weight:
                type: number
        prompt_chunking_mode:
          type: string
          enum: [a1111, sd_scripts, nobos]
          default: a1111
        max_prompt_chunks:
          type: integer
          default: 0
        controlnets:
          type: array
          items:
            type: object
            properties:
              model_path:
                type: string
              image_base64:
                type: string
              strength:
                type: number
                default: 1.0
              start_step:
                type: integer
                default: 0
              end_step:
                type: integer
                default: 1000
              is_lllite:
                type: boolean
                default: false
              is_reference_guide:
                type: boolean
                default: false
                description: "Reference Guide mode: blend latent toward reference image instead of using ControlNet model"
              preprocessor:
                type: string
              enable_preprocessor:
                type: boolean
                default: false
        cfg_schedule_type:
          type: string
          enum: [constant, linear, cosine, exponential]
          default: constant
        cfg_schedule_min:
          type: number
          default: 1.0
        cfg_schedule_max:
          type: number
        cfg_schedule_power:
          type: number
          default: 2.0
        cfg_rescale_snr_alpha:
          type: number
          default: 0.0
        dynamic_threshold_percentile:
          type: number
          default: 0.0
        dynamic_threshold_mimic_scale:
          type: number
          default: 7.0
        nag_enable:
          type: boolean
          default: false
        nag_scale:
          type: number
          default: 5.0
        nag_tau:
          type: number
          default: 3.5
        nag_alpha:
          type: number
          default: 0.25
        nag_sigma_end:
          type: number
          default: 3.0
        nag_negative_prompt:
          type: string
          default: ""
        unet_quantization:
          type: string
          enum: [none, fp8_e4m3fn, fp8_e5m2, uint2, uint3, uint4, uint5, uint6, uint7, uint8]
        use_torch_compile:
          type: boolean
          default: false
        vae_tiling:
          type: boolean
          default: false
          description: |
            Decode the latent through the VAE in overlapping tiles so the decode
            memory peak is bounded by the tile size, not the full image. Lets large
            images decode without OOM. Off by default (not bit-identical to a full
            decode; small images below the tile threshold are unaffected).
          example: false
        vae_tile_threshold:
          type: integer
          default: 0
          description: |
            Image size in pixels above which VAE tiling activates (also the tile
            size). 0 = auto = VAE sample_size * 1.5 (~1536px for SDXL). Below the
            threshold the decode runs whole; above it, split into threshold-sized
            tiles. Raise it if mid-size images decode fine un-tiled.
          example: 0
        spectrum_enable:
          type: boolean
          default: false
          description: |
            Spectrum (Adaptive Spectral Feature Forecasting, arXiv 2603.01623):
            training-free acceleration that skips U-Net forwards on selected steps by
            forecasting the output from a Chebyshev polynomial fit (ridge regression)
            over actual passes. Most effective at high step counts (>=30); little
            benefit on low-step/distilled models. Auto-disabled with prompt-editing,
            ControlNet, or DEUS (per-step conditioning changes).
          example: false
        spectrum_w:
          type: number
          default: 1.0
          description: "Mix between the spectral forecast and linear extrapolation (1.0 = spectral only). Recommended 0.5-1.0."
          example: 1.0
        spectrum_m:
          type: integer
          default: 4
          description: "Number of Chebyshev basis functions. Larger = more detail but less stable."
          example: 4
        spectrum_lam:
          type: number
          default: 0.1
          description: "Ridge regularization strength for the coefficient fit."
          example: 0.1
        spectrum_warmup_steps:
          type: integer
          default: 3
          description: "Leading steps that always run a full forward (build the cache before forecasting)."
          example: 3
        spectrum_window_size:
          type: integer
          default: 4
          description: "Initial skip interval; subsequent intervals grow (sparser late)."
          example: 4
        spectrum_flex_window:
          type: number
          default: 0.75
          description: "Damps the actual number of skipped steps. 0 = skip the full window (most aggressive); higher = more conservative/higher quality."
          example: 0.75
        vision_encoder_path:
          type: string
          nullable: true
          description: "Path to SigLIP2 vision encoder safetensors file. When set, reference images are encoded via SigLIP2 and concatenated to text embeddings."
          example: "models/siglip2_base_vision_encoder.safetensors"
        ref_images:
          type: array
          items:
            type: string
            format: binary
          description: "Reference images for FLUX.2 Image Edit or SigLIP2 vision encoder conditioning (multipart upload)"

    Txt2ImgRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          properties:
            controlnet_images:
              type: array
              items:
                type: string
                format: binary
              description: "Optional ControlNet images for direct upload (alternative to base64)"

    Img2ImgRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          required:
            - image
          properties:
            image:
              type: string
              format: binary
            denoising_strength:
              type: number
              minimum: 0
              maximum: 1
              default: 0.75
            denoising_schedule_type:
              type: string
              default: constant

    InpaintRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          required:
            - image
            - mask
          properties:
            image:
              type: string
              format: binary
            mask:
              type: string
              format: binary
            denoising_strength:
              type: number
              minimum: 0
              maximum: 1
              default: 0.75
            denoising_schedule_type:
              type: string
              default: constant
            mask_blur:
              type: integer
              default: 4

    GenerationResponse:
      type: object
      properties:
        image_path:
          type: string
        image_id:
          type: integer
        seed:
          type: integer
        metadata:
          type: object

    GeneratedImage:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        generation_type:
          type: string
          enum: [txt2img, img2img, inpaint]
        model_name:
          type: string
        prompt:
          type: string
        negative_prompt:
          type: string
        parameters:
          type: object
        created_at:
          type: string
          format: date-time

    ImageListResponse:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedImage'
        total:
          type: integer

    ModelInfo:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [safetensors, ckpt, diffusers]
        hash:
          type: string
        size:
          type: integer

    ErrorResponse:
      type: object
      required:
        - error
        - status_code
        - timestamp
        - path
      properties:
        error:
          type: string
          description: Error message
          example: "Generation failed"
        detail:
          type: string
          description: Detailed error information
          example: "Invalid parameter: steps must be between 1 and 150"
        status_code:
          type: integer
          description: HTTP status code
          example: 400
        timestamp:
          type: string
          format: date-time
          description: Error occurrence timestamp (ISO 8601)
          example: "2025-11-28T12:34:56.789Z"
        path:
          type: string
          description: Request path that caused the error
          example: "/generate/txt2img"

    ControlNetInfo:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
          description: ControlNet model name
          example: "control_canny-fp16"
        path:
          type: string
          description: Relative path to model file
          example: "controlnet/control_canny-fp16.safetensors"
        type:
          type: string
          enum: [standard, lllite]
          description: ControlNet type
          default: standard
        size:
          type: integer
          description: File size in bytes
          example: 1456734208
        hash:
          type: string
          description: Model hash (SHA256)
          example: "a1b2c3d4e5f6..."

    ControlNetListResponse:
      type: object
      properties:
        controlnets:
          type: array
          items:
            $ref: '#/components/schemas/ControlNetInfo'

    LoRAInfo:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
          description: LoRA model name
          example: "my_style_lora"
        path:
          type: string
          description: Relative path to LoRA file
          example: "lora/my_style_lora.safetensors"
        size:
          type: integer
          description: File size in bytes
          example: 143654912
        hash:
          type: string
          description: Model hash (SHA256)
          example: "f1e2d3c4b5a6..."

    LoRAListResponse:
      type: object
      properties:
        loras:
          type: array
          items:
            $ref: '#/components/schemas/LoRAInfo'

    SamplerInfo:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Sampler identifier
          example: "euler_a"
        name:
          type: string
          description: Display name
          example: "Euler a"
        description:
          type: string
          description: Sampler description
          example: "Euler Ancestral sampler (stochastic)"

    SamplerListResponse:
      type: object
      properties:
        samplers:
          type: array
          items:
            $ref: '#/components/schemas/SamplerInfo'

    ScheduleTypeInfo:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Schedule type identifier
          example: "karras"
        name:
          type: string
          description: Display name
          example: "Karras"
        description:
          type: string
          description: Schedule type description
          example: "Karras noise schedule"

    ScheduleTypeListResponse:
      type: object
      properties:
        schedule_types:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleTypeInfo'

    PreprocessorInfo:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Preprocessor name
          example: "canny"
        description:
          type: string
          description: Preprocessor description
          example: "Canny edge detection"

    PreprocessorListResponse:
      type: object
      properties:
        preprocessors:
          type: array
          items:
            $ref: '#/components/schemas/PreprocessorInfo'

    TokenizeResponse:
      type: object
      properties:
        tokens:
          type: integer
          description: Number of tokens in the prompt
          example: 42
        max_tokens:
          type: integer
          description: Maximum tokens allowed
          example: 75

    DatasetSuffixUpdateRequest:
      type: object
      description: Update suffix configuration for dataset structure detection
      properties:
        reference_suffixes:
          type: array
          items:
            type: string
          description: Suffixes identifying reference/source images (e.g., ["_source", "_depth"])
          example: ["_source"]
        target_suffixes:
          type: array
          items:
            type: string
          description: Suffixes identifying target/main training images (e.g., ["_target"])
          example: ["_target"]
        caption_suffixes_for_reference:
          type: array
          items:
            type: string
          description: Suffixes identifying caption/instruction files in reference mode (e.g., ["_instruction"])
          example: ["_instruction"]

    Dataset:
      type: object
      required:
        - id
        - name
        - path
      properties:
        id:
          type: integer
          description: Dataset ID
          example: 1
        name:
          type: string
          description: Dataset name
          example: "Instruct_NL"
        path:
          type: string
          description: Directory path
          example: "D:\\datasets\\instruct_nl"
        description:
          type: string
          nullable: true
          description: Optional description
        recursive:
          type: boolean
          description: Whether subdirectories are scanned
          default: true
        read_exif:
          type: boolean
          description: Whether EXIF metadata is extracted
          default: false
        reference_suffixes:
          type: array
          items:
            type: string
          description: Configured reference image suffixes
          example: ["_source"]
        target_suffixes:
          type: array
          items:
            type: string
          description: Configured target image suffixes
          example: ["_target"]
        caption_suffixes_for_reference:
          type: array
          items:
            type: string
          description: Configured caption suffixes for reference mode
          example: ["_instruction"]
        total_items:
          type: integer
          description: Total number of dataset items
          example: 986
        total_captions:
          type: integer
          description: Total number of captions
          example: 986
        total_tags:
          type: integer
          description: Total number of unique tags
          example: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_scanned_at:
          type: string
          format: date-time
          nullable: true

    StructureDetectionResult:
      type: object
      description: Result of automatic dataset structure detection
      required:
        - structure_type
      properties:
        structure_type:
          type: string
          enum: ["normal", "paired"]
          description: Detected dataset structure type
          example: "paired"
        reference_suffixes:
          type: array
          items:
            type: string
          description: Detected reference image suffixes
          example: ["_source"]
        target_suffixes:
          type: array
          items:
            type: string
          description: Detected target image suffixes
          example: ["_target"]
        caption_suffixes_for_reference:
          type: array
          items:
            type: string
          description: Detected caption suffixes
          example: ["_instruction"]
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Detection confidence (ratio of fully paired groups)
          example: 0.95
        unknown_suffixes:
          type: array
          items:
            type: string
          description: Suffixes detected as paired but not classifiable
        stats:
          type: object
          properties:
            total_files_sampled:
              type: integer
            suffix_counts:
              type: object
              additionalProperties:
                type: integer
            paired_groups:
              type: integer
            unpaired_files:
              type: integer

    DatasetScanResponse:
      type: object
      required:
        - items_found
        - captions_found
        - dataset
      properties:
        items_found:
          type: integer
          description: Number of items found during scan
          example: 986
        captions_found:
          type: integer
          description: Number of captions found during scan
          example: 986
        dataset:
          $ref: '#/components/schemas/Dataset'
        structure_detection:
          $ref: '#/components/schemas/StructureDetectionResult'
          description: Auto-detection result (only present when detection was performed)

    # ========================================
    # Training Schemas
    # ========================================

    TrainingRunCreateRequest:
      type: object
      required:
        - training_method
        - base_model_path
        - dataset_ids
      properties:
        training_method:
          type: string
          enum: ["lora", "relora", "full_finetune", "controlnet"]
          description: Training method to use
          example: "lora"
        base_model_path:
          type: string
          description: Path to the base model file
          example: "M:/models/animagine-xl-3.1.safetensors"
        dataset_ids:
          type: array
          items:
            type: integer
          description: List of dataset IDs to use for training
          example: [1, 2]
        learning_rate:
          type: number
          format: float
          default: 0.0001
          description: Base learning rate
          example: 0.0001
        total_steps:
          type: integer
          default: 1000
          description: Total training steps (when use_epochs is false)
          example: 1000
        epochs:
          type: integer
          default: 10
          description: Number of epochs (when use_epochs is true)
          example: 10
        use_epochs:
          type: boolean
          default: false
          description: Whether to use epoch-based training
        batch_size:
          type: integer
          default: 1
          description: Training batch size
          example: 1
        optimizer:
          type: string
          default: "adamw"
          description: Optimizer type
          example: "adamw"
        lr_scheduler:
          type: string
          default: "constant"
          description: Learning rate scheduler type
          example: "cosine"
        lr_warmup_steps:
          type: integer
          default: 0
          description: Number of LR warmup steps
          example: 100
        # LoRA parameters (used by lora and relora methods)
        lora_rank:
          type: integer
          default: 16
          description: LoRA rank (used when training_method is lora or relora)
          example: 16
        lora_alpha:
          type: integer
          default: 16
          description: LoRA alpha (used when training_method is lora or relora)
          example: 16
        lora_dtype:
          type: string
          enum: ["fp32", "fp16", "bf16"]
          default: "fp32"
          description: LoRA weight dtype
          example: "fp32"
        # ReLoRA-specific parameters
        relora_merge_every:
          type: integer
          default: 500
          description: Interval between merge-reinit cycles (in steps or epochs)
          example: 500
        relora_merge_unit:
          type: string
          enum: ["steps", "epochs"]
          default: "steps"
          description: Unit for merge interval
          example: "steps"
        restart_warmup_steps:
          type: integer
          default: 100
          description: Number of LR warmup steps after each merge-reinit cycle
          example: 100
        optimizer_reset_strategy:
          type: string
          enum: ["full_reset", "magnitude_pruning", "random_pruning"]
          default: "full_reset"
          description: Strategy for resetting optimizer state after merge
          example: "full_reset"
        optimizer_pruning_ratio:
          type: number
          format: float
          default: 0.9
          minimum: 0.0
          maximum: 1.0
          description: Fraction of optimizer state to prune (for pruning strategies)
          example: 0.9
        # Reference image conditioning
        use_reference_images:
          type: boolean
          default: false
          description: Enable reference image latent conditioning during training (FLUX.2 only)
        # SigLIP2 Vision Encoder
        vision_encoder_path:
          type: string
          nullable: true
          description: "Path to SigLIP2 vision encoder safetensors file for SD/SDXL training"
          example: "models/siglip2_base_vision_encoder.safetensors"
        train_vision_encoder:
          type: boolean
          default: false
          description: Whether to train the vision encoder weights
        vision_encoder_lr:
          type: number
          format: float
          nullable: true
          description: Learning rate for vision encoder (defaults to text_encoder_lr if null)
          example: 0.0001
        # Per-bucket activation offload dispatcher (proactive VRAM management)
        activation_dispatch_enable:
          type: boolean
          default: false
          description: |
            Enable the per-bucket activation offload dispatcher. Predicts the
            training peak per bucket (static + coef * bs * latent_area) before the
            forward pass and offloads saved activations to CPU only on buckets that
            would otherwise exceed the VRAM budget. Proactive (no OOM detection),
            so it works on Windows WDDM which silently spills instead of raising.
          example: false
        activation_dispatch_margin_gb:
          type: number
          format: float
          default: 1.0
          description: Safety headroom (GB) kept free when deciding offload, to avoid driver spill
          example: 1.0
        activation_dispatch_seed_coef:
          type: number
          format: float
          default: 0.000024
          description: Initial GB per (batch_size * latent-pixel) used to predict unseen buckets, refined by online calibration
          example: 0.000024
        activation_dispatch_residual_frac:
          type: number
          format: float
          default: 0.85
          description: Fraction of activation that stays on GPU with offload under gradient checkpointing
          example: 0.85
        activation_dispatch_threshold_mb:
          type: integer
          default: 4
          description: Minimum saved-tensor size (MB) to offload to CPU
          example: 4
