      tags: [models]
      summary: List upscaler model files (.pth/.safetensors) for the spandrel backend
      description: Scans <models_dir>/upscalers/ (created if missing) and each additional model directory's upscalers/ subdirectory directly (no cache).
      operationId: listUpscalerModels
      responses:
        '200':
          description: Upscaler model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        path:
                          type: string
                        size_mb:
                          type: number
                        source_dir:
                          type: string

  /models/minit2i/create-scratch:
    post:
      tags: [models]
      summary: Create a random-initialized MiniT2I model for from-scratch Full-FT training
      description: Writes a diffusers directory (transformer + scheduler) that becomes selectable in the model list. Latent variants (vae_type sdxl/flux1) load their VAE by type at train/inference time; the VAE weights are not bundled.
      operationId: createScratchMiniT2I
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScratchMiniT2IRequest'
      responses:
        '200':
          description: Scratch model created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  path:
                    type: string
                  name:
                    type: string
                  variant:
                    type: string
                  vae_type:
                    type: string
        '400':
          description: Invalid name/variant/vae_type, target_dir not configured, or path already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create scratch model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /settings/generation:
    get:
      tags: [settings]
      summary: Get user-configured generation settings
      operationId: getGenerationSettings
      responses:
        '200':
          description: Generation settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  inpaint_use_dedicated_model:
                    type: boolean
    post:
      tags: [settings]
      summary: Save user-configured generation settings
      operationId: saveGenerationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inpaint_use_dedicated_model:
                  type: boolean
      responses:
        '200':
          description: Settings saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  settings:
                    type: object
                    properties:
                      inpaint_use_dedicated_model:
                        type: boolean
        '500':
          description: Failed to save settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /debug/vram:
    get:
      tags: [debug]
      summary: Inspect CUDA VRAM usage
      description: Developer-mode diagnostics endpoint. Lists all live CUDA tensors (grouped by shape/dtype) plus PyTorch memory stats and pipeline component device placement.
      operationId: debugVramInspect
      responses:
        '200':
          description: VRAM inspection report
          content:
            application/json:
              schema:
                type: object
                properties:
                  memory:
                    type: object
                    additionalProperties: true
                  tensor_count:
                    type: integer
                  unique_shapes:
                    type: integer
                  tensors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  components:
                    type: object
                    additionalProperties: true

  /debug/vram/release:
    post:
      tags: [debug]
      summary: Force release all cached CUDA memory back to the OS
      operationId: debugVramRelease
      responses:
        '200':
          description: Release result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /logs:
    get:
      tags: [logs]
      summary: Get captured backend console logs
      operationId: getLogs
      parameters:
        - name: last
          in: query
          required: false
          schema:
            type: integer
          description: Return only the last N log lines
      responses:
        '200':
          description: Log lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      type: string
                  total:
                    type: integer
    delete:
      tags: [logs]
      summary: Clear all captured backend console logs
      operationId: clearLogs
      responses:
        '200':
          description: Logs cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ResolveCategoriesRequest:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 1000
          description: |
            Tags to resolve. Any format is accepted (underscore or space separated,
            escaped or plain parentheses). Maximum 1000 tags per request.
          items:
            type: string
          example: ["1girl", "hatsune_miku_(vocaloid)", "masterpiece", "explicit"]
    ResolveCategoriesResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedTagCategory'
    ResolvedTagCategory:
      type: object
      required: [tag, category, normalized]
      properties:
        tag:
          type: string
          description: The original tag string as supplied in the request.
          example: "hatsune_miku"
        category:
          type: string
          description: Resolved category, or "Unknown" if the tag is not found.
          enum: [General, Character, Artist, Copyright, Meta, Model, Rating, Quality, Unknown]
          example: "Character"
        normalized:
          type: string
          description: The tag normalized for matching (escapes removed, underscores to spaces, lowercased).
          example: "hatsune miku"
    TimestepSamplingConfig:
      type: object
      description: |
        Training timestep sampling distribution. Drawn once per step by the shared
        TimestepSampler. The sampler emits t in [0,1]; each model interprets the
        convention (e.g. MiniT2I uses t=1=data, flow models use t=1=noise), so the
        sign/meaning of `mean` is architecture-dependent.
      properties:
        distribution:
          type: string
          enum: [uniform, normal, logit_normal, beta, custom]
          default: uniform
          description: 'Sampling distribution. "logit_normal" = sigmoid(N(mean,std)) (FLUX/SD3 style).'
          example: logit_normal
        min_timestep:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.0
          example: 0.0
        max_timestep:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 1.0
          example: 1.0
        mean:
          type: number
          description: Mean of the underlying normal (normal / logit_normal only).
          example: -0.8
        std:
          type: number
          description: Std of the underlying normal (normal / logit_normal only).
          example: 0.8
        alpha:
          type: number
          description: Beta distribution alpha (beta only).
          example: 2.0
        beta:
          type: number
          description: Beta distribution beta (beta only).
          example: 2.0
        custom_weights:
          type: array
          items:
            type: number
          description: Per-bin weights (custom distribution only).
      example:
        distribution: logit_normal
        mean: -0.8
        std: 0.8
        min_timestep: 0.0
        max_timestep: 1.0
    GenerationParams:
      type: object
      description: |
        Fields shared by all three generation endpoints (txt2img/img2img/inpaint), which
        are all sent as multipart/form-data. Only `prompt` is required by the backend;
        every other field has a Form() default and may be omitted.
      required:
        - prompt
      properties:
        prompt:
          type: string
        negative_prompt:
          type: string
          default: ""
        sampler:
          type: string
          default: euler
          example: "euler_a"
        schedule_type:
          type: string
          default: uniform
          example: "karras"
        developer_mode:
          type: boolean
          default: false
          description: "Enables developer-only fields/behaviors in the generation pipeline."
        steps:
          type: integer
          minimum: 1
          maximum: 150
          default: 20
        cfg_scale:
          type: number
          minimum: 0
          maximum: 30
          default: 7.0
        seed:
          type: integer
          default: -1
        ancestral_seed:
          type: integer
          default: -1
        width:
          type: integer
          multipleOf: 8
          default: 1024
        height:
          type: integer
          multipleOf: 8
          default: 1024
        loras:
          type: string
          default: "[]"
          description: "JSON-encoded string (sent via multipart Form) containing an array of LoRA config objects (e.g. name/weight)."
          example: '[{"name": "my_lora", "weight": 0.8}]'
        prompt_chunking_mode:
          type: string
          enum: [a1111, sd_scripts, nobos]
          default: a1111
        max_prompt_chunks:
          type: integer
          default: 0
        controlnets:
          type: string
          default: "[]"
          description: |
            JSON-encoded string (sent via multipart Form) containing an array of
            ControlNet config objects. Each object may include: model_path (string),
            image_base64 (string), strength (number, default 1.0), start_step
            (integer, default 0), end_step (integer, default 1000), is_lllite
            (boolean, default false), is_reference_guide (boolean, default false —
            blend latent toward the reference image instead of using a ControlNet
            model), preprocessor (string), enable_preprocessor (boolean, default false).
          example: '[{"model_path": "controlnet.safetensors", "strength": 1.0}]'
        cfg_schedule_type:
          type: string
          enum: [constant, linear, cosine, exponential]
          default: constant
        cfg_schedule_min:
          type: number
          default: 1.0
        cfg_schedule_max:
          type: number
        cfg_schedule_power:
          type: number
          default: 2.0
        cfg_rescale_snr_alpha:
          type: number
          default: 0.0
        dynamic_threshold_percentile:
          type: number
          default: 0.0
        dynamic_threshold_mimic_scale:
          type: number
          default: 7.0
        nag_enable:
          type: boolean
          default: false
        nag_scale:
          type: number
          default: 5.0
        nag_tau:
          type: number
          default: 3.5
        nag_alpha:
          type: number
          default: 0.25
        nag_sigma_end:
          type: number
          default: 3.0
        nag_negative_prompt:
          type: string
          default: ""
        unet_quantization:
          type: string
          nullable: true
          enum: [none, fp8_e4m3fn, fp8_e5m2, uint2, uint3, uint4, uint5, uint6, uint7, uint8]
        text_encoder_quantization:
          type: string
          nullable: true
          description: "Text encoder quantization mode. None = full precision."
        attention_type:
          type: string
          enum: [normal, sage, flash, tq]
          default: normal
          description: |
            Inference attention backend, applied to all model architectures via the
            unified dispatch (backend/core/attention/). normal=PyTorch SDPA (auto Flash
            Attention in PyTorch 2.0+), sage=SageAttention (INT8), flash=explicit Flash
            Attention 2, tq=Triton-Quantized attention (trainable, with a real backward).
            tq is effective only on conduit-routed architectures (Z-Image/Lens/MiniT2I/Anima
            and SDXL inference); it does NOT reach FLUX.2 (diffusers-native) and falls back
            to native there UNLESS attention_impl=conduit (FLUX.2 then routes through the
            conduit and tq engages at head_dim 128). tq supports head_dim of 64 or 128 only;
            other head dims (e.g. Ideogram4 head_dim=256) fall back to native. Unsupported
            combinations (e.g. head_dim outside the backend's supported set, mask present)
            fall back to native automatically.
          example: normal
        attention_impl:
          type: string
          enum: [conduit, diffusers]
          default: conduit
          description: |
            Which attention IMPLEMENTATION runs the kernel (orthogonal to attention_type,
            which selects the backend). conduit=route through SushiUI's unified dispatch
            (backend/core/attention/), enabling conduit-only backends such as tq on FLUX.2.
            diffusers=use diffusers' own attention registry (byte-identical legacy path,
            selectable for reversion). Currently consumed by the FLUX.2 inference path; other
            architectures are conduit-only or ignore it.
          example: conduit
        use_torch_compile:
          type: boolean
          default: false
        keep_models_hot:
          type: boolean
          default: false
          description: |
            Opt-in queue optimization (SD1.5/SDXL only in this phase). When generating
            several items back-to-back on the SAME loaded model (same checkpoint, LoRA
            set, and unet_quantization), keeps eligible components (text encoder, U-Net,
            VAE) resident on the GPU between consecutive generations instead of staging
            them to CPU and back. Bounded by a VRAM guard: falls back to normal
            staging/offload (with a warnings[] entry) when free VRAM is insufficient.
            Never keeps a component resident under block-swap streaming or CPU text
            encoding. Off by default (identical staging/offload behavior to previous
            releases).
          example: false
        vae_tiling:
          type: boolean
          default: false
          description: |
            Decode the latent through the VAE in overlapping tiles so the decode
            memory peak is bounded by the tile size, not the full image. Lets large
            images decode without OOM. Off by default (not bit-identical to a full
            decode; small images below the tile threshold are unaffected).
          example: false
        vae_tile_threshold:
          type: integer
          default: 0
          description: |
            Image size in pixels above which VAE tiling activates (also the tile
            size). 0 = auto, which uses each VAE's own default (sample_size * 1.5,
            ~1536px, for SDXL-family autoencoders; 256px for the Qwen-family ones
            used by Anima and Krea2). Below the threshold the decode runs whole;
            above it, split into threshold-sized tiles. Values are rounded down to
            a whole latent cell and floored at 2 cells. Raise it if mid-size
            images decode fine un-tiled.

            In `vae_tile_mode: context` this value is the decode-area budget —
            the size of the latent block actually pushed through the decoder —
            and the output tile is `threshold - 2 * margin`, so the decode
            memory peak matches `blend` mode at the same threshold.
          example: 0
        vae_tile_mode:
          type: string
          enum: [blend, context]
          default: blend
          description: |
            How a tiled VAE decode joins its tiles. Only has an effect when
            `vae_tiling` is true and the image exceeds `vae_tile_threshold`.

            - `blend` (default): tiles overlap by 25% of the tile size and the
              overlapping bands are cross-faded into each other.
            - `context`: each output tile is decoded together with a margin of
              real neighbouring latent cells (16 latent cells) around it, and
              that margin is cropped off after the decode. Tiles then join
              without a cross-fade. The margin is clamped at the latent edge,
              where a whole-image decode also has no neighbour.

            Measured differences at a 1536px image, one image per architecture:
            `context` has a lower decode memory peak at the same threshold
            (2.67 vs 3.35 GB on SDXL, 5.73 vs 7.28 GB on Qwen-family at
            threshold 1024), and issues more decoder calls at small thresholds
            (36 vs 16 at threshold 512). Pixel differences between the two modes
            were below 0.5/255 in mean on both families.
          example: blend
        vae_tile_global_norm:
          type: boolean
          default: false
          description: |
            Use whole-image GroupNorm statistics for a tiled VAE decode. Only has
            an effect when `vae_tiling` is true and the image exceeds
            `vae_tile_threshold`; applies to both `vae_tile_mode` values.

            A tiled decode normalises each tile with that tile's own per-group
            mean and variance, which offsets whole tiles against each other. With
            this enabled the decode runs twice: the first pass records every
            decoder GroupNorm's per-group statistics across all tiles, and the
            second pass re-decodes with the accumulated whole-image statistics.

            Measured cost and effect (SDXL autoencoder, `blend` join, 512px tile
            budget, one 1536px image): the per-tile offset falls from 1.32 to
            0.037 /255 peak-to-peak in fp32 and from 1.35 to 0.038 in fp16;
            decode wall time is 2.0x; peak decode memory is unchanged (measured
            +0.00003 GB — only per-group scalars are retained), so the tiling
            memory bound still holds.

            In bf16 the same measurement gives 1.36 to 0.18 /255 (and 2.6x-16x
            across tile sizes and join modes) rather than 35x: the statistics are
            accumulated in fp32/fp64, but the correction has to be applied
            through the normalization's own weight/bias, which the kernel
            requires in the activation dtype, and bf16 carries 8 mantissa bits.
            The result improves in every case measured; the size of the
            improvement depends on the dtype the autoencoder runs in.

            The doubling applies to EVERY VAE decode in the request, not only the
            final one. On SD1.5/SDXL that includes the in-loop decodes performed
            by `flatten_in_loop` (one per injected step, 3 by default) and by
            `vae_drift_correction`, so enabling those together with this flag
            doubles each of them as well.

            Has no effect on autoencoders whose decoder contains no GroupNorm —
            which includes the Qwen-family autoencoder used by Anima and Krea2.
            On those the second pass is skipped, so the flag costs nothing there.
          example: false
        color_flatten_strength:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: |
            Color Flatten (chroma smoothing): an RGB-guided guided filter applied
            to the decoded image's YCoCg chroma channels (luma left untouched) right
            after VAE decode. Removes low-frequency color mottling while preserving
            luminance detail. 0 = off (zero cost). All modes, all architectures.
          example: 0
        flatten_in_loop:
          type: boolean
          default: false
          description: |
            In-loop hard-flatten of the flat background (SD1.5/SDXL only). On the
            last N actual denoise steps the x0 prediction is decoded, the flat
            background region (largest connected low-gradient component touching the
            border) is detected and replaced with its dominant colour (feathered),
            re-encoded, and the correction injected back into the latents. Gated: if
            no confident flat region is found (area < flatten_in_loop_min_region) the
            step is a no-op, so textured backgrounds are protected. DiT architectures
            accept the flag and emit an unsupported_param warning. Default false =
            byte-identical loop behaviour.
          example: false
        flatten_in_loop_last_steps:
          type: integer
          minimum: 1
          maximum: 16
          default: 3
          description: |
            Number of trailing ACTUAL denoise steps to inject on (relative to the real
            step sequence the loop executes, not a fixed fraction, so it is stable
            across step counts and accelerators). Larger N = flatter background but
            more subject-detail cost (~6-7% wall-time per injection).
          example: 3
        flatten_in_loop_min_region:
          type: number
          format: float
          minimum: 0.005
          maximum: 0.5
          default: 0.02
          description: |
            Flat-region area gate as a fraction of the frame. The detected background
            region must cover at least this fraction, otherwise the injection step is
            a no-op (protects textured-background intents).
          example: 0.02
        spectrum_enable:
          type: boolean
          default: false
          description: |
            Spectrum (Adaptive Spectral Feature Forecasting, arXiv 2603.01623):
            training-free acceleration that skips U-Net forwards on selected steps by
            forecasting the output from a Chebyshev polynomial fit (ridge regression)
            over actual passes. Most effective at high step counts (>=30); little
            benefit on low-step/distilled models. Auto-disabled with prompt-editing,
            ControlNet, or DEUS (per-step conditioning changes).
          example: false
        spectrum_w:
          type: number
          default: 0.5
          description: "Mix between the spectral forecast and linear extrapolation (1.0 = spectral only; lower leans on the more stable linear extrapolation). Raise toward 1.0 for more aggressive forecasting if quality holds."
          example: 0.5
        spectrum_w_decay:
          type: number
          default: 0.0
          description: "OPT-IN (default 0 = off). Exponent of the per-step decay applied to spectrum_w: when > 0 the effective mix weight is spectrum_w * (1 - step/(steps-1))**spectrum_w_decay, so the spectral term contributes less at later (low-noise) steps. 0 disables the decay (constant spectrum_w) and reproduces the original forecaster behavior."
          example: 0.0
        spectrum_delta_cap:
          type: number
          default: 0.0
          description: "OPT-IN (default 0 = off). Multiplier K on the trajectory speed limiter: when > 0, a forecast may advance past the last real anchor by at most K times the distance implied by the recently-observed real per-step trajectory speed. Lower positive values keep forecasts closer to the observed trajectory; 0 disables the cap entirely and reproduces the original (uncapped) forecaster behavior."
          example: 0.0
        spectrum_m:
          type: integer
          default: 4
          description: "Number of Chebyshev basis functions. Larger = more detail but less stable."
          example: 4
        spectrum_lam:
          type: number
          default: 0.1
          description: "Ridge regularization strength for the coefficient fit."
          example: 0.1
        spectrum_warmup_steps:
          type: integer
          default: 3
          description: "Leading steps that always run a full forward (build the cache before forecasting)."
          example: 3
        spectrum_window_size:
          type: integer
          default: 4
          description: "Initial skip interval; subsequent intervals grow (sparser late)."
          example: 4
        spectrum_flex_window:
          type: number
          default: 0.75
          description: "Damps the actual number of skipped steps. 0 = skip the full window (most aggressive); higher = more conservative/higher quality."
          example: 0.75
        spectrum_tail:
          type: number
          default: 0.12
          description: "Fraction of the final sampling steps forced to run an actual forward (minimum 2). The low-noise tail carries fine detail, so forecasting it degrades sharpness; raise this for more detail/quality, lower it (toward 0) for more speed."
          example: 0.12
        spectrum_feature_mode:
          type: string
          enum: [output, block]
          default: output
          description: |
            Which quantity Spectrum forecasts. "output" (black-box) forecasts the final
            U-Net epsilon and skips the whole forward on skip steps -- max speedup but
            the rough output extrapolates noisily. "block" (paper-faithful, SDXL/SD
            U-Net only) forecasts the SMOOTH deep features (down_blocks[cache_branch:] +
            mid) and recomputes the shallow/up path every step -- higher quality, lower
            speedup (only the deep blocks are skipped).
          example: output
        spectrum_cache_branch:
          type: integer
          default: 1
          description: "Block mode only: down_blocks[cache_branch:] and the mid block are forecast; the shallow blocks below it stay exact. Lower = skip more (faster, less safe), higher = skip fewer deep blocks."
          example: 1
        spectrum_max_cache:
          type: integer
          default: 0
          description: "Sliding-window size for the coefficient fit (0 = unlimited; block mode defaults to 6). A finite window caps memory for the large block features and makes the fit local, stabilizing extrapolation."
          example: 0
        fbcache_enable:
          type: boolean
          default: false
          description: "First Block Cache (FBCache): dynamic per-step output caching. Mutually exclusive with Spectrum."
          example: false
        fbcache_threshold:
          type: number
          default: 0.12
          description: "Relative-L1 first-block residual threshold; higher allows more step skips (faster, more quality risk)."
          example: 0.12
        fbcache_warmup_steps:
          type: integer
          default: 1
          description: "Leading steps that always compute a full forward before caching starts."
          example: 1
        fbcache_cache_branch:
          type: integer
          default: 1
          description: "U-Net block mode indicator/reuse boundary: indicator = down[branch], reused region = down[branch+1:] + mid."
          example: 1
        use_tipo:
          type: boolean
          default: false
          description: "Enable TIPO prompt upsampling before generation."
        tipo_config:
          type: string
          default: "{}"
          description: "JSON-encoded string (sent via multipart Form) with TIPO configuration (model_name, lengths, etc.)."
          example: '{"model_name": "KBlueLeaf/TIPO-500M"}'
        preview_predicted_x0:
          type: boolean
          default: false
          description: "Show the predicted x0 (denoised estimate) instead of the current noisy latent in the live preview."
        preview_decoder:
          type: string
          enum: [matrix, taef2]
          default: matrix
          description: "Live-preview decoder used for FLUX.2-VAE models."
          example: matrix
        enable_block_swap:
          type: boolean
          default: false
          description: "Enable CPU/GPU block swap offloading for the diffusion backbone."
        blocks_to_swap:
          type: integer
          default: 20
          description: "Number of transformer/U-Net blocks to offload to CPU when block swap is enabled."
          example: 20
        use_pinned_memory:
          type: boolean
          default: false
          description: "Use pinned (page-locked) host memory for block swap transfers."
        block_swap_h2d_only:
          type: boolean
          default: false
          description: "H2D-only swap mode: weights are copied host-to-device but not evicted device-to-host again."
        block_swap_ring_size:
          type: integer
          default: 2
          description: "Number of GPU weight-buffer ring slots for block swap (>=1; 2 double-buffers)."
          example: 2
        original_size_w:
          type: integer
          default: 0
          description: "SDXL micro-conditioning override: explicit original width for time_ids. 0 = auto."
        original_size_h:
          type: integer
          default: 0
          description: "SDXL micro-conditioning override: explicit original height for time_ids. 0 = auto."
        original_size_scale:
          type: number
          default: 1.0
          description: "SDXL micro-conditioning: when original_size_w/h are 0, original_size = output size * this scale."
        vision_encoder_path:
          type: string
          nullable: true
          description: "Path to SigLIP2 vision encoder safetensors file. When set, reference images are encoded via SigLIP2 and concatenated to text embeddings."
          example: "models/siglip2_base_vision_encoder.safetensors"
        vae_path:
          type: string
          nullable: true
          description: |
            Per-generation VAE override. Path to a standalone VAE (diffusers vae/
            dir or a model dir) whose VAE replaces the loaded model's VAE for this
            generation. Validated for compatibility (latent_channels, latent_ndim,
            VAE class family, scale factor) against the loaded model; a HARD
            mismatch returns 400. Supported on every image architecture except
            ltx2 and minit2i (accepted-but-ignored with a warning there). None uses
            the loaded model's own VAE.
          example: "models/vae/sdxl"
        text_encoder_path:
          type: string
          nullable: true
          description: |
            Per-generation text-encoder override (SD1.5/SDXL only). Path to a
            standalone text encoder. On other architectures it is
            accepted-but-ignored with a warning. None uses the loaded model's own
            text encoder.
          example: "models/text_encoders/clip-vit-large"
        pid_sr_output:
          type: string
          enum: ["4x", "original"]
          default: "4x"
          description: |
            Only consulted when vae_path points at a PiD (Pixel Diffusion
            Decoder) checkpoint (SDXL only); ignored otherwise. "4x" returns
            PiD's native super-resolution output (latent_h/w * 8 * 4). PiD's
            4x super-resolution factor is fixed by the checkpoint, so
            "original" still runs the full 4x decode and downscales the result
            back to the model's native resolution (latent_h/w * 8) afterward —
            NOT a cheaper decode path.
          example: "4x"
        pid_use_gemma:
          type: boolean
          default: false
          description: |
            Only consulted when vae_path points at a PiD decoder checkpoint;
            ignored otherwise. False (default) uses a precomputed null-caption
            embedding (no runtime text encoder needed). True loads
            Efficient-Large-Model/gemma-2-2b-it (the ungated mirror PiD was
            trained against) once for this generation and encodes the actual
            prompt for sharper output; on any resolution/load/encode failure
            it falls back to the null-caption embedding with a warning.
          example: false
        pid_low_vram:
          type: boolean
          default: false
          description: |
            Only consulted when vae_path points at a PiD decoder checkpoint;
            ignored otherwise. False (default) runs the decoder's PiTBlock
            and FinalLayer forward passes exactly as originally implemented
            (bit-identical output). True opts into a row-chunked activation
            path that reduces the decoder's per-block VRAM peak at large
            output resolutions (e.g. 4096px) at the cost of small bf16
            floating-point rounding differences from the default path (the
            underlying computation is mathematically row-independent and
            bit-identical in fp32; bf16's lower precision amplifies ordinary
            GEMM-tiling rounding noise through the decoder's iterative
            sampler).
          example: false
        pid_tile_native:
          type: integer
          default: 512
          description: |
            Only consulted when vae_path points at a PiD decoder checkpoint
            and the requested output's native resolution (latent_h/w * 8)
            exceeds the checkpoint's in-distribution ceiling; ignored
            otherwise. Every tile's OWN native resolution (tile_lat * 8) is
            capped at this value so each tile individually stays
            in-distribution for PiD (clamped down with a warning if set above
            the checkpoint's native ceiling). Used only by the default tiled
            large-output decode; has no effect when pid_fast_large_decode is
            true.
          example: 512
        pid_tile_overlap_ratio:
          type: number
          default: 0.25
          description: |
            Only consulted together with pid_tile_native (same gating).
            Feather-blend overlap between adjacent tiles, as a fraction of
            the tile size (in latent space, before scaling to pixel space
            for the blend). 0.25 was confirmed seam-free on both busy and
            smooth backgrounds.
          example: 0.25
        pid_fast_large_decode:
          type: boolean
          default: false
          description: |
            Only consulted when vae_path points at a PiD decoder checkpoint
            and the requested output's native resolution exceeds the
            checkpoint's in-distribution ceiling; ignored otherwise. False
            (default) decodes the large output in overlapping in-distribution
            tiles and feather-blends them back into the full requested output
            size (true super-resolution detail, ~6x more decode passes). True
            opts out to the original single-pass whole-latent downscale
            -then-decode-then-upscale path (fewer decode passes, less detail
            at large output sizes).
          example: false
        ref_images:
          type: array
          items:
            type: string
            format: binary
          description: "Reference images for FLUX.2 Image Edit or SigLIP2 vision encoder conditioning (multipart upload)"
        loop_decode:
          type: string
          enum: [full, cheap, none]
          default: full
          description: |
            Loop-generation decode mode (SD1.5/SDXL only in this phase; other
            architectures accept the field but always behave as "full").
            `full` decodes with the active VAE (the PiD decoder if a PiD VAE
            override is applied) and saves + galleries as usual. `cheap`
            decodes with the real SDXL VAE embedded in a PiD override instead
            of running the PiD student net (identical to `full` when no PiD
            override is active); still saves + galleries. `none` skips
            decode/save/gallery entirely -- the final latent is cached
            server-side and a `latent_id` is returned instead of an `image`,
            for the next loop step's `input_latent_id` (no VAE round-trip).
          example: "full"
        skip_gallery:
          type: boolean
          default: false
          description: |
            Orthogonal to loop_decode. When true, the generated image is still
            saved to disk (so a client-driven generation loop can chain to the
            next step via the file path) but the gallery database record
            (thumbnail + DB row) is skipped. Meaningless combined with
            loop_decode="none" (nothing is decoded/saved there either way).

    Txt2ImgRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          properties:
            batch_size:
              type: integer
              default: 1
              description: "Number of images to generate in this request."
            controlnet_images:
              type: array
              items:
                type: string
                format: binary
              description: "Optional ControlNet images for direct upload (alternative to base64)"

    Txt2VidRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: "Text prompt describing the video."
          example: "A cat playing a piano on a stage, warm stage lighting"
        negative_prompt:
          type: string
          default: ""
          description: "Content to steer away from. Applied only when guidance_scale > 1."
          example: "worst quality, inconsistent motion, blurry, jittery, distorted"
        width:
          type: integer
          default: 768
          description: "Video width in pixels. Must be divisible by 32."
          example: 768
        height:
          type: integer
          default: 512
          description: "Video height in pixels. Must be divisible by 32."
          example: 512
        num_frames:
          type: integer
          default: 121
          description: "Number of frames. Must satisfy (num_frames - 1) % 8 == 0."
          example: 121
        frame_rate:
          type: number
          default: 24.0
          description: "Output frames per second."
          example: 24.0
        num_inference_steps:
          type: integer
          default: 8
          description: "Number of denoising steps (distilled default: 8)."
          example: 8
        guidance_scale:
          type: number
          default: 1.0
          description: "Classifier-free guidance scale. 1.0 disables CFG (distilled default)."
          example: 1.0
        seed:
          type: integer
          default: -1
          description: "Random seed. -1 draws a random seed (returned in actual_seed)."
          example: -1
        num_videos_per_prompt:
          type: integer
          default: 1
          description: "Number of videos generated per prompt."
          example: 1
        max_sequence_length:
          type: integer
          default: 1024
          description: "Maximum prompt token length for the Gemma-3 text encoder."
          example: 1024
        audio_enable:
          type: boolean
          default: true
          description: "When true, mux the generated audio track into the mp4."
          example: true
        controlnets:
          type: array
          nullable: true
          description: |
            Optional array of ControlNet / reference-guide / style-transfer config
            objects (same shape as the image endpoints' controlnets). Training-free
            STYLE TRANSFER rides here as an entry with is_style_transfer: true carrying
            the style reference image (image_base64) plus Style Strength (strength),
            style_adain_strength and style_blocks; LTX-2.3 extracts it and injects the
            reference's video-token self-attention K/V so every frame attends the same
            still reference (temporally consistent). Mutually exclusive with FBCache /
            Spectrum / Block Swap (style takes precedence, those are disabled with a
            logged reason). Other entry types are accepted for shape parity.
          items:
            type: object
          example: []
        blocks_to_swap:
          type: integer
          default: 0
          description: "Number of LTX-2.3 transformer blocks kept CPU-resident and streamed to GPU during the denoise loop. 0 disables block swap (transformer stays fully GPU-resident via the stock model-offload path)."
          example: 0
        fbcache_enable:
          type: boolean
          default: false
          description: "First-Block-Cache: per-step reuse of the previous transformer output when the first-block residual changes little between steps. Mutually exclusive with Block Swap (blocks_to_swap > 0 disables it, with a logged reason)."
          example: false
        fbcache_threshold:
          type: number
          default: 0.12
          description: "Relative-L1 change threshold on the first-block residual used to decide cache reuse. Higher values reuse more often; lower values reuse less often."
          example: 0.12
        fbcache_warmup_steps:
          type: integer
          default: 1
          description: "Number of initial denoising steps that always run the full transformer (no cache reuse), before fbcache_enable takes effect."
          example: 1
        spectrum_enable:
          type: boolean
          default: false
          description: |
            Spectrum (Adaptive Spectral Feature Forecasting): skips the joint
            (video, audio) transformer forward on selected denoising steps by
            forecasting the output from a Chebyshev polynomial fit (ridge
            regression) over actual passes. Hosted in the LTX-2.3 block-loop
            wrapper (forecast at the pre-CFG batched-input stage). Mutually
            exclusive with fbcache_enable (Spectrum takes precedence, disabling
            FBCache with a logged reason) and with Block Swap (blocks_to_swap > 0
            disables Spectrum, with a logged reason).
          example: false
        spectrum_w:
          type: number
          default: 0.5
          description: "Mix between the spectral forecast and linear extrapolation (1.0 = spectral only; lower leans on the more stable linear extrapolation)."
          example: 0.5
        spectrum_w_decay:
          type: number
          default: 0.0
          description: "OPT-IN (default 0 = off). Exponent of the per-step decay applied to spectrum_w; 0 disables the decay (constant spectrum_w)."
          example: 0.0
        spectrum_delta_cap:
          type: number
          default: 0.0
          description: "OPT-IN (default 0 = off). Multiplier K on the trajectory speed limiter bounding how far a forecast may advance past the last real anchor; 0 disables the cap."
          example: 0.0
        spectrum_m:
          type: integer
          default: 4
          description: "Number of Chebyshev basis functions. Larger = more detail but less stable."
          example: 4
        spectrum_lam:
          type: number
          default: 0.1
          description: "Ridge regularization strength for the coefficient fit."
          example: 0.1
        spectrum_warmup_steps:
          type: integer
          default: 3
          description: "Leading steps that always run a full forward (build the cache before forecasting)."
          example: 3
        spectrum_window_size:
          type: integer
          default: 4
          description: "Initial skip interval; subsequent intervals grow (sparser late)."
          example: 4
        spectrum_flex_window:
          type: number
          default: 0.75
          description: "Damps the actual number of skipped steps. 0 = skip the full window (most aggressive); higher = more conservative."
          example: 0.75
        spectrum_tail:
          type: number
          default: 0.12
          description: "Fraction of the final sampling steps forced to run an actual forward (minimum 2)."
          example: 0.12
        spectrum_max_cache:
          type: integer
          default: 0
          description: "Sliding-window size for the coefficient fit (0 = unlimited). Each of the two forecasters (video, audio) caches up to this many anchor tensors."
          example: 0
        vae_path:
          type: string
          nullable: true
          description: "Per-generation VAE override. Unsupported on the LTX-2.3 video model: accepted-but-ignored with a warning."
        text_encoder_path:
          type: string
          nullable: true
          description: "Per-generation text-encoder override. Unsupported on the LTX-2.3 video model: accepted-but-ignored with a warning."

    Img2VidRequest:
      allOf:
        - $ref: '#/components/schemas/Txt2VidRequest'
        - type: object
          required:
            - image
          properties:
            image:
              type: string
              format: binary
              description: "First-frame keyframe image (multipart file upload). Resized to (width, height) before conditioning."

    OutpaintVideoRequest:
      type: object
      required:
        - prompt
        - video
      description: |
        Distinct from `Txt2VidRequest`/`Img2VidRequest`: uses `total_frames`
        (not `num_frames`) for the output timeline length, and does not
        accept `controlnets` (no style-transfer wiring for video outpaint in
        this phase). All other video-generation knobs (block swap /
        FBCache / Spectrum / per-generation component overrides) are the
        same as `Txt2VidRequest`.
      properties:
        prompt:
          type: string
          description: "Text prompt describing the generated (non-preserved) portion of the video."
          example: "A cat playing a piano on a stage, warm stage lighting"
        negative_prompt:
          type: string
          default: ""
          description: "Content to steer away from. Applied only when guidance_scale > 1."
        video:
          type: string
          format: binary
          description: "Input video clip to place inside the output timeline (any ffmpeg-demuxable container)."
        width:
          type: integer
          multipleOf: 32
          default: 768
          description: "Output video width in pixels. Must be divisible by 32. The uploaded clip is center-cropped + resized to this resolution (see the endpoint's ÷32 preprocessing note)."
          example: 768
        height:
          type: integer
          multipleOf: 32
          default: 512
          description: "Output video height in pixels. Must be divisible by 32."
          example: 512
        total_frames:
          type: integer
          default: 121
          description: "Total number of frames in the OUTPUT timeline. Must satisfy (total_frames - 1) % 8 == 0."
          example: 121
        frame_rate:
          type: number
          default: 24.0
          description: "Output frames per second."
          example: 24.0
        num_inference_steps:
          type: integer
          default: 8
          description: "Number of denoising steps (distilled default: 8)."
          example: 8
        guidance_scale:
          type: number
          default: 1.0
          description: "Classifier-free guidance scale. 1.0 disables CFG (distilled default)."
          example: 1.0
        seed:
          type: integer
          default: -1
          description: "Random seed. -1 draws a random seed (returned in actual_seed)."
          example: -1
        num_videos_per_prompt:
          type: integer
          default: 1
          example: 1
        max_sequence_length:
          type: integer
          default: 1024
          description: "Maximum prompt token length for the Gemma-3 text encoder."
          example: 1024
        audio_enable:
          type: boolean
          default: true
          description: "When true, mux an audio track into the mp4 (see outpaint_video_audio_mode for its source)."
          example: true
        input_offset_frames:
          type: integer
          default: 0
          description: |
            Desired PIXEL frame offset (in the OUTPUT timeline) at which the
            (trimmed) input clip is placed. Snapped server-side to the
            nearest valid latent frame index's pixel start
            ({0, 1, 9, 17, ..., 8m+1}) -- a warning is added to the response
            when the requested value is not already a valid pixel start.
          example: 0
        input_trim_start_frames:
          type: integer
          default: 0
          description: "Trim this many PIXEL frames off the START of the uploaded clip (in the clip's own frames) before placement."
          example: 0
        input_trim_end_frames:
          type: integer
          default: 0
          description: "Trim this many PIXEL frames off the END of the uploaded clip before placement."
          example: 0
        outpaint_video_audio_mode:
          type: string
          enum: [regenerate, preserve_input]
          default: regenerate
          description: |
            "regenerate": use LTX-2.3's own whole-timeline generated audio
            as-is (the input clip's own audio is NOT preserved).
            "preserve_input": mux the input clip's ORIGINAL audio over its
            placed span after generation, keeping LTX-generated audio
            outside that span, with a ~50ms crossfade confined to the
            GENERATED side of each boundary. Falls back to "regenerate"
            (with a warning) if the uploaded clip has no audio stream. Only
            relevant when audio_enable is true.
          example: regenerate
        blocks_to_swap:
          type: integer
          default: 0
          description: "Number of LTX-2.3 transformer blocks kept CPU-resident and streamed to GPU during the denoise loop. 0 disables block swap."
          example: 0
        fbcache_enable:
          type: boolean
          default: false
          example: false
        fbcache_threshold:
          type: number
          default: 0.12
          example: 0.12
        fbcache_warmup_steps:
          type: integer
          default: 1
          example: 1
        spectrum_enable:
          type: boolean
          default: false
          example: false
        spectrum_w:
          type: number
          default: 0.5
          example: 0.5
        spectrum_w_decay:
          type: number
          default: 0.0
          example: 0.0
        spectrum_delta_cap:
          type: number
          default: 0.0
          example: 0.0
        spectrum_m:
          type: integer
          default: 4
          example: 4
        spectrum_lam:
          type: number
          default: 0.1
          example: 0.1
        spectrum_warmup_steps:
          type: integer
          default: 3
          example: 3
        spectrum_window_size:
          type: integer
          default: 4
          example: 4
        spectrum_flex_window:
          type: number
          default: 0.75
          example: 0.75
        spectrum_tail:
          type: number
          default: 0.12
          example: 0.12
        spectrum_max_cache:
          type: integer
          default: 0
          example: 0
        vae_path:
          type: string
          nullable: true
          description: "Per-generation VAE override. Unsupported on the LTX-2.3 video model: accepted-but-ignored with a warning."
        text_encoder_path:
          type: string
          nullable: true
          description: "Per-generation text-encoder override. Unsupported on the LTX-2.3 video model: accepted-but-ignored with a warning."
        video_lossless:
          type: boolean
          default: false
          description: |
            When true, encodes the output with FFV1 (`-pix_fmt rgb24`)
            instead of H.264, so the pasted (preserved) input frames are
            BIT-EXACT after decode -- empirically verified: plain
            "libx264 -qp 0" is NOT actually bit-exact (observed up to 2/255
            per-channel drift from RGB<->YUV/GBR colorspace rounding even at
            "lossless" x264 settings), while FFV1 with no forced colorspace
            conversion gives an exact roundtrip. Audio (when present) uses
            FLAC instead of AAC in this mode -- FLAC adds no further lossy
            compression beyond the existing 16-bit PCM quantization this
            pipeline always applies, it does not exceed 16-bit precision.
            Trade-offs: much larger file size, and the resulting mp4 will
            generally NOT play back in a browser's native <video> element
            (FFV1 has no mainstream browser decoder) -- intended for
            archival/verification of the exact preserved frames, not casual
            playback.
          example: false

    Txt2AudRequest:
      type: object
      properties:
        prompt:
          type: string
          default: ""
          description: "Caption text describing the desired music (also accepted server-side as `caption`)."
          example: "upbeat synthpop, driving bassline, female vocals"
        lyrics:
          type: string
          default: ""
          description: "Lyrics text. Empty for instrumental generation."
          example: ""
        audio_duration:
          type: number
          default: 30.0
          description: "Target audio length in seconds."
          example: 30.0
        seed:
          type: integer
          default: -1
          description: "Random seed. -1 draws a random seed (returned in actual_seed)."
          example: -1
        inference_steps:
          type: integer
          default: 8
          description: "Number of denoising steps (turbo distilled default: 8)."
          example: 8
        guidance_scale:
          type: number
          default: 1.0
          description: "Classifier-free guidance scale. Turbo is CFG-distilled (no twin forward pass); a non-1.0 value is overridden back to 1.0."
          example: 1.0
        shift:
          type: number
          default: 3.0
          description: "Flow-matching timestep shift used to select the distilled step schedule."
          example: 3.0
        sampler_mode:
          type: string
          default: "euler"
          description: "Accepted for forward-compatibility. The vendored generate_audio has no sampler_mode knob (Euler-only ODE/SDE integration); a non-default value is logged and ignored."
          example: "euler"
        vocal_language:
          type: string
          default: "en"
          description: "Language folded into the lyrics/metas conditioning text."
          example: "en"
        loras:
          type: array
          default: []
          description: |
            Optional LoRA(s) to apply to the ACE-Step DiT for this generation.
            Wrapped as forward-time addition layers (not merged into weights)
            and restored after generation unless the next request reuses them.
            Matches the ACE-Step LoRA training scope: decoder attention
            Linears only (`decoder.layers.{i}.{self_attn,cross_attn}.{q,k,v,o}_proj}`).
            A LoRA trained for a different architecture (mismatched keys) is
            skipped with a server-side warning, not an error.
          items:
            type: object
            properties:
              path:
                type: string
                description: "LoRA .safetensors filename (relative to the LoRA directory or an additional configured directory)."
              strength:
                type: number
                default: 1.0
                description: "LoRA strength multiplier."
          example: []

    Aud2AudRequest:
      type: object
      required:
        - reference_audio
      properties:
        prompt:
          type: string
          default: ""
          description: "Caption text describing the desired re-render (also accepted server-side as `caption`). The reference audio is re-rendered under this new caption/lyrics."
          example: "lo-fi hip hop, chill, jazzy piano"
        lyrics:
          type: string
          default: ""
          description: "Lyrics text. Empty for instrumental generation."
          example: ""
        seed:
          type: integer
          default: -1
          description: "Random seed. -1 draws a random seed (returned in actual_seed)."
          example: -1
        inference_steps:
          type: integer
          default: 8
          description: "Number of denoising steps (turbo distilled default: 8)."
          example: 8
        guidance_scale:
          type: number
          default: 1.0
          description: "Classifier-free guidance scale. Turbo is CFG-distilled (no twin forward pass); a non-1.0 value is overridden back to 1.0."
          example: 1.0
        shift:
          type: number
          default: 3.0
          description: "Flow-matching timestep shift used to select the distilled step schedule."
          example: 3.0
        cover_strength:
          type: number
          default: 1.0
          minimum: 0.0
          maximum: 1.0
          description: "Cover mode only. Fraction of denoising steps that keep the reference audio's semantic context before switching to a text2music-style (silence) context built from the same caption/lyrics. This is a step-count blend, NOT an img2img start-timestep/partial-denoise knob; xt always starts from full noise and runs every step. Higher = closer to the reference."
          example: 1.0
        mode:
          type: string
          enum: [cover, repaint]
          default: cover
          description: "Sub-mode. `cover` (img2img analog) re-renders the whole reference under the new caption/lyrics. `repaint` (inpaint analog) regenerates only [repaint_start, repaint_end) seconds of the reference, keeping the rest (approximately) unchanged."
          example: cover
        repaint_start:
          type: number
          default: 0.0
          minimum: 0.0
          description: "Repaint mode only. Start of the region to regenerate, in seconds. Required (with repaint_end) when mode=repaint."
          example: 4.0
        repaint_end:
          type: number
          default: 0.0
          minimum: 0.0
          description: "Repaint mode only. End of the region to regenerate, in seconds. Must be greater than repaint_start (otherwise 400)."
          example: 7.0
        vocal_language:
          type: string
          default: "en"
          description: "Language folded into the lyrics/metas conditioning text."
          example: "en"
        loras:
          type: string
          default: "[]"
          description: |
            JSON-encoded string (sent via multipart Form) containing an array
            of LoRA config objects (e.g. path/strength). Same apply/restore
            contract as `Txt2AudRequest.loras` -- see there for details.
          example: '[{"path": "acestep_lora.safetensors", "strength": 1.0}]'
        reference_audio:
          type: string
          format: binary
          description: "Reference audio clip (multipart file upload) used as the cover/repaint source. VAE-encoded and fed back to the model as conditioning (is_covers=true for cover mode, false for repaint mode). Output duration is derived from this clip's length, not user-supplied."

    OutpaintAudioRequest:
      type: object
      required:
        - reference_audio
      description: |
        Audio temporal outpaint (extend). Structurally the INVERSE of
        `Aud2AudRequest`'s `mode=repaint`: repaint holds everything OUTSIDE
        a window and generates INSIDE it; outpaint holds the placed input
        window itself and generates OUTSIDE it (before and/or after).
        Shares prompt/lyrics/seed/inference_steps/guidance_scale/shift/
        vocal_language/loras with `Aud2AudRequest` -- see there for details
        on each.
      properties:
        prompt:
          type: string
          default: ""
          description: "Caption text describing the generated (non-preserved) portion of the timeline (also accepted server-side as `caption`)."
          example: "lo-fi hip hop, chill, jazzy piano"
        lyrics:
          type: string
          default: ""
          description: "Lyrics text. Empty for instrumental generation."
          example: ""
        seed:
          type: integer
          default: -1
          description: "Random seed. -1 draws a random seed (returned in actual_seed)."
          example: -1
        inference_steps:
          type: integer
          default: 8
          description: "Number of denoising steps (turbo distilled default: 8)."
          example: 8
        guidance_scale:
          type: number
          default: 1.0
          description: "Classifier-free guidance scale. Turbo is CFG-distilled (no twin forward pass); a non-1.0 value is overridden back to 1.0."
          example: 1.0
        shift:
          type: number
          default: 3.0
          description: "Flow-matching timestep shift used to select the distilled step schedule."
          example: 3.0
        vocal_language:
          type: string
          default: "en"
          description: "Language folded into the lyrics/metas conditioning text."
          example: "en"
        total_duration:
          type: number
          default: 60.0
          minimum: 0.0
          maximum: 240.0
          description: "Length of the OUTPUT timeline, in seconds. Must be in (0, 240]."
          example: 60.0
        input_offset_sec:
          type: number
          default: 0.0
          minimum: 0.0
          description: |
            Where the (trimmed) input clip is placed within the output
            timeline, in seconds. Snapped server-side to the nearest 1/25s
            (the ACE-Step VAE's latent frame rate) and CLAMPED so the placed
            input fits inside total_duration (a warning is added to the
            response if clamped). A trimmed input longer than
            total_duration itself is rejected (400), not clamped.
          example: 15.0
        input_trim_start_sec:
          type: number
          default: 0.0
          minimum: 0.0
          description: "Trim this many seconds off the START of the uploaded clip before placement."
          example: 0.0
        input_trim_end_sec:
          type: number
          default: 0.0
          minimum: 0.0
          description: "Trim this many seconds off the END of the uploaded clip before placement."
          example: 0.0
        loras:
          type: string
          default: "[]"
          description: |
            JSON-encoded string (sent via multipart Form) containing an array
            of LoRA config objects (e.g. path/strength). Same apply/restore
            contract as `Txt2AudRequest.loras` -- see there for details.
          example: '[{"path": "acestep_lora.safetensors", "strength": 1.0}]'
        reference_audio:
          type: string
          format: binary
          description: "The input audio clip to place inside the longer output timeline (multipart file upload). Its (trimmed) waveform samples, normalized to stereo/48kHz, are re-spliced verbatim into the output over its placed span -- sample-exact preservation to that decoded 48kHz/16-bit representation, independent of the surrounding generated audio."

    Img2ImgRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          description: |
            Exactly one of `image` or `input_latent_id` must be supplied:
            `image` for a normal img2img request, `input_latent_id` for a
            loop-generation step chaining from a prior loop_decode="none" step
            (no VAE round-trip). Omitting both, or supplying neither, is a 400.
          properties:
            image:
              type: string
              format: binary
              description: "Input image. Required unless input_latent_id is supplied."
            input_latent_id:
              type: string
              nullable: true
              description: |
                Loop-generation latent passthrough (SD1.5/SDXL only). Opaque id
                returned by a prior request's loop_decode="none" response.
                When set, `image` is not read (may be omitted) -- denoising
                starts directly from the cached latent instead of an
                encode(image) round-trip. If the cached latent's spatial size
                doesn't match this request's width/height, it is resized
                in latent space (using resampling_method) before denoising.
                A missing/expired id (LRU-evicted or server restarted) returns
                400 with a message asking the client to restart the loop.
              example: "3f9a7c2e1b4d4a2c8e6f0a1b2c3d4e5f"
            denoising_strength:
              type: number
              minimum: 0
              maximum: 1
              default: 0.75
            img2img_fix_steps:
              type: boolean
              default: true
              description: "When true, run the full step count scaled by denoising_strength (fixed number of steps) rather than skipping initial steps."
            resize_mode:
              type: string
              default: image
              description: "How the input image is resized/cropped to the target width/height."
            resampling_method:
              type: string
              default: lanczos
              description: "Resampling filter used when resizing the input image."
            cpu_text_encoding:
              type: boolean
              default: false
              description: "Run text encoding on CPU instead of GPU."
            vae_drift_correction:
              type: boolean
              default: false
              description: |
                VAE DC-drift correction (img2img/inpaint only). Subtracts the
                per-channel DC bias the VAE round-trip introduces
                (mean(decode(encode(input))) - mean(input)) from the final decode,
                then clips to valid range. Adds ONE reference decode when enabled.
                Strength-independent (corrects a VAE property, not a denoise
                property). Implemented for SD1.5/SDXL; accepted-but-ignored (with a
                warning) on the DiT architectures.

    InpaintRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          required:
            - image
            - mask
          properties:
            image:
              type: string
              format: binary
            mask:
              type: string
              format: binary
            input_latent_id:
              type: string
              nullable: true
              description: |
                Reserved for schema parity with Img2ImgRequest -- NOT currently
                supported for inpaint. Inpaint's pixel-space mask compositing
                needs the real source image, so a non-null value here returns
                400. `image`/`mask` are always required for inpaint; use
                loop_decode ("full"/"cheap") for loop-generation cost control
                instead.
            denoising_strength:
              type: number
              minimum: 0
              maximum: 1
              default: 0.75
            img2img_fix_steps:
              type: boolean
              default: true
              description: "When true, run the full step count scaled by denoising_strength (fixed number of steps) rather than skipping initial steps."
            cpu_text_encoding:
              type: boolean
              default: false
              description: "Run text encoding on CPU instead of GPU."
            vae_drift_correction:
              type: boolean
              default: false
              description: |
                VAE DC-drift correction (img2img/inpaint only). Subtracts the
                per-channel DC bias the VAE round-trip introduces
                (mean(decode(encode(input))) - mean(input)) from the final decode,
                then clips to valid range. Adds ONE reference decode when enabled.
                Strength-independent. Implemented for SD1.5/SDXL; accepted-but-
                ignored (with a warning) on the DiT architectures.
            mask_blur:
              type: integer
              default: 4
              description: "Gaussian blur radius applied to the mask edges before compositing."
            inpaint_full_res:
              type: boolean
              default: false
              description: "Process only the masked region at full resolution instead of the whole image."
            inpaint_full_res_padding:
              type: integer
              default: 32
              description: "Padding (px) added around the masked region when inpaint_full_res is enabled."
            inpaint_fill_mode:
              type: string
              default: original
              description: "How the masked area is initialized before denoising."
            inpaint_fill_strength:
              type: number
              default: 1.0
              description: "Strength of the fill applied to the masked area before denoising."
            inpaint_blur_strength:
              type: number
              default: 1.0
              description: "Strength of the mask-edge blend when compositing the inpainted region back into the original image."
            region_prompt:
              type: string
              default: ""
              description: |
                SD/SDXL only. An additional POSITIVE prompt that conditions
                ONLY the repaint mask region, leaving the main prompt and the
                preserved (unmasked) region untouched. Encoded and combined
                with the main prompt the same way region_negative_prompt is
                (see region_prompt_method). Active only when
                region_prompt_strength > 0 and at least one of
                region_prompt/region_negative_prompt is non-empty.
              example: "continue the character, full body"
            region_negative_prompt:
              type: string
              default: ""
              description: |
                SD/SDXL only. An additional NEGATIVE prompt that suppresses
                content ONLY in the repaint mask region (e.g. suppressing
                invented UI/HUD chrome that a whole-image negative prompt
                cannot target without affecting the preserved region).
              example: "ui, hud, frame, border, text, watermark"
            region_prompt_strength:
              type: number
              default: 1.0
              minimum: 0.0
              maximum: 2.0
              description: |
                SD/SDXL only. Blend strength for the regional additional
                prompt. 0 disables the feature entirely (regardless of
                region_prompt/region_negative_prompt content). 1.0 is the
                canonical spatial blend; values above 1.0 extrapolate a
                stronger regional effect.
              example: 1.0
            region_prompt_method:
              type: string
              enum: [cfg, attention]
              default: cfg
              description: |
                SD/SDXL only. Mechanism used to apply the regional additional
                prompt. "cfg" (default): an extra masked/spatial classifier-
                free-guidance denoise branch, blended into the main branch's
                result via the (feathered) region mask -- costs roughly
                1.5x-2x the base U-Net forward count (higher under outpaint
                time-travel resampling). "attention" is not yet available in
                this build and falls back to "cfg" with a warning.
              example: cfg
            region_mask_feather:
              type: number
              default: 0.0
              minimum: 0.0
              description: |
                SD/SDXL only. Gaussian sigma, in latent cells, for feathering
                the region mask's edge before the spatial blend (method
                "cfg"). 0 (default) uses a hard mask (no feathering).
              example: 0.0
            seam_structure_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 2.0
              description: |
                SD/SDXL only. Seam Structure Continuity: make thin structures
                that cross the repaint mask boundary (a limb, torso, held object,
                architectural lines) continue coherently into the repainted
                region. Detects oriented structures crossing the boundary in the
                known latent (structure tensor), affine-extrapolates their
                band-pass cross-section into a shallow repaint-side collar, and
                pulls the model's per-step x0 prediction toward that target --
                gated per boundary position by a structure-saliency map so it
                fires only where a real crossing structure touches the boundary.
                x0-space, no extra U-Net forwards, known region bit-exact.
                0 (default) disables the feature (byte-identical). Active
                range ~0.25-0.6.
              example: 0.0
            seam_structure_depth:
              type: number
              default: 6.0
              minimum: 1.0
              description: "SSC repaint-side collar depth, in latent cells."
              example: 6.0
            seam_structure_end:
              type: number
              default: 0.70
              minimum: 0.0
              maximum: 1.0
              description: "SSC schedule progress at which the effect decays to 0 (full strength up to 0.45)."
              example: 0.70
            seam_structure_saliency:
              type: number
              default: 2.0
              minimum: 0.0
              description: "SSC saliency-gate midpoint as a multiple of the boundary-ribbon median contrast (0 = apply to the whole seam)."
              example: 2.0
            seam_structure_max_area:
              type: number
              default: 0.25
              minimum: 0.0
              maximum: 1.0
              description: "SSC safety cap: the maximum fraction of the repaint region the saliency gate may cover."
              example: 0.25
            boundary_relax_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 0.5
              description: |
                SD/SDXL only. Boundary Determinism Relaxation: instead of hard-pinning
                the known side of the repaint mask boundary each step, soft-pin a narrow
                SSC-saliency-gated known-side seam band (annealed soft->hard, with a
                small scheduled noise term), so the adjacent known-side latent can bend
                to meet the continuation Seam Structure Continuity indicates. Deep known
                content stays hard-pinned. Most effective with seam_structure_strength
                > 0. 0 (default) = off (byte-identical). Active range ~0.2-0.35.
              example: 0.0
            boundary_relax_width:
              type: number
              default: 3.0
              minimum: 1.0
              description: "BDR known-side seam-band width, in latent cells."
              example: 3.0
            boundary_relax_noise:
              type: number
              default: 0.35
              minimum: 0.0
              maximum: 1.0
              description: "BDR band-noise amount as a fraction of the x0-posterior standard deviation at each step."
              example: 0.35
            boundary_relax_full_until:
              type: number
              default: 0.37
              minimum: 0.0
              maximum: 1.0
              description: "BDR: schedule progress up to which the seam band is fully soft (sigma-based threshold)."
              example: 0.37
            boundary_relax_end:
              type: number
              default: 0.55
              minimum: 0.0
              maximum: 1.0
              description: "BDR: schedule progress by which the hard pin is fully restored (sigma-based threshold)."
              example: 0.55
            boundary_relax_paste:
              type: string
              default: "feather"
              enum: ["feather", "exact"]
              description: "BDR seam-strip paste variant (outpaint-relevant; inpaint keeps its own compositing): 'feather' | 'exact'."
              example: "feather"

    OutpaintRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          required:
            - image
          description: |
            `width`/`height` (inherited from GenerationParams) are NOT used by
            this endpoint -- `canvas_width`/`canvas_height` define the output
            size instead; the resolved canvas size is what actually gets
            generated (and is what is recorded as width/height in the
            response image's metadata).
          properties:
            image:
              type: string
              format: binary
              description: "Input image to place on the outpaint canvas."
            denoising_strength:
              type: number
              minimum: 0
              maximum: 1
              default: 1.0
              description: |
                Denoising strength for the surrounding canvas. Defaults to
                1.0 (full generation) unlike /generate/inpaint's 0.75,
                because outpaint has no existing content in the generated
                region -- the placed input region is preserved regardless,
                via the final pixel paste (not via this parameter).

                At 1.0 (default), the generated region is initialized from
                pure architecture-native noise rather than a noised encode of
                the canvas fill. Below 1.0, the legacy guided-from-fill mode
                runs instead (the generated region is denoised starting from
                the canvas fill, so it remains influenced by the extended
                edge content) and a warning is returned in the response.
            img2img_fix_steps:
              type: boolean
              default: true
              description: "When true, run the full step count scaled by denoising_strength (fixed number of steps) rather than skipping initial steps."
            cpu_text_encoding:
              type: boolean
              default: false
              description: "Run text encoding on CPU instead of GPU."
            vae_drift_correction:
              type: boolean
              default: false
              description: |
                VAE DC-drift correction. Subtracts the per-channel DC bias the
                VAE round-trip introduces from the final decode. Implemented
                for SD1.5/SDXL; accepted-but-ignored (with a warning) on the
                DiT architectures. Only affects the generated region -- the
                preserved rect is pasted back afterward regardless.
            canvas_width:
              type: integer
              multipleOf: 16
              default: 1536
              description: "Output canvas width. Rounded to a 16px grid -- a fixed point for every supported architecture's own internal resolution rounding (SD's /8 grid divides evenly into it too), so the canvas dimensions generate_inpaint is invoked with and the size it returns always match."
              example: 1536
            canvas_height:
              type: integer
              multipleOf: 16
              default: 1536
              description: "Output canvas height. Rounded to a 16px grid -- a fixed point for every supported architecture's own internal resolution rounding (SD's /8 grid divides evenly into it too), so the canvas dimensions generate_inpaint is invoked with and the size it returns always match."
              example: 1536
            place_x:
              type: integer
              default: 0
              description: "Left edge of the placed input rectangle on the canvas (clamped server-side so the whole rect stays in bounds)."
              example: 256
            place_y:
              type: integer
              default: 0
              description: "Top edge of the placed input rectangle on the canvas (clamped server-side so the whole rect stays in bounds)."
              example: 256
            place_width:
              type: integer
              default: 0
              description: "Width the (cropped) input is resized to before placement. 0 = use the input's native width."
              example: 1024
            place_height:
              type: integer
              default: 0
              description: "Height the (cropped) input is resized to before placement. 0 = use the input's native height."
              example: 1024
            input_crop_x:
              type: integer
              default: 0
              description: "Left edge of an optional trim applied to the input image BEFORE placement."
            input_crop_y:
              type: integer
              default: 0
              description: "Top edge of an optional trim applied to the input image BEFORE placement."
            input_crop_w:
              type: integer
              default: 0
              description: "Width of the input trim. 0 = to the input's right edge."
            input_crop_h:
              type: integer
              default: 0
              description: "Height of the input trim. 0 = to the input's bottom edge."
            outpaint_fill_mode:
              type: string
              enum: [replicate, reflect, mean, noise]
              default: replicate
              description: "How the canvas outside the placed rect is pre-filled before denoising: replicate (edge-extend the placed content outward), reflect (mirror it outward), mean (solid average color of the placed content), noise (uniform random RGB)."
              example: replicate
            mask_blur:
              type: integer
              default: 4
              description: |
                Gaussian blur radius for the generation-boundary transition.
                Unlike /generate/inpaint, this blur is OUTWARD-ONLY: the
                softened band lies entirely outside the preserved rect, so
                the placed input region is never blended with generated
                content.
            inpaint_full_res:
              type: boolean
              default: false
              description: "Accepted for API compatibility with /generate/inpaint; not implemented (no effect)."
            inpaint_full_res_padding:
              type: integer
              default: 32
              description: "Accepted for API compatibility with /generate/inpaint; not implemented (no effect)."
            inpaint_fill_mode:
              type: string
              default: original
              description: "How the masked (to-be-generated) area is initialized before denoising, on top of the canvas outpaint_fill_mode already built. Left at its default (original) is recommended -- the canvas is already pre-filled."
            inpaint_fill_strength:
              type: number
              default: 1.0
              description: "Strength of the fill applied to the masked area before denoising."
            inpaint_blur_strength:
              type: number
              default: 1.0
              description: "Strength of the mask-edge blend when compositing the generated region back onto the canvas (internal to generate_inpaint; the final preserved-rect paste happens afterward regardless)."
            region_prompt:
              type: string
              default: ""
              description: |
                SD/SDXL only. An additional POSITIVE prompt that conditions
                ONLY the generated (outside-the-preserved-rect) region,
                leaving the main prompt and the preserved input rectangle
                untouched. Active only when region_prompt_strength > 0 and at
                least one of region_prompt/region_negative_prompt is
                non-empty.
              example: "continue the character, full body"
            region_negative_prompt:
              type: string
              default: ""
              description: |
                SD/SDXL only. An additional NEGATIVE prompt that suppresses
                content ONLY in the generated region (e.g. suppressing
                invented UI/HUD chrome that a whole-image negative prompt
                cannot target without affecting the preserved rectangle).
              example: "ui, hud, frame, border, text, watermark, game screenshot"
            region_prompt_strength:
              type: number
              default: 1.0
              minimum: 0.0
              maximum: 2.0
              description: |
                SD/SDXL only. Blend strength for the regional additional
                prompt. 0 disables the feature entirely. 1.0 is the canonical
                spatial blend; values above 1.0 extrapolate a stronger
                regional effect.
              example: 1.0
            region_prompt_method:
              type: string
              enum: [cfg, attention]
              default: cfg
              description: |
                SD/SDXL only. Mechanism used to apply the regional additional
                prompt. "cfg" (default): an extra masked/spatial classifier-
                free-guidance denoise branch, blended into the main branch's
                result via the (feathered) region mask -- costs roughly
                1.5x-2x the base U-Net forward count, multiplied further by
                outpaint time-travel resampling's own NFE multiplier when
                outpaint_resample_count > 1. "attention" is not yet available
                in this build and falls back to "cfg" with a warning.
              example: cfg
            region_mask_feather:
              type: number
              default: 0.0
              minimum: 0.0
              description: |
                SD/SDXL only. Gaussian sigma, in latent cells, for feathering
                the region mask's edge before the spatial blend (method
                "cfg"). 0 (default) uses a hard mask (no feathering).
              example: 0.0
            seam_structure_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 2.0
              description: |
                SD/SDXL only. Seam Structure Continuity: make thin structures
                that cross the region boundary (a held rod/staff, a limb, torso,
                architectural lines) continue coherently into the generated
                region. Detects oriented structures crossing the boundary in the
                known latent (structure tensor), affine-extrapolates their
                band-pass cross-section into a shallow generate-side collar, and
                pulls the model's per-step x0 prediction toward that target --
                gated per boundary position by a structure-saliency map so it
                fires only where a real crossing structure touches the boundary.
                x0-space, no extra U-Net forwards, known region bit-exact.
                0 (default) disables the feature (byte-identical). Active
                range ~0.25-0.6.
              example: 0.0
            seam_structure_depth:
              type: number
              default: 6.0
              minimum: 1.0
              description: "SSC generate-side collar depth, in latent cells."
              example: 6.0
            seam_structure_end:
              type: number
              default: 0.70
              minimum: 0.0
              maximum: 1.0
              description: "SSC schedule progress at which the effect decays to 0 (full strength up to 0.45)."
              example: 0.70
            seam_structure_saliency:
              type: number
              default: 2.0
              minimum: 0.0
              description: "SSC saliency-gate midpoint as a multiple of the boundary-ribbon median contrast (0 = apply to the whole seam)."
              example: 2.0
            seam_structure_max_area:
              type: number
              default: 0.25
              minimum: 0.0
              maximum: 1.0
              description: "SSC safety cap: the maximum fraction of the generate region the saliency gate may cover (capped to the highest-confidence structures)."
              example: 0.25
            boundary_relax_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 0.5
              description: |
                SD/SDXL only. Boundary Determinism Relaxation: instead of hard-pinning
                the known boundary each step, soft-pin a narrow SSC-saliency-gated
                keep-side seam band (annealed from soft early to a full hard pin late,
                with a small scheduled noise term), so the immediately-adjacent
                known-side latent can bend to meet the continuation Seam Structure
                Continuity indicates. Deep known content stays hard-pinned. Most
                effective with seam_structure_strength > 0. 0 (default) = off
                (byte-identical). Active range ~0.2-0.35.
              example: 0.0
            boundary_relax_width:
              type: number
              default: 3.0
              minimum: 1.0
              description: "BDR keep-side seam-band width, in latent cells."
              example: 3.0
            boundary_relax_noise:
              type: number
              default: 0.35
              minimum: 0.0
              maximum: 1.0
              description: "BDR band-noise amount as a fraction of the x0-posterior standard deviation at each step."
              example: 0.35
            boundary_relax_full_until:
              type: number
              default: 0.37
              minimum: 0.0
              maximum: 1.0
              description: "BDR: schedule progress up to which the seam band is fully soft (sigma-based threshold)."
              example: 0.37
            boundary_relax_end:
              type: number
              default: 0.55
              minimum: 0.0
              maximum: 1.0
              description: "BDR: schedule progress by which the hard pin is fully restored (sigma-based threshold)."
              example: 0.55
            boundary_relax_paste:
              type: string
              default: "feather"
              enum: ["feather", "exact"]
              description: "BDR seam-strip paste variant: 'feather' keeps a thin model-rendered strip inside the rect at generated-adjacent edges; 'exact' restores the full placed rect byte-exact. Deep interior is byte-exact in both."
              example: "feather"
            outpaint_seam_fix:
              type: boolean
              default: true
              description: |
                Corrects a tonal (exposure) mismatch between the generated
                surroundings and the preserved input rectangle by comparing
                narrow strips just inside/outside each generated-adjacent rect
                edge and applying a smooth, outward-tapered per-channel gain
                to the generated pixels only. Applied after generation and
                before the final unconditional paste, so the preserved rect is
                never altered. Disable to see the model's raw output.
              example: true
            outpaint_boundary_color_strength:
              type: number
              default: 0.25
              minimum: 0.0
              maximum: 1.0
              description: |
                SD/SDXL only. A low-frequency color/illumination correction
                applied during denoising to the generate region, restricted to
                a narrow collar near the preserved rectangle's boundary and
                active mid/late in the schedule. Nudges coarse chroma and
                illumination continuity across the seam without constraining
                composition or content further from the boundary. 0 disables
                the correction.
              example: 0.25
            outpaint_resample_count:
              type: integer
              default: 1
              minimum: 1
              description: |
                SD/SDXL only. RePaint-style time-travel resampling: the
                number of denoise traversals through each resampled band
                segment (mid-schedule). After completing a denoise step
                inside the band, the whole latent (preserved region and
                generate region together) is re-noised back up
                `outpaint_jump_length` steps and re-denoised, repeating this
                count of times, before continuing forward. Re-exposes the
                generate region to the preserved-region constraint while it
                is still malleable, addressing content divergence (invented
                or unrelated composition) that persists with
                `outpaint_boundary_color_strength` alone. 1 (default) disables
                resampling. Values above 1 cost roughly 1.5-2x the requested
                step count in actual denoise passes (e.g. ~2x at a count of
                2). Only takes effect with a resample-compatible sampler
                (Euler, Euler Ancestral, DDIM, DDPM); other samplers run
                without resampling.
              example: 1
            outpaint_jump_length:
              type: integer
              default: 4
              minimum: 1
              description: |
                SD/SDXL only. Number of step indices each time-travel jump
                (see `outpaint_resample_count`) re-noises back across.
              example: 4
            outpaint_reference_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 1.0
              description: |
                SD/SDXL only. Masked self-attention Key/Value injection: a
                noise-matched reference built from the preserved rectangle's
                own clean latents (restricted to the preserved region only,
                via spatial token masking) is captured and its Key/Value are
                injected into the generate region's self-attention, scaled by
                this strength. Lets the generate region directly attend to
                the input's own features instead of only following the
                prompt, addressing content, style, and palette divergence
                that persists with `outpaint_boundary_color_strength` and
                `outpaint_resample_count` alone. Active only mid-schedule and
                on a subset of self-attention layers. 0 disables the
                mechanism entirely.
              example: 0.35
            outpaint_commit_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 1.0
              description: |
                SD/SDXL only. EXPERIMENTAL, off by default. Boundary-outward
                commitment front: augments the in-loop x0-space projection
                with a distance-graded, low-frequency, EMA-anchored proximal
                that makes generate cells near the preserved rectangle commit
                their coarse structure earlier in the denoise schedule than
                far-interior cells, following the boundary outward. Only the
                low-frequency band is nudged (high-frequency detail keeps
                refining every step); this reduces seam-adjacent structural
                artifacts (razor cuts, haze, doubled features) at the cost of
                a mild bias toward the preserved region's layout near the
                boundary. 0 disables the proximal entirely (byte-identical to
                the boundary-color/resample/reference mechanisms alone).
              example: 0.35
            outpaint_commit_near:
              type: number
              default: 0.35
              minimum: 0.0
              maximum: 1.0
              description: |
                SD/SDXL only. Schedule progress fraction (0-1) at which
                generate cells directly touching the preserved rectangle's
                boundary begin committing under `outpaint_commit_strength`.
              example: 0.35
            outpaint_commit_far:
              type: number
              default: 0.80
              minimum: 0.0
              maximum: 1.0
              description: |
                SD/SDXL only. Schedule progress fraction (0-1) at which the
                farthest generate cells (at or beyond
                `outpaint_commit_distance` from the boundary) begin
                committing under `outpaint_commit_strength`.
              example: 0.80
            outpaint_commit_distance:
              type: number
              default: 32.0
              minimum: 1.0
              description: |
                SD/SDXL only. Distance, in latent cells, from the preserved
                rectangle's boundary at which the per-cell commit-progress
                schedule saturates to `outpaint_commit_far`. Cells farther
                than this all commit at `outpaint_commit_far`.
              example: 32.0
            outpaint_controlnet_enable:
              type: boolean
              default: false
              description: |
                SD/SDXL only. Edge-extrapolation ControlNet: detects
                structures in the preserved region that cross the rect
                boundary (a held rod, a limb, architectural lines) and
                extrapolates them a short, confidence-tapered distance into
                the generate region as a synthetic ControlNet control image,
                driving a general structure ControlNet model. The same
                confidence field also spatially gates the ControlNet's
                residual contribution during denoising, so its influence
                tapers to 0 with distance from the boundary instead of
                applying uniformly. This enforces a GUESSED continuation
                geometry (not a learned one), so it is off by default.
                Mutually exclusive with a user-supplied ControlNet or
                LLLite model in this version -- skipped (with a warning) if
                one is already active, never overriding the user's own
                request. When active, forces `boundary_relax_paste` to
                "exact" and disables `seam_structure_strength` to avoid
                double geometry enforcement at the boundary.
              example: false
            outpaint_controlnet_mode:
              type: string
              enum: ["edge_extrapolate", "crop_mask"]
              default: "crop_mask"
              description: |
                Conditioning mode. "edge_extrapolate" (PART A): detect +
                extrapolate boundary-crossing edges to drive a general
                "anytest"-style structure ControlNet over a GUESSED geometry.
                "crop_mask" (default, PART B): build the trained
                outpaint-native 4-channel conditioning (crop RGB + binary
                known-mask) -- requires a ControlNet trained with
                conditioning_mode="outpaint" (4-ch diffusers directory),
                which LEARNED the continuation, so no extrapolation/termination
                heuristic and a flat (untapered) residual gate over the whole
                generate region.
              example: "crop_mask"
            outpaint_controlnet_model:
              type: string
              default: ""
              description: |
                Path to the ControlNet model checkpoint driving Outpaint
                ControlNet. Required (non-empty) for the feature to take
                effect when `outpaint_controlnet_enable` is true. For
                "crop_mask" mode this must be an outpaint-trained diffusers
                directory (4-channel conditioning).
              example: "controlnet/CN-anytest4-canny.safetensors"
            outpaint_controlnet_detector:
              type: string
              enum: [canny, lineart, lineart_anime]
              default: canny
              description: |
                Edge/structure detector run over the preserved region only
                (never the synthetic canvas fill). "canny" (default) uses
                cv2 with no model download; "lineart"/"lineart_anime" use
                controlnet_aux (opt-in) and fall back to canny if
                unavailable offline.
              example: canny
            outpaint_controlnet_scale:
              type: number
              default: 0.6
              minimum: 0.0
              maximum: 2.0
              description: "ControlNet conditioning scale for the synthetic control image."
              example: 0.6
            outpaint_controlnet_guidance_start:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 1.0
              description: "ControlNet guidance window start (schedule progress fraction, 0-1)."
              example: 0.0
            outpaint_controlnet_guidance_end:
              type: number
              default: 0.55
              minimum: 0.0
              maximum: 1.0
              description: "ControlNet guidance window end (schedule progress fraction, 0-1)."
              example: 0.55
            outpaint_controlnet_depth:
              type: integer
              default: 160
              minimum: 4
              description: |
                Maximum extrapolation depth, in canvas pixels, a detected
                boundary-crossing structure is continued into the generate
                region before its confidence tapers to 0.
              example: 160
            outpaint_controlnet_taper:
              type: number
              default: 2.0
              minimum: 0.5
              description: |
                Exponent of the cosine-squared distance taper applied to
                each extrapolated structure's confidence (higher = sharper
                falloff near the taper depth).
              example: 2.0
            outpaint_controlnet_edge_feather_px:
              type: number
              default: 0.0
              minimum: 0.0
              description: |
                Fixed inference-time inward edge-feather (canvas px) applied to
                the crop_mask ControlNet conditioning perimeter. MUST be 0.0 for
                a hard-edge-trained ControlNet (the current live checkpoint) so
                inference matches training byte-for-byte. Set to the training
                feather-range midpoint only once an R1-retrained (soft-edge) CN
                becomes the live model.
              example: 0.0
            outpaint_controlnet_corner_radius_px:
              type: number
              default: 0.0
              minimum: 0.0
              description: |
                crop_mask mode only, opt-in (Feature #3a, secondary lever):
                rounds the ControlNet conditioning's known/unknown boundary
                at each of the 4 rect corners with this radius (canvas px)
                instead of a sharp 90-degree vertex, softening what the
                ControlNet is TOLD near a corner. Only takes effect when
                `outpaint_controlnet_edge_feather_px` > 0.0. Clamped to 25%
                of the shorter placed-rect side. 0.0 (default) = disabled,
                byte-identical to before this feature existed.
              example: 0.0
            outpaint_controlnet_corner_gate_radius_px:
              type: number
              default: 0.0
              minimum: 0.0
              description: |
                crop_mask mode only, opt-in (Feature #2, primary fix for the
                rect-corner seam line): attenuates the ControlNet residual
                in a disk of this radius (canvas px) around each of the 4
                placed-rect vertices, down to
                `outpaint_controlnet_corner_gate_min` at the vertex center;
                the rect edges away from corners keep full residual
                strength. Clamped to 25% of the shorter placed-rect side.
                0.0 (default, paired with `outpaint_controlnet_corner_gate_min`
                defaulting to 1.0) = disabled, byte-identical to before this
                feature existed (no gate is applied for crop_mask mode).
              example: 0.0
            outpaint_controlnet_corner_gate_min:
              type: number
              default: 1.0
              minimum: 0.0
              maximum: 1.0
              description: |
                crop_mask mode only: the ControlNet residual gate value at
                each rect vertex center (see
                `outpaint_controlnet_corner_gate_radius_px`), in [0, 1].
                1.0 (default) = no attenuation = disabled regardless of the
                radius.
              example: 1.0
            outpaint_pin_corner_relax_radius_px:
              type: number
              default: 0.0
              minimum: 0.0
              description: |
                crop_mask mode only, opt-in (L1 four-corner x0-pin
                softening): softens the per-step x0-pin composite's
                keep-weight (a different mechanism from the ControlNet
                residual gate above) in a disk of this radius (canvas px)
                around each of the 4 placed-rect vertices, down to
                `outpaint_pin_corner_relax_min` at the vertex center; the
                rect edges away from corners keep the full hard pin.
                Clamped to 25% of the shorter placed-rect side. 0.0
                (default, paired with `outpaint_pin_corner_relax_min`
                defaulting to 1.0) = disabled, byte-identical to before this
                feature existed. The preserved rect always stays byte-exact
                via the final byte-exact paste, regardless of this setting.
              example: 0.0
            outpaint_pin_corner_relax_min:
              type: number
              default: 1.0
              minimum: 0.0
              maximum: 1.0
              description: |
                crop_mask mode only: the x0-pin keep-weight value at each
                rect vertex center (see
                `outpaint_pin_corner_relax_radius_px`), in [0, 1]. 1.0
                (default) = no relax = disabled regardless of the radius.
              example: 1.0
            outpaint_seam_membrane:
              type: boolean
              default: false
              description: |
                Harmonic boundary-offset blend: adjusts generated pixels to
                meet the preserved boundary exactly; the preserved region
                remains byte-identical. Distinct from `outpaint_seam_fix`
                (a per-edge exposure/tone gain): this solves a smooth
                per-channel offset field over the generated region, equal to
                the preserved rectangle's own pixels at the seam and
                harmonic (smoothly diffused) away from it, tapering to zero
                within `outpaint_seam_membrane_band` pixels. Runs after
                `outpaint_seam_fix` and before the final unconditional
                paste. False = off (the underlying module is not imported).
              example: false
            outpaint_seam_membrane_band:
              type: integer
              default: 0
              minimum: 0
              description: |
                Taper band width, in pixels, over which the seam membrane's
                correction fades to zero. 0 = automatic
                (clamp(max(canvas_width, canvas_height) // 8, 64, 256)).
              example: 0
            outpaint_seam_tone_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 2.0
              description: |
                Cross-seam low-frequency tone membrane ("R2"), a separate
                mechanism from `outpaint_seam_membrane`: measures the
                per-channel tone step between the preserved rectangle's own
                pixels and the decoded generated pixels immediately across
                the seam, subtracts the local content gradient estimated from
                the preserved side so a legitimate ramp is not flattened,
                low-passes the residual along the seam axis, and writes a
                decaying offset into the generated side only, within
                `outpaint_seam_tone_band` pixels of the seam. Runs after
                `outpaint_seam_membrane` and before the final unconditional
                paste; the preserved region remains byte-identical. Scales
                the applied offset; 0 = off (the module is not imported).
              example: 0.0
            outpaint_seam_tone_band:
              type: integer
              default: 0
              minimum: 0
              description: |
                Decay band width, in pixels, over which the cross-seam tone
                membrane's offset fades to zero. 0 = automatic (16 px).
              example: 0
            outpaint_seam_offset_prop:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 2.0
              description: |
                Boundary-offset propagation ("G_prop16"), a third seam
                mechanism distinct from `outpaint_seam_membrane` and
                `outpaint_seam_tone_strength`. Measures the same per-channel
                offset between the preserved rectangle's own pixels and the
                decoded reconstruction of that same region (the quantity
                `outpaint_seam_membrane` also measures, not the cross-seam
                comparison `outpaint_seam_tone_strength` uses), and writes it
                directly into the generated pixels adjacent to the seam as a
                Gaussian-smoothed low-frequency term plus a short
                high-frequency residual term, each independently tapered to
                zero moving away from the seam. Writes only generated-side
                pixels; the preserved region is unaffected. Runs after
                `outpaint_seam_tone_strength` and before the final
                unconditional paste. Scales the applied offset; 0 = off (the
                module is not imported). Default 0.0: on the trained crop_mask
                CN the real seam is a hard paste-line (removed by
                `outpaint_paste_feather_px`) plus a CN-driven generation frame
                (a training property), which this generated-side propagation
                does not correct cleanly, so it ships off.
              example: 0.0
            outpaint_paste_feather_px:
              type: integer
              default: 24
              minimum: 0
              description: |
                Paste-band reconciliation feather ("Option E"): at the final
                preserved-rectangle paste, the last N rows/columns of the
                preserved rectangle at its generate-adjacent edges are
                blended (raised cosine) from the exact input toward the
                decoded canvas already underneath them, instead of pasted
                byte-exact. Independent of the boundary relaxation feather
                paste (`boundary_relax_strength`/`boundary_relax_paste`) and
                takes precedence over it when both are active; applies to
                every outpaint ControlNet mode. Default 24: the tiled-VAE-style
                blend that removes the hard raw/decoded seam paste-line while
                keeping the rectangle's deep interior byte-exact. 0 = off, the
                preserved rectangle stays byte-identical at the edge (the hard
                seam line returns). Only the N-row/column band loses
                byte-exactness when > 0; the rest of the rectangle is unaffected.
              example: 24
            outpaint_preserve_mode:
              type: string
              enum: [exact, vae_reconstruct, vae_reconstruct_hf]
              default: exact
              description: |
                Preserved-region compositing mode. `exact` (default) is the
                current byte-exact behavior: the preserved rectangle is
                pasted pixel-for-pixel from the input, unchanged by this
                parameter's existence. `vae_reconstruct` outputs a single
                uniform VAE decode of the whole canvas with no paste at all
                -- the preserved region becomes a VAE reconstruction of the
                input rather than byte-identical to it, removing the hard
                raw/decoded pixel discontinuity at the boundary.
                `vae_reconstruct_hf` additionally restores the preserved
                region's own high-frequency detail (its raw pixels minus
                their own VAE roundtrip reconstruction) on top of the
                uniform decode, tapering that restoration to zero over the
                rows/columns closest to the boundary so the boundary itself
                still matches the uniform decode exactly. `vae_reconstruct_hf`
                is implemented for SD1.5/SDXL; on other architectures it
                falls back to the `vae_reconstruct` behavior. Both non-`exact`
                modes make the preserved region not byte-identical to the
                input and emit a warning.
              example: exact
            outpaint_preview_unpinned_x0:
              type: boolean
              default: false
              description: |
                Display-only preview substitution for outpaint generations.
                The sampling loop pins the model's predicted original sample
                to the composite of the preserved region and the model's
                generate-region prediction before it reaches the mid-sampling
                preview decoder, so previews can show a boundary line that
                the actual denoising math never produces. When true, the
                unpinned model prediction is sent to the preview decoder
                instead; the value used by the sampler's own step function is
                unchanged either way, so the final saved image for a given
                seed is byte-identical regardless of this flag. False
                (default) preserves prior preview behavior.
              example: false

    UpscaleRequest:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          format: binary
          description: "Input image to upscale."
        upscaler_backend:
          type: string
          enum: [pil, spandrel, rtx_vsr, diffusion]
          default: spandrel
          description: "Which upscale backend to run: a PIL resample, a spandrel super-resolution model, RTX Video Super Resolution (nvvfx), or diffusion tile upscale (img2img per tile with the currently loaded model)."
          example: spandrel
        upscaler_model:
          type: string
          nullable: true
          default: null
          description: "Filename of the model under models/upscalers/. Required when upscaler_backend=spandrel, or when upscaler_backend=diffusion and diffusion_pre_upscale_mode=model."
          example: "4x-UltraSharp.pth"
        scale_factor:
          type: number
          minimum: 1.0
          maximum: 8.0
          default: 2.0
          description: "Output dimensions = round(input dimensions * scale_factor). If the spandrel model's native scale differs, its output is Lanczos-resized to the target."
          example: 2.0
        pil_resample:
          type: string
          enum: [lanczos, bicubic, nearest]
          default: lanczos
          description: "Resampling filter used by the pil backend."
        tile_size:
          type: integer
          default: 512
          description: "Tile size (px) for spandrel inference. 0 disables tiling (whole image in one pass)."
        tile_overlap:
          type: integer
          default: 32
          description: "Tile overlap (px) for spandrel inference, feather-blended across tile seams."
        rtx_vsr_quality:
          type: string
          enum: [low, medium, high, ultra]
          default: high
          description: "Quality level passed to RTX Video Super Resolution (nvvfx)."
        unsharp_enable:
          type: boolean
          default: false
          description: "Apply an unsharp mask after upscaling, regardless of backend."
        unsharp_radius:
          type: number
          default: 2.0
          description: "Unsharp mask radius."
        unsharp_percent:
          type: integer
          default: 100
          description: "Unsharp mask amount (percent)."
        unsharp_threshold:
          type: integer
          default: 3
          description: "Unsharp mask threshold."
        prompt:
          type: string
          default: ""
          description: "Tile img2img prompt (diffusion backend only)."
          example: "highly detailed, sharp focus"
        negative_prompt:
          type: string
          default: ""
          description: "Tile img2img negative prompt (diffusion backend only)."
        diffusion_denoising_strength:
          type: number
          minimum: 0.05
          maximum: 0.9
          default: 0.3
          description: "img2img denoising strength applied to each tile (diffusion backend only)."
          example: 0.3
        steps:
          type: integer
          default: 20
          description: "Inference steps for each tile's img2img pass (diffusion backend only)."
          example: 20
        cfg_scale:
          type: number
          default: 7.0
          description: "Classifier-free guidance scale for each tile's img2img pass (diffusion backend only)."
          example: 7.0
        sampler:
          type: string
          default: euler
          description: "Sampler used for each tile's img2img pass (diffusion backend only)."
          example: euler
        schedule_type:
          type: string
          default: uniform
          description: "Noise schedule type used for each tile's img2img pass (diffusion backend only)."
          example: uniform
        seed:
          type: integer
          default: -1
          description: "Base seed for diffusion tile upscale; -1 = random. The same base seed is used for all tiles, offset by tile index. The resolved seed is recorded on the returned image (diffusion backend only)."
          example: -1
        diffusion_pre_upscale_mode:
          type: string
          enum: [pil, model]
          default: pil
          description: "How the image is pre-upscaled to the target size before tiling, when upscaler_backend=diffusion: a PIL resample (using pil_resample) or the spandrel model in upscaler_model."
          example: pil

    GenerationResponse:
      type: object
      properties:
        image_path:
          type: string
        image_id:
          type: integer
        seed:
          type: integer
        metadata:
          type: object
        latent_id:
          type: string
          nullable: true
          description: |
            Present only when the request had loop_decode="none": an opaque id
            for the cached final latent (no decode/save/gallery happened this
            request). Pass it as the next loop step's input_latent_id. Absent
            (or null) for a normal "full"/"cheap" decode response.

    GenerationStatusResponse:
      type: object
      description: |
        Snapshot returned by `GET /generation/status`. Complements the
        WebSocket `/api/v1/ws/progress` channel, which has no dedicated
        completion/error message.
      required: [status, generation_type, current_step, total_steps, phase, started_at, updated_at, last_error, last_result]
      properties:
        status:
          type: string
          enum: [idle, running, error]
          description: Current lifecycle state of the most recently started generation.
          example: "running"
        generation_type:
          type: string
          nullable: true
          enum: [txt2img, img2img, inpaint]
          description: Which endpoint the most recently started generation used; null before any generation has run.
          example: "txt2img"
        current_step:
          type: integer
          nullable: true
          description: Current display step of the active generation, from the same per-step callback that feeds the WS `progress` message.
          example: 15
        total_steps:
          type: integer
          nullable: true
          description: Total display step count for the active generation.
          example: 28
        phase:
          type: string
          nullable: true
          description: Human-readable status text for the current step, matching the WS `progress` message's `message` field.
          example: "Step 15/28"
        started_at:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 UTC timestamp when the current/most recent generation started.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 UTC timestamp of the last update to this snapshot.
        last_error:
          type: string
          nullable: true
          description: Error message from the most recent generation, if it ended in `status=error`.
        last_result:
          type: object
          nullable: true
          description: Result of the most recent successful generation, if any.
          properties:
            image_id:
              type: integer
            filename:
              type: string
            seed:
              type: integer

    GeneratedImage:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        generation_type:
          type: string
          enum: [txt2img, img2img, inpaint]
        model_name:
          type: string
        prompt:
          type: string
        negative_prompt:
          type: string
        parameters:
          type: object
        created_at:
          type: string
          format: date-time

    GeneratedImageSummary:
      type: object
      description: |
        Light per-row payload returned by `GET /images` (the gallery list
        endpoint). Omits the full `parameters` JSON and `mask_data` present on
        `GeneratedImage` -- those can carry embedded base64 (ControlNet/style
        reference images, inpaint masks) up to several MB per row and are only
        needed by the detail view. Fetch `GET /images/{image_id}` for the full
        `GeneratedImage` record when a gallery cell is opened.
      properties:
        id:
          type: integer
          example: 4821
        filename:
          type: string
          example: txt2img_20260711_155444_55555.png
        prompt:
          type: string
        negative_prompt:
          type: string
        generation_type:
          type: string
          enum: [txt2img, img2img, inpaint, outpaint, outpaint_vid, outpaint_aud, txt2vid, img2vid, txt2aud, aud2aud, repaint, upscale]
        width:
          type: integer
        height:
          type: integer
        seed:
          type: integer
        created_at:
          type: string
          format: date-time
        is_favorite:
          type: boolean
        image_hash:
          type: string
          description: SHA256 hash of the generated image (used for source/reference-image lookups within the current page).
        is_video:
          type: boolean
        is_audio:
          type: boolean

    ImageListResponse:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedImageSummary'
        total:
          type: integer

    ModelInfo:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [safetensors, ckpt, diffusers]
        hash:
          type: string
        size:
          type: integer

    ErrorResponse:
      type: object
      required:
        - error
        - status_code
        - timestamp
        - path
      properties:
        error:
          type: string
          description: Error message
          example: "Generation failed"
        detail:
          type: string
          description: Detailed error information
          example: "Invalid parameter: steps must be between 1 and 150"
        status_code:
          type: integer
          description: HTTP status code
          example: 400
        timestamp:
          type: string
          format: date-time
          description: Error occurrence timestamp (ISO 8601)
          example: "2025-11-28T12:34:56.789Z"
        path:
          type: string
          description: Request path that caused the error
          example: "/generate/txt2img"

    ControlNetInfo:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
          description: ControlNet model name
          example: "control_canny-fp16"
        path:
          type: string
          description: Relative path to model file
          example: "controlnet/control_canny-fp16.safetensors"
        type:
          type: string
          enum: [standard, lllite]
          description: ControlNet type
          default: standard
        size:
          type: integer
          description: File size in bytes
          example: 1456734208
        hash:
          type: string
          description: Model hash (SHA256)
          example: "a1b2c3d4e5f6..."

    ControlNetListResponse:
      type: object
      properties:
        controlnets:
          type: array
          items:
            $ref: '#/components/schemas/ControlNetInfo'

    LoRAInfo:
      type: object
      required:
        - name
        - path
      properties:
        name:
