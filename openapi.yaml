            schema:
              allOf:
                - $ref: '#/components/schemas/GenerationParams'
                - type: object
                  required: [init_image_base64]
                  properties:
                    run_id:
                      type: integer
                      nullable: true
                    save_to_gallery:
                      type: boolean
                      default: false
                    init_image_base64:
