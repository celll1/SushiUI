                      slider is never bounded by this value; it always accepts any
                      frame count, including one above this setting.
                    example: 600
                  slider_bounds:
                    type: object
                    additionalProperties:
                      type: number
                    description: |
                      User overrides for slider/number-input UPPER BOUNDS, keyed by
                      bound name (see backend/api/param_defaults.py's PARAM_BOUNDS
                      registry for the eligible keys and their [floor, ceiling]). A
                      key absent from this object means that bound uses its builtin
                      value. Always an object (empty when no overrides are set).
