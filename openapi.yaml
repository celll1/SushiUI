          example: 0.0001
        # Per-bucket activation offload dispatcher (proactive VRAM management)
        activation_dispatch_enable:
          type: boolean
          default: false
          description: |
            Enable the per-bucket activation offload dispatcher. Predicts the
            training peak per bucket (static + coef * bs * latent_area) before the
            forward pass and offloads saved activations to CPU only on buckets that
            would otherwise exceed the VRAM budget. Proactive (no OOM detection),
            so it works on Windows WDDM which silently spills instead of raising.
          example: false
