                $ref: '#/components/schemas/CurrentModelResponse'

  /models/current/components:
    get:
      tags: [models]
      summary: Get effective loaded components
      description: |
        Returns the configured and resident state of each component slot in the
        currently loaded model. Generation-only VAE/text-encoder overrides are
        reported separately and never replace the configured component identity.
      operationId: getCurrentModelComponents
      responses:
        '200':
          description: Effective component state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentComponentsResponse'

  /models/current/components/candidates:
    get:
      tags: [models]
      summary: List component candidates for the loaded architecture
      operationId: listCurrentModelComponentCandidates
      parameters:
        - in: query
          name: slot
          required: true
          schema:
            $ref: '#/components/schemas/ComponentSlotId'
      responses:
        '200':
          description: Candidate list, including the current value even when it is no longer scanned
          content:
            application/json:
              schema:
                type: object
                required: [model_revision, component_revision, slot, candidates]
                properties:
                  model_revision:
                    type: integer
                  component_revision:
                    type: integer
                  slot:
                    $ref: '#/components/schemas/ComponentSlotId'
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComponentCandidate'
        '400':
          description: Invalid slot
        '404':
          description: No model is loaded

  /models/current/components/switch:
    post:
      tags: [models]
      summary: Switch one loaded component safely
      description: |
        Switches only slots with an architecture adapter that guarantees the old
        component is detached and released before the new weights are read.
        Unsupported and unsafe slots are rejected with 422.

        `projection_path` (MiniMax-H3 text encoders) names the trained
        projection to install with the encoder; it goes through the same pairing
        gates as a discovered one, and the encoder and its projection are
        installed — or restored on failure — as one pair.
      operationId: switchCurrentModelComponent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentSwitchRequest'
      responses:
        '200':
          description: Component switched and refreshed state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentSwitchResponse'
        '404':
          description: No model or candidate was found
        '409':
          description: Stale revision or model lifecycle activity is in progress
        '422':
          description: Candidate is incompatible or the slot has no safe adapter

        '500':
          description: >-
            The switch failed after releasing the old component. The response
            says whether the previous component was reloaded serially or the
            model is left degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /loras:
    get:
      tags: [models]
      summary: List available LoRAs
      description: |
        Scans the default LoRA directory plus every registered seeded (e.g.
