  /models:
    get:
      tags: [models]
      summary: List available models
      description: Get list of all available Stable Diffusion models
      operationId: listModels
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelInfo'

  /models/load:
    post:
      tags: [models]
      summary: Load a model
      description: |
        Load a Stable Diffusion model into memory for generation.

        **Supported formats:**
        - `.safetensors` (recommended)
        - `.ckpt` (legacy)
        - Diffusers format (directory)

        **Note:** Loading a new model will unload the currently loaded model and clear VRAM.

        **Re-loading the model that is already loaded** is a no-op unless
        `force=true` is sent. `force` is the documented way to undo any
        per-session mutation of the loaded components — above all the one-way
        in-place runtime INT8 conversion (`unet_quantization: "int8"` on anima /
        krea2 / flux2 / ideogram4 / ltx2), whose source weights are dropped and
        can only come back from the checkpoint.
      operationId: loadModel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [source_type, source]
              properties:
                source_type:
                  type: string
                  description: Where the model comes from (as reported by `GET /models`, e.g. `local`).
                  example: local
                source:
                  type: string
                  description: Model path (or hub id) to load.
                  example: "M:/model/sdxl/animagine-xl-3.1.safetensors"
                revision:
                  type: string
                  nullable: true
                  description: Optional hub revision, passed through to the loader.
                force:
                  type: boolean
                  default: false
                  description: |
                    Reload even when this model is already the loaded one. Without
                    it, a request for the currently loaded model returns success
                    without touching the pipeline, so nothing per-session is reset.

                    Not needed to change `text_encoder_file` / `clip_projection_file`:
                    naming an encoder other than the loaded one reloads on its own.
                  example: true
                text_encoder_file:
                  type: string
                  nullable: true
                  description: |
                    **MiniMax-H3 only.** Absolute path to the `.safetensors` or
                    `.gguf` text encoder to build, inside this model's tree.
                    Omitted/null uses the loader's own preference order — which
                    never auto-selects a small stand-in Qwen3-VL (converted or
                    GGUF), so reaching one takes this field.
                    List the choices with
                    `GET /models/minimax-h3/text-encoders`.

                    Sent for any other architecture, the request is refused rather
                    than silently ignored.
                  example: "M:/model/minimax_h3/text_encoders/qwen3vl_4b_heretic_tap24_bf16.safetensors"
                clip_projection_file:
                  type: string
                  nullable: true
                  description: |
                    **MiniMax-H3 only.** Absolute path to the trained projection to
                    pair with `text_encoder_file`. Omitted/null discovers it in
                    `clip_projections/` by matching declared widths. Only the small
                    stand-in encoders need one; naming a projection for an encoder
                    that does not is refused, not ignored. For a `.gguf` the
                    projection's `tap` also decides how many of the file's decoder
                    blocks are read.
                  example: "M:/model/minimax_h3/clip_projections/mmh3-4b-clipproj-celeb-mlp.safetensors"
      responses:
        '200':
          description: Model loaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Model loaded successfully"
                  model_info:
                    type: object
                    additionalProperties: true
                    description: Same payload as `GET /models/current`'s `model_info`.

        '409':
          description: >-
            Another model load, a component switch, an in-flight generation, or
            a training run is holding the model lifecycle gate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/minimax-h3/text-encoders:
    get:
      tags: [models]
      summary: MiniMax-H3 text encoders and CLIP projections in a model tree
      description: |
        The load-time choices behind `POST /models/load`'s `text_encoder_file`
        and `clip_projection_file`, read from the tree's safetensors HEADERS
        only — no weights are mapped, so this is safe to call while a model is
        loaded.

        `selected` / `selected_reason` are what a load with neither field set
        would pick, straight from the loader's own selection. A converted small
        Qwen3-VL is never selected that way; it is listed as compatible with
        `requires_projection: true` and is reached by naming it here or by
        switching to it through `POST /models/current/components/switch`.

        `projection` is the `clip_projections/` file such a load would pair,
        resolved through the same width/tap gates the load path runs, and
        `projection_reason` says why none resolved.
        `projection_candidates` is every file declaring that encoder's width,
        each with the verdict of those same gates, so a client can name one with
        `clip_projection_file` when several match and auto-resolution refuses.

        `agreement` is the recorded measurement for that resolved pairing, and
        is null for a released 32B encoder and for an unmeasured pairing. No
        pairing borrows another pairing's number.
      operationId: listMiniMaxH3TextEncoders
      parameters:
        - name: model_path
          in: query
          required: true
          schema:
            type: string
          description: A MiniMax-H3 DiT `.safetensors` path or the tree root.
          example: "M:/model/minimax_h3/diffusion_models/minimax_h3_fl2va_pruned_fp8_scaled.safetensors"
      responses:
        '200':
          description: Text encoders and projections found in the tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniMaxH3TextEncoderListResponse'
        '400':
          description: |
            `model_path` does not resolve to a MiniMax-H3 model tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Scanning the tree failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /models/minimax-h3/te-agreement:
    get:
      tags: [models]
      summary: MiniMax-H3 text-encoder agreement state for this installation
      description: |
        Everything a client needs to decide whether to build a reference bank
        and how to read an existing measurement.

        A converted small Qwen3-VL plus a trained projection stands in for the
        released Qwen3-VL-32B. How well it stands in depends on three files the
        user chose, so it is measured here rather than tabulated in the source
        tree. The cost is split: the REFERENCE BANK (the released encoder's
        hidden state for the tracked prompt suite) is built once per released
        encoder file and is the expensive half; the substitute measurement
        against that bank runs automatically on the first load of a pairing.

        `bank` is the stored bank for the LOADED encoder — null when none was
        built from it. A bank built from a different released encoder is
        reported under `banks` and does not answer for this one, so it is not
        promoted to `bank`.

        `measurements` are the stored measurements whose text encoder or
        reference encoder is a file in `model_path`'s tree; `measurements_reason`
        says why that list is empty when the tree could not be scanned.

        `loaded.substitution` is the backend's single wording for the loaded
        pairing (the same sentence the loader logs and the generation warning
        carries), and states whether the number came from this installation or
        from the compiled-in table measured elsewhere.
      operationId: getMiniMaxH3TeAgreement
      parameters:
        - name: model_path
          in: query
          required: false
          schema:
            type: string
          description: |
            A MiniMax-H3 DiT `.safetensors` path or tree root whose files the
            `measurements` list is filtered to. Defaults to the loaded model's
            own source.
          example: "M:/model/minimax_h3/diffusion_models/minimax_h3_fl2va_pruned_fp8_scaled.safetensors"
      responses:
        '200':
          description: Agreement state, stored banks and measurements, and any job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniMaxH3TeAgreementStatus'
        '500':
          description: Reading the agreement store failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /models/minimax-h3/te-agreement/reference-bank:
    post:
      tags: [models]
      summary: Build the reference bank from the loaded released text encoder
      description: |
        Start a background job that encodes the tracked prompt suite with the
        LOADED released text encoder and stores the result as this
        installation's reference bank.

        Measured for suite `h3-te-suite-v1` on the 25 GB released encoder: about
        5 minutes, 14-24 GiB of host RSS, 39 MB stored. `GET` reports those same
        figures under `cost` so a client can state them before the click.

        `text_encoder_path` names the encoder the client believes is loaded. The
        build refuses when that is not the loaded encoder — a bank labelled with
        the wrong released encoder is worse than no bank — and refuses when the
        loaded encoder is itself a substitute, since a substitute is what
        agreement is measured AGAINST a reference and cannot be one.

        Returns immediately with the job document; poll `GET` for
        `job.processed` / `job.total` (presentations encoded).
      operationId: startMiniMaxH3ReferenceBank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniMaxH3ReferenceBankRequest'
      responses:
        '200':
          description: Bank build started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniMaxH3ReferenceBankJob'
        '400':
          description: |
            No MiniMax-H3 model is loaded, the loaded model has no text encoder,
            the loaded encoder is a substitute, or `text_encoder_path` is not
            the loaded encoder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            An image generation or a training run is in flight, another
            lifecycle mutation (model load, component switch, quantized export)
            holds the model, or a bank build is already running. The build reads
            the live text encoder and holds the model lifecycle gate for its
            whole run, which is also why a generation started while it runs is
            refused with 409.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The job could not be started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [models]
      summary: Cancel the running reference-bank build
      description: |
        Ask the running build to stop. The worker checks after each presentation
        and the bank file is written only once every presentation is encoded, so
        a cancelled build stores nothing; an interrupted REBUILD leaves the
        previous bank in place. The job document ends in state `cancelled`.
      operationId: cancelMiniMaxH3ReferenceBank
      responses:
        '200':
          description: Cancellation requested (or nothing was running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniMaxH3ReferenceBankJob'

  /models/export-quantized:
    get:
      tags: [models]
      summary: Quantized-model export status
      description: |
        Report whether the loaded transformer can be written out as a
        weight-only quantized single file, plus the state of any export job.

        `exportable` is true exactly when the loaded transformer owns
        `Int8Linear` / `Fp8Linear` modules. Both provenances count and are
        indistinguishable by then: a checkpoint that was already quantized, and
        a bf16 checkpoint converted in place at generation time
        (`unet_quantization: "int8"` on anima / krea2 / flux2 / ideogram4 / ltx2
        — which converts BOTH of Ideogram 4's transformers, and only the video
        DiT on LTX-2.3, and is one-way until the model is reloaded).

        `suggested_path` is a destination outside the loaded model's own
        directory tree, in the subdirectory that architecture's loader needs
        (anima resolves its text encoder and VAE by walking up from the DiT file
        to a `split_files/` parent, so its export goes in
        `split_files/diffusion_models/`).
      operationId: getQuantizedExportStatus
      responses:
        '200':
          description: Export capability and job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantizedExportStatus'
    post:
      tags: [models]
      summary: Export the loaded quantized model to a single file
      description: |
        Start a background job that writes the loaded, weight-only quantized
        transformer to `output_path` in the layout the production loader reads
        back (per-row `.weight_scale` siblings, architecture key prefix,
        architecture metadata). Shards above 4 GB with a
        `<stem>.safetensors.index.json`, the diffusers convention.

        Transformer only — no text encoder and no VAE are embedded. With
        `link_siblings` (default true) the companion component directories of the
        loaded model are junctioned next to the output so the loader's sibling
        probe resolves the same components.

        When the quantized layers came from an in-place runtime conversion, the
        per-layer audit document for that conversion is written next to the file
        as `<stem>.int8_audit.json`, the same document the offline conversion
        tool emits. When the model was loaded already quantized no audit exists;
        the file's metadata records `quant_audit=unavailable` rather than a
        fabricated table.

        Returns immediately with the job document; poll `GET` for progress.
      operationId: startQuantizedExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuantizedExportRequest'
      responses:
        '200':
          description: Export job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantizedExportJob'
        '400':
          description: |
            The loaded model cannot be exported: nothing is loaded, the
            architecture has no single-file export layout, the transformer owns
            no quantized Linear layers, the destination does not end in
            `.safetensors`, or it lies inside the loaded model's own directory
            tree (that tree holds the source checkpoint and the sibling
            directories the loader completes from).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            An image generation or a training run is in flight (the export reads
            the live transformer, so it must describe one settled state), or
            another export job is already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Export could not be started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /models/upload:
    post:
      tags: [models]
      summary: Upload new model
      description: Upload a new model file (safetensors)
      operationId: uploadModel
      requestBody:
        required: true
