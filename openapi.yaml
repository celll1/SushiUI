            schema:
              $ref: '#/components/schemas/BrowserSaveTagsRequest'
      responses:
        '200':
          description: Save result
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: boolean
  /tagger/browser/batch-infer:
    post:
      tags: [tagger]
      summary: Run tagger inference over multiple browser images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserBatchInferRequest'
      responses:
        '200':
          description: Batch inference results
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /datasets:
    get:
      tags: [datasets]
      summary: List all datasets
      description: Returns dataset summaries ordered by creation date (descending). Omits the tag_statistics column for speed; use GET /datasets/{dataset_id} for the full payload.
      responses:
        '200':
          description: Dataset list
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dataset'
                  total:
                    type: integer
    post:
      tags: [datasets]
      summary: Create a new dataset
      operationId: createDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreateRequest'
      responses:
        '201':
          description: Dataset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '400':
          description: Name already exists, or path not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{dataset_id}:
    get:
      tags: [datasets]
      summary: Get dataset by ID
      description: Returns the full dataset payload including tag_statistics.
      operationId: getDataset
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dataset detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [datasets]
      summary: Delete dataset
      operationId: deleteDataset
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Dataset deleted
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{dataset_id}/caption-processing:
    patch:
      tags: [datasets]
      summary: Update caption processing configuration for a dataset
      operationId: updateDatasetCaptionProcessing
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptionProcessingUpdateRequest'
      responses:
        '200':
          description: Dataset updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{dataset_id}/exif-config:
    patch:
      tags: [datasets]
      summary: Toggle EXIF-caption reading for a dataset
      description: Applied on the next scan; does not retroactively re-read existing items.
      operationId: updateDatasetExifConfig
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetExifConfigUpdateRequest'
      responses:
        '200':
          description: Dataset updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{dataset_id}/scan/preview:
    post:
      tags: [datasets]
      summary: Preview dataset structure before importing
      description: Scans the directory and returns detected file groups, caption suffixes, and format classifications, without writing to the database. Samples up to 500 groups.
      operationId: previewDatasetScan
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Scan preview
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Dataset path not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{dataset_id}/scan:
    post:
      tags: [datasets]
      summary: Scan dataset directory and register images/captions
      description: |
        Auto-detects reference/target suffix structure on first scan, then registers
        images and captions found on disk. Also updates cached tag_statistics.
      operationId: scanDataset
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
        - name: incremental
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Training pre-flight rescan mode; updates tag_statistics incrementally instead of recomputing from scratch
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Dataset directory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{dataset_id}/items:
    get:
      tags: [datasets]
      summary: List dataset items with pagination and search
      operationId: listDatasetItems
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Text search in filename (base_name)
        - name: tags
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated tags; item must contain ALL specified tags (e.g. "1girl,solo")
      responses:
        '200':
          description: Paginated item list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer

  /datasets/{dataset_id}/items/ids:
    get:
      tags: [datasets]
      summary: Get all matching dataset item IDs (unpaginated)
      operationId: listDatasetItemIds
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: tags
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: All matching item IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  item_ids:
                    type: array
                    items:
                      type: integer
                  total:
                    type: integer

  /datasets/{dataset_id}/items/{item_id}:
    get:
      tags: [datasets]
      summary: Get detailed dataset item with captions
      operationId: getDatasetItem
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item detail with captions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Dataset item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{dataset_id}/tags:
    get:
      tags: [datasets]
      summary: Get all unique tags used in a dataset
      description: Aggregates the "tags" caption type across all items in the dataset.
      operationId: getDatasetTags
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Unique tag list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: string

  /datasets/{dataset_id}/caption-types:
    get:
      tags: [datasets]
      summary: Get available caption types with format detection info
      operationId: getDatasetCaptionTypes
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Caption type summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  caption_types:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{dataset_id}/random-caption:
    get:
      tags: [datasets]
      summary: Get a random processed caption from the dataset
      description: |
        Mirrors the training caption pipeline: resolves caption types the same way
        training does, selects one caption per item by priority, then applies the
        dataset's caption processing (normalize/shuffle/dropout/category order) so
        the preview matches the string actually fed to training.
      operationId: getDatasetRandomCaption
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
        - name: caption_types
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated caption types to filter; defaults to the dataset's configured/auto-selected types
      responses:
        '200':
          description: Random processed caption
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/items/{item_id}/captions:
    patch:
      tags: [datasets]
      summary: Update caption for a dataset item
      description: Creates the caption if it doesn't exist for the given caption_type; keeps the dataset's cached tag_statistics in sync for "tags" captions.
      operationId: updateDatasetItemCaption
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptionUpdateRequest'
      responses:
        '200':
          description: Caption updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Dataset item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/items/{item_id}/reference-images:
    patch:
      tags: [datasets]
      summary: Replace all reference images for a dataset item
      operationId: updateDatasetItemReferenceImages
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceImagesUpdateRequest'
      responses:
        '200':
          description: Reference images updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: One or more reference image paths do not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dataset item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [datasets]
      summary: Remove a single reference image from a dataset item
      operationId: removeDatasetItemReferenceImage
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
        - name: image_path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reference image removed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Dataset item, or reference image path, not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/items/{item_id}/reference-images/add:
    post:
      tags: [datasets]
      summary: Add a single reference image to a dataset item
      operationId: addDatasetItemReferenceImage
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image_path]
              properties:
                image_path:
                  type: string
                  description: Absolute path to an existing image file
      responses:
        '200':
          description: Reference image added (or already present)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Image file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dataset item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/items/{item_id}/save-to-txt:
    post:
      tags: [datasets]
      summary: Save the item's "tags" caption from the DB to its TXT/JSON sidecar file
      description: Auto-detects existing TXT/JSON sidecar files next to the image and writes to whichever exist; creates a TXT file if neither exists.
      operationId: saveDatasetItemCaptionToTxt
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Save result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Dataset item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to write file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{dataset_id}/save-all-to-txt:
    post:
      tags: [datasets]
      summary: Save all items' "tags" captions from the DB to TXT sidecar files
      operationId: saveAllDatasetCaptionsToTxt
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Save result summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  saved_count:
                    type: integer
                  failed_count:
                    type: integer
                  failed_items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/items/{item_id}/restore-from-txt:
    post:
      tags: [datasets]
      summary: Restore an item's "tags" caption from its TXT sidecar file into the DB
      operationId: restoreDatasetItemCaptionFromTxt
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Caption restored
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Dataset item not found, or no TXT file exists next to the image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to read TXT file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{dataset_id}/batch-tagger:
    post:
      tags: [datasets]
      summary: Run tagger inference over multiple dataset items
      operationId: batchTaggerDataset
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTaggerRequest'
      responses:
        '200':
          description: Batch operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'

  /datasets/{dataset_id}/batch-reorder-tags:
    post:
      tags: [datasets]
      summary: Reorder tags by category for multiple dataset items
      operationId: batchReorderDatasetTags
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchReorderTagsRequest'
      responses:
        '200':
          description: Batch operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'

  /datasets/{dataset_id}/batch-replace-tag:
    post:
      tags: [datasets]
      summary: Replace a specific tag with another tag across multiple dataset items
      operationId: batchReplaceDatasetTag
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchReplaceTagRequest'
      responses:
        '200':
          description: Batch operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'

  /datasets/{dataset_id}/backfill-tag-data:
    post:
      tags: [datasets]
      summary: Populate missing tag_data JSON for tags-format captions in a dataset
      description: Backfills category info for captions that have comma-separated tags in "content" but tag_data=NULL (e.g. from bulk import).
      operationId: backfillDatasetTagData
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Batch operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'

  /datasets/{dataset_id}/batch-cancel:
    post:
      tags: [datasets]
      summary: Cancel the current batch operation for a dataset
      operationId: cancelDatasetBatchOperation
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cancellation requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /caption-processing-presets:
    get:
      tags: [datasets]
      summary: List all caption processing presets
