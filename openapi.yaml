openapi: 3.0.3
info:
  title: SushiUI - Stable Diffusion WebUI API
  description: |
    Backend API for SushiUI, a Stable Diffusion web interface with advanced features.

    Features:
    - Multiple generation modes (txt2img, img2img, inpaint)
    - LoRA support
    - ControlNet integration
    - TIPO tag generation
    - Image tagging
    - Quantization support (FP8, UINT)

    WebSocket progress protocol (`/api/v1/ws/progress`) is documented separately in backend/api/WS_PROTOCOL.md.
  version: 1.0.0
  contact:
    name: SushiUI GitHub
    url: https://github.com/celll1/SushiUI

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server (API v1)

tags:
  - name: generation
    description: Image generation endpoints
  - name: images
    description: Image management and gallery
  - name: models
    description: Model management and loading
  - name: controlnet
    description: ControlNet preprocessors and detection
  - name: tags
    description: Tag suggestions and autocomplete
  - name: tipo
    description: TIPO tag generation AI
  - name: tagger
    description: Image tag prediction
  - name: settings
    description: Application settings
  - name: system
    description: System control and monitoring
  - name: auth
    description: Authentication (if enabled)
  - name: datasets
    description: Dataset management, scanning, and structure detection
  - name: training
    description: LoRA/Full-FT training run and preset management
  - name: tagger-training
    description: Tagger (vision encoder) training run management
  - name: logs
    description: Backend console log retrieval
  - name: debug
    description: Developer-mode diagnostics (VRAM inspection)

paths:
  /health:
    get:
      summary: Backend liveness check
      description: |
        Minimal liveness probe for the backend API. Returns a fixed status
        string and the running API version.
      tags: [system]
      responses:
        '200':
          description: Backend is up and responding
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 0.1.0
              example:
                status: ok
                version: 0.1.0
  /schema/timestep-defaults-by-arch:
    get:
      summary: Per-architecture default timestep_sampling configs
      description: |
        Returns a map of model architecture -> default `timestep_sampling` config.
        The frontend applies the selected model's entry when the base model changes
        (user edits win). Most architectures default to uniform; only MiniT2I differs
        (logit_normal mean=-0.8/std=0.8). The `_default` key is the global fallback.
      tags: [Schema]
      responses:
        '200':
          description: Map of architecture name to timestep sampling config
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/TimestepSamplingConfig'
              example:
                _default: { distribution: uniform, min_timestep: 0.0, max_timestep: 1.0 }
                minit2i: { distribution: logit_normal, mean: -0.8, std: 0.8, min_timestep: 0.0, max_timestep: 1.0 }
                krea2: { distribution: uniform, min_timestep: 0.0, max_timestep: 1.0 }
  /schema/bundle-vae-defaults-by-arch:
    get:
      summary: Per-architecture default bundle_vae values
      description: |
        Returns a map of model architecture -> default `bundle_vae` boolean for
        full-parameter training saves. sd15/sdxl/deus default `true` (their
        comfy-layout checkpoints are consumed by A1111/ComfyUI, which require the
        `first_stage_model.*` VAE section); other architectures default `false`.
        The `_default` key is the global fallback. The frontend applies the selected
        model's entry when the base model changes (user edits win).
      tags: [Schema]
      responses:
        '200':
          description: Map of architecture name to default bundle_vae boolean
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
              example:
                _default: false
                sd15: true
                sdxl: true
                deus: true
  /schema/generation-defaults:
    get:
      summary: Get default parameter values for txt2img/img2img/inpaint generation
      description: |
        Single source of truth for generation defaults
        (`backend/api/param_defaults.py` `GENERATION_DEFAULTS`, split per mode).
        The frontend fetches this at startup and applies it when no localStorage
        override is present.
      tags: [Schema]
      responses:
        '200':
          description: Defaults grouped by generation mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  txt2img:
                    type: object
                    additionalProperties: true
                  img2img:
                    type: object
                    additionalProperties: true
                  inpaint:
                    type: object
                    additionalProperties: true
                  outpaint:
                    type: object
                    additionalProperties: true
                  outpaint_vid:
                    type: object
                    additionalProperties: true
                  outpaint_aud:
                    type: object
                    additionalProperties: true
  /schema/training-defaults:
    get:
      summary: Get default parameter values for LoRA / Full-FT training
      description: |
        Single source of truth for LoRA/Full-FT training defaults
        (`backend/api/param_defaults.py` `TRAINING_DEFAULTS`). The frontend
        fetches this at startup and applies it when no localStorage override
        is present, so the UI and backend never diverge on default values.
      tags: [Schema]
      responses:
        '200':
          description: Map of training parameter name to default value
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /schema/tagger-training-defaults:
    get:
      summary: Get default parameter values for tagger training
      description: |
        Single source of truth for tagger training defaults
        (`backend/api/param_defaults.py` `TAGGER_TRAINING_DEFAULTS`). The
        frontend fetches this at startup and applies it when no localStorage
        override is present.
      tags: [Schema]
      responses:
        '200':
          description: Map of tagger training parameter name to default value
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /schema/vae-training-defaults:
    get:
      summary: Get default parameter values for VAE (decoder-only) training
      description: |
        Single source of truth for VAE training defaults
        (`backend/api/param_defaults.py` `VAE_TRAINING_DEFAULTS`). Backs training
        runs created with `training_method: "vae_decoder"`, which produce a YAML
        config whose `network.type` is `vae_decoder`.

        **Where each key ends up in the generated YAML:**
        - `batch_size` … `max_step_saves_to_keep` are written into the shared
          `process.train` / `process.save` sections, so the existing start /
          stop / resume / checkpoint-keep plumbing keeps owning them.
        - everything from `vae_source` onwards is written into a dedicated
          `process.vae` section read by
          `core/training/vae/vae_config.resolve_vae_training_config`.

        **Refused combinations** (the config is rejected before training starts):
        `train_encoder: true` (Phase 2 — it moves the latent distribution and
        invalidates every latent cache / LoRA trained against this VAE),
        `train_decoder: false` with `train_encoder: false` (nothing to train),
        `latent_encoding_mode: pre_encoded_cache` (VAE training is a live
        encode→decode forward on raw pixels), `dtype: fp16` (SD1.5/SDXL-family
        activation overflow, and no gradient scaler for the other families),
        all loss weights 0, and `lpips_weight > 0` with the `lpips` package not
        installed.
      tags: [Schema]
      responses:
        '200':
          description: Map of VAE training parameter name to default value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaeTrainingDefaults'
  /generate/txt2img:
    post:
      tags: [generation]
      summary: Generate image from text prompt
      description: |
        Text-to-image generation using Stable Diffusion.

        **Key parameters:**
        - `prompt`: Main generation prompt (required)
        - `steps`: Number of inference steps (1-150, default: 28)
        - `cfg_scale`: Classifier-free guidance scale (1.0-30.0, default: 7.0)
        - `controlnet_images`: Optional ControlNet images for direct upload (multipart)

        **ControlNet usage:**
        - Can upload images directly via `controlnet_images` field
        - Or use base64 encoding in `controlnets` JSON parameter
      operationId: generateTxt2Img
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Txt2ImgRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                image_path: "/outputs/2025-11-28/txt2img_20251128_123456_001.png"
                image_id: 42
                seed: 1234567890
                metadata:
                  prompt: "1girl, beautiful anime character, detailed face, long hair, standing in garden, cherry blossoms"
                  model_name: "animagine-xl-3.1"
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/txt2vid:
    post:
      tags: [generation]
      summary: Generate video from text prompt (LTX-2.3)
      description: |
        Text-to-video generation using a loaded LTX-2.3 model. Produces an
        H.264 mp4 (with an audio track when `audio_enable` is true) and a
        gallery row.

        **Requirements:**
        - An LTX-2.3 model must be loaded (otherwise 400).

        **Constraints (validated before generation):**
        - `width` and `height` must both be divisible by 32.
        - `num_frames` must satisfy (num_frames - 1) % 8 == 0 (e.g. 9, 17, ..., 121).

        **Distilled defaults:** num_inference_steps=8, guidance_scale=1.0,
        num_frames=121, frame_rate=24.0, height=512, width=768.
      operationId: generateTxt2Vid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Txt2VidRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 1234567890
                image:
                  id: 43
                  filename: "txt2vid_20260708_120000_1234567890.mp4"
                  generation_type: "txt2vid"
        '400':
          description: Invalid parameters or no LTX-2.3 model loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/img2vid:
    post:
      tags: [generation]
      summary: Generate video from a still-image first-frame keyframe (LTX-2.3)
      description: |
        Image-to-video generation using a loaded LTX-2.3 model. The uploaded
        image is used as the first-frame keyframe (pinned as frame 0) and the
        remaining frames are generated. Produces an H.264 mp4 (with an audio
        track when `audio_enable` is true) and a gallery row.

        **Requirements:**
        - An LTX-2.3 model must be loaded (otherwise 400).
        - Sent as multipart/form-data with the keyframe `image` file plus the
          txt2vid parameters as form fields.

        **Constraints (validated before generation):**
        - `width` and `height` must both be divisible by 32.
        - `num_frames` must satisfy (num_frames - 1) % 8 == 0 (e.g. 9, 17, ..., 121).

        The keyframe is resized to (`width`, `height`) before conditioning. A
        `source_image_hash` of the keyframe is stored on the gallery row.
      operationId: generateImg2Vid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Img2VidRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 1234567890
                image:
                  id: 44
                  filename: "img2vid_20260708_120000_1234567890.mp4"
                  generation_type: "img2vid"
        '400':
          description: Invalid parameters or no LTX-2.3 model loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/txt2aud:
    post:
      tags: [generation]
      summary: Generate music/audio from a text caption (ACE-Step 1.5)
      description: |
        Text-to-audio (music) generation using a loaded ACE-Step 1.5 (turbo)
        model. Produces a lossless FLAC file and a gallery row.

        **Requirements:**
        - An ACE-Step model must be loaded (otherwise 400).

        **Key parameters:**
        - `prompt`: caption text describing the desired music.
        - `lyrics`: optional lyrics text; empty for instrumental.
        - `audio_duration`: target length in seconds.

        **Distilled defaults:** inference_steps=8, guidance_scale=1.0 (turbo
        is CFG-distilled; a non-default value is overridden back to 1.0),
        shift=3.0.
      operationId: generateTxt2Aud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Txt2AudRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 1234567890
                image:
                  id: 45
                  filename: "txt2aud_20260713_120000_1234567890.flac"
                  generation_type: "txt2aud"
        '400':
          description: Invalid parameters or no ACE-Step model loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/aud2aud:
    post:
      tags: [generation]
      summary: Generate a cover or repaint (audio-to-audio) from a reference clip (ACE-Step 1.5)
      description: |
        Audio-to-audio generation using a loaded ACE-Step 1.5 (turbo) model,
        with two sub-modes selected by `mode`:

        - `mode=cover` (default, the img2img analog): the uploaded reference
          clip is VAE-encoded and fed back to the model as the cover context
          (`is_covers=true`); the WHOLE reference is re-rendered under the
          new `prompt`/`lyrics`.
        - `mode=repaint` (the inpaint analog): only the `[repaint_start,
          repaint_end)` seconds window of the reference is regenerated under
          the new `prompt`/`lyrics`; everything outside that window is held
          to the (correctly re-noised) reference during sampling and the
          original reference waveform is spliced back in after decoding
          (with a short crossfade at the boundaries), so only the
          repainted region actually changes.

        Produces a lossless FLAC file and a gallery row in both modes.

        **Requirements:**
        - An ACE-Step model must be loaded (otherwise 400).
        - Sent as multipart/form-data with the `reference_audio` file plus
          the cover/repaint parameters as form fields.

        **Key parameters:**
        - `prompt`: caption text the reference (or repainted region) is
          rendered under.
        - `mode`: `cover` or `repaint`.
        - `cover_strength` (cover only): fraction of steps that keep the
          reference's semantic context (step-count blend, NOT an img2img
          start-timestep/partial-denoise knob). Higher = closer to the
          reference.
        - `repaint_start` / `repaint_end` (repaint only, required, seconds):
          the time range to regenerate. Must satisfy `repaint_end >
          repaint_start` (otherwise 400).
        - Output duration is always derived from the reference clip's
          length, not user-supplied.

        **Distilled defaults:** inference_steps=8, guidance_scale=1.0 (turbo
        is CFG-distilled; a non-default value is overridden back to 1.0),
        shift=3.0.
      operationId: generateAud2Aud
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Aud2AudRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 1234567890
                image:
                  id: 46
                  filename: "aud2aud_20260713_120000_1234567890.flac"
                  generation_type: "aud2aud"
        '400':
          description: Invalid parameters or no ACE-Step model loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/outpaint/audio:
    post:
      tags: [generation]
      summary: Audio temporal outpaint (extend) from a placed input clip (ACE-Step 1.5)
      description: |
        Places a (optionally trimmed) input `reference_audio` clip at a time
        offset inside a LONGER `total_duration` output timeline and
        generates the audio before and/or after it. Structurally the
        INVERSE of `/generate/aud2aud`'s `mode=repaint`: repaint holds
        everything OUTSIDE a window and generates INSIDE it; outpaint holds
        the placed input window itself and generates OUTSIDE it (before
        and/or after) -- see
        `core.pipeline_backends.acestep.AceStepMixin._generate_audoutpaint_acestep`
        for the full mechanism (inverted latent-domain repaint hold +
        boundary blend, plus a post-decode waveform splice).

        **Strict preservation guarantee:** the placed input span in the
        returned audio is sample-exact to the decoded 48kHz/16-bit
        representation of the (trimmed, stereo/48kHz-normalized) input
        clip, regardless of `total_duration`/`input_offset_sec`. This is
        enforced by an unconditional post-decode waveform splice performed
        AFTER generation (splicing the FULL trimmed input regardless of the
        latent hold-window length, so no tail is ever dropped), with a short
        (10ms) declick ramp confined entirely to the GENERATED side of each
        boundary so every preserved sample stays untouched. Because the
        app's standard audio output (FLAC) is already lossless, this makes
        the output sample-exact to that decoded representation end to end
        -- unlike video outpaint, no separate lossless toggle is needed
        here. An upload that is not already 48kHz/16-bit stereo is
        faithfully resampled/requantized once during normalization, not
        byte-identical to the original file.

        Produces a lossless FLAC file and a gallery row.

        **Requirements:**
        - An ACE-Step model must be loaded (otherwise 400).
        - Sent as multipart/form-data with the `reference_audio` file plus
          the placement/generation parameters as form fields.
        - `total_duration` must be in (0, 240] seconds.
        - The (trimmed) input clip must fit inside `total_duration`; if
          `input_offset_sec` would push it out of bounds it is CLAMPED (with
          a warning) rather than rejected, but a trimmed input longer than
          `total_duration` itself is rejected (400).

        **Key parameters:**
        - `reference_audio`: the input clip to place (multipart file upload).
        - `total_duration`: length of the OUTPUT timeline, in seconds.
        - `input_offset_sec`: where the (trimmed) input clip is placed
          within that timeline, in seconds.
        - `input_trim_start_sec` / `input_trim_end_sec`: trim applied to the
          UPLOADED clip itself before placement, in seconds.

        **Distilled defaults:** inference_steps=8, guidance_scale=1.0 (turbo
        is CFG-distilled; a non-default value is overridden back to 1.0),
        shift=3.0.
      operationId: generateOutpaintAudio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OutpaintAudioRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 1234567890
                image:
                  id: 89
                  filename: "outpaint_aud_20260715_120000_1234567890.flac"
                  generation_type: "outpaint_aud"
        '400':
          description: Invalid parameters (including a placement that cannot fit) or no ACE-Step model loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/img2img:
    post:
      tags: [generation]
      summary: Generate image from image and prompt
      description: |
        Image-to-image generation. Transforms an input image according to the prompt.

        **Key parameters:**
        - `denoising_strength`: Controls how much the image is changed (0.0-1.0). Lower = closer to original.
        - `image`: Input image (PNG/JPEG, binary file upload)
      operationId: generateImg2Img
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Img2ImgRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                image_path: "/outputs/2025-11-28/img2img_20251128_123456_001.png"
                image_id: 43
                seed: 9876543210
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/inpaint:
    post:
      tags: [generation]
      summary: Inpaint image with mask
      description: |
        Inpainting generation. Fills masked areas of an image according to the prompt.

        **Key parameters:**
        - `image`: Original image (PNG/JPEG, binary file upload)
        - `mask`: Mask image (PNG/JPEG, white = inpaint area, black = keep original)
        - `denoising_strength`: Controls strength of generation (0.0-1.0)
        - `mask_blur`: Blur radius for mask edge smoothing (default: 4)
      operationId: generateInpaint
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InpaintRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                image_path: "/outputs/2025-11-28/inpaint_20251128_123456_001.png"
                image_id: 44
                seed: 5555555555
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/outpaint:
    post:
      tags: [generation]
      summary: Outpaint (spatially extend) an image onto a larger canvas
      description: |
        Places `image` (optionally trimmed via `input_crop_*` and resized to
        `place_width`x`place_height`) inside a larger `canvas_width`x`canvas_height`
        canvas at (`place_x`, `place_y`), fills the rest of the canvas per
        `outpaint_fill_mode`, and generates everything outside the placed
        rectangle according to the prompt. Internally delegates to the same
        all-architecture inpaint machinery as `/generate/inpaint` (no mask
        upload -- the mask is built server-side from the placement rect).

        **Strict preservation guarantee:** the placed input rectangle in the
        returned image is BYTE-IDENTICAL to the (cropped + resized) input,
        regardless of the loaded architecture or `denoising_strength`. This
        is enforced by an unconditional final pixel paste performed AFTER
        generation (see `core/inference/outpaint_utils.py`), independent of
        any per-architecture inpaint compositing.

        **Key parameters:**
        - `image`: Input image to place on the canvas (PNG/JPEG, binary file upload)
        - `canvas_width` / `canvas_height`: Output canvas size (rounded to a
          16px grid -- a fixed point for every supported architecture's own
          internal resolution rounding)
        - `place_x` / `place_y` / `place_width` / `place_height`: Placed
          rectangle on the canvas. `place_width`/`place_height` = 0 means
          "use the (cropped) input's native size"
        - `input_crop_x` / `input_crop_y` / `input_crop_w` / `input_crop_h`:
          Optional trim of the input BEFORE placement (0 width/height = to
          the input's edge)
        - `outpaint_fill_mode`: How the canvas outside the placed rect is
          pre-filled before denoising: `replicate` | `reflect` | `mean` | `noise`
        - `mask_blur`: Gaussian blur radius for the generation-boundary
          transition. Unlike `/generate/inpaint`, this blur is OUTWARD-ONLY
          (the softened band lies entirely outside the preserved rect)
        - `denoising_strength`: Defaults to 1.0 (full-strength generation of
          the surrounding canvas; the placed region is preserved regardless
          via the final pixel paste, not via this parameter)
      operationId: generateOutpaint
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OutpaintRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                image_path: "/outputs/2026-07-15/outpaint_20260715_123456_001.png"
                image_id: 87
                seed: 5555555555
        '400':
          description: Invalid parameters (including degenerate placement geometry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate/outpaint/video:
    post:
      tags: [generation]
      summary: Video temporal outpaint (place a clip at an offset in a longer timeline, LTX-2.3)
      description: |
        Places a (optionally trimmed) input `video` clip at a frame offset
        inside a LONGER `total_frames` output timeline and generates the
        frames before/after with a loaded LTX-2.3 model. Internally
        delegates to the stock `diffusers.LTX2ConditionPipeline`
        (`LTX2VideoCondition`) -- no new denoise loop, no mask upload.

        **Strict preservation guarantee:** the placed input frames in the
        returned video are BYTE-IDENTICAL to the (trimmed + preprocessed)
        input clip, over the EFFECTIVE placed span (which may be shorter
        than the full trimmed clip if it runs past `total_frames` -- see
        `input_offset_frames`). This is enforced by an unconditional
        frame-exact paste performed AFTER generation.

        **÷32 preprocessing:** every frame in a single LTX-2.3 video shares
        one resolution (`width`x`height`, both required ÷32 like
        `/generate/txt2vid`). A clip whose native resolution or aspect ratio
        does not match is center-cropped and LANCZOS-resized ONCE to that
        resolution -- the PREPROCESSED frames (not the raw upload) become
        the exact-preserved content, mirroring `/generate/outpaint`'s
        placed-image RESIZE convention.

        **Placement:** `input_offset_frames` is a desired PIXEL frame offset
        into the output timeline. Because `LTX2VideoCondition.index`
        addresses a LATENT frame (temporal compression 8x), it is snapped
        server-side to the nearest valid pixel start
        ({0, 1, 9, 17, ..., 8m+1}) -- a warning is returned in the response
        when snapping changes the requested offset. `input_trim_start_frames`
        / `input_trim_end_frames` trim the UPLOADED clip itself (in the
        clip's own pixel frames) before placement.

        **Audio (`outpaint_video_audio_mode`, only relevant when
        `audio_enable` is true):**
        - `regenerate` (default): use LTX-2.3's own whole-timeline generated
          audio as-is. The input clip's own audio is NOT preserved.
        - `preserve_input`: after generation, mux the input clip's ORIGINAL
          audio over its placed span, keeping the LTX-generated audio
          outside that span, with a ~50ms crossfade confined to the
          GENERATED side of each boundary so every input audio sample stays
          exact. Falls back to `regenerate` (with a warning) if the
          uploaded clip has no audio stream.

        **Requirements:**
        - An LTX-2.3 model must be loaded (otherwise 400).
        - `width`/`height` divisible by 32; `total_frames` must satisfy
          `(total_frames - 1) % 8 == 0`.
      operationId: generateOutpaintVideo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OutpaintVideoRequest'
      responses:
        '200':
          description: Generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
              example:
                success: true
                actual_seed: 1234567890
                image:
                  id: 88
                  filename: "outpaint_vid_20260715_120000_1234567890.mp4"
                  generation_type: "outpaint_vid"
        '400':
          description: Invalid parameters or no LTX-2.3 model loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

