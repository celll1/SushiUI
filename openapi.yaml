        torch_compile:
          type: 'string'
          default: 'off'
          enum: ['off', 'default', 'reduce-overhead', 'max-autotune-no-cudagraphs']
          description: |
            Opt-in torch.compile (Inductor) acceleration for DiT training. The
            transformer's forward is compiled once, after model/dtype/device and
            gradient-checkpointing setup, before the training loop (the first
            step pays a one-time compilation cost).

            - `off` (default): eager, no compile.
            - `default`: torch.compile(mode="default").
            - `reduce-overhead`: CUDA-graphs mode (higher VRAM).
            - `max-autotune-no-cudagraphs`: autotuned kernels, no CUDA graphs.

            Gated to DiT architectures (Anima/Z-Image/Lens/FLUX.2/Krea2/etc.) and
            full-parameter fine-tuning only; skipped with a log warning for LoRA
            and when block swap is active (blocks_to_swap > 0). Any Inductor
            failure at runtime falls back to eager. The forward is replaced
            in-place, so checkpoint state_dict keys stay unprefixed.
          example: 'off'
        torch_compile_dynamic:
          type: 'boolean'
          nullable: true
          default: null
          description: |
            Dynamic-shape handling for torch_compile. null = auto (Dynamo detects
            varying shapes and recompiles / promotes to dynamic as needed — best
            with bucketing). true = force dynamic from first compile (fewer
            recompiles, slightly slower kernels). false = assume static shapes.
        tread_enable:
          type: 'boolean'
          default: false
          description: |
            TREAD token routing (arXiv 2501.04765) for DiT training (anima).
            During training forwards only, a random token subset bypasses the
            middle transformer blocks and is reintroduced before the final
            blocks; sampling always runs the full network.
        tread_drop_ratio:
          type: 'number'
          default: 0.5
          description: "Fraction of tokens routed around the span (0-1 exclusive)."
        tread_start_block:
          type: 'integer'
          default: 2
          description: "First block index of the routed span."
        tread_end_block:
          type: 'integer'
          default: 26
          description: "End (exclusive) block index of the routed span."
        block_skip_rate:
          type: 'number'
          default: 0.0
          description: |
            Low-rate stochastic depth (per-batch block dropout) for DiT training
            (anima). Training-only regularization: each step, eligible blocks
            (front/back, outside the protected middle span) are independently
            dropped with this probability; executed eligible blocks rescale their
            residual by 1/(1-rate) so the expected contribution matches the full
            eval network. Sampling always runs every block. 0.0 = off; capped to
            0.35 (high block dropout on a pretrained DiT degrades quality).
        block_skip_protect_start:
          type: 'integer'
          default: 6
          description: |
            Start (inclusive) index of the PROTECTED middle block span that is
            never dropped. Middle DiT blocks are semantically critical; only
            blocks before this index are front-eligible for dropout.
        block_skip_protect_end:
          type: 'integer'
          default: 22
          description: |
            End (exclusive) index of the PROTECTED middle block span. Blocks at or
            after this index are back-eligible for dropout.
        blockskip_enable:
          type: 'boolean'
          default: false
          description: |
            DiT-BlockSkip (arXiv 2603.20755) — training-only MEMORY-REDUCTION for
            LoRA and full fine-tune training (anima). Skips the first blockskip_front
            and last blockskip_back transformer blocks; only the unskipped middle
            blocks train (LoRA injected there, or full parameters when
            training_method=full_finetune — the skipped blocks are frozen and
            excluded from the optimizer). Each step, a no_grad full forward captures
            the skipped spans' residual features (Delta = span input->output), which
            are re-added during the gradient forward so backprop flows only through
            the middle blocks — eliminating the skipped blocks' backward-activation
            memory (and, for full-FT, their gradient + optimizer-state memory).
            Supported for LoRA and full fine-tune; unsupported for ReLoRA and
            ControlNet. Mutually exclusive with tread_enable, block_skip_rate and
            blocks_to_swap. Default off.
        blockskip_front:
          type: 'integer'
          default: 4
          description: |
            Number of leading transformer blocks to skip (n). Middle block count
            (num_blocks - front - back) must be >= 1.
        blockskip_back:
          type: 'integer'
          default: 4
          description: |
            Number of trailing transformer blocks to skip (m).
        res_curriculum_enable:
          type: 'boolean'
          default: false
          description: |
            Resolution curriculum (training-only, arch-agnostic data-pipeline
            feature): warm up at a lower resolution, then switch to the target
            (base_resolutions) at an epoch boundary. Lower resolution => fewer
            latent tokens => cheaper attention per step, so warmup steps are far
            faster. Default off; requires res_curriculum_warmup_steps > 0 to take
            effect.
        res_curriculum_warmup_steps:
          type: 'integer'
          default: 0
          description: |
            Number of warmup steps at the scaled resolution. Rounds UP to the end
            of the epoch that contains it (the resolution switch happens at an
            epoch boundary so per-epoch batch planning stays intact). 0 = no
            warmup (feature inert even if enabled).
        res_curriculum_warmup_scale:
          type: 'number'
          default: 0.5
          description: |
            Warmup resolution = base_resolutions * this scale, each snapped to the
            /64 grid the bucket table is defined on (reuses the existing bucket-fit
            logic). 0.5 => half the linear size => ~1/4 the tokens. Must be in
            (0, 1).
