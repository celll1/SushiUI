  /video-chain/plan:
    post:
      tags: [video-chain]
      summary: Plan a long-form video chain and return an immutable Chain Manifest
      operationId: planVideoChain
      description: |
        Builds the **Chain Manifest** for a video longer than one model
        invocation can produce. Planning is a pure, model-free computation: it
        loads no checkpoint, generates nothing, and writes no gallery row. The
        client generates by turning the returned manifest into the ordinary
        `/generate/*` requests it already uses.

        **Why this exists:** today a chain splits only the *length* and copies
        the same full-length prompt into every continuation, so each segment
        re-enacts events that belong to other segments (repeated actions,
        reversed order, restarted dialogue and ambience). The planner instead
        normalizes the root prompt into a canonical timeline once, assigns each
        event to exactly one owning segment, and compiles a per-segment prompt
        whose timestamps are rebased to that segment's own span.

        **Key parameters:**
        - `architecture` / `variant`: the loaded model. Frame grid, maximum
          segment length and available `continuation_mode`s come from the
          backend's capabilities for this pair, never from a checkpoint name
          (`GET /schema/arch-capabilities` -> `video_constraints` and
          `chain_context`).
        - `target_frames` / `fps`: the desired final length. Frames are the
          authoritative unit; seconds are a display-only derivation.
        - `requested_segment_frames`: per-invocation span. `null` uses the
          architecture's own maximum. Snapped up to the model's frame grid,
          which is why `expected_final_frames` may overshoot `target_frames`.
        - `segment_length_mode`: where the segment boundaries fall. It has no
          schema default: omitted, the planner resolves it from the canonical
          timeline, so a prompt whose shots parse (or a supplied
          `canonical_timeline`) gets boundaries chosen around the shots, and a
          free-form prompt with nothing to align to gets fixed lengths. Send
          `fixed` to keep `requested_segment_frames` as the length of every
          segment; under shot alignment it is an upper bound instead. What was
          applied is `manifest.segment_length_mode`, and the resulting segment
          count and per-segment lengths are in `frame_plan`.
        - `boundary_crossing_policy`: what to do with a shot whose frames cross
          a segment boundary. `refuse` (default) reports it as a plan error
          naming the shot, its frame range and the cut frame, and no other
          behaviour changes. `assign_to_earlier_segment` gives the whole shot to
          the earlier segment and lists every such shot in `warnings`. It only
          decides anything for a fixed-length plan, where the boundaries come
          from the frame arithmetic and a caller cannot choose timestamps that
          avoid them before planning — which is why the second option exists at
          all. A shot-aligned plan places the boundaries around the shots and
          discloses the ones it could not fit as warnings either way.
        - `context_mode`: `timeline` (compile per-segment prompts), `manual`
          (caller supplies `canonical_timeline`), or `legacy_repeat` (copy the
          root prompt verbatim — explicit opt-in, always warned about). It has
          no schema default because "unset" is a distinct request: `timeline`
          is applied only when the root prompt parses structurally. For a
          free-form prose root prompt with no parsable structure the planner
          does **not** pick a mode for you: it returns a hard error so the user
          chooses. It never silently falls back to `legacy_repeat`.
        - `seed_policy`: `fixed` (default, every segment reuses the root seed)
          or `derived` (stable hash of root seed, plan hash and segment index).
          `explicit` is a manifest-only policy and is refused here with a 400,
          because the plan request carries no per-segment seeds. Concrete seeds
          are frozen into the manifest here and are never re-drawn at
          generation time — a `root_seed` of `-1` is resolved to a real value
          during planning.
        - `references`: an **inventory only** — kind and label, no file bytes
          and no paths. Binding is many-to-many: one reference may apply to
          several non-contiguous segments, and one segment may carry several
          references. A reference with no `segment_indices` applies to every
          segment, which is the backward-compatible carry-to-all behaviour.

        **Example use cases:**
        - Plan a 1000-frame MiniMax-H3 clip as three snapped segments and
          review the compiled per-segment prompts before queuing anything.
        - Bind a character sheet to the opening and closing segments only, and
          see the per-segment reference count (and therefore the per-step cost)
          each binding implies.

        Frame arithmetic follows the shared-anchor rule: a continuation's first
        generated frame is the same instant as the previous segment's last
        frame, so a segment of `generated_span_frames` adds
        `generated_span_frames - 1` new frames. Ownership ranges are half-open
        `[owned_start_frame, owned_end_frame)`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoChainPlanRequest'
      responses:
        '200':
          description: >-
            Plan computed. A 200 does not mean the plan is runnable: check
            `success` and `errors`. Hard errors (an event owned by no segment,
            a timestamp outside the clip, an unknown reference token) are
            reported here rather than as an HTTP error, so the editor can show
            them next to the offending segment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoChainPlanResponse'
        '400':
          description: >-
            Request rejected before planning: unknown architecture/variant, a
            `continuation_mode` the architecture/variant does not advertise in
            `GET /schema/arch-capabilities`'s
            `chain_context[arch].chain_continuation_modes` (never silently
            downgraded), `context_mode: manual` without a
            `canonical_timeline`, a free-form root prompt with no explicit
            `context_mode` choice, `seed_policy: explicit` (no per-segment
            seeds can be sent here), a `requested_segment_frames` no longer
            than the shared anchor, a negative `requested_overlap_frames` or
            `chain_drift_tolerance_frames`, an unknown `segment_length_mode` or
            `boundary_crossing_policy`, or a non-positive `target_frames` or
            `fps`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Planning failed unexpectedly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /video-chain/validate:
    post:
      tags: [video-chain]
      summary: Re-validate an edited Chain Manifest
      operationId: validateVideoChain
      description: |
        Re-runs the planner's validators over a manifest the user has edited in
        the plan editor (typically after rewriting segment prompts or changing
        reference bindings) and recomputes its `plan_hash`. Loads no model and
        generates nothing.

        **Key parameters:**
        - `manifest`: the edited manifest, in the exact shape `/video-chain/plan`
          returned.
        - `recompute_plan_hash`: when true (default) the response carries the
          hash of the edited manifest, which becomes the provenance value
          recorded with every generated segment. The backend is the only
          implementation of this hash; clients display it and never recompute
          it.

        `segments[].seed` comes back re-derived from `seed_policy`, `root_seed`
        and the manifest's `plan_hash`, in the planner's own order: under
        `derived` the seeds are a function of the hash, so an edit that moves
        the hash moves them. `explicit` per-segment seeds are returned as sent,
        and a manifest whose `root_seed` is still -1 keeps the seeds it carried
        (an unresolved root seed is only ever drawn at plan time).

        **Example use cases:**
        - Gate the editor's "Start chain" button: enable it only while `valid`
          is true and `errors` is empty.
        - Confirm after a reference-binding edit that `references[].segment_indices`
          and `segments[].reference_ids` still agree in both directions, and
          surface the warning for a segment left with no reference at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoChainValidateRequest'
      responses:
        '200':
          description: >-
            Validation result. Content problems are returned as `errors` /
            `warnings` with `valid: false`, not as an HTTP error status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoChainValidateResponse'
        '400':
          description: >-
            The submitted document is not a manifest this server can read at
            all — missing or unsupported `manifest_version`, or a body that
            does not match the manifest schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Validation failed unexpectedly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StudioRenderAssetRef:
      type: object
      required: [id, kind]
      properties:
        id:
          type: string
          description: Client-local asset id; never a filesystem path.
          example: "asset-1"
        kind:
          type: string
          enum: [image, video, audio]
        galleryId:
          type: integer
          nullable: true
          description: Existing Gallery row id. Omit this for an uploaded asset.
        name:
          type: string
        duration:
          type: number
          minimum: 0
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
    StudioRenderTrack:
      type: object
      required: [id, kind]
      properties:
        id:
          type: string
          example: "track-video-1"
        kind:
          type: string
          enum: [video, audio]
        muted:
          type: boolean
          default: false
          description: Audio-only. Excludes this track's audio from the mix; the track's video is still composited.
        visible:
          type: boolean
          default: true
          description: Excludes this track from both the video composite and, for an audio track, its audio.
    StudioRenderClip:
      type: object
      # `id`, `start`, and `sourceIn` are all server-defaulted when omitted
      # (`id` -> "clip-<index>", `start`/`sourceIn` -> 0); only the fields the
      # server has no reasonable default for are required. See
      # `_canonical_manifest()` in backend/api/studio_render_jobs.py.
      required: [assetId, trackId, duration]
      properties:
        id:
          type: string
          example: "clip-1"
        assetId:
          type: string
          example: "asset-1"
        trackId:
          type: string
          example: "track-video-1"
        start:
          type: number
          minimum: 0
          default: 0
          description: Timeline position in seconds; normalized to an integer output frame.
          example: 0
        duration:
          type: number
          exclusiveMinimum: 0
          description: Presentation duration in seconds; normalized to output frames.
          example: 2.5
        sourceIn:
          type: number
          minimum: 0
          default: 0
          description: Source trim offset in seconds.
        presentation:
          type: string
          enum: [frame, hold, clip]
          description: >-
            Defaults to "frame" for an image clip with duration_frames == 1,
            "hold" for a longer image clip (required in that case), and
            "clip" for video/audio.
        fitMode:
          type: string
          enum: [cover, contain]
          default: cover
          description: How the clip is scaled into the fixed project canvas.
        activeTake:
          type: boolean
          default: true
    StudioRenderManifest:
      type: object
      required: [project, assets, tracks, clips]
      properties:
        schemaVersion:
          type: integer
        project:
          type: object
          required: [id, revision, duration, fps, width, height]
          # NOTE: the numeric bounds below (duration/fps/width/height) mirror
          # backend/api/param_defaults.py's STUDIO_RENDER_DEFAULTS, which is
          # this project's single source of truth and the one the backend
          # actually enforces. If that file's limits change, these bounds
          # must be updated too -- the backend does not read this spec.
          properties:
            id:
              type: string
            revision:
              type: integer
            name:
              type: string
            duration:
              type: number
              exclusiveMinimum: 0
              maximum: 600
              description: Seconds. Mirrors `STUDIO_RENDER_DEFAULTS["max_duration_seconds"]`.
            fps:
              type: number
              minimum: 1
              maximum: 120
            width:
              type: integer
              minimum: 64
              maximum: 8192
            height:
              type: integer
              minimum: 64
              maximum: 8192
        render:
          type: object
          properties:
            audio_enabled:
              type: boolean
              default: true
            fit_mode:
              type: string
              enum: [cover, contain]
              default: cover
              description: >-
                "cover" scales a clip up and crops its edges to fill the
                canvas; "contain" scales it down and letterboxes with black
                bars instead.
            video_lossless:
              type: boolean
              default: false
              description: >-
                Only `false` is currently accepted; the renderer produces
                browser-playable H.264 output only. Sending `true` is
                rejected with a 422.
        assets:
          type: array
          items:
            $ref: '#/components/schemas/StudioRenderAssetRef'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/StudioRenderTrack'
        clips:
          type: array
          items:
            $ref: '#/components/schemas/StudioRenderClip'
    StudioRenderRequest:
      type: object
      required: [manifest]
      properties:
        manifest:
          type: string
          description: JSON-encoded StudioRenderManifest.
          example: '{"project":{"id":"proj-1","revision":1,"duration":2.5,"fps":30,"width":1920,"height":1080},"assets":[{"id":"asset-1","kind":"image","galleryId":42}],"tracks":[{"id":"track-video-1","kind":"video"}],"clips":[{"assetId":"asset-1","trackId":"track-video-1","duration":2.5}]}'
        asset_ids:
          type: array
          items:
            type: string
          description: Repeated ids corresponding positionally to asset_files.
        asset_files:
          type: array
          items:
            type: string
            format: binary
          description: Browser-imported files; Gallery assets must not be uploaded again.
    StudioRenderJob:
      type: object
      required: [success, job_id, state, progress]
      properties:
        success:
          type: boolean
          default: true
        job_id:
          type: string
          example: "3f2a1c9e8b7d4a6f9c0e1b2a3d4e5f60"
        state:
          type: string
          enum: [queued, running, cancel_requested, cancelled, completed, failed]
        progress:
          type: number
          minimum: 0
          maximum: 1
          example: 0.42
        message:
          type: string
          nullable: true
          example: "Rendering timeline"
        gallery_image_id:
          type: integer
          nullable: true
        filename:
          type: string
          nullable: true
          example: "studio_render_20260812_143022_3f2a1c9e8b7d.mp4"
        preview_filename:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        warnings:
          type: array
          items:
            type: string
          description: >-
            Non-fatal feature-degradation notices (e.g. a missing audio
            source despite audio being enabled, a failed poster/thumbnail
            generation, or the edge-cropping side effect of fit_mode
            "cover"). Populated once the job reaches a terminal state.
          example:
            - "Audio was enabled for this render, but no unmuted clip on the timeline has an audio source; the output has no sound track."
        created_at:
          type: string
          nullable: true
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
        image:
          allOf:
            - $ref: '#/components/schemas/GeneratedImage'
          nullable: true

    PromptAssistReference:
      type: object
      required: [token, kind, role]
      properties:
        token:
          type: string
          example: "<Picture 1>"
        kind:
          type: string
          enum: [picture, video, audio, subject]
        role:
          type: string
          example: first_frame
        description:
          type: string
          default: ""
    PromptAssistModelRequest:
      type: object
      properties:
        provider:
          type: string
          enum: [lm_studio, ollama]
          default: lm_studio
        base_url:
          type: string
          default: ""
          description: Empty selects the provider default; only loopback URLs are accepted.
        api_key:
          type: string
          default: ""
          writeOnly: true
    PromptAssistModelList:
      type: object
      required: [provider, models]
      properties:
        provider:
          type: string
        models:
          type: array
          items:
            type: object
            required: [id, name, loaded]
            properties:
              id:
                type: string
              name:
                type: string
              loaded:
                type: boolean
              size_bytes:
                type: integer
                nullable: true
    PromptAssistTemplateRequest:
      type: object
      required: [prompt, mode, duration_seconds]
      properties:
        prompt:
          type: string
        mode:
          type: string
          enum: [t2va, i2va, fl2va, l2va, ref2va]
        duration_seconds:
          type: number
          minimum: 0.001
          maximum: 600
    PromptAssistTransformRequest:
      allOf:
        - $ref: '#/components/schemas/PromptAssistTemplateRequest'
        - type: object
          properties:
            provider:
              type: string
              enum: [lm_studio, ollama]
              default: lm_studio
            base_url:
              type: string
              default: ""
            model:
              type: string
              default: ""
            api_key:
              type: string
              default: ""
              writeOnly: true
            references:
              type: array
              items:
                $ref: '#/components/schemas/PromptAssistReference'
              default: []
            temperature:
              type: number
              minimum: 0
              maximum: 1
              default: 0.2
            top_p:
              type: number
              exclusiveMinimum: 0
              maximum: 1
              default: 0.9
            max_output_tokens:
              type: integer
              minimum: 128
              maximum: 8192
              default: 3072
            context_length:
              type: integer
              minimum: 1024
              maximum: 262144
              default: 8192
            timeout_seconds:
              type: integer
              minimum: 10
              maximum: 1800
              default: 300
            force_refresh:
              type: boolean
              default: false
    PromptAssistResponse:
      type: object
      required: [prompt, warnings, valid]
      properties:
        prompt:
          type: string
        warnings:
          type: array
          items:
            type: string
        valid:
          type: boolean
        cached:
          type: boolean
          default: false
        cache_key:
          type: string
        provider:
          type: string
        model:
          type: string

    QuantizedExportRequest:
      type: object
      required: [output_path]
      properties:
        output_path:
          type: string
          description: |
            Destination `<stem>.safetensors`. Must end in `.safetensors` and must
            not lie inside the loaded model's own directory tree. Shards and a
            `<stem>.safetensors.index.json` are written beside it above 4 GB.
          example: "D:/celll1/webui_cl/models/quantized_exports/anima-base-v1.0_int8/split_files/diffusion_models/anima-base-v1.0_int8.safetensors"
        link_siblings:
          type: boolean
          default: true
          description: |
            Make the loaded model's companion components resolvable next to the
            output, so the loader's sibling probe finds the same components it
            does today. A companion that is a DIRECTORY (text encoder, VAE, ...)
            is junctioned; one that is a FILE is copied instead — LTX-2.3 needs
            `model_index.json` and the transformer's own `config.json`, both of
            which `LTX2Pipeline.from_pretrained` reads before it resolves any
            component directory, and both of which are about a kilobyte.
          example: true
        overwrite:
          type: boolean
          default: false
          description: Replace an existing file or shard index at the destination.
          example: false
    QuantizedExportJob:
      type: object
      description: |
        Export job document. Before the first export of this backend process it
        is the single key `{"state": "idle"}`; every other field appears once a
        job has been started.
      required: [state]
      properties:
        job_id:
          type: string
          example: "61944768f00c"
        state:
          type: string
          enum: [idle, running, completed, failed]
          example: running
        arch:
          type: string
          nullable: true
          description: |
            Architecture being exported: one of `acestep`, `anima`, `flux2`,
            `ideogram4`, `krea2`, `ltx2`, `minimax_h3`, `zimage` (the keys of the backend's
            `EXPORT_LAYOUTS` table, pinned by
            `quantized_capability_parity_test`).
          example: anima
        output_path:
          type: string
          description: Requested destination.
          example: "D:/exports/anima_int8/split_files/diffusion_models/anima_int8.safetensors"
        written_path:
          type: string
          nullable: true
          description: |
            What was actually written: the `.safetensors` itself, or the
            `<stem>.safetensors.index.json` for a sharded export. Null until the
            job completes.
          example: "D:/exports/anima_int8/split_files/diffusion_models/anima_int8.safetensors"
        processed:
          type: integer
          description: Tensors written so far.
          example: 640
        total:
          type: integer
          description: Tensors in the transformer's state dict.
          example: 920
        message:
          type: string
          example: "writing blocks.12.attn.to_q.weight"
        error:
          type: string
          nullable: true
          example: null
        result:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Present when `state` is `completed`: written path, tensor and byte
            counts, elapsed seconds, the per-format Linear census, the file
            metadata, the audit JSON path (null when no audit exists) and the
            linked sibling names.
        started_at:
          type: number
          format: double
          example: 1785756665.12
        finished_at:
          type: number
          format: double
          nullable: true
          example: null
    QuantizedExportInventory:
      type: object
      description: Per-format census of the loaded transformer's Linear modules.
      properties:
        int8:
          type: integer
          description: "`Int8Linear` modules (int8 weight + per-row float32 scale)."
          example: 231
        e4m3:
          type: integer
          description: "`Fp8Linear` modules (float8_e4m3fn weight + per-row float32 scale)."
          example: 1
        plain:
          type: integer
          description: Unquantized `nn.Linear` modules.
          example: 283
        total:
          type: integer
          example: 515
    QuantizedExportStatus:
      type: object
      required: [exportable, inventory, job]
      properties:
        exportable:
          type: boolean
          description: True when the loaded transformer owns quantized Linear modules.
          example: true
        reason:
          type: string
          nullable: true
          description: Why it is not exportable; null when it is.
          example: null
        arch:
          type: string
          nullable: true
          example: anima
        source:
          type: string
          nullable: true
          description: Path the loaded model came from.
          example: "M:/model/anima/split_files/diffusion_models/anima-base-v1.0.safetensors"
        inventory:
          $ref: '#/components/schemas/QuantizedExportInventory'
        has_runtime_audit:
          type: boolean
          description: |
            True when this session converted the model in place, so a per-layer
            audit document exists and will be written next to the export.
          example: true
        suggested_path:
          type: string
          nullable: true
          description: Pre-fillable destination; null when nothing is exportable.
          example: "D:/celll1/webui_cl/models/quantized_exports/anima-base-v1.0_int8/split_files/diffusion_models/anima-base-v1.0_int8.safetensors"
        job:
          $ref: '#/components/schemas/QuantizedExportJob'
    ResolveCategoriesRequest:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 1000
          description: |
            Tags to resolve. Any format is accepted (underscore or space separated,
            escaped or plain parentheses). Maximum 1000 tags per request.
          items:
            type: string
          example: ["1girl", "hatsune_miku_(vocaloid)", "masterpiece", "explicit"]
    ResolveCategoriesResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedTagCategory'
    ResolvedTagCategory:
      type: object
      required: [tag, category, normalized]
      properties:
        tag:
          type: string
          description: The original tag string as supplied in the request.
          example: "hatsune_miku"
        category:
          type: string
          description: Resolved category, or "Unknown" if the tag is not found.
          enum: [General, Character, Artist, Copyright, Meta, Model, Rating, Quality, Unknown]
          example: "Character"
        normalized:
          type: string
          description: The tag normalized for matching (escapes removed, underscores to spaces, lowercased).
          example: "hatsune miku"
    Fp8ScaledMmRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            true  = FP8 Linear layers run the W8A8 `torch._scaled_mm` path where
                    the probe accepts a scaling mode for the device/dtype.
            false = FP8 Linear layers dequantize the weight and run a normal
                    matmul (the process default).
          example: true
    ArchCapabilities:
      type: object
      required: [unsupported, supported_values, feature_params, feature_labels, runtime_int8_archs, quantized_linear_archs]
      description: |
        Mirror of `backend/api/arch_capabilities.py`. Declares which generation
        features a given model architecture does NOT honor, and why. Served by
        `GET /schema/arch-capabilities`.
      properties:
        unsupported:
          type: object
          description: Architecture name -> feature name -> factual reason the feature has no effect there.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          example:
            sdxl:
              quantized_gemm: "this architecture's checkpoints hold plain floating-point Linear weights; the quantized-GEMM path selection applies only to the weight-only quantized Linear layers used by Anima, FLUX.2, Ideogram 4 and Krea 2"
        supported_values:
          type: object
          description: |
            Architecture name -> feature name -> the values of that feature's
            arming parameter which the architecture DOES honor, despite the
            feature being listed in `unsupported`. A caller should treat a
            parameter value present here as supported and must not hide the
            control outright for that architecture.
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
          example:
            krea2:
              unet_quantization: [int8]
        feature_params:
          type: object
          description: Feature name -> the request parameter keys that arm it.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            quantized_gemm: [quantized_gemm_mode]
        feature_labels:
          type: object
          description: Feature name -> the human-readable label used in the warning message.
          additionalProperties:
            type: string
          example:
            quantized_gemm: "quantized_gemm_mode (quantized GEMM path)"
        training_unsupported:
          type: object
          description: |
            Architecture name -> training method name -> the factual reason that
            method cannot be run for that architecture. Mirrors
            `TRAINING_UNSUPPORTED` in `backend/api/arch_capabilities.py`, which
            is one of the places the corresponding trainer branch refuses. An
            architecture absent from the map, or a method absent from its entry,
            is offered normally.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          example:
            minimax_h3:
              full_finetune: "MiniMax-H3's DiT is a 33 B dense transformer; its parameters, gradients and optimizer state do not fit the single-GPU 48 GB envelope this integration targets, so only LoRA training is implemented"
        video_constraints:
          type: object
          description: |
            Architecture name -> the temporal and spatial constraints of that
            VIDEO architecture, mirroring its `TemporalSpec`
            (`backend/core/models/components/wiring.py`). Non-video
            architectures are absent.

            * `frame_multiple` / `frame_offset` — valid clip lengths are
              `k * frame_multiple + frame_offset`.
            * `min_frames` / `max_frames` — the ENFORCED production generation
              bounds (`max_frames` null = unbounded; MiniMax-H3 is null as of
              the 362 decision below).
            * `trained_max_frames` — an ADVISORY top of the architecture's
              DOCUMENTED trained range, distinct from `max_frames`: a length
              past it is still accepted and generated, only warned as
              untested (never refused or clamped). null when the architecture
              has nothing narrower to document than `max_frames` already
              enforces (LTX-2.3). MiniMax-H3: 362 — ComfyUI's reference node
              states the trained range as "~124-362, longer is untested";
              nothing stops a longer clip structurally (RoPE is computed on
              the fly), so this field carries the caveat forward instead of
              enforcing it.
            * `min_decodable_frames` — a hard VAE floor that nothing overrides.
            * `fps_fixed` — the architecture's fixed frame rate, or null when
              the source rate is preserved.
            * `max_pixel_hw` — `[short_edge, long_edge]` canvas envelope
              (orientation-agnostic: the SHORTER of width/height is compared
              against the first entry and the longer against the second, so
              `[768, 1344]` admits both 1344x768 and 768x1344), or null when
              uncapped. It is NOT `[height, width]`.
            * `pixel_align` — the multiple both spatial axes round to.
            * `snap_invalid_length` — what an off-grid or out-of-range clip
              length does: `false` = the request is refused with a 400
              (LTX-2.3), `true` = it is rounded UP to the next valid length and
              a `warnings[]` entry states the rule (MiniMax-H3). The two video
              architectures differ here, and the behaviour cannot be derived
              from the fields above.
            * `suggested_frames` — valid in-range lengths a client can offer in
              a clip-length list. This is a subset of what validation accepts,
              in two ways: LTX-2.3 accepts a 1-frame clip but does not suggest
              one, and the list is capped at 16 entries for an architecture
              whose valid lengths are unbounded (LTX-2.3 stops at 129).
              A client holding a valid length that is not listed should offer it
              as well rather than dropping it.
            * `min_inference_steps` — the smallest `num_inference_steps` this
              architecture's scheduler accepts. A smaller value is refused with
              a 400 before any weights are touched. LTX-2.3: 1. MiniMax-H3: 2.
            * `steps_are_sigma_grid_points` — how `num_inference_steps` maps to
              model evaluations. `false` (LTX-2.3) = N steps run N evaluations.
              `true` (MiniMax-H3) = N counts SIGMA GRID POINTS with the terminal
              `0` included, so N steps run N-1 evaluations (a 20-step request
              performs 19), and N=1 would run none — which is where that
              architecture's `min_inference_steps` of 2 comes from.
            * `outpaint_placements` — where `POST /generate/outpaint/video` may
              place the input clip on this architecture.
              `["free"]` (LTX-2.3) = any offset; its `LTX2VideoCondition.index`
              addresses an arbitrary latent frame, so the clip can sit anywhere
              in the output timeline.
              `["extend_forward", "extend_backward", "bridge"]` (MiniMax-H3) =
              boundary placements only: MiniMax-H3 conditions on the FIRST
              and/or LAST frame of what it generates and has no
              index-addressable conditioning, so the input clip must abut the
              start of the timeline (`input_offset_frames = 0`), abut its end
              (`input_offset_frames + placed_frames = total_frames`), or, with a
              second `bridge_video` upload, sit at both ends with the generated
              span between them. Any other offset is refused with a 400 stating
              that reason; it is not approximated.
            * `latent_chunk_pattern` — the video VAE's temporal chunking, in
              pixel frames per latent frame, cycled from the start of the clip
              (MiniMax-H3: `[1, 4, 4, 4, 4]`, i.e. latent frame 0 holds pixel
              frame 0, latent frame 1 holds pixel frames 1-4, and so on). This
              is the addressable unit of `POST /generate/inpaint/video`: a
              latent frame is regenerated or preserved as a whole, so a
              requested range is expanded OUTWARD to these boundaries. A client
              offering a range control snaps to the same boundaries and shows
              the effective span, rather than implying single-frame placement.
              `[]` = the architecture declares no chunking, and temporal inpaint
              is refused on it.
          additionalProperties:
            type: object
            additionalProperties: true
          example:
            minimax_h3:
              frame_multiple: 17
              frame_offset: 5
              min_frames: 124
              max_frames: null
              trained_max_frames: 362
              min_decodable_frames: 22
              fps_fixed: 24.0
              max_pixel_hw: [768, 1344]
              pixel_align: 32
              snap_invalid_length: true
              suggested_frames: [124, 141, 158, 175, 192, 209, 226, 243, 260, 277, 294, 311, 328, 345, 362]
              min_inference_steps: 2
              steps_are_sigma_grid_points: true
              outpaint_placements: [extend_forward, extend_backward, bridge]
              latent_chunk_pattern: [1, 4, 4, 4, 4]
        chain_context:
          type: object
          description: |
            Architecture name -> what a long-form video CHAIN's continuation
            segments receive from their predecessor there. Mirrors
            `CHAIN_CONTEXT` in `backend/api/arch_capabilities.py`, which is what
            `POST /video-chain/plan` and `POST /video-chain/validate` refuse an
            unadvertised `continuation_mode` against, so a client picks a mode
            from here instead of branching on a checkpoint name. Non-video
            architectures are absent.
          additionalProperties:
            $ref: '#/components/schemas/ChainContextCapability'
          example:
            minimax_h3:
              chain_continuation_modes: [boundary_frame, pinned_tail, motion_preroll]
              chain_default_continuation_mode: boundary_frame
              chain_context_min_frames: 5
              chain_context_max_frames: 17
              chain_supports_sparse_motion_anchors: true
              chain_motion_preroll_min_frames: 2
              chain_motion_preroll_max_frames: 17
              chain_motion_preroll_min_anchors: 2
              chain_motion_preroll_max_anchors: 4
              chain_supports_reference_video: false
              chain_supports_exact_prefix: true
              variants:
                ref2va:
                  chain_continuation_modes: [boundary_frame]
                  chain_default_continuation_mode: boundary_frame
                  chain_context_min_frames: 1
                  chain_context_max_frames: 1
                  chain_supports_sparse_motion_anchors: false
                  chain_motion_preroll_min_frames: null
                  chain_motion_preroll_max_frames: null
                  chain_motion_preroll_min_anchors: null
                  chain_motion_preroll_max_anchors: null
                  chain_supports_reference_video: true
                  chain_supports_exact_prefix: true
                hybrid:
                  chain_continuation_modes: [boundary_frame]
                  chain_default_continuation_mode: boundary_frame
                  chain_context_min_frames: 1
                  chain_context_max_frames: 1
                  chain_supports_sparse_motion_anchors: false
                  chain_motion_preroll_min_frames: null
                  chain_motion_preroll_max_frames: null
                  chain_motion_preroll_min_anchors: null
                  chain_motion_preroll_max_anchors: null
                  chain_supports_reference_video: false
                  chain_supports_exact_prefix: true
        runtime_int8_archs:
          type: array
          description: |
            Architectures whose transformer the in-place weight-only INT8
            converter is wired for, i.e. the ones that honor
            `unet_quantization: "int8"`. Mirrors `RUNTIME_INT8_ARCHS` in
            `backend/core/models/common/int8_runtime_quantize.py`. Requesting
            `int8` on any other architecture is refused before conversion and
            reported through the generation's `warnings[]`.
          items:
            type: string
          example: [anima, krea2, flux2, ideogram4, ltx2, acestep, zimage]
        quantized_linear_archs:
          type: array
          description: |
            Architectures whose LOADERS swap in the weight-only quantized Linear
            classes (`Int8Linear` / `Fp8Linear`), i.e. the ones where
            `quantized_gemm_mode` selects anything. Mirrors
            `QUANTIZED_LINEAR_ARCHS` in
            `backend/core/models/common/int8_runtime_quantize.py`. A superset of
            `runtime_int8_archs` in general (an architecture can read a quantized
            checkpoint without having an in-place converter), and a STRICT
            superset of it today: `minimax_h3` ships a weight-only FP8 DiT and
            therefore owns quantized Linear layers, but has no in-place runtime
            converter because there is no unquantized transformer to convert.
          items:
            type: string
          example: [acestep, anima, flux2, ideogram4, krea2, ltx2, minimax_h3, zimage]
    ChainContextVariantCapability:
      type: object
      required:
        - chain_continuation_modes
        - chain_default_continuation_mode
        - chain_context_min_frames
        - chain_context_max_frames
        - chain_supports_sparse_motion_anchors
        - chain_motion_preroll_min_frames
        - chain_motion_preroll_max_frames
        - chain_motion_preroll_min_anchors
        - chain_motion_preroll_max_anchors
        - chain_supports_reference_video
        - chain_supports_exact_prefix
      description: |
        The long-form video chain's continuation capability for ONE
        architecture (or one loaded transformer variant of it). Design §7.1 of
        the video chain context design; served inside
        `GET /schema/arch-capabilities`'s `chain_context`.

        A chain is several `/generate/*` requests where every continuation is a
        `POST /generate/outpaint/video` `extend_forward` on the clip produced so
        far. These fields say what that continuation can be given, and are the
        authority a client plans against — never the checkpoint's file name.
      properties:
        chain_continuation_modes:
          type: array
          items:
            type: string
            enum: [boundary_frame, pinned_tail, motion_preroll, tail_reference_video, sampler_state]
          description: |
            The `continuation_mode` values this architecture/variant advertises.
            ONLY IMPLEMENTED MODES APPEAR HERE: the `continuation_mode` enum
            elsewhere in this document is the wider wire vocabulary, so that a
            Phase-B candidate can be refused by name rather than as an unknown
            string. Sending a mode that is not in this list is a 400 from
            `/video-chain/plan` and `/video-chain/validate`; it is never
            downgraded to a mode that is (design §7.7).

            `boundary_frame` — the continuation shares exactly one frame with
            the preserved prefix (the chain's shared anchor) and asks for no
            additional pinned context beyond what the architecture's own
            temporal-outpaint conditioning already provides. How much that is
            differs per architecture and is reported by
            `chain_context_min_frames`/`chain_context_max_frames`.

            `pinned_tail` — the preserved prefix's last
            `continuation_overlap_frames` frames are pinned as the continuation's
            own leading latent frames (and, with `preserve_input` audio, the
            audio latents of the same physical time). Advertised by MiniMax-H3
            `fl2va` only.

            `motion_preroll` — the same shared region, but REGENERATED with
            `continuation_anchor_count` of the predecessor's frames placed on it
            as keyframe anchors, and then discarded. Advertised by MiniMax-H3
            `fl2va` only, and mutually exclusive with `pinned_tail` (they are
            two values of one field, and the two mechanisms claim the same
            conditioning prefix). Its lengths come from the
            `chain_motion_preroll_*` fields, NOT from
            `chain_context_min/max_frames`.
          example: [boundary_frame, pinned_tail, motion_preroll]
        chain_default_continuation_mode:
          type: string
          description: |
            The mode to use when the client has no reason to choose. It is
            `VIDEO_CHAIN_DEFAULTS["continuation_mode"]` when this
            architecture advertises it, and this architecture's first
            advertised mode otherwise — so it is always a member of
            `chain_continuation_modes`.
          example: boundary_frame
        chain_context_min_frames:
          type: integer
          minimum: 1
          description: |
            The FEWEST pixel frames of the preceding segment a mode that PINS an
            overlap accepts, i.e. the bottom of the `continuation_overlap_frames`
            range. It does not describe `boundary_frame`: that mode's shared
            anchor is first-frame conditioning rather than an overlap request,
            and it takes no length at all.

            A context length is only meaningful on a video-VAE temporal group
            boundary, because a latent frame is conditioned or generated as a
            whole. The valid lengths are therefore the cumulative sums of
            `video_constraints[arch].latent_chunk_pattern`, served next to this
            block: for MiniMax-H3's `[1, 4, 4, 4, 4]` they are 1, 5, 9, 13, 17,
            18, 22, ... That pattern is the one enumerator; this schema does not
            restate the list, and a client that offers a context-length control
            derives it from the pattern the same way it derives a
            temporal-inpaint range, then keeps the lengths within
            `[chain_context_min_frames, chain_context_max_frames]`.

            MiniMax-H3 `fl2va` is `5`, which is a MEASURED floor rather than an
            alignment one: a 1-frame pin hands the model a motionless still as
            observed video and it can continue that as a static scene (the
            generated span froze outright on one seed in four, and moved
            systematically less than the boundary anchor even when it did not).
            The effect is gone at 5. A shorter pin is refused with a 400, never
            snapped up — and `boundary_frame` remains available for one frame of
            context, since the two are not equivalent conditionings.
          example: 5
        chain_context_max_frames:
          type: integer
          nullable: true
          minimum: 1
          description: |
            The MOST pixel frames of the preceding segment the advertised modes
            condition the model on, on the same VAE-group grid as
            `chain_context_min_frames`. `null` = not bounded by a number the
            client can reason about: the architecture's own conditioning decides
            and it takes whatever the preserved prefix is.

            MiniMax-H3 `fl2va` is `17`: the longest `pinned_tail` overlap this
            integration serves, one full cycle of its `[1, 4, 4, 4, 4]` chunk
            pattern and the top of the 5/17 comparison the mode was built for
            — a longer pin is refused rather than accepted untested. Its
            `ref2va` and `hybrid` variants are both `1` (boundary anchor only:
            on `ref2va` because references claim the same conditioning prefix a
            pin would, on `hybrid` because nothing about it is measured).
            LTX-2.3 is `null`:
            its continuation places the whole accumulated clip as one video
            condition, so the context grows with the chain and cannot be made
            smaller.
          example: 17
        chain_supports_sparse_motion_anchors:
          type: boolean
          description: |
            Whether a continuation can be given SEVERAL frames of the preceding
            segment at chosen positions inside the span it generates (design
            §7.3's motion pre-roll), as opposed to the single boundary anchor.
            True for MiniMax-H3 `fl2va`, whose temporal-outpaint continuation
            takes `continuation_mode: motion_preroll` and places the anchors
            through the same index-addressable conditioning
            `POST /generate/img2vid` uses; false elsewhere, including `ref2va`
            (its reference block already occupies the conditioning prefix the
            anchors would need). The flag says the placement EXISTS, not that it
            improves anything: the arm is unmeasured and opt-in. Distinct from
            the `keyframe_placement` feature in `unsupported`, which is about
            `POST /generate/img2vid` itself.
          example: true
        chain_motion_preroll_min_frames:
          type: integer
          nullable: true
          minimum: 1
          description: |
            The SHORTEST pre-roll `continuation_mode: motion_preroll` accepts,
            in pixel frames of the preceding segment. `null` when the
            architecture/variant does not advertise the mode.

            Separate from `chain_context_min_frames` because a pre-roll is not a
            pin: it needs no video-VAE group alignment (any integer in range is
            addressable, since an anchor names a pixel frame directly), and its
            floor is STRUCTURAL rather than measured — MiniMax-H3 `fl2va` is
            `2`, which is simply the fewest distinct frames two anchors can sit
            on. The pinned tail's measured 5-frame floor is a property of
            pinning and deliberately does not carry over.
          example: 2
        chain_motion_preroll_max_frames:
          type: integer
          nullable: true
          minimum: 1
          description: |
            The LONGEST pre-roll the mode accepts. `null` when the mode is not
            advertised. MiniMax-H3 `fl2va` is `17`: a refusal bound rather than
            a clamp, chosen to match `chain_context_max_frames` so the two
            continuation arms can be compared over the same context lengths, and
            small next to the shortest span this architecture generates (124),
            since every pre-roll frame is generated and thrown away.
          example: 17
        chain_motion_preroll_min_anchors:
          type: integer
          nullable: true
          minimum: 2
          description: |
            The FEWEST anchors `continuation_anchor_count` may name. `null` when
            the mode is not advertised. Never below 2: one anchor carries no
            direction or speed, which makes that request `boundary_frame` plus
            discarded frames.
          example: 2
        chain_motion_preroll_max_anchors:
          type: integer
          nullable: true
          minimum: 2
          description: |
            The MOST anchors `continuation_anchor_count` may name, and never
            more than the pre-roll has frames. `null` when the mode is not
            advertised. MiniMax-H3 `fl2va` is `4`: each anchor reserves
            conditioning rows carried on every denoise step, so the cost is
            linear in the count, and the model card documents at most two
            anchors — beyond that the request is already outside it, and this is
            where the refusal is drawn rather than accepting an untested count.
          example: 4
        chain_supports_reference_video:
          type: boolean
          description: |
            Whether a continuation additionally receives part of the preceding
            clip as a REFERENCE video (whole-clip content conditioning, a
            separate channel from the boundary anchor). True only for
            MiniMax-H3's `ref2va` transformer, where the preserved clip's own
            trailing frames become an automatic video reference; `fl2va` was
            never trained to read reference rows and LTX-2.3 has no reference
            channel at all. Its window length is not client-settable yet.
          example: false
        chain_supports_exact_prefix:
          type: boolean
          description: |
            Whether the frames produced by earlier segments survive the
            continuation pixel-exact. True for both video architectures, by
            different mechanisms: MiniMax-H3 does not generate the preserved
            frames at all (it generates the missing span and concatenates),
            while LTX-2.3 generates the whole timeline and pastes the input back
            frame-exact. A client can therefore treat a chain's earlier output
            as final on both.
          example: true
    ChainContextCapability:
      allOf:
        - $ref: '#/components/schemas/ChainContextVariantCapability'
        - type: object
          description: |
            One architecture's chain-context capability, plus the per-variant
            entries that differ from it.
          properties:
            variants:
              type: object
              description: |
                Loaded transformer variant -> its own capability, for the
                variants whose answer differs from the architecture-level one.
                A variant that is absent answers with the ARCHITECTURE-LEVEL
                entry — which is the widest one that architecture advertises,
                not a conservative default — so a variant that serves LESS than
                its architecture carries an entry here. MiniMax-H3 lists
                `ref2va` (which adds the automatic video reference and drops
                `pinned_tail`/`motion_preroll`) and `hybrid` (an `fl2va` base
                carrying `ref2va` AdaLN blocks, which generates on no endpoint).
                The key is the variant the backend reports for the loaded
                checkpoint, not a file name.
              additionalProperties:
                $ref: '#/components/schemas/ChainContextVariantCapability'
    Fp8ScaledMmState:
      type: object
      required: [enabled, origin, resolved_modes]
      properties:
        enabled:
          type: boolean
          description: Whether the W8A8 `torch._scaled_mm` path is currently selected.
          example: true
        origin:
          type: string
          enum: [default, env, api, generation]
          description: |
            Where the current value came from. "default" = no environment
            variable was set at import; "env" = `SUSHI_FP8_SCALED_MM` was present
            at import; "api" = a later POST to this endpoint; "generation" = a
            generation request carried an explicit `quantized_gemm_mode` and
            forced the flag for itself. "generation" is distinct from "api" so a
            manual flip can be told apart from one a queued generation made.
          example: api
        resolved_modes:
          type: object
          additionalProperties:
            type: string
            nullable: true
            enum: [rowwise_bias, rowwise, tensorwise, null]
          description: |
            Cached probe result per "<device>/<activation dtype>" key. The value
            is the `torch._scaled_mm` scaling mode this build accepted, or null
            when no variant worked (in which case those layers run the
            dequantized matmul even while `enabled` is true). Empty when no FP8
            Linear forward has reached the probe yet.
          example:
            "cuda:0/bfloat16": tensorwise
    Int8MmRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            true  = INT8 Linear layers run the W8A8 `torch._int_mm` path where the
                    probe succeeded and the shape gates allow it.
            false = INT8 Linear layers dequantize the weight and run a normal
                    matmul (the process default).
          example: true
    Int8MmState:
      type: object
      required: [enabled, origin, resolved_modes]
      properties:
        enabled:
          type: boolean
          description: Whether the W8A8 `torch._int_mm` path is currently selected.
          example: true
        origin:
          type: string
          enum: [default, env, api, generation]
          description: |
            Where the current value came from. "default" = no environment
            variable was set at import; "env" = `SUSHI_INT8_MM` was present at
            import; "api" = a later POST to this endpoint; "generation" = a
            generation request carried an explicit `quantized_gemm_mode` and
            forced the flag for itself. "generation" is distinct from "api" so a
            manual flip can be told apart from one a queued generation made.
          example: api
        resolved_modes:
          type: object
          additionalProperties:
            type: string
            nullable: true
            enum: [int_mm, null]
          description: |
            Cached probe result per device. "int_mm" means `torch._int_mm` ran
            and reproduced an int32 reference product; null means it was
            unusable, in which case those layers run the dequantized matmul even
            while `enabled` is true. Empty when no INT8 Linear forward has
            reached the probe yet.
          example:
            "cuda:0": int_mm
    TimestepSamplingConfig:
      type: object
      description: |
        Training timestep sampling distribution. Drawn once per step by the shared
        TimestepSampler. The sampler emits t in [0,1]; each model interprets the
        convention (e.g. MiniT2I uses t=1=data, flow models use t=1=noise), so the
        sign/meaning of `mean` is architecture-dependent.
      properties:
        distribution:
          type: string
          enum: [uniform, normal, logit_normal, beta, custom]
          default: uniform
          description: 'Sampling distribution. "logit_normal" = sigmoid(N(mean,std)) (FLUX/SD3 style).'
          example: logit_normal
        min_timestep:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.0
          example: 0.0
        max_timestep:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 1.0
          example: 1.0
        mean:
          type: number
          description: Mean of the underlying normal (normal / logit_normal only).
          example: -0.8
        std:
          type: number
          description: Std of the underlying normal (normal / logit_normal only).
          example: 0.8
        alpha:
          type: number
          description: Beta distribution alpha (beta only).
          example: 2.0
        beta:
          type: number
          description: Beta distribution beta (beta only).
          example: 2.0
        custom_weights:
          type: array
          items:
            type: number
          description: Per-bin weights (custom distribution only).
      example:
        distribution: logit_normal
        mean: -0.8
        std: 0.8
        min_timestep: 0.0
        max_timestep: 1.0
    GenerationParams:
      type: object
      description: |
        Fields shared by all three generation endpoints (txt2img/img2img/inpaint), which
        are all sent as multipart/form-data. Only `prompt` is required by the backend;
        every other field has a Form() default and may be omitted.
      required:
        - prompt
      properties:
        prompt:
          type: string
        negative_prompt:
          type: string
          default: ""
        sampler:
          type: string
          default: euler
          example: "euler_a"
        schedule_type:
          type: string
          default: uniform
          example: "karras"
        developer_mode:
          type: boolean
          default: false
          description: "Enables developer-only fields/behaviors in the generation pipeline."
        steps:
          type: integer
          minimum: 1
          maximum: 150
          default: 20
        cfg_scale:
          type: number
          minimum: 0
          maximum: 30
          default: 7.0
        seed:
          type: integer
          default: -1
        ancestral_seed:
          type: integer
          default: -1
        width:
          type: integer
          multipleOf: 8
          default: 1024
        height:
          type: integer
          multipleOf: 8
          default: 1024
        loras:
          type: string
          default: "[]"
          description: "JSON-encoded string (sent via multipart Form) containing an array of LoRA config objects (e.g. name/weight)."
          example: '[{"name": "my_lora", "weight": 0.8}]'
        prompt_chunking_mode:
          type: string
          enum: [a1111, sd_scripts, nobos]
          default: a1111
        max_prompt_chunks:
          type: integer
          default: 0
        controlnets:
          type: string
          default: "[]"
          description: |
            JSON-encoded string (sent via multipart Form) containing an array of
            ControlNet config objects. Each object may include: model_path (string),
            image_base64 (string), strength (number, default 1.0), start_step
            (integer, default 0), end_step (integer, default 1000), is_lllite
            (boolean, default false), is_reference_guide (boolean, default false —
            blend latent toward the reference image instead of using a ControlNet
            model), preprocessor (string), enable_preprocessor (boolean, default false).
          example: '[{"model_path": "controlnet.safetensors", "strength": 1.0}]'
        cfg_schedule_type:
          type: string
          enum: [constant, linear, cosine, exponential]
          default: constant
        cfg_schedule_min:
          type: number
          default: 1.0
        cfg_schedule_max:
          type: number
        cfg_schedule_power:
          type: number
          default: 2.0
        cfg_rescale_snr_alpha:
          type: number
          default: 0.0
        dynamic_threshold_percentile:
          type: number
          default: 0.0
        dynamic_threshold_mimic_scale:
          type: number
          default: 7.0
        nag_enable:
          type: boolean
          default: false
        nag_scale:
          type: number
          default: 5.0
        nag_tau:
          type: number
          default: 3.5
        nag_alpha:
          type: number
          default: 0.25
        nag_sigma_end:
          type: number
          default: 3.0
        nag_negative_prompt:
          type: string
          default: ""
        unet_quantization:
          type: string
          nullable: true
          enum: [none, fp8_e4m3fn, fp8_e5m2, int8]
          description: |
            U-Net/transformer quantization mode. `none`/null = full precision.

            `fp8_e4m3fn` / `fp8_e5m2` — per-call full-weight dequantization
            (SD1.5/SDXL, Z-Image, FLUX.2, Anima, Lens; on Z-Image these two
            values still take that path, and only the INT8 value described
            below takes the in-place converter). Weights are stored at
            lower precision and dequantized back to full precision per
            operation during inference, so measured generation speed is slower
            than full precision, not faster.

            `int8` — **`anima`, `krea2`, `flux2`, `ideogram4`, `ltx2`, `acestep`
            and `zimage` only**
            (the authoritative list is `runtime_int8_archs` from
            `GET /schema/arch-capabilities`). Converts the loaded
            transformer IN PLACE to the mixed weight-only int8/e4m3 layout the
            offline tool (`subapps/fp8_quantize/quantize_transformer_fp8.py
            --format int8`) writes, using the same per-layer selection rule
            (shared module `core/models/common/int8_runtime_quantize.py`). The
            conversion happens once, at the first generation after the model is
            loaded, and is ONE-WAY: the source weights are dropped, so a later
            request with a different value keeps the quantized transformer and
            returns a `runtime_quantization_persistent` warning. To get full
            precision back, load the model again with
            `POST /models/load` **`force=true`** (loading the already-loaded
            model without `force` is a no-op and undoes nothing).

            On any OTHER architecture `int8` is refused up front with
            `quantization_fallback` and the model runs at full precision.

            Refusals specific to `int8`, each returning a warning and leaving the
            transformer exactly as it was:

            * the checkpoint is already weight-only quantized —
              `quantization_superseded`;
            * the weights were already cast to FP8 by an earlier generation in
              the same session — `quantization_superseded`. Quantizing
              already-rounded weights measured 11.2x the weight error of a direct
              int8 conversion, i.e. worse than either format alone;
            * LoRAs are loaded — `quantization_fallback`. The wrappers hide the
              Linear layers, which would silently change the selection.

            If the conversion FAILS part-way (a CUDA out-of-memory is the
            realistic case) the transformer is left partially converted, which
            cannot be undone; the response carries `quantization_partial` with
            the number of layers converted. Requesting `int8` again RESUMES the
            conversion from where it stopped.

            Whether the resulting int8 layers run the integer GEMM or the
            dequantized matmul is a separate axis (`quantized_gemm_mode` /
            `POST /api/v1/system/int8-mm`).
        text_encoder_quantization:
          type: string
          nullable: true
          description: "Text encoder quantization mode. None = full precision."
        quantized_gemm_mode:
          type: string
          nullable: true
          enum: [w8a8, dequant, null]
          default: null
          description: |
            Per-generation selection of the GEMM path used by Linear layers whose
            weights are ALREADY weight-only quantized in the checkpoint. A
            different axis from `unet_quantization`: that one quantizes an
            unquantized model's weights at load time, this one selects how
            already-quantized weights are multiplied.

            Consumed only by the architectures whose loaders swap in the
            quantized Linear classes — `acestep`, `anima`, `flux2`, `ideogram4`,
            `krea2`, `ltx2`, `minimax_h3`, `zimage`
            (the `quantized_linear_archs` list of
            `GET /schema/arch-capabilities`, which is derived from the backend's
            own tuple and is the authority if this sentence ever drifts).
            One of them accepts the parameter and always resolves to `dequant`:
            `minimax_h3`'s loader pins all 300 of its FP8 Linear modules to
            the dequantized path (of the 200 quantized tensors in the file, 50
            are marked `full_precision_matrix_mult` and the other 150 carry an
            activation scale this backend does not read), and that pin
            outranks this request — a `"w8a8"` there is reported through the
            generation's `warnings[]` rather than silently ignored.
            Whether a given layer is FP8 or INT8 is
            fixed by the checkpoint, not by this parameter, so this is ONE axis
            that drives both process flags rather than two independent booleans.

            * `null` (default) — do not touch process state. Whatever
              `SUSHI_FP8_SCALED_MM` / `SUSHI_INT8_MM` or a prior
              `POST /system/fp8-scaled-mm` | `/system/int8-mm` set remains in
              force. Existing callers that never send this field are unaffected.
            * `"w8a8"` — force both W8A8 paths ON for this generation
              (`torch._scaled_mm` for FP8 layers, `torch._int_mm` for INT8).
            * `"dequant"` — force both W8A8 paths OFF for this generation; every
              quantized Linear dequantizes its weight and runs a normal matmul.

            Applied directly to the process flags before this generation's first
            forward, recorded with `origin: "generation"`. It is per-process
            state, so the forced value persists until something else changes it;
            `GET /system/fp8-scaled-mm` and `GET /system/int8-mm` report the
            current value and its origin.

            Requesting `"w8a8"` on a model with no quantized Linear layers (any
            other architecture, or a bf16 checkpoint on one of the three) is a
            NO-OP, not an error; the response's `warnings[]` reports it. The same
            channel reports a `"w8a8"` request that resolved to the dequantized
            matmul, and NAMES THE CAUSE, which is not always the hardware: the
            per-device probe may have rejected every scaling mode (a device/build
            limitation), or the architecture's loader may pin its quantized
            layers to the dequantized path for that checkpoint — `minimax_h3`
            does exactly that for all 300 of its FP8 Linear modules, so `"w8a8"`
            can never engage there and a newer GPU would not change it. The
            RESOLVED path is recorded separately in the image's `fp8_gemm`
            metadata field.

            The two paths are numerically different functions (the W8A8 path
            additionally quantizes the activation), so this is
            reproduction-affecting whenever the checkpoint has quantized layers.
            No end-to-end throughput measurement exists for either path.
          example: w8a8
        attention_type:
          type: string
          enum: [normal, native, sdpa, none, sage, flash, tq, sla]
          default: normal
          description: |
            Inference attention backend, applied to all model architectures via the
            unified dispatch (backend/core/attention/). normal=PyTorch SDPA (auto Flash
            Attention in PyTorch 2.0+), sage=SageAttention (INT8), flash=explicit Flash
            Attention 2, tq=Triton-Quantized attention (trainable, with a real backward).
            tq is effective only on conduit-routed architectures (Z-Image/Lens/MiniT2I/Anima
            and SDXL inference); it does NOT reach FLUX.2 (diffusers-native) and falls back
            to native there UNLESS attention_impl=conduit (FLUX.2 then routes through the
            conduit and tq engages at head_dim 128). tq supports head_dim of 64 or 128 only;
            other head dims (e.g. Ideogram4 head_dim=256) fall back to native. Unsupported
            combinations (e.g. head_dim outside the backend's supported set, mask present)
            fall back to native automatically.

            The enum is the FULL accepted vocabulary and is derived server-side from the
            attention registry (`core.attention.known_backends`): `native`/`sdpa`/`none`
            are alias spellings of `normal`, and `sla` is meaningful only for SLA-trained
            Z-Image models (it degrades to native elsewhere). **A value outside this list
            is rejected with HTTP 400** before the generation is opened — it used to be
            absorbed into native, succeed, and be recorded on the gallery row as if it
            had run.

            The backend that ACTUALLY ran is recorded separately as `attention_backend`
            (in the PNG metadata and the gallery row's `parameters`), observed per
            attention call by the conduit. It is absent when the loaded architecture does
            not route attention through the conduit; any downgrade is also reported
            through the generation's `warnings[]`.
          example: normal
        attention_impl:
          type: string
          enum: [conduit, diffusers]
          default: conduit
          description: |
            Which attention IMPLEMENTATION runs the kernel (orthogonal to attention_type,
            which selects the backend). conduit=route through SushiUI's unified dispatch
            (backend/core/attention/), enabling conduit-only backends such as tq on FLUX.2.
            diffusers=use diffusers' own attention registry (byte-identical legacy path,
            selectable for reversion). Currently consumed by the FLUX.2 inference path; other
            architectures are conduit-only or ignore it.
          example: conduit
        use_torch_compile:
          type: boolean
          default: false
        keep_models_hot:
          type: boolean
          default: false
          description: |
            Opt-in queue optimization (SD1.5/SDXL only in this phase). When generating
            several items back-to-back on the SAME loaded model (same checkpoint, LoRA
            set, and unet_quantization), keeps eligible components (text encoder, U-Net,
            VAE) resident on the GPU between consecutive generations instead of staging
            them to CPU and back. Bounded by a VRAM guard: falls back to normal
            staging/offload (with a warnings[] entry) when free VRAM is insufficient.
            Never keeps a component resident under block-swap streaming or CPU text
            encoding. Off by default (identical staging/offload behavior to previous
            releases).
          example: false
        vae_tiling:
          type: boolean
          default: false
          description: |
            Decode the latent through the VAE in overlapping tiles so the decode
            memory peak is bounded by the tile size, not the full image. Lets large
            images decode without OOM. Off by default (not bit-identical to a full
            decode; small images below the tile threshold are unaffected).
          example: false
        vae_tile_threshold:
          type: integer
          default: 0
          description: |
            Image size in pixels above which VAE tiling activates (also the tile
            size). 0 = auto, which uses each VAE's own default (sample_size * 1.5,
            ~1536px, for SDXL-family autoencoders; 256px for the Qwen-family ones
            used by Anima and Krea2). Below the threshold the decode runs whole;
            above it, split into threshold-sized tiles. Values are rounded down to
            a whole latent cell and floored at 2 cells. Raise it if mid-size
            images decode fine un-tiled.

            In `vae_tile_mode: context` this value is the decode-area budget —
            the size of the latent block actually pushed through the decoder —
            and the output tile is `threshold - 2 * margin`, so the decode
            memory peak matches `blend` mode at the same threshold.
          example: 0
        vae_tile_mode:
          type: string
          enum: [blend, context]
          default: blend
          description: |
            How a tiled VAE decode joins its tiles. Only has an effect when
            `vae_tiling` is true and the image exceeds `vae_tile_threshold`.

            - `blend` (default): tiles overlap by 25% of the tile size and the
              overlapping bands are cross-faded into each other.
            - `context`: each output tile is decoded together with a margin of
              real neighbouring latent cells (16 latent cells) around it, and
              that margin is cropped off after the decode. Tiles then join
              without a cross-fade. The margin is clamped at the latent edge,
              where a whole-image decode also has no neighbour.

            Measured differences at a 1536px image, one image per architecture:
            `context` has a lower decode memory peak at the same threshold
            (2.67 vs 3.35 GB on SDXL, 5.73 vs 7.28 GB on Qwen-family at
            threshold 1024), and issues more decoder calls at small thresholds
            (36 vs 16 at threshold 512). Pixel differences between the two modes
            were below 0.5/255 in mean on both families.
          example: blend
        vae_tile_global_norm:
          type: boolean
          default: false
          description: |
            Use whole-image GroupNorm statistics for a tiled VAE decode. Only has
            an effect when `vae_tiling` is true and the image exceeds
            `vae_tile_threshold`; applies to both `vae_tile_mode` values.

            A tiled decode normalises each tile with that tile's own per-group
            mean and variance, which offsets whole tiles against each other. With
            this enabled the decode runs twice: the first pass records every
            decoder GroupNorm's per-group statistics across all tiles, and the
            second pass re-decodes with the accumulated whole-image statistics.

            Measured cost and effect (SDXL autoencoder, `blend` join, 512px tile
            budget, one 1536px image): the per-tile offset falls from 1.32 to
            0.037 /255 peak-to-peak in fp32 and from 1.35 to 0.038 in fp16;
            decode wall time is 2.0x; peak decode memory is unchanged (measured
            +0.00003 GB — only per-group scalars are retained), so the tiling
            memory bound still holds.

            In bf16 the same measurement gives 1.36 to 0.18 /255 (and 2.6x-16x
            across tile sizes and join modes) rather than 35x: the statistics are
            accumulated in fp32/fp64, but the correction has to be applied
            through the normalization's own weight/bias, which the kernel
            requires in the activation dtype, and bf16 carries 8 mantissa bits.
            The result improves in every case measured; the size of the
            improvement depends on the dtype the autoencoder runs in.

            The doubling applies to EVERY VAE decode in the request, not only the
            final one. On SD1.5/SDXL that includes the in-loop decodes performed
            by `flatten_in_loop` (one per injected step, 3 by default) and by
            `vae_drift_correction`, so enabling those together with this flag
            doubles each of them as well.

            Has no effect on autoencoders whose decoder contains no GroupNorm —
            which includes the Qwen-family autoencoder used by Anima and Krea2.
            On those the second pass is skipped, so the flag costs nothing there.
          example: false
        color_flatten_strength:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: |
            Color Flatten (chroma smoothing): an RGB-guided guided filter applied
            to the decoded image's YCoCg chroma channels (luma left untouched) right
            after VAE decode. Removes low-frequency color mottling while preserving
            luminance detail. 0 = off (zero cost). All modes, all architectures.
          example: 0
        flatten_in_loop:
          type: boolean
          default: false
          description: |
            In-loop hard-flatten of the flat background (SD1.5/SDXL only). On the
            last N actual denoise steps the x0 prediction is decoded, the flat
            background region (largest connected low-gradient component touching the
            border) is detected and replaced with its dominant colour (feathered),
            re-encoded, and the correction injected back into the latents. Gated: if
            no confident flat region is found (area < flatten_in_loop_min_region) the
            step is a no-op, so textured backgrounds are protected. DiT architectures
            accept the flag and emit an unsupported_param warning. Default false =
            byte-identical loop behaviour.
          example: false
        flatten_in_loop_last_steps:
          type: integer
          minimum: 1
          maximum: 16
          default: 3
          description: |
            Number of trailing ACTUAL denoise steps to inject on (relative to the real
            step sequence the loop executes, not a fixed fraction, so it is stable
            across step counts and accelerators). Larger N = flatter background but
            more subject-detail cost (~6-7% wall-time per injection).
          example: 3
        flatten_in_loop_min_region:
          type: number
          format: float
          minimum: 0.005
          maximum: 0.5
          default: 0.02
          description: |
            Flat-region area gate as a fraction of the frame. The detected background
            region must cover at least this fraction, otherwise the injection step is
            a no-op (protects textured-background intents).
          example: 0.02
        spectrum_enable:
          type: boolean
          default: false
          description: |
            Spectrum (Adaptive Spectral Feature Forecasting, arXiv 2603.01623):
            training-free acceleration that skips U-Net forwards on selected steps by
            forecasting the output from a Chebyshev polynomial fit (ridge regression)
            over actual passes. Most effective at high step counts (>=30); little
            benefit on low-step/distilled models. Auto-disabled with prompt-editing,
            ControlNet, or DEUS (per-step conditioning changes).
          example: false
        spectrum_w:
          type: number
          default: 0.5
          description: "Mix between the spectral forecast and linear extrapolation (1.0 = spectral only; lower leans on the more stable linear extrapolation). Raise toward 1.0 for more aggressive forecasting if quality holds."
          example: 0.5
        spectrum_w_decay:
          type: number
          default: 0.0
          description: "OPT-IN (default 0 = off). Exponent of the per-step decay applied to spectrum_w: when > 0 the effective mix weight is spectrum_w * (1 - step/(steps-1))**spectrum_w_decay, so the spectral term contributes less at later (low-noise) steps. 0 disables the decay (constant spectrum_w) and reproduces the original forecaster behavior."
          example: 0.0
        spectrum_delta_cap:
          type: number
          default: 0.0
          description: "OPT-IN (default 0 = off). Multiplier K on the trajectory speed limiter: when > 0, a forecast may advance past the last real anchor by at most K times the distance implied by the recently-observed real per-step trajectory speed. Lower positive values keep forecasts closer to the observed trajectory; 0 disables the cap entirely and reproduces the original (uncapped) forecaster behavior."
          example: 0.0
        spectrum_m:
          type: integer
          default: 4
          description: "Number of Chebyshev basis functions. Larger = more detail but less stable."
          example: 4
        spectrum_lam:
          type: number
          default: 0.1
          description: "Ridge regularization strength for the coefficient fit."
          example: 0.1
        spectrum_warmup_steps:
          type: integer
          default: 3
          description: "Leading steps that always run a full forward (build the cache before forecasting)."
          example: 3
        spectrum_window_size:
          type: integer
          default: 4
          description: "Initial skip interval; subsequent intervals grow (sparser late)."
          example: 4
        spectrum_flex_window:
          type: number
          default: 0.75
          description: "Damps the actual number of skipped steps. 0 = skip the full window (most aggressive); higher = more conservative/higher quality."
          example: 0.75
        spectrum_tail:
          type: number
          default: 0.12
          description: "Fraction of the final sampling steps forced to run an actual forward (minimum 2). The low-noise tail carries fine detail, so forecasting it degrades sharpness; raise this for more detail/quality, lower it (toward 0) for more speed."
          example: 0.12
        spectrum_feature_mode:
          type: string
          enum: [output, block]
          default: output
          description: |
            Which quantity Spectrum forecasts. "output" (black-box) forecasts the final
            U-Net epsilon and skips the whole forward on skip steps -- max speedup but
            the rough output extrapolates noisily. "block" (paper-faithful, SDXL/SD
            U-Net only) forecasts the SMOOTH deep features (down_blocks[cache_branch:] +
            mid) and recomputes the shallow/up path every step -- higher quality, lower
            speedup (only the deep blocks are skipped).
          example: output
        spectrum_cache_branch:
          type: integer
          default: 1
          description: "Block mode only: down_blocks[cache_branch:] and the mid block are forecast; the shallow blocks below it stay exact. Lower = skip more (faster, less safe), higher = skip fewer deep blocks."
          example: 1
        spectrum_max_cache:
          type: integer
          default: 0
          description: "Sliding-window size for the coefficient fit (0 = unlimited; block mode defaults to 6). A finite window caps memory for the large block features and makes the fit local, stabilizing extrapolation."
          example: 0
        fbcache_enable:
          type: boolean
          default: false
          description: "First Block Cache (FBCache): dynamic per-step output caching. Mutually exclusive with Spectrum."
          example: false
        fbcache_threshold:
          type: number
          default: 0.12
          description: "Relative-L1 first-block residual threshold; higher allows more step skips (faster, more quality risk)."
          example: 0.12
        fbcache_warmup_steps:
          type: integer
          default: 1
          description: "Leading steps that always compute a full forward before caching starts."
          example: 1
        fbcache_cache_branch:
          type: integer
          default: 1
          description: "U-Net block mode indicator/reuse boundary: indicator = down[branch], reused region = down[branch+1:] + mid."
          example: 1
        use_tipo:
          type: boolean
          default: false
          description: "Enable TIPO prompt upsampling before generation."
        tipo_config:
          type: string
          default: "{}"
          description: "JSON-encoded string (sent via multipart Form) with TIPO configuration (model_name, lengths, etc.)."
          example: '{"model_name": "KBlueLeaf/TIPO-500M"}'
        preview_predicted_x0:
          type: boolean
          default: false
          description: "Show the predicted x0 (denoised estimate) instead of the current noisy latent in the live preview."
        preview_decoder:
          type: string
          enum: [matrix, taef2]
          default: matrix
          description: "Live-preview decoder used for FLUX.2-VAE models."
          example: matrix
        enable_block_swap:
          type: boolean
          default: false
          description: "Enable CPU/GPU block swap offloading for the diffusion backbone."
        blocks_to_swap:
          type: integer
          default: 20
          description: "Number of transformer/U-Net blocks to offload to CPU when block swap is enabled."
          example: 20
        use_pinned_memory:
          type: boolean
          default: false
          description: "Use pinned (page-locked) host memory for block swap transfers."
        block_swap_h2d_only:
          type: boolean
          default: false
          description: "H2D-only swap mode: weights are copied host-to-device but not evicted device-to-host again."
        block_swap_ring_size:
          type: integer
          default: 2
          description: "Number of GPU weight-buffer ring slots for block swap (>=1; 2 double-buffers)."
          example: 2
        original_size_w:
          type: integer
          default: 0
          description: "SDXL micro-conditioning override: explicit original width for time_ids. 0 = auto."
        original_size_h:
          type: integer
          default: 0
          description: "SDXL micro-conditioning override: explicit original height for time_ids. 0 = auto."
        original_size_scale:
          type: number
          default: 1.0
          description: "SDXL micro-conditioning: when original_size_w/h are 0, original_size = output size * this scale."
        vision_encoder_path:
          type: string
          nullable: true
          description: "Path to SigLIP2 vision encoder safetensors file. When set, reference images are encoded via SigLIP2 and concatenated to text embeddings."
          example: "models/siglip2_base_vision_encoder.safetensors"
        vae_path:
          type: string
          nullable: true
          description: |
            Per-generation VAE override. Path to a standalone VAE (diffusers vae/
            dir or a model dir) whose VAE replaces the loaded model's VAE for this
            generation. Validated for compatibility (latent_channels, latent_ndim,
            VAE class family, scale factor) against the loaded model; a HARD
            mismatch returns 400. Supported on every image architecture except
            ltx2 and minit2i (accepted-but-ignored with a warning there). None uses
            the loaded model's own VAE.
          example: "models/vae/sdxl"
        text_encoder_path:
          type: string
          nullable: true
          description: |
            Per-generation text-encoder override (SD1.5/SDXL only). Path to a
            standalone text encoder. On other architectures it is
            accepted-but-ignored with a warning. None uses the loaded model's own
            text encoder.
          example: "models/text_encoders/clip-vit-large"
        pid_sr_output:
          type: string
          enum: ["4x", "original"]
          default: "4x"
          description: |
            Only consulted when vae_path points at a PiD (Pixel Diffusion
            Decoder) checkpoint (SDXL only); ignored otherwise. "4x" returns
            PiD's native super-resolution output (latent_h/w * 8 * 4). PiD's
            4x super-resolution factor is fixed by the checkpoint, so
            "original" still runs the full 4x decode and downscales the result
            back to the model's native resolution (latent_h/w * 8) afterward —
            NOT a cheaper decode path.
          example: "4x"
        pid_use_gemma:
          type: boolean
          default: false
          description: |
            Only consulted when vae_path points at a PiD decoder checkpoint;
            ignored otherwise. False (default) uses a precomputed null-caption
            embedding (no runtime text encoder needed). True loads
            Efficient-Large-Model/gemma-2-2b-it (the ungated mirror PiD was
            trained against) once for this generation and encodes the actual
            prompt for sharper output; on any resolution/load/encode failure
            it falls back to the null-caption embedding with a warning.
          example: false
        pid_low_vram:
          type: boolean
          default: false
          description: |
            Only consulted when vae_path points at a PiD decoder checkpoint;
            ignored otherwise. False (default) runs the decoder's PiTBlock
            and FinalLayer forward passes exactly as originally implemented
            (bit-identical output). True opts into a row-chunked activation
            path that reduces the decoder's per-block VRAM peak at large
            output resolutions (e.g. 4096px) at the cost of small bf16
            floating-point rounding differences from the default path (the
            underlying computation is mathematically row-independent and
            bit-identical in fp32; bf16's lower precision amplifies ordinary
            GEMM-tiling rounding noise through the decoder's iterative
            sampler).
          example: false
        pid_tile_native:
          type: integer
          default: 512
          description: |
            Only consulted when vae_path points at a PiD decoder checkpoint
            and the requested output's native resolution (latent_h/w * 8)
            exceeds the checkpoint's in-distribution ceiling; ignored
            otherwise. Every tile's OWN native resolution (tile_lat * 8) is
            capped at this value so each tile individually stays
            in-distribution for PiD (clamped down with a warning if set above
            the checkpoint's native ceiling). Used only by the default tiled
            large-output decode; has no effect when pid_fast_large_decode is
            true.
          example: 512
        pid_tile_overlap_ratio:
          type: number
          default: 0.25
          description: |
            Only consulted together with pid_tile_native (same gating).
            Feather-blend overlap between adjacent tiles, as a fraction of
            the tile size (in latent space, before scaling to pixel space
            for the blend). 0.25 was confirmed seam-free on both busy and
            smooth backgrounds.
          example: 0.25
        pid_fast_large_decode:
          type: boolean
          default: false
          description: |
            Only consulted when vae_path points at a PiD decoder checkpoint
            and the requested output's native resolution exceeds the
            checkpoint's in-distribution ceiling; ignored otherwise. False
            (default) decodes the large output in overlapping in-distribution
            tiles and feather-blends them back into the full requested output
            size (true super-resolution detail, ~6x more decode passes). True
            opts out to the original single-pass whole-latent downscale
            -then-decode-then-upscale path (fewer decode passes, less detail
            at large output sizes).
          example: false
        ref_images:
          type: array
          items:
            type: string
            format: binary
          description: "Reference images for FLUX.2 Image Edit or SigLIP2 vision encoder conditioning (multipart upload)"
        loop_decode:
          type: string
          enum: [full, cheap, none]
          default: full
          description: |
            Loop-generation decode mode (SD1.5/SDXL only in this phase; other
            architectures accept the field but always behave as "full").
            `full` decodes with the active VAE (the PiD decoder if a PiD VAE
            override is applied) and saves + galleries as usual. `cheap`
            decodes with the real SDXL VAE embedded in a PiD override instead
            of running the PiD student net (identical to `full` when no PiD
            override is active); still saves + galleries. `none` skips
            decode/save/gallery entirely -- the final latent is cached
            server-side and a `latent_id` is returned instead of an `image`,
            for the next loop step's `input_latent_id` (no VAE round-trip).
          example: "full"
        skip_gallery:
          type: boolean
          default: false
          description: |
            Orthogonal to loop_decode. When true, the generated image is still
            saved to disk (so a client-driven generation loop can chain to the
            next step via the file path) but the gallery database record
            (thumbnail + DB row) is skipped. Meaningless combined with
            loop_decode="none" (nothing is decoded/saved there either way).

    Txt2ImgRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          properties:
            batch_size:
              type: integer
              default: 1
              description: "Number of images to generate in this request."
            controlnet_images:
              type: array
              items:
                type: string
                format: binary
              description: "Optional ControlNet images for direct upload (alternative to base64)"

    Txt2VidRequest:
      type: object
      description: |
        Every field is optional apart from `prompt`. An OMITTED field is filled
        from the loaded architecture's resolved video defaults
        (`video_arch_overlays` of `GET /schema/generation-defaults` merged over
        the base `txt2vid` defaults), so the `default` values declared below —
        which are the LTX-2.3-shaped base — are what an omitted field resolves
        to only when no arch overlay applies.
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: "Text prompt describing the video."
          example: "A cat playing a piano on a stage, warm stage lighting"
        negative_prompt:
          type: string
          default: ""
          description: >-
            Content to steer away from. Applied only when guidance_scale > 1.
            Ignored on MiniMax-H3 (guidance is distilled into the weights, so
            there is no unconditional branch); a warning is emitted when it is
            set to a non-default value.
          example: "worst quality, inconsistent motion, blurry, jittery, distorted"
        width:
          type: integer
          default: 768
          description: >-
            Video width in pixels. Must be divisible by 32. On MiniMax-H3
            SushiUI additionally restricts the canvas to a short edge <= 768
            and a long edge <= 1344 (SushiUI policy, not a model limit).
          example: 768
        height:
          type: integer
          default: 512
          description: >-
            Video height in pixels. Must be divisible by 32. On MiniMax-H3
            SushiUI additionally restricts the canvas to a short edge <= 768
            and a long edge <= 1344 (SushiUI policy, not a model limit).
          example: 512
        num_frames:
          type: integer
          default: 121
          description: >-
            Number of frames. LTX-2.3: must satisfy (num_frames - 1) % 8 == 0.
            MiniMax-H3: must be of the form 17 * n + 5 with n >= 1, at least
            124 with no enforced maximum (362 is the documented trained-range
            top, not a decoder limit -- a longer on-grid value is accepted
            with an untested-range warning); an off-grid or too-short value is
            snapped to the nearest valid length and reported in warnings[].
          example: 121
        frame_rate:
          type: number
          default: 24.0
          description: >-
            Output frames per second. Fixed at 24.0 on MiniMax-H3: any other
            value is forced to 24.0 with a warning.
          example: 24.0
        num_inference_steps:
          type: integer
          default: 8
          minimum: 1
          description: |
            Number of denoising steps (LTX-2.3 distilled default: 8). MiniMax-H3
            defaults to 20; MiniMax publishes no step count for this model, so
            20 is a community baseline rather than an official figure.

            The step-count semantics are architecture-specific, and both are
            served per architecture in the `video_constraints` block of
            `GET /schema/arch-capabilities` (`min_inference_steps`,
            `steps_are_sigma_grid_points`):

            * LTX-2.3 — N steps run N model evaluations; the minimum is 1.
            * MiniMax-H3 — N counts SIGMA GRID POINTS of a `linspace(1, 0, N)`
              schedule with the terminal `0` included, and the timesteps are
              `1 - sigmas[:-1]`, so N steps run **N-1** model evaluations (a
              20-step request performs 19). N=1 would run none, so the minimum
              is 2; a smaller value is refused with a 400 before the text
              encoder runs.
          example: 8
        guidance_scale:
          type: number
          default: 1.0
          description: >-
            Classifier-free guidance scale. 1.0 disables CFG (distilled
            default). Ignored on MiniMax-H3 (its sampler takes no guidance
            scale); a warning is emitted when it is set to a non-default value.
          example: 1.0
        seed:
          type: integer
          default: -1
          description: "Random seed. -1 draws a random seed (returned in actual_seed)."
          example: -1
        num_videos_per_prompt:
          type: integer
          default: 1
          description: "Number of videos generated per prompt."
          example: 1
        max_sequence_length:
          type: integer
          default: 1024
          description: "Maximum prompt token length for the Gemma-3 text encoder."
          example: 1024
        audio_enable:
          type: boolean
          default: true
          description: "When true, mux the generated audio track into the mp4."
          example: true
        controlnets:
          type: array
          nullable: true
          description: |
            Optional array of ControlNet / reference-guide / style-transfer config
            objects (same shape as the image endpoints' controlnets). Training-free
            STYLE TRANSFER rides here as an entry with is_style_transfer: true carrying
            the style reference image (image_base64) plus Style Strength (strength),
            style_adain_strength and style_blocks; LTX-2.3 extracts it and injects the
            reference's video-token self-attention K/V so every frame attends the same
            still reference (temporally consistent). Mutually exclusive with FBCache /
            Spectrum / Block Swap (style takes precedence, those are disabled with a
            logged reason). Other entry types are accepted for shape parity.
          items:
            type: object
          example: []
        blocks_to_swap:
          type: integer
          default: 0
          description: "Number of LTX-2.3 transformer blocks kept CPU-resident and streamed to GPU during the denoise loop. 0 disables block swap (transformer stays fully GPU-resident via the stock model-offload path)."
          example: 0
        fuse_output_proj:
          type: boolean
          default: false
          description: |
            MiniMax-H3 only. Fuses the output-tail projection heads (proj_out,
            audio_proj_out) into the sequence-chunked output-norm loop instead of
            materializing the full (1, S, hidden_size) intermediate first. Not
            bit-exact with the default path: fusing changes the output-projection
            GEMM's row count per call, and cuBLAS's tiling/reduction order depends
            on it. Measured against the unfused path on the production checkpoint
            (same loaded weights, same in-process hidden_states): max abs
            deviation 1.5e-4 (video head) / 6.2e-5 (audio head) against output
            magnitudes with mean ~1.1; scale-relative (max abs / max magnitude)
            4.6e-6 / 3.7e-6, roughly 30-40x fp32 machine epsilon. Off by default
            for that reason. Accepted and ignored (with a warning) on LTX-2.3.
          example: false
        fbcache_enable:
          type: boolean
          default: false
          description: "First-Block-Cache: per-step reuse of the previous transformer output when the first-block residual changes little between steps. Mutually exclusive with Block Swap (blocks_to_swap > 0 disables it, with a logged reason)."
          example: false
        fbcache_threshold:
          type: number
          default: 0.12
          description: "Relative-L1 change threshold on the first-block residual used to decide cache reuse. Higher values reuse more often; lower values reuse less often."
          example: 0.12
        fbcache_warmup_steps:
          type: integer
          default: 1
          description: "Number of initial denoising steps that always run the full transformer (no cache reuse), before fbcache_enable takes effect."
          example: 1
        spectrum_enable:
          type: boolean
          default: false
          description: |
            Spectrum (Adaptive Spectral Feature Forecasting): skips the joint
            (video, audio) transformer forward on selected denoising steps by
            forecasting the output from a Chebyshev polynomial fit (ridge
            regression) over actual passes. Hosted in the LTX-2.3 block-loop
            wrapper (forecast at the pre-CFG batched-input stage). Mutually
            exclusive with fbcache_enable (Spectrum takes precedence, disabling
            FBCache with a logged reason) and with Block Swap (blocks_to_swap > 0
            disables Spectrum, with a logged reason).
          example: false
        spectrum_w:
          type: number
          default: 0.5
          description: "Mix between the spectral forecast and linear extrapolation (1.0 = spectral only; lower leans on the more stable linear extrapolation)."
          example: 0.5
        spectrum_w_decay:
          type: number
          default: 0.0
          description: "OPT-IN (default 0 = off). Exponent of the per-step decay applied to spectrum_w; 0 disables the decay (constant spectrum_w)."
          example: 0.0
        spectrum_delta_cap:
          type: number
          default: 0.0
          description: "OPT-IN (default 0 = off). Multiplier K on the trajectory speed limiter bounding how far a forecast may advance past the last real anchor; 0 disables the cap."
          example: 0.0
        spectrum_m:
          type: integer
          default: 4
          description: "Number of Chebyshev basis functions. Larger = more detail but less stable."
          example: 4
        spectrum_lam:
          type: number
          default: 0.1
          description: "Ridge regularization strength for the coefficient fit."
          example: 0.1
        spectrum_warmup_steps:
          type: integer
          default: 3
          description: "Leading steps that always run a full forward (build the cache before forecasting)."
          example: 3
        spectrum_window_size:
          type: integer
          default: 4
          description: "Initial skip interval; subsequent intervals grow (sparser late)."
          example: 4
        spectrum_flex_window:
          type: number
          default: 0.75
          description: "Damps the actual number of skipped steps. 0 = skip the full window (most aggressive); higher = more conservative."
          example: 0.75
        spectrum_tail:
          type: number
          default: 0.12
          description: "Fraction of the final sampling steps forced to run an actual forward (minimum 2)."
          example: 0.12
        spectrum_max_cache:
          type: integer
          default: 0
          description: "Sliding-window size for the coefficient fit (0 = unlimited). Each of the two forecasters (video, audio) caches up to this many anchor tensors."
          example: 0
        vae_path:
          type: string
          nullable: true
          description: "Per-generation VAE override. Unsupported on the LTX-2.3 video model: accepted-but-ignored with a warning."
        text_encoder_path:
          type: string
          nullable: true
          description: "Per-generation text-encoder override. Unsupported on the LTX-2.3 video model: accepted-but-ignored with a warning."
        unet_quantization:
          type: string
          nullable: true
          enum: [none, fp8_e4m3fn, fp8_e5m2, int8]
          default: null
          description: |
            Transformer quantization mode for the video DiT. Only `int8` is
            applied on LTX-2.3: it converts `LTX2VideoTransformer3DModel` IN
            PLACE to the mixed weight-only int8/e4m3 layout, once, at the first
            generation after the model is loaded, and is ONE-WAY (reload the
            model with `force=true` to get full precision back). 1360 of the
            DiT's 1660 Linear layers are selected; the 300 skipped ones are
            below the runtime min-work gate and hold 0.19% of its Linear
            parameters.

            SCOPE: the video DiT only. The bundled Gemma-3 text encoder and the
            text connectors are separate components and are never quantized by
            this parameter; `text_encoder_quantization` is separately
            unsupported on this architecture.

            The FP8 values are accepted-but-ignored with an `unsupported_param`
            warning on LTX-2.3. Requesting `int8` while a block-swap generation
            has an offloader attached is refused with an error rather than
            silently producing a model whose offloader streams pre-conversion
            weights, so request it before enabling `blocks_to_swap`.
          example: int8
        quantized_gemm_mode:
          type: string
          nullable: true
          enum: [w8a8, dequant, null]
          default: null
          description: |
            Per-generation selection of the GEMM path used by Linear layers whose
            weights are ALREADY weight-only quantized; identical semantics and
            identical three values to `GenerationParams.quantized_gemm_mode`, and
            it selects a real path here because `ltx2` is one of the
            `quantized_linear_archs` of `GET /schema/arch-capabilities` (the
            LTX-2.3 loader swaps in `Int8Linear`/`Fp8Linear` for a weight-only
            quantized `transformer/` component, and `unet_quantization: "int8"`
            produces the same classes at runtime).

            A different axis from `unet_quantization`: that one quantizes an
            unquantized DiT's weights, this one selects how already-quantized
            weights are multiplied. The resolved path is recorded in the video's
            sidecar metadata as `fp8_gemm`, and an explicit `"w8a8"` that
            degraded to the dequantized matmul is reported through the
            generation's `warnings[]` together with the cause — a device/build
            limitation (the probe rejected every scaling mode) and an
            architecture-policy pin are different things, and `minimax_h3` is
            always the latter: its loader pins all 300 FP8 Linear modules to the
            dequantized path for the released checkpoint.
          example: w8a8
        attention_type:
          type: string
          enum: [normal, native, sdpa, none, flash, sage, tq, sla]
          default: normal
          description: |
            Attention backend for this generation. Same vocabulary and same
            normalization as `GenerationParams.attention_type` on the image
            routes — one resolver (`core.attention.normalize_backend`) for every
            architecture — and omitting the field falls back to the process-wide
            setting rather than to a route-local literal.

            **Honored by `minimax_h3`**, whose vendored transformer routes its
            attention through SushiUI's unified conduit. Its attention is
            unmasked full self-attention over one packed document with
            `head_dim = 128` and equal q/kv head counts, so neither `sage` nor
            `flash` is downgraded by a capability guard; `tq` is available on the
            same conduit. **Ignored by `ltx2`**, which drives diffusers' own
            attention dispatch — accepted with a capability warning like every
            other per-architecture parameter on these routes.

            A backend the conduit cannot satisfy for a given call is downgraded
            to `native` with the reason reported through the generation's
            `warnings[]`; no such downgrade can fail a generation. A value
            OUTSIDE the enum is a different matter and answers **HTTP 400**
            before the run is opened: the enum is derived from the attention
            registry (`core.attention.known_backends`), and an unknown backend
            used to be absorbed into native with the only trace a console line
            deduped once per process.

            The backend that ACTUALLY ran is recorded on the gallery row as
            `attention_backend` (observed per attention call by the conduit);
            it is absent for `ltx2`, which never reaches the conduit.
          example: sage
        loras:
          type: array
          default: []
          description: |
            Optional LoRA(s) to apply for this generation. Applied by
            `minimax_h3` (`core.models.minimax_h3.minimax_h3_lora`, forward-time
            addition layers, never merged into weights, restored after
            generation unless the next request reuses them). `ltx2` has no
            LoRA loader on its video generation path at all: the field is
            accepted-but-ignored with an `unsupported_param` warning when
            non-empty, same contract as every other per-architecture video
            parameter on these routes.
          items:
            type: object
            properties:
              path:
                type: string
                description: "LoRA .safetensors filename (relative to the LoRA directory or an additional configured directory)."
              strength:
                type: number
                default: 1.0
                description: "LoRA strength multiplier."
          example: []
        chain_id:
          type: string
          nullable: true
          default: null
          description: |
            Video chain provenance. Identifies the chain this generation is the
            FIRST segment of — a long clip produced as several requests, planned
            once by `POST /video-chain/plan` (`VideoChainManifest.chain_id`).
            Every later segment of the same chain sends the identical value to
            `POST /generate/outpaint/video`.

            `chain_id`, `chain_plan_hash` and `chain_segment_index` are sent
            TOGETHER or not at all; sending some of them is a 400, so a gallery
            row never names a chain it cannot be traced back to. Omitting all of
            them (the default) is an ordinary, unchained generation.

            The chain's root prompt and canonical timeline are deliberately NOT
            request fields: they live once in the manifest, and
            `chain_plan_hash` / `chain_root_prompt_hash` reference them instead
            of being copied onto every segment's gallery row.
          example: "3f1c2b9e-3c8a-4f0a-9a1c-2b7d5f0e4a11"
        chain_manifest_version:
          type: integer
          nullable: true
          minimum: 1
          default: null
          description: "Manifest schema version this segment was planned under (`VideoChainManifest.manifest_version`)."
          example: 1
        chain_plan_hash:
          type: string
          nullable: true
          default: null
          description: >-
            sha256 hex digest of the plan this segment was compiled from
            (`VideoChainManifest.plan_hash`). Must be 64 hex characters.
          example: "9f2c0b1d5e4a3c8b7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c"
        chain_segment_index:
          type: integer
          nullable: true
          minimum: 0
          default: null
          description: >-
            Which segment of the plan this request is, 0-based. 0 is the
            segment a chain starts with (this endpoint); every later index
            arrives on `/generate/outpaint/video`. Must be less than
            `chain_segment_count` when that is also sent.
          example: 0
        chain_segment_count:
          type: integer
          nullable: true
          minimum: 1
          default: null
          description: "How many segments the plan has."
          example: 4
        chain_global_frame_start:
          type: integer
          nullable: true
          minimum: 0
          default: null
          description: >-
            Start of this segment's half-open `[start, end)` span on the
            chain's global frame timeline (`VideoChainSegment.owned_start_frame`).
          example: 0
        chain_global_frame_end:
          type: integer
          nullable: true
          minimum: 0
          default: null
          description: >-
            End (exclusive) of that span (`VideoChainSegment.owned_end_frame`).
            Must be greater than `chain_global_frame_start`.
          example: 362
        chain_context_mode:
          type: string
          nullable: true
          enum: [timeline, manual, legacy_repeat, null]
          default: null
          description: >-
            How the segment prompts were produced
            (`VideoChainManifest.context_mode`), recorded so a row states which
            planning mode wrote its prompt.
          example: timeline
        chain_root_prompt_hash:
          type: string
          nullable: true
          default: null
          description: >-
            sha256 hex digest of the chain's root prompt
            (`VideoChainManifest.root_prompt_hash`), 64 hex characters. The
            prompt itself stays in the manifest.
          example: "1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c"

    Img2VidRequest:
      allOf:
        - $ref: '#/components/schemas/Txt2VidRequest'
        - type: object
          description: |
            The txt2vid parameter set plus the media this endpoint conditions
            on: keyframe images and/or an `input_audio` track. At least one of
            them is required — `image` alone, `input_audio` alone, or both. A
            request with neither belongs on `/generate/txt2vid`.

            `image` is required on LTX-2.3, whose image-to-video pipeline has
            no other conditioning input.
          properties:
            image:
              type: string
              format: binary
              description: >-
                Keyframe image (multipart file upload), placed at
                `input_image_frame_index` (the first frame by default) and
                resized to (width, height) before conditioning. OPTIONAL on
                MiniMax-H3 when `input_audio` is sent — a pinned audio track
                conditions the clip on its own — and required otherwise.
            last_frame_image:
              type: string
              format: binary
              nullable: true
              description: >-
                OPTIONAL last-frame keyframe image (multipart file upload),
                MiniMax-H3 only. Equivalent to a `keyframe_images` entry with
                `keyframe_frame_indices` `-1`: the file is folded into the
                keyframe list and anchors the last frame of the clip. Sending
                it together with another anchor that also resolves to the last
                frame is a duplicate-index 400. Resized to (width, height) like
                `image`. Omitted (the default) means no end anchor. Ignored on
                LTX-2.3, which conditions on the first frame only — sending it
                there returns an `unsupported_param` entry in `warnings[]`.
            input_image_frame_index:
              type: integer
              default: 0
              description: >-
                Which PIXEL frame of the generated clip the uploaded `image`
                anchors (MiniMax-H3 only). `0` (the default) is the first
                frame; `-1` is the last frame of the clip AFTER `num_frames`
                has been snapped to the `17n + 5` grid, which is why the
                sentinel exists — a client cannot compute the last index
                itself. Any other value addresses that exact frame; there is no
                grid to snap an anchor to, since every pixel frame has an exact
                rotary coordinate. Out of range, or colliding with another
                anchor, is a 400 stating the resolved clip length. Ignored on
                LTX-2.3 (`unsupported_param` warning), whose image-to-video
                pipeline pins the uploaded image as frame 0.
              example: 0
            keyframe_images:
              type: array
              items:
                type: string
                format: binary
              description: >-
                ADDITIONAL conditioning anchors (multipart file uploads),
                MiniMax-H3 only, each placed at the positionally matching
                `keyframe_frame_indices` entry. The two lists must be the same
                length (a 400 otherwise). Anchors are packed in ascending frame
                order regardless of upload order, so the order of this list is
                not semantic — unlike `/generate/ref2vid`'s reference lists.
                Each anchor costs one frame's worth of conditioning rows in the
                packed sequence. Ignored on LTX-2.3
                (`unsupported_param` warning).
            keyframe_frame_indices:
              type: array
              items:
                type: integer
              description: >-
                Placement of each `keyframe_images` entry, in the same order.
                Same semantics as `input_image_frame_index`: `0` is the first
                frame, `-1` the resolved last frame, and any other value that
                exact pixel frame. One integer per uploaded keyframe.
              example: [60]
            input_audio:
              type: string
              format: binary
              nullable: true
              description: >-
                OPTIONAL audio track (multipart file upload) that the video is
                generated against, MiniMax-H3 only. The track is decoded,
                resampled to 32 kHz stereo (a mono file is duplicated to both
                channels), encoded by the audio VAE and packed as the clip's
                own audio rows, held at t = 1.0 for every step — i.e. supplied
                at their true value and never denoised, the same mechanism a
                `/generate/ref2vid` reference soundtrack uses, at the generated
                clip's own rotary positions.

                The track conditions the ENTIRE clip; partial-timeline
                placement is not supported. A track shorter than the clip is a
                400 naming the required duration; a longer one is trimmed to
                the clip, head-aligned.

                The output carries the SOURCE waveform: the uploaded samples
                are handed to the muxer unchanged, sample for sample, and not a
                decode of the pinned latents (those rows are never written, so
                decoding them would only round-trip the input through the VAE).
                The mp4's audio track is AAC-encoded like every other video this
                API writes, so the FILE is a lossy encoding of those samples
                rather than a bit copy of them. With `audio_enable` false the
                rows still condition the video and nothing is muxed.

                Sending this field emits one
                `minimax_h3_undocumented_conditioning` entry in `warnings[]`:
                MiniMax's model card documents `fl2va` for image keyframes, and
                audio conditioning is the same pinning mechanism applied to the
                audio rows. Ignored on LTX-2.3 (`unsupported_param` warning).

    Ref2VidRequest:
      allOf:
        - $ref: '#/components/schemas/Txt2VidRequest'
        - type: object
          description: |
            The txt2vid parameter set plus the `ref2va` reference uploads. At
            least one image or video reference is required; audio references
            cannot stand alone. Every list is read in UPLOAD ORDER, and the
            packed order is images, then videos (each preceded by its own
            soundtrack), then standalone audio.

            `controlnets` is inherited from `Txt2VidRequest` but is not read by
            this endpoint: its only video use is LTX-2.3 style transfer, and
            this endpoint serves MiniMax-H3 alone.
          properties:
            reference_images:
              type: array
              maxItems: 9
              items:
                type: string
                format: binary
              description: >-
                Subject / style / scene reference images (multipart file
                uploads), at most 9. Each is encoded at a short edge of its own
                (see `reference_image_size`) and never binds the generated
                geometry. Referred to in the prompt as `<Picture i>`, numbered
                from 1 in upload order.
            reference_videos:
              type: array
              maxItems: 3
              items:
                type: string
                format: binary
              description: >-
                Motion / camera reference clips (multipart file uploads), at
                most 3. Each is resampled to 24 fps, truncated to the generated
                duration, and put on the canvas its own aspect ratio resolves
                to; it must run at least 22 frames after that. The clip's own
                embedded soundtrack is NOT read — send it explicitly as the
                positionally matching `reference_video_audios` entry. Referred
                to in the prompt as `<Video k>`.
            reference_video_audios:
              type: array
              maxItems: 3
              items:
                type: string
                format: binary
              description: >-
                Soundtrack of the same-position `reference_videos` entry
                (multipart file uploads), at most 3. Entry `n` belongs to
                reference video `n`; sending more of these than videos is a 400.
                A video reference's soundtrack packs immediately BEFORE its
                video rows and shares their rotary origin, and is labelled
                `<Audio j>` ahead of that video's `<Video k>`. Send an empty
                part to skip a video's soundtrack while supplying a later one.
            reference_audios:
              type: array
              maxItems: 3
              items:
                type: string
                format: binary
              description: >-
                Standalone voice / music references (multipart file uploads), at
                most 3, packed after every image and video reference. They never
                reach the conditioner (only the audio VAE), so a request built
                from audio references alone is a 400. Referred to in the prompt
                as `<Audio j>`, numbered across soundtracks and standalone
                clips alike in packed order.
            reference_image_size:
              type: string
              enum: [max, match]
              default: max
              description: >-
                How an IMAGE reference is sized before encoding. `max` is the
                released recipe — each image on a short edge of its own, 2048
                for the released checkpoint, upscaling included and with no area
                cap. `match` scales it down (never up) to the generation's pixel
                area, which produces fewer reference rows and therefore a
                shorter packed sequence, since reference rows ride through every
                sampling step. Video references are unaffected: they always
                follow the canvas rule the generated video follows.
              example: max
            keyframe_images:
              type: array
              items:
                type: string
                format: binary
              description: >-
                OPTIONAL keyframe anchors (multipart file uploads), placed on
                the generated canvas AFTER every reference block. Same
                positional-pair convention as `Img2VidRequest`'s field of the
                same name: each entry is placed at the matching
                `keyframe_frame_indices` entry, the two lists must be the same
                length, and anchors are packed in ascending frame order. Always
                beyond MiniMax's model card when combined with references
                (`warnings[]`, code `minimax_h3_undocumented_conditioning`).
            keyframe_frame_indices:
              type: array
              items:
                type: integer
              description: >-
                Placement of each `keyframe_images` entry, in the same order.
                Same semantics as `Img2VidRequest.keyframe_frame_indices`: `0`
                is the first frame, `-1` the resolved last frame, and any other
                value that exact pixel frame.
              example: [60]

    OutpaintVideoRequest:
      type: object
      required:
        - prompt
        - video
      description: |
        Distinct from `Txt2VidRequest`/`Img2VidRequest`: uses `total_frames`
        (not `num_frames`) for the output timeline length, and does not
        accept `controlnets` (no style-transfer wiring for video outpaint in
        this phase). All other video-generation knobs (block swap /
        FBCache / Spectrum / per-generation component overrides) are the
        same as `Txt2VidRequest`.
      properties:
        prompt:
          type: string
          description: "Text prompt describing the generated (non-preserved) portion of the video."
          example: "A cat playing a piano on a stage, warm stage lighting"
        negative_prompt:
          type: string
          default: ""
          description: "Content to steer away from. Applied only when guidance_scale > 1."
        video:
          type: string
          format: binary
          description: "Input video clip to place inside the output timeline (any ffmpeg-demuxable container). In a MiniMax-H3 bridge this is the HEAD clip, the one the generated span continues FROM."
        bridge_video:
          type: string
          format: binary
          description: |
            OPTIONAL second clip, preserved at the END of the output timeline,
            turning the request into a BRIDGE: `video` is preserved at the head,
            this clip at the tail, and the span between them is generated from
            the head clip's last frame and this clip's first frame.

            Only accepted on an architecture whose
            `video_constraints[arch].outpaint_placements` contains `bridge`
            (MiniMax-H3). Sending it with an LTX-2.3 model loaded is a 400: that
            architecture places one arbitrary-offset condition and has no
            two-clip bridge path here. Requires `input_offset_frames = 0`.
        width:
          type: integer
          multipleOf: 32
          default: 768
          description: "Output video width in pixels. Must be divisible by 32. The uploaded clip is center-cropped + resized to this resolution (see the endpoint's ÷32 preprocessing note)."
          example: 768
        height:
          type: integer
          multipleOf: 32
          default: 512
          description: "Output video height in pixels. Must be divisible by 32."
          example: 512
        total_frames:
          type: integer
          default: 121
          description: |
            Total number of frames in the OUTPUT timeline.

            LTX-2.3: must satisfy (total_frames - 1) % 8 == 0; the value is
            exact. MiniMax-H3: a REQUESTED length. The generated span (this
            value minus the preserved clip length(s), plus the shared anchor
            frame(s)) is what has to land on that architecture's 17n+5 grid,
            at least 124 with no enforced maximum (a span past the documented
            362 trained-range top is accepted with an untested-range
            warning), so it is rounded UP to the grid and the effective
            output length is reported in `warnings[]`. The MiniMax-H3 default
            resolves to 248 through
            `outpaint_video_arch_overlays` of GET /schema/generation-defaults.
          example: 121
        frame_rate:
          type: number
          default: 24.0
          description: "Output frames per second."
          example: 24.0
        num_inference_steps:
          type: integer
          default: 8
          description: "Number of denoising steps (distilled default: 8)."
          example: 8
        guidance_scale:
          type: number
          default: 1.0
          description: "Classifier-free guidance scale. 1.0 disables CFG (distilled default)."
          example: 1.0
        seed:
          type: integer
          default: -1
          description: "Random seed. -1 draws a random seed (returned in actual_seed)."
          example: -1
        num_videos_per_prompt:
          type: integer
          default: 1
          example: 1
        max_sequence_length:
          type: integer
          default: 1024
          description: "Maximum prompt token length for the Gemma-3 text encoder."
          example: 1024
        audio_enable:
          type: boolean
          default: true
          description: "When true, mux an audio track into the mp4 (see outpaint_video_audio_mode for its source)."
          example: true
        input_offset_frames:
          type: integer
          default: 0
          description: |
            Desired PIXEL frame offset (in the OUTPUT timeline) at which the
            (trimmed) input clip is placed.

            LTX-2.3: snapped server-side to the nearest valid latent frame
            index's pixel start ({0, 1, 9, 17, ..., 8m+1}) -- a warning is
            added to the response when the requested value is not already a
            valid pixel start.

            MiniMax-H3: it SELECTS the placement instead, and is not snapped.
            `0` is extend-forward (or, with `bridge_video`, a bridge);
            `total_frames - placed_frames` is extend-backward; anything else is
            a 400, because that architecture conditions on boundary frames only.
          example: 0
        input_trim_start_frames:
          type: integer
          default: 0
          description: "Trim this many PIXEL frames off the START of the uploaded clip (in the clip's own frames) before placement."
          example: 0
        input_trim_end_frames:
          type: integer
          default: 0
          description: "Trim this many PIXEL frames off the END of the uploaded clip before placement."
          example: 0
        outpaint_video_audio_mode:
          type: string
          enum: [regenerate, preserve_input]
          default: regenerate
          description: |
            "regenerate": use the model's own generated audio as-is (the input
            clip's own audio is NOT preserved). On LTX-2.3 that track spans the
            whole timeline; on MiniMax-H3 it spans only the GENERATED frames --
            audio is produced jointly with video there, so the preserved span
            has no generated audio and is left silent, with a warning.
            "preserve_input": mux the input clip's ORIGINAL audio over its
            placed span after generation, keeping the model-generated audio
            outside that span, with a ~50ms crossfade confined to the
            GENERATED side of each boundary. Falls back to "regenerate"
            (with a warning) if the uploaded clip has no audio stream. Only
            relevant when audio_enable is true.

            PER-ARCHITECTURE DEFAULT. The `default: regenerate` above is the
            base value and is what LTX-2.3 resolves to. MiniMax-H3 resolves to
            `preserve_input` through `outpaint_video_arch_overlays` of
            GET /schema/generation-defaults, because "regenerate" on that
            architecture means the preserved half of the output has no sound at
            all. Omit the field to get the loaded architecture's default; send
            it to pin a mode regardless of architecture.
          example: regenerate
        attention_type:
          type: string
          enum: [normal, native, sdpa, none, flash, sage, tq, sla]
          default: normal
          description: |
            Attention backend for this generation, with exactly the semantics of
            `Img2VidRequest.attention_type`: one resolver
            (`core.attention.normalize_backend`) for every architecture, omitting
            the field falls back to the process-wide setting, honored by
            `minimax_h3` and accepted-with-a-warning by `ltx2`.
          example: normal
        blocks_to_swap:
          type: integer
          default: 0
          description: "Number of transformer blocks kept CPU-resident and streamed to GPU during the denoise loop. 0 disables block swap."
          example: 0
        fuse_output_proj:
          type: boolean
          default: false
          description: "MiniMax-H3 only. Fuses proj_out/audio_proj_out into the chunked output-norm loop; not bit-exact (see Txt2VidRequest.fuse_output_proj). Off by default."
          example: false
        fbcache_enable:
          type: boolean
          default: false
          example: false
        fbcache_threshold:
          type: number
          default: 0.12
          example: 0.12
        fbcache_warmup_steps:
          type: integer
          default: 1
          example: 1
        spectrum_enable:
          type: boolean
          default: false
          example: false
        spectrum_w:
          type: number
          default: 0.5
          example: 0.5
        spectrum_w_decay:
          type: number
          default: 0.0
          example: 0.0
        spectrum_delta_cap:
          type: number
          default: 0.0
          example: 0.0
        spectrum_m:
          type: integer
          default: 4
          example: 4
        spectrum_lam:
          type: number
          default: 0.1
          example: 0.1
        spectrum_warmup_steps:
          type: integer
          default: 3
          example: 3
        spectrum_window_size:
          type: integer
          default: 4
          example: 4
        spectrum_flex_window:
          type: number
          default: 0.75
          example: 0.75
        spectrum_tail:
          type: number
          default: 0.12
          example: 0.12
        spectrum_max_cache:
          type: integer
          default: 0
          example: 0
        vae_path:
          type: string
          nullable: true
          description: "Per-generation VAE override. Unsupported on the LTX-2.3 video model: accepted-but-ignored with a warning."
        text_encoder_path:
          type: string
          nullable: true
          description: "Per-generation text-encoder override. Unsupported on the LTX-2.3 video model: accepted-but-ignored with a warning."
        unet_quantization:
          type: string
          nullable: true
          enum: [none, fp8_e4m3fn, fp8_e5m2, int8]
          default: null
          description: |
            Transformer quantization mode for the video DiT; identical semantics
            to `Txt2VidRequest.unet_quantization` (only `int8` is applied on
            LTX-2.3, converting `LTX2VideoTransformer3DModel` in place once per
            model load, video DiT only).
          example: int8
        quantized_gemm_mode:
          type: string
          nullable: true
          enum: [w8a8, dequant, null]
          default: null
          description: |
            Per-generation GEMM path for already-quantized Linear weights;
            identical semantics to `Txt2VidRequest.quantized_gemm_mode`.
          example: w8a8
        video_lossless:
          type: boolean
          default: false
          description: |
            When true, writes the returned `filename` as an FFV1-in-mkv
            MASTER (`-pix_fmt rgb24`) instead of an H.264-in-mp4, so the
            pasted (preserved) input frames are BIT-EXACT after decode --
            empirically verified: plain "libx264 -qp 0" is NOT actually
            bit-exact (observed up to 2/255 per-channel drift from
            RGB<->YUV/GBR colorspace rounding even at "lossless" x264
            settings), while FFV1 with no forced colorspace conversion gives
            an exact roundtrip. Audio (when present) uses FLAC instead of AAC
            in this mode -- FLAC adds no further lossy compression beyond the
            existing 16-bit PCM quantization this pipeline always applies, it
            does not exceed 16-bit precision. Trade-offs: much larger file
            size, and the master itself is NOT browser-playable (FFV1 has no
            mainstream browser decoder) -- a second, browser-playable H.264
            mp4 proxy is encoded alongside it and returned as
            `preview_filename` for gallery playback; the master stays
            downloadable, untouched, and is for archival/verification of the
            exact preserved frames, not casual playback.
          example: false
        reference_image_size:
          type: string
          enum: [max, match]
          default: max
          description: |
            MiniMax-H3 ref2va only (extend_forward). Sizing of each
            `reference_images` file before it is encoded -- identical
            semantics to `Ref2VidRequest.reference_image_size`: "max" puts
            each image on a 2048px short edge of its own (the released
            recipe), "match" scales down to the generation's pixel area.
            Never affects the automatic source-clip video reference, which
            always follows the generation canvas rule.
          example: max
        reference_images:
          type: array
          items:
            type: string
            format: binary
          description: |
            MiniMax-H3 ref2va only, extend_forward placement only (400 on
            `fl2va`, on any other architecture, or on any other placement --
            see the endpoint's partition/placement gate). Optional image
            references, read in upload order, laid out AFTER the automatic
            source-clip video reference and the boundary anchor's own row.
            There is no `reference_videos`/`reference_audios` field here: the
            preserved clip is ALWAYS the sole video reference on this
            endpoint (its own trailing frames, soundtrack excluded,
            tail-truncated to the generated span's length) -- that is what
            makes this an extend rather than a `/generate/ref2vid` request.
        loras:
          type: string
          default: "[]"
          description: |
            JSON-encoded string (sent via multipart Form) containing an array
            of LoRA config objects (e.g. path/strength). Same apply/restore
            contract and same MiniMax-H3-only capability as `Txt2VidRequest.loras`
            -- see there for details.
          example: '[{"path": "minimax_h3_lora.safetensors", "strength": 1.0}]'
        continuation_mode:
          type: string
          enum: [boundary_frame, pinned_tail, motion_preroll, tail_reference_video, sampler_state]
          default: boundary_frame
          description: |
            What THIS continuation is conditioned on. The enum is the wire
            vocabulary (wider than any architecture advertises, so an
            unimplemented candidate can be refused by name); a mode absent from
            `GET /schema/arch-capabilities`'s
            `chain_context[arch].chain_continuation_modes` — or from its
            `variants[loaded_variant]` entry — is a 400, never a downgrade.

            `boundary_frame` (default, unchanged behaviour): the preserved
            clip's last frame is the generated span's first-frame anchor, and
            one frame is all the model gets.

            `pinned_tail`: the preserved clip's last `continuation_overlap_frames`
            PIXEL frames become the generated clip's own leading latent frames,
            pinned as conditioning and never denoised (the mechanism
            `/generate/inpaint/video` already uses). With
            `outpaint_video_audio_mode: preserve_input` the matching audio
            latents — the ones whose time interval lies inside the same overlap
            — are pinned too, so video and audio conditioning describe the same
            physical time. MiniMax-H3 `fl2va` only: `ref2va` packs its
            references into the same conditioning prefix and does not advertise
            it, and LTX-2.3 already conditions on the whole preserved prefix.
            The preserved frames stay pixel-exact either way (they are
            concatenated, never sampled), and the overlap frames the model
            re-renders are discarded.

            `motion_preroll`: the same overlap, conditioned the other way
            round. Nothing is pinned; instead `continuation_anchor_count` of the
            preserved clip's last `continuation_overlap_frames` frames are
            placed as keyframe anchors at their own positions inside the
            generated span (the index-addressable conditioning
            `/generate/img2vid`'s keyframe placement uses), so the model reads
            direction and speed off several frames rather than one. That
            pre-roll is generated and then DISCARDED — the preserved clip is
            concatenated over it unchanged — so the request pays for frames it
            does not keep. MiniMax-H3 `fl2va` only, for the same prefix-conflict
            reason `pinned_tail` is, and mutually exclusive with it: an anchor
            reserves conditioning rows ahead of the clip and a pin re-uses that
            same prefix for rows of the clip itself. Opt-in and unmeasured.
          example: boundary_frame
        continuation_overlap_frames:
          type: integer
          minimum: 0
          default: 0
          description: |
            PIXEL frames of the preserved clip shared with the generated span:
            what `continuation_mode: pinned_tail` pins, and what
            `motion_preroll` uses as its pre-roll. Ignored by `boundary_frame`
            (which always shares exactly one anchor frame), REQUIRED by the
            other two.

            **`pinned_tail`:**

            Only a length that lands on a video-VAE temporal group boundary can
            be pinned, because a latent frame is conditioned or generated whole:
            the candidate values are the cumulative sums of
            `video_constraints[arch].latent_chunk_pattern`, which for
            MiniMax-H3's `[1, 4, 4, 4, 4]` are 1, 5, 9, 13, 17, 18, 22, ... —
            note that the pattern CYCLES, so 17 is followed by 18 and not by 33.
            An unaligned value is a 400 listing the ones that work; it is never
            snapped silently.

            The accepted values are additionally bounded by
            `chain_context[arch].chain_context_min_frames` and
            `chain_context_max_frames` — for MiniMax-H3 `fl2va` that leaves
            5, 9, 13, 17. The FLOOR is measured, not arithmetic: a 1-frame pin
            is a motionless still, which the model can read as a static scene
            and continue as one, so it is refused with its own 400 rather than
            offered as a cheap `boundary_frame`. Those two are different
            conditionings, not two sizes of the same one.

            The generated span grows by this many frames (the overlap is
            re-rendered and thrown away) and is then rounded up onto the arch's
            frame grid, so a continuation can add more frames than the
            one-frame-anchor arithmetic would: `POST /video-chain/plan` computes
            the plan's frame ranges with the overlap it was given, and the
            effective output length of a single request is reported in
            `warnings[]` exactly as it is for `total_frames`.

            **`motion_preroll`:** the pre-roll needs NO video-VAE alignment — an
            anchor addresses a pixel frame directly, unlike a pin, which
            conditions a latent frame whole — so any integer inside
            `chain_context[arch].chain_motion_preroll_min_frames` ..
            `chain_motion_preroll_max_frames` is accepted (MiniMax-H3 `fl2va`:
            2..17) and anything outside is a 400 rather than a clamp. The span
            grows and is rounded onto the frame grid exactly as above.
          example: 0
        continuation_anchor_count:
          type: integer
          minimum: 0
          default: 0
          description: |
            How many of the pre-roll's frames `continuation_mode:
            motion_preroll` places as keyframe anchors. REQUIRED by that mode
            and a 400 with any other one: a mode that places no anchors cannot
            honour a count, and the field is refused rather than dropped
            silently.

            Bounded by `chain_context[arch].chain_motion_preroll_min_anchors` ..
            `chain_motion_preroll_max_anchors` (MiniMax-H3 `fl2va`: 2..4) and by
            the pre-roll itself, since two anchors cannot share a frame. Fewer
            than the minimum carries no direction or speed — that request is
            `boundary_frame` plus discarded frames — and each anchor adds
            conditioning rows to every denoise step, which is why the top is a
            refusal rather than an accepted-but-untested value.

            WHERE the anchors land is not sent: they are spread uniformly over
            the pre-roll, from its oldest frame to the boundary frame, so the
            positions are a function of the count and the pre-roll length alone
            and a chain manifest can fix them
            (`VideoChainVisualContext.anchor_local_frames`).
          example: 0
        chain_id:
          type: string
          nullable: true
          default: null
          description: |
            Video chain provenance. This endpoint is where every CONTINUATION
            segment of a chain runs, so a chained request carries the same
            `chain_id` its segment 0 (`/generate/txt2vid`, `/generate/img2vid`
            or `/generate/ref2vid`) sent, with this segment's own index and
            frame span. Identical semantics, identical validation and the same
            send-them-together rule as `Txt2VidRequest.chain_id` — see there.
          example: "3f1c2b9e-3c8a-4f0a-9a1c-2b7d5f0e4a11"
        chain_manifest_version:
          type: integer
          nullable: true
          minimum: 1
          default: null
          description: "See `Txt2VidRequest.chain_manifest_version`."
          example: 1
        chain_plan_hash:
          type: string
          nullable: true
          default: null
          description: "See `Txt2VidRequest.chain_plan_hash` (64 hex characters)."
          example: "9f2c0b1d5e4a3c8b7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c"
        chain_segment_index:
          type: integer
          nullable: true
          minimum: 0
          default: null
          description: >-
            See `Txt2VidRequest.chain_segment_index`. Always >= 1 here: index 0
            is the request that starts the chain, which is not an outpaint.
          example: 1
        chain_segment_count:
          type: integer
          nullable: true
          minimum: 1
          default: null
          description: "See `Txt2VidRequest.chain_segment_count`."
          example: 4
        chain_global_frame_start:
          type: integer
          nullable: true
          minimum: 0
          default: null
          description: "See `Txt2VidRequest.chain_global_frame_start`."
          example: 362
        chain_global_frame_end:
          type: integer
          nullable: true
          minimum: 0
          default: null
          description: "See `Txt2VidRequest.chain_global_frame_end`."
          example: 723
        chain_context_mode:
          type: string
          nullable: true
          enum: [timeline, manual, legacy_repeat, null]
          default: null
          description: "See `Txt2VidRequest.chain_context_mode`."
          example: timeline
        chain_root_prompt_hash:
          type: string
          nullable: true
          default: null
          description: "See `Txt2VidRequest.chain_root_prompt_hash` (64 hex characters)."
          example: "1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c"

    InpaintVideoRequest:
      type: object
      required:
        - prompt
        - video
        - regenerate_start_frame
        - regenerate_end_frame
      description: |
        Distinct from `OutpaintVideoRequest`: there is no output-length field at
        all (the output is as long as the trimmed input) and no placement or
        bridge field; the range to regenerate takes their place. All other
        video-generation knobs (block swap / FBCache / Spectrum / per-generation
        component overrides) are the same as `Txt2VidRequest`.
      properties:
        prompt:
          type: string
          description: "Text prompt describing the regenerated range. The preserved frames are the input's own pixels and are not described by it."
          example: "A cat playing a piano on a stage, warm stage lighting"
        negative_prompt:
          type: string
          default: ""
          description: "Content to steer away from. Applied only when guidance_scale > 1."
        video:
          type: string
          format: binary
          description: "The clip to inpaint (any ffmpeg-demuxable container). Its TRIMMED length is the output length and must be a valid clip length for the loaded model."
        spatial_mask_manifest:
          type: string
          description: |
            Optional JSON manifest for a spatial mask timeline inside the
            temporal regenerate range. The manifest canvas must equal the
            resolved output width and height. When supplied, provide one PNG
            in `spatial_mask_files` and the corresponding ID in
            `spatial_mask_ids` for each unique `mask_id` referenced by the
            manifest. Upload filenames are ignored; IDs define the mapping.
            At most 128 keyframes and 64 unique PNG assets are allowed. A
            keyframe's `transform.scale_x`/`transform.scale_y` must be between
            0.01 and 100. Rejected with a 400 when combined with
            `fbcache_enable=true` (see that field).
          example: '{"version":1,"coordinate_space":"output_canvas","polarity":"white_generate","canvas":{"width":640,"height":384},"keyframes":[{"frame":40,"mask_id":"subject","interpolation_to_next":"hold"}]}'
        spatial_mask_files:
          type: array
          description: |
            Optional repeated PNG uploads for `spatial_mask_manifest`. The
            array position is paired with the same-position
            `spatial_mask_ids` entry. Each PNG must match the manifest canvas.
          items:
            type: string
            format: binary
        spatial_mask_ids:
          type: array
          description: |
            Optional repeated form IDs paired positionally with
            `spatial_mask_files`. The set must exactly match the unique
            `mask_id` values in the manifest; duplicate IDs are rejected.
          items:
            type: string
        regenerate_start_frame:
          type: integer
          description: |
            First PIXEL frame of the range to regenerate, in the TRIMMED clip's
            own frames, INCLUSIVE. Expanded outward to a latent-group boundary
            (see the endpoint's granularity note); the effective span is
            reported in `warnings[]` when the expansion changed the request.
          example: 40
        regenerate_end_frame:
          type: integer
          description: |
            End of the range to regenerate, EXCLUSIVE (Python-slice
            convention): `start=40, end=85` regenerates frames 40..84, i.e. 45
            frames. Expanded outward to a latent-group boundary like the start.
          example: 85
        width:
          type: integer
          multipleOf: 32
          default: 768
          description: "Output video width in pixels. The uploaded clip is center-cropped + resized to this resolution, and the PREPROCESSED frames are what the preserved region is pasted from. The MiniMax-H3 default resolves to 1344 through `video_arch_overlays` of GET /schema/generation-defaults."
          example: 640
        height:
          type: integer
          multipleOf: 32
          default: 512
          description: "Output video height in pixels. Must be divisible by 32."
          example: 384
        frame_rate:
          type: number
          default: 24.0
          description: "Output frames per second. MiniMax-H3 is a fixed 24 fps model and forces this value with a warning."
          example: 24.0
        num_inference_steps:
          type: integer
          default: 8
          description: "Number of denoising steps. The MiniMax-H3 default resolves to 20; its scheduler counts sigma grid points, so the minimum is 2."
          example: 20
        guidance_scale:
          type: number
          default: 1.0
          description: "Classifier-free guidance scale. MiniMax-H3 is guidance-distilled and ignores it."
          example: 1.0
        seed:
          type: integer
          default: -1
          description: "Random seed. -1 draws a random seed (returned in actual_seed)."
          example: -1
        num_videos_per_prompt:
          type: integer
          default: 1
          example: 1
        max_sequence_length:
          type: integer
          default: 1024
          example: 1024
        audio_enable:
          type: boolean
          default: true
          description: "When true, mux an audio track into the mp4 (see inpaint_video_audio_mode for its source). When false the audio rows still ride the packed sequence and still influence the video."
          example: true
        input_trim_start_frames:
          type: integer
          default: 0
          description: "Trim this many PIXEL frames off the START of the uploaded clip before anything else. The regenerate range is expressed in the TRIMMED clip's frames."
          example: 0
        input_trim_end_frames:
          type: integer
          default: 0
          description: "Trim this many PIXEL frames off the END of the uploaded clip. This is the field that brings an over-long clip down onto the model's clip-length grid."
          example: 0
        inpaint_video_audio_mode:
          type: string
          enum: [regenerate, preserve_input, regenerate_range]
          default: regenerate
          description: |
            "preserve_input": pin the clip's own track as conditioning across
            the whole clip and mux it back verbatim, so the regenerated span
            carries the original soundtrack. Falls back to "regenerate" (with a
            warning) when the clip has no audio stream.
            "regenerate": generate the soundtrack for the whole clip, so the
            preserved video span carries generated audio that need not match its
            visuals. Only relevant when audio_enable is true.
            "regenerate_range": pin the audio outside the regenerate range as
            conditioning (the same mechanism "preserve_input" uses), so the
            audio inside the range is generated with the surrounding original
            track as context. The preserved spans are then spliced back from
            the input clip's own audio after decode, with a short crossfade at
            the two boundaries. The pinned/free boundary snaps to the audio
            latent grid, which is finer than the video latent-group grid, so
            it can differ from the pixel range by up to one audio latent per
            side. Falls back to "regenerate" (with a warning) when the clip
            has no audio stream or when the regenerate range covers the whole
            clip (there is nothing to pin).

            PER-ARCHITECTURE DEFAULT. The `default: regenerate` above is the
            architecture-neutral base value; MiniMax-H3 resolves to
            `preserve_input` through `inpaint_video_arch_overlays` of
            GET /schema/generation-defaults. Omit the field to get the loaded
            architecture's default.
          example: preserve_input
        attention_type:
          type: string
          enum: [normal, native, sdpa, none, flash, sage, tq, sla]
          default: normal
          description: "Attention backend for this generation, with exactly the semantics of `Img2VidRequest.attention_type`."
          example: normal
        blocks_to_swap:
          type: integer
          default: 0
          description: "Number of transformer blocks kept CPU-resident and streamed to GPU during the denoise loop. 0 disables block swap."
          example: 0
        fuse_output_proj:
          type: boolean
          default: false
          description: "MiniMax-H3 only. Fuses proj_out/audio_proj_out into the chunked output-norm loop; not bit-exact (see Txt2VidRequest.fuse_output_proj). Off by default."
          example: false
        fbcache_enable:
          type: boolean
          default: false
          description: |
            First-Block-Cache, with the same semantics as `Txt2VidRequest.fbcache_enable`.
            Rejected with a 400 (`spatial_mask_manifest is incompatible with fbcache_enable`)
            when `spatial_mask_manifest` is also supplied: FBCache's per-frame guard
            indicator assumes the free (non-pinned) video rows tile into whole latent
            frames, which a row-level spatial mask pin does not guarantee.
          example: false
        fbcache_threshold:
          type: number
          default: 0.12
          example: 0.12
        fbcache_warmup_steps:
          type: integer
          default: 1
          example: 1
        spectrum_enable:
          type: boolean
          default: false
          example: false
        spectrum_w:
          type: number
          default: 0.5
          example: 0.5
        spectrum_w_decay:
          type: number
          default: 0.0
          example: 0.0
        spectrum_delta_cap:
          type: number
          default: 0.0
          example: 0.0
        spectrum_m:
          type: integer
          default: 4
          example: 4
        spectrum_lam:
          type: number
          default: 0.1
          example: 0.1
        spectrum_warmup_steps:
          type: integer
          default: 3
          example: 3
        spectrum_window_size:
          type: integer
          default: 4
          example: 4
        spectrum_flex_window:
          type: number
          default: 0.75
          example: 0.75
        spectrum_tail:
          type: number
          default: 0.12
          example: 0.12
        spectrum_max_cache:
          type: integer
          default: 0
          example: 0
        vae_path:
          type: string
          nullable: true
          description: "Per-generation VAE override."
        text_encoder_path:
          type: string
          nullable: true
          description: "Per-generation text-encoder override."
        unet_quantization:
          type: string
          nullable: true
          enum: [none, fp8_e4m3fn, fp8_e5m2, int8]
          default: null
          description: "Transformer quantization mode for the video DiT; identical semantics to `Txt2VidRequest.unet_quantization`."
          example: null
        quantized_gemm_mode:
          type: string
          nullable: true
          enum: [w8a8, dequant, null]
          default: null
          description: "Per-generation GEMM path for already-quantized Linear weights; identical semantics to `Txt2VidRequest.quantized_gemm_mode`."
          example: w8a8
        video_lossless:
          type: boolean
          default: false
          description: |
            When true, writes `filename` as an FFV1-in-mkv master (instead of
            H.264-in-mp4), which is what carries the pasted preserved frames
            into the FILE bit-exact -- "libx264 -qp 0" is NOT actually
            bit-exact. Audio uses FLAC instead of AAC in this mode. Much
            larger master file, and it will NOT play in a browser's native
            <video> element -- `preview_filename` carries a browser-playable
            H.264 proxy instead; the master stays downloadable untouched.
          example: false
        loras:
          type: string
          default: "[]"
          description: |
            JSON-encoded string (sent via multipart Form) containing an array
            of LoRA config objects (e.g. path/strength). Same apply/restore
            contract and same MiniMax-H3-only capability as `Txt2VidRequest.loras`
            -- see there for details.
          example: '[{"path": "minimax_h3_lora.safetensors", "strength": 1.0}]'

    VideoMaskPreviewRequest:
      type: object
      required:
        - spatial_mask_manifest
        - frames
      description: |
        Multipart request for `/video-mask/preview`. Carries the same
        spatial-mask-timeline fields as `InpaintVideoRequest` (manifest +
        repeated PNG uploads/IDs), plus a ref-based alternative to uploading
        each asset (spatial_mask_ref_ids/spatial_mask_refs) and the frame
        list and preview size that are specific to this read-only endpoint.
        Every manifest keyframe's `mask_id` must appear in EXACTLY ONE of
        `spatial_mask_ids` or `spatial_mask_ref_ids`.
      properties:
        spatial_mask_manifest:
          type: string
          description: |
            The version-1 spatial mask timeline manifest, identical schema to
            `InpaintVideoRequest.spatial_mask_manifest`. Required here (unlike
            the generation endpoint, where it is optional) since a preview
            with no manifest has nothing to rasterize.
          example: '{"version":1,"coordinate_space":"output_canvas","polarity":"white_generate","canvas":{"width":640,"height":384},"keyframes":[{"frame":40,"mask_id":"subject","interpolation_to_next":"sdf"},{"frame":85,"mask_id":"subject","interpolation_to_next":"hold"}]}'
        spatial_mask_files:
          type: array
          description: "Repeated PNG uploads, paired positionally with spatial_mask_ids, exactly as InpaintVideoRequest.spatial_mask_files."
          items:
            type: string
            format: binary
        spatial_mask_ids:
          type: array
          description: "Repeated form IDs paired positionally with spatial_mask_files, exactly as InpaintVideoRequest.spatial_mask_ids."
          items:
            type: string
        spatial_mask_ref_ids:
          type: array
          description: "Repeated form IDs paired positionally with spatial_mask_refs -- the ref-based counterpart of spatial_mask_ids. An ID must not also appear in spatial_mask_ids."
          items:
            type: string
        spatial_mask_refs:
          type: array
          description: >-
            Repeated temp_img:// references (from a prior
            /temp-images/upload of the same PNG this asset would otherwise
            upload), paired positionally with spatial_mask_ref_ids. A ref
            that fails to resolve server-side answers 409, naming the
            unresolved ID(s) so the client can retry with just those moved to
            spatial_mask_ids/spatial_mask_files.
          items:
            type: string
          example: ["temp_img://1700000000000_a1b2c3d4e5f60718.png"]
        frames:
          type: array
          description: |
            Frame numbers to rasterize and return, as a repeated form field.
            At most 64 entries, no duplicates, each >= 0.
          items:
            type: integer
          example: [40, 50, 62, 85]
        max_size:
          type: integer
          default: 256
          minimum: 16
          maximum: 1024
          description: "Longest edge, in pixels, of each returned tile in the strip. The manifest canvas is downscaled to this with a Lanczos filter."
          example: 256

    VideoMaskPreviewResponse:
      type: object
      description: >-
        The `/video-mask/preview` response's metadata, carried as JSON in the
        `X-Mask-Preview-Meta` response header -- the sprite PNG itself is the
        raw response body (media type image/png), not a field of this schema.
      required:
        - canvas_width
        - canvas_height
        - frame_width
        - frame_height
        - frames
        - warnings
      properties:
        canvas_width:
          type: integer
          description: "The manifest's own (full-resolution) canvas width, for computing the downscale ratio back to output-canvas pixel coordinates."
          example: 640
        canvas_height:
          type: integer
          example: 384
        frame_width:
          type: integer
          description: "Width, in pixels, of one tile in the response body's sprite strip. Shared by every returned frame."
          example: 256
        frame_height:
          type: integer
          example: 154
        frames:
          type: array
          description: "One entry per requested frame, ascending and de-duplicated by frame number, each naming its tile's left edge inside the response body's sprite strip."
          items:
            type: object
            required: [frame, x_offset]
            properties:
              frame:
                type: integer
                example: 40
              x_offset:
                type: integer
                description: "Left edge, in pixels, of this frame's tile inside the response body's sprite strip. Its width is frame_width and its height is frame_height."
                example: 0
        warnings:
          type: array
          description: >-
            Human-readable notices, e.g. an sdf interpolation segment that
            fell back to holding an endpoint's mask on some of the returned
            frames. Same wording as the generation endpoint's own sdf
            warnings. Capped so this whole header stays well under 8 KB
            (Node's default max header size is 16 KB, and this response is
            proxied through Next.js) -- if more warnings were produced than
            fit, the excess is dropped from this array and counted in
            `warnings_truncated` instead.
          items:
            type: string
          example: []
        warnings_truncated:
          type: integer
          description: >-
            Present only when `warnings` above had to be capped to fit the
            response header's byte budget. Counts how many additional
            warnings were dropped, beyond what `warnings` holds.
          example: 3

    Txt2AudRequest:
      type: object
      properties:
        prompt:
          type: string
          default: ""
          description: "Caption text describing the desired music (also accepted server-side as `caption`)."
          example: "upbeat synthpop, driving bassline, female vocals"
        lyrics:
          type: string
          default: ""
          description: "Lyrics text. Empty for instrumental generation."
          example: ""
        audio_duration:
          type: number
          default: 30.0
          description: "Target audio length in seconds."
          example: 30.0
        seed:
          type: integer
          default: -1
          description: "Random seed. -1 draws a random seed (returned in actual_seed)."
          example: -1
        inference_steps:
          type: integer
          default: 8
          description: "Number of denoising steps (turbo distilled default: 8)."
          example: 8
        guidance_scale:
          type: number
          default: 1.0
          description: "Classifier-free guidance scale. Turbo is CFG-distilled (no twin forward pass); a non-1.0 value is overridden back to 1.0."
          example: 1.0
        shift:
          type: number
          default: 3.0
          description: "Flow-matching timestep shift used to select the distilled step schedule."
          example: 3.0
        sampler_mode:
          type: string
          default: "euler"
          description: "Accepted for forward-compatibility. The vendored generate_audio has no sampler_mode knob (Euler-only ODE/SDE integration); a non-default value is logged and ignored."
          example: "euler"
        vocal_language:
          type: string
          default: "en"
          description: "Language folded into the lyrics/metas conditioning text."
          example: "en"
        unet_quantization:
          type: string
          nullable: true
          enum: [none, fp8_e4m3fn, fp8_e5m2, int8]
          default: null
          description: |
            Weight-only quantization of the ACE-Step DiT. Identical semantics to
            `GenerationParams.unet_quantization`; on this architecture only
            `int8` is applied (`acestep` is in `runtime_int8_archs`), converting
            the DiT's 392 Linear layers in place ONCE per model load. The FP8
            values are not implemented here and are reported through the
            generation's `warnings[]`. Only the DiT is converted -- not the
            Oobleck VAE (which holds no 2-D Linear weight at all) and not the
            Qwen3-Embedding text encoder.
          example: null
        quantized_gemm_mode:
          type: string
          nullable: true
          enum: [w8a8, dequant, null]
          default: null
          description: |
            Per-generation selection of the GEMM path used by Linear layers whose
            weights are ALREADY weight-only quantized; identical semantics and
            identical three values to `GenerationParams.quantized_gemm_mode`, and
            it selects a real path here because `acestep` is one of the
            `quantized_linear_archs` of `GET /schema/arch-capabilities` (its
            loader swaps in `Int8Linear`/`Fp8Linear`, and the runtime `int8`
            conversion above produces the same classes).
          example: null
        loras:
          type: array
          default: []
          description: |
            Optional LoRA(s) to apply to the ACE-Step DiT for this generation.
            Wrapped as forward-time addition layers (not merged into weights)
            and restored after generation unless the next request reuses them.
            Matches the ACE-Step LoRA training scope: decoder attention
            Linears only (`decoder.layers.{i}.{self_attn,cross_attn}.{q,k,v,o}_proj}`).
            A LoRA trained for a different architecture (mismatched keys) is
            skipped with a server-side warning, not an error.
          items:
            type: object
            properties:
              path:
                type: string
                description: "LoRA .safetensors filename (relative to the LoRA directory or an additional configured directory)."
              strength:
                type: number
                default: 1.0
                description: "LoRA strength multiplier."
          example: []

    Aud2AudRequest:
      type: object
      required:
        - reference_audio
      properties:
        prompt:
          type: string
          default: ""
          description: "Caption text describing the desired re-render (also accepted server-side as `caption`). The reference audio is re-rendered under this new caption/lyrics."
          example: "lo-fi hip hop, chill, jazzy piano"
        lyrics:
          type: string
          default: ""
          description: "Lyrics text. Empty for instrumental generation."
          example: ""
        seed:
          type: integer
          default: -1
          description: "Random seed. -1 draws a random seed (returned in actual_seed)."
          example: -1
        inference_steps:
          type: integer
          default: 8
          description: "Number of denoising steps (turbo distilled default: 8)."
          example: 8
        guidance_scale:
          type: number
          default: 1.0
          description: "Classifier-free guidance scale. Turbo is CFG-distilled (no twin forward pass); a non-1.0 value is overridden back to 1.0."
          example: 1.0
        shift:
          type: number
          default: 3.0
          description: "Flow-matching timestep shift used to select the distilled step schedule."
          example: 3.0
        cover_strength:
          type: number
          default: 1.0
          minimum: 0.0
          maximum: 1.0
          description: "Cover mode only. Fraction of denoising steps that keep the reference audio's semantic context before switching to a text2music-style (silence) context built from the same caption/lyrics. This is a step-count blend, NOT an img2img start-timestep/partial-denoise knob; xt always starts from full noise and runs every step. Higher = closer to the reference."
          example: 1.0
        mode:
          type: string
          enum: [cover, repaint]
          default: cover
          description: "Sub-mode. `cover` (img2img analog) re-renders the whole reference under the new caption/lyrics. `repaint` (inpaint analog) regenerates only [repaint_start, repaint_end) seconds of the reference, keeping the rest (approximately) unchanged."
          example: cover
        repaint_start:
          type: number
          default: 0.0
          minimum: 0.0
          description: "Repaint mode only. Start of the region to regenerate, in seconds. Required (with repaint_end) when mode=repaint."
          example: 4.0
        repaint_end:
          type: number
          default: 0.0
          minimum: 0.0
          description: "Repaint mode only. End of the region to regenerate, in seconds. Must be greater than repaint_start (otherwise 400)."
          example: 7.0
        vocal_language:
          type: string
          default: "en"
          description: "Language folded into the lyrics/metas conditioning text."
          example: "en"
        loras:
          type: string
          default: "[]"
          description: |
            JSON-encoded string (sent via multipart Form) containing an array
            of LoRA config objects (e.g. path/strength). Same apply/restore
            contract as `Txt2AudRequest.loras` -- see there for details.
          example: '[{"path": "acestep_lora.safetensors", "strength": 1.0}]'
        unet_quantization:
          type: string
          nullable: true
          enum: [none, fp8_e4m3fn, fp8_e5m2, int8]
          default: null
          description: |
            Weight-only quantization of the ACE-Step DiT. Identical semantics to
            `GenerationParams.unet_quantization`; on this architecture only
            `int8` is applied (`acestep` is in `runtime_int8_archs`), converting
            the DiT's 392 Linear layers in place ONCE per model load. The FP8
            values are not implemented here and are reported through the
            generation's `warnings[]`. Only the DiT is converted -- not the
            Oobleck VAE (which holds no 2-D Linear weight at all) and not the
            Qwen3-Embedding text encoder.
          example: null
        quantized_gemm_mode:
          type: string
          nullable: true
          enum: [w8a8, dequant, null]
          default: null
          description: |
            Per-generation selection of the GEMM path used by Linear layers whose
            weights are ALREADY weight-only quantized; identical semantics and
            identical three values to `GenerationParams.quantized_gemm_mode`, and
            it selects a real path here because `acestep` is one of the
            `quantized_linear_archs` of `GET /schema/arch-capabilities` (its
            loader swaps in `Int8Linear`/`Fp8Linear`, and the runtime `int8`
            conversion above produces the same classes).
          example: null
        reference_audio:
          type: string
          format: binary
          description: "Reference audio clip (multipart file upload) used as the cover/repaint source. VAE-encoded and fed back to the model as conditioning (is_covers=true for cover mode, false for repaint mode). Output duration is derived from this clip's length, not user-supplied."

    OutpaintAudioRequest:
      type: object
      required:
        - reference_audio
      description: |
        Audio temporal outpaint (extend). Structurally the INVERSE of
        `Aud2AudRequest`'s `mode=repaint`: repaint holds everything OUTSIDE
        a window and generates INSIDE it; outpaint holds the placed input
        window itself and generates OUTSIDE it (before and/or after).
        Shares prompt/lyrics/seed/inference_steps/guidance_scale/shift/
        vocal_language/loras with `Aud2AudRequest` -- see there for details
        on each.
      properties:
        prompt:
          type: string
          default: ""
          description: "Caption text describing the generated (non-preserved) portion of the timeline (also accepted server-side as `caption`)."
          example: "lo-fi hip hop, chill, jazzy piano"
        lyrics:
          type: string
          default: ""
          description: "Lyrics text. Empty for instrumental generation."
          example: ""
        seed:
          type: integer
          default: -1
          description: "Random seed. -1 draws a random seed (returned in actual_seed)."
          example: -1
        inference_steps:
          type: integer
          default: 8
          description: "Number of denoising steps (turbo distilled default: 8)."
          example: 8
        guidance_scale:
          type: number
          default: 1.0
          description: "Classifier-free guidance scale. Turbo is CFG-distilled (no twin forward pass); a non-1.0 value is overridden back to 1.0."
          example: 1.0
        shift:
          type: number
          default: 3.0
          description: "Flow-matching timestep shift used to select the distilled step schedule."
          example: 3.0
        vocal_language:
          type: string
          default: "en"
          description: "Language folded into the lyrics/metas conditioning text."
          example: "en"
        total_duration:
          type: number
          default: 60.0
          minimum: 0.0
          maximum: 240.0
          description: "Length of the OUTPUT timeline, in seconds. Must be in (0, 240]."
          example: 60.0
        input_offset_sec:
          type: number
          default: 0.0
          minimum: 0.0
          description: |
            Where the (trimmed) input clip is placed within the output
            timeline, in seconds. Snapped server-side to the nearest 1/25s
            (the ACE-Step VAE's latent frame rate) and CLAMPED so the placed
            input fits inside total_duration (a warning is added to the
            response if clamped). A trimmed input longer than
            total_duration itself is rejected (400), not clamped.
          example: 15.0
        input_trim_start_sec:
          type: number
          default: 0.0
          minimum: 0.0
          description: "Trim this many seconds off the START of the uploaded clip before placement."
          example: 0.0
        input_trim_end_sec:
          type: number
          default: 0.0
          minimum: 0.0
          description: "Trim this many seconds off the END of the uploaded clip before placement."
          example: 0.0
        loras:
          type: string
          default: "[]"
          description: |
            JSON-encoded string (sent via multipart Form) containing an array
            of LoRA config objects (e.g. path/strength). Same apply/restore
            contract as `Txt2AudRequest.loras` -- see there for details.
          example: '[{"path": "acestep_lora.safetensors", "strength": 1.0}]'
        unet_quantization:
          type: string
          nullable: true
          enum: [none, fp8_e4m3fn, fp8_e5m2, int8]
          default: null
          description: |
            Weight-only quantization of the ACE-Step DiT. Identical semantics to
            `GenerationParams.unet_quantization`; on this architecture only
            `int8` is applied (`acestep` is in `runtime_int8_archs`), converting
            the DiT's 392 Linear layers in place ONCE per model load. The FP8
            values are not implemented here and are reported through the
            generation's `warnings[]`. Only the DiT is converted -- not the
            Oobleck VAE (which holds no 2-D Linear weight at all) and not the
            Qwen3-Embedding text encoder.
          example: null
        quantized_gemm_mode:
          type: string
          nullable: true
          enum: [w8a8, dequant, null]
          default: null
          description: |
            Per-generation selection of the GEMM path used by Linear layers whose
            weights are ALREADY weight-only quantized; identical semantics and
            identical three values to `GenerationParams.quantized_gemm_mode`, and
            it selects a real path here because `acestep` is one of the
            `quantized_linear_archs` of `GET /schema/arch-capabilities` (its
            loader swaps in `Int8Linear`/`Fp8Linear`, and the runtime `int8`
            conversion above produces the same classes).
          example: null
        reference_audio:
          type: string
          format: binary
          description: "The input audio clip to place inside the longer output timeline (multipart file upload). Its (trimmed) waveform samples, normalized to stereo/48kHz, are re-spliced verbatim into the output over its placed span -- sample-exact preservation to that decoded 48kHz/16-bit representation, independent of the surrounding generated audio."

    Img2ImgRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          description: |
            Exactly one of `image` or `input_latent_id` must be supplied:
            `image` for a normal img2img request, `input_latent_id` for a
            loop-generation step chaining from a prior loop_decode="none" step
            (no VAE round-trip). Omitting both, or supplying neither, is a 400.
          properties:
            image:
              type: string
              format: binary
              description: "Input image. Required unless input_latent_id is supplied."
            input_latent_id:
              type: string
              nullable: true
              description: |
                Loop-generation latent passthrough (SD1.5/SDXL only). Opaque id
                returned by a prior request's loop_decode="none" response.
                When set, `image` is not read (may be omitted) -- denoising
                starts directly from the cached latent instead of an
                encode(image) round-trip. If the cached latent's spatial size
                doesn't match this request's width/height, it is resized
                in latent space (using resampling_method) before denoising.
                A missing/expired id (LRU-evicted or server restarted) returns
                400 with a message asking the client to restart the loop.
              example: "3f9a7c2e1b4d4a2c8e6f0a1b2c3d4e5f"
            denoising_strength:
              type: number
              minimum: 0
              maximum: 1
              default: 0.75
            img2img_fix_steps:
              type: boolean
              default: true
              description: "When true, run the full step count scaled by denoising_strength (fixed number of steps) rather than skipping initial steps."
            resize_mode:
              type: string
              default: image
              description: "How the input image is resized/cropped to the target width/height."
            resampling_method:
              type: string
              default: lanczos
              description: "Resampling filter used when resizing the input image."
            cpu_text_encoding:
              type: boolean
              default: false
              description: "Run text encoding on CPU instead of GPU."
            vae_drift_correction:
              type: boolean
              default: false
              description: |
                VAE DC-drift correction (img2img/inpaint only). Subtracts the
                per-channel DC bias the VAE round-trip introduces
                (mean(decode(encode(input))) - mean(input)) from the final decode,
                then clips to valid range. Adds ONE reference decode when enabled.
                Strength-independent (corrects a VAE property, not a denoise
                property). Implemented for SD1.5/SDXL; accepted-but-ignored (with a
                warning) on the DiT architectures.

    InpaintRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          required:
            - image
            - mask
          properties:
            image:
              type: string
              format: binary
            mask:
              type: string
              format: binary
            input_latent_id:
              type: string
              nullable: true
              description: |
                Reserved for schema parity with Img2ImgRequest -- NOT currently
                supported for inpaint. Inpaint's pixel-space mask compositing
                needs the real source image, so a non-null value here returns
                400. `image`/`mask` are always required for inpaint; use
                loop_decode ("full"/"cheap") for loop-generation cost control
                instead.
            denoising_strength:
              type: number
              minimum: 0
              maximum: 1
              default: 0.75
            img2img_fix_steps:
              type: boolean
              default: true
              description: "When true, run the full step count scaled by denoising_strength (fixed number of steps) rather than skipping initial steps."
            cpu_text_encoding:
              type: boolean
              default: false
              description: "Run text encoding on CPU instead of GPU."
            vae_drift_correction:
              type: boolean
              default: false
              description: |
                VAE DC-drift correction (img2img/inpaint only). Subtracts the
                per-channel DC bias the VAE round-trip introduces
                (mean(decode(encode(input))) - mean(input)) from the final decode,
                then clips to valid range. Adds ONE reference decode when enabled.
                Strength-independent. Implemented for SD1.5/SDXL; accepted-but-
                ignored (with a warning) on the DiT architectures.
            mask_blur:
              type: integer
              default: 4
              description: "Gaussian blur radius applied to the mask edges before compositing."
            inpaint_full_res:
              type: boolean
              default: false
              description: "Process only the masked region at full resolution instead of the whole image."
            inpaint_full_res_padding:
              type: integer
              default: 32
              description: "Padding (px) added around the masked region when inpaint_full_res is enabled."
            inpaint_fill_mode:
              type: string
              default: original
              description: "How the masked area is initialized before denoising."
            inpaint_fill_strength:
              type: number
              default: 1.0
              description: "Strength of the fill applied to the masked area before denoising."
            inpaint_blur_strength:
              type: number
              default: 1.0
              description: "Strength of the mask-edge blend when compositing the inpainted region back into the original image."
            region_prompt:
              type: string
              default: ""
              description: |
                SD/SDXL only. An additional POSITIVE prompt that conditions
                ONLY the repaint mask region, leaving the main prompt and the
                preserved (unmasked) region untouched. Encoded and combined
                with the main prompt the same way region_negative_prompt is
                (see region_prompt_method). Active only when
                region_prompt_strength > 0 and at least one of
                region_prompt/region_negative_prompt is non-empty.
              example: "continue the character, full body"
            region_negative_prompt:
              type: string
              default: ""
              description: |
                SD/SDXL only. An additional NEGATIVE prompt that suppresses
                content ONLY in the repaint mask region (e.g. suppressing
                invented UI/HUD chrome that a whole-image negative prompt
                cannot target without affecting the preserved region).
              example: "ui, hud, frame, border, text, watermark"
            region_prompt_strength:
              type: number
              default: 1.0
              minimum: 0.0
              maximum: 2.0
              description: |
                SD/SDXL only. Blend strength for the regional additional
                prompt. 0 disables the feature entirely (regardless of
                region_prompt/region_negative_prompt content). 1.0 is the
                canonical spatial blend; values above 1.0 extrapolate a
                stronger regional effect.
              example: 1.0
            region_prompt_method:
              type: string
              enum: [cfg, attention]
              default: cfg
              description: |
                SD/SDXL only. Mechanism used to apply the regional additional
                prompt. "cfg" (default): an extra masked/spatial classifier-
                free-guidance denoise branch, blended into the main branch's
                result via the (feathered) region mask -- costs roughly
                1.5x-2x the base U-Net forward count (higher under outpaint
                time-travel resampling). "attention" is not yet available in
                this build and falls back to "cfg" with a warning.
              example: cfg
            region_mask_feather:
              type: number
              default: 0.0
              minimum: 0.0
              description: |
                SD/SDXL only. Gaussian sigma, in latent cells, for feathering
                the region mask's edge before the spatial blend (method
                "cfg"). 0 (default) uses a hard mask (no feathering).
              example: 0.0
            seam_structure_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 2.0
              description: |
                SD/SDXL only. Seam Structure Continuity: make thin structures
                that cross the repaint mask boundary (a limb, torso, held object,
                architectural lines) continue coherently into the repainted
                region. Detects oriented structures crossing the boundary in the
                known latent (structure tensor), affine-extrapolates their
                band-pass cross-section into a shallow repaint-side collar, and
                pulls the model's per-step x0 prediction toward that target --
                gated per boundary position by a structure-saliency map so it
                fires only where a real crossing structure touches the boundary.
                x0-space, no extra U-Net forwards, known region bit-exact.
                0 (default) disables the feature (byte-identical). Active
                range ~0.25-0.6.
              example: 0.0
            seam_structure_depth:
              type: number
              default: 6.0
              minimum: 1.0
              description: "SSC repaint-side collar depth, in latent cells."
              example: 6.0
            seam_structure_end:
              type: number
              default: 0.70
              minimum: 0.0
              maximum: 1.0
              description: "SSC schedule progress at which the effect decays to 0 (full strength up to 0.45)."
              example: 0.70
            seam_structure_saliency:
              type: number
              default: 2.0
              minimum: 0.0
              description: "SSC saliency-gate midpoint as a multiple of the boundary-ribbon median contrast (0 = apply to the whole seam)."
              example: 2.0
            seam_structure_max_area:
              type: number
              default: 0.25
              minimum: 0.0
              maximum: 1.0
              description: "SSC safety cap: the maximum fraction of the repaint region the saliency gate may cover."
              example: 0.25
            boundary_relax_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 0.5
              description: |
                SD/SDXL only. Boundary Determinism Relaxation: instead of hard-pinning
                the known side of the repaint mask boundary each step, soft-pin a narrow
                SSC-saliency-gated known-side seam band (annealed soft->hard, with a
                small scheduled noise term), so the adjacent known-side latent can bend
                to meet the continuation Seam Structure Continuity indicates. Deep known
                content stays hard-pinned. Most effective with seam_structure_strength
                > 0. 0 (default) = off (byte-identical). Active range ~0.2-0.35.
              example: 0.0
            boundary_relax_width:
              type: number
              default: 3.0
              minimum: 1.0
              description: "BDR known-side seam-band width, in latent cells."
              example: 3.0
            boundary_relax_noise:
              type: number
              default: 0.35
              minimum: 0.0
              maximum: 1.0
              description: "BDR band-noise amount as a fraction of the x0-posterior standard deviation at each step."
              example: 0.35
            boundary_relax_full_until:
              type: number
              default: 0.37
              minimum: 0.0
              maximum: 1.0
              description: "BDR: schedule progress up to which the seam band is fully soft (sigma-based threshold)."
              example: 0.37
            boundary_relax_end:
              type: number
              default: 0.55
              minimum: 0.0
              maximum: 1.0
              description: "BDR: schedule progress by which the hard pin is fully restored (sigma-based threshold)."
              example: 0.55
            boundary_relax_paste:
              type: string
              default: "feather"
              enum: ["feather", "exact"]
              description: "BDR seam-strip paste variant (outpaint-relevant; inpaint keeps its own compositing): 'feather' | 'exact'."
              example: "feather"

    OutpaintRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          required:
            - image
          description: |
            `width`/`height` (inherited from GenerationParams) are NOT used by
            this endpoint -- `canvas_width`/`canvas_height` define the output
            size instead; the resolved canvas size is what actually gets
            generated (and is what is recorded as width/height in the
            response image's metadata).
          properties:
            image:
              type: string
              format: binary
              description: "Input image to place on the outpaint canvas."
            denoising_strength:
              type: number
              minimum: 0
              maximum: 1
              default: 1.0
              description: |
                Denoising strength for the surrounding canvas. Defaults to
                1.0 (full generation) unlike /generate/inpaint's 0.75,
                because outpaint has no existing content in the generated
                region -- the placed input region is preserved regardless,
                via the final pixel paste (not via this parameter).

                At 1.0 (default), the generated region is initialized from
                pure architecture-native noise rather than a noised encode of
                the canvas fill. Below 1.0, the legacy guided-from-fill mode
                runs instead (the generated region is denoised starting from
                the canvas fill, so it remains influenced by the extended
                edge content) and a warning is returned in the response.
            img2img_fix_steps:
              type: boolean
              default: true
              description: "When true, run the full step count scaled by denoising_strength (fixed number of steps) rather than skipping initial steps."
            cpu_text_encoding:
              type: boolean
              default: false
              description: "Run text encoding on CPU instead of GPU."
            vae_drift_correction:
              type: boolean
              default: false
              description: |
                VAE DC-drift correction. Subtracts the per-channel DC bias the
                VAE round-trip introduces from the final decode. Implemented
                for SD1.5/SDXL; accepted-but-ignored (with a warning) on the
                DiT architectures. Only affects the generated region -- the
                preserved rect is pasted back afterward regardless.
            canvas_width:
              type: integer
              multipleOf: 16
              default: 1536
              description: "Output canvas width. Rounded to a 16px grid -- a fixed point for every supported architecture's own internal resolution rounding (SD's /8 grid divides evenly into it too), so the canvas dimensions generate_inpaint is invoked with and the size it returns always match."
              example: 1536
            canvas_height:
              type: integer
              multipleOf: 16
              default: 1536
              description: "Output canvas height. Rounded to a 16px grid -- a fixed point for every supported architecture's own internal resolution rounding (SD's /8 grid divides evenly into it too), so the canvas dimensions generate_inpaint is invoked with and the size it returns always match."
              example: 1536
            place_x:
              type: integer
              default: 0
              description: "Left edge of the placed input rectangle on the canvas (clamped server-side so the whole rect stays in bounds)."
              example: 256
            place_y:
              type: integer
              default: 0
              description: "Top edge of the placed input rectangle on the canvas (clamped server-side so the whole rect stays in bounds)."
              example: 256
            place_width:
              type: integer
              default: 0
              description: "Width the (cropped) input is resized to before placement. 0 = use the input's native width."
              example: 1024
            place_height:
              type: integer
              default: 0
              description: "Height the (cropped) input is resized to before placement. 0 = use the input's native height."
              example: 1024
            input_crop_x:
              type: integer
              default: 0
              description: "Left edge of an optional trim applied to the input image BEFORE placement."
            input_crop_y:
              type: integer
              default: 0
              description: "Top edge of an optional trim applied to the input image BEFORE placement."
            input_crop_w:
              type: integer
              default: 0
              description: "Width of the input trim. 0 = to the input's right edge."
            input_crop_h:
              type: integer
              default: 0
              description: "Height of the input trim. 0 = to the input's bottom edge."
            outpaint_fill_mode:
              type: string
              enum: [replicate, reflect, mean, noise]
              default: replicate
              description: "How the canvas outside the placed rect is pre-filled before denoising: replicate (edge-extend the placed content outward), reflect (mirror it outward), mean (solid average color of the placed content), noise (uniform random RGB)."
              example: replicate
            mask_blur:
              type: integer
              default: 4
              description: |
                Gaussian blur radius for the generation-boundary transition.
                Unlike /generate/inpaint, this blur is OUTWARD-ONLY: the
                softened band lies entirely outside the preserved rect, so
                the placed input region is never blended with generated
                content.
            inpaint_full_res:
              type: boolean
              default: false
              description: "Accepted for API compatibility with /generate/inpaint; not implemented (no effect)."
            inpaint_full_res_padding:
              type: integer
              default: 32
              description: "Accepted for API compatibility with /generate/inpaint; not implemented (no effect)."
            inpaint_fill_mode:
              type: string
              default: original
              description: "How the masked (to-be-generated) area is initialized before denoising, on top of the canvas outpaint_fill_mode already built. Left at its default (original) is recommended -- the canvas is already pre-filled."
            inpaint_fill_strength:
              type: number
              default: 1.0
              description: "Strength of the fill applied to the masked area before denoising."
            inpaint_blur_strength:
              type: number
              default: 1.0
              description: "Strength of the mask-edge blend when compositing the generated region back onto the canvas (internal to generate_inpaint; the final preserved-rect paste happens afterward regardless)."
            region_prompt:
              type: string
              default: ""
              description: |
                SD/SDXL only. An additional POSITIVE prompt that conditions
                ONLY the generated (outside-the-preserved-rect) region,
                leaving the main prompt and the preserved input rectangle
                untouched. Active only when region_prompt_strength > 0 and at
                least one of region_prompt/region_negative_prompt is
                non-empty.
              example: "continue the character, full body"
            region_negative_prompt:
              type: string
              default: ""
              description: |
                SD/SDXL only. An additional NEGATIVE prompt that suppresses
                content ONLY in the generated region (e.g. suppressing
                invented UI/HUD chrome that a whole-image negative prompt
                cannot target without affecting the preserved rectangle).
              example: "ui, hud, frame, border, text, watermark, game screenshot"
            region_prompt_strength:
              type: number
              default: 1.0
              minimum: 0.0
              maximum: 2.0
              description: |
                SD/SDXL only. Blend strength for the regional additional
                prompt. 0 disables the feature entirely. 1.0 is the canonical
                spatial blend; values above 1.0 extrapolate a stronger
                regional effect.
              example: 1.0
            region_prompt_method:
              type: string
              enum: [cfg, attention]
              default: cfg
              description: |
                SD/SDXL only. Mechanism used to apply the regional additional
                prompt. "cfg" (default): an extra masked/spatial classifier-
                free-guidance denoise branch, blended into the main branch's
                result via the (feathered) region mask -- costs roughly
                1.5x-2x the base U-Net forward count, multiplied further by
                outpaint time-travel resampling's own NFE multiplier when
                outpaint_resample_count > 1. "attention" is not yet available
                in this build and falls back to "cfg" with a warning.
              example: cfg
            region_mask_feather:
              type: number
              default: 0.0
              minimum: 0.0
              description: |
                SD/SDXL only. Gaussian sigma, in latent cells, for feathering
                the region mask's edge before the spatial blend (method
                "cfg"). 0 (default) uses a hard mask (no feathering).
              example: 0.0
            seam_structure_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 2.0
              description: |
                SD/SDXL only. Seam Structure Continuity: make thin structures
                that cross the region boundary (a held rod/staff, a limb, torso,
                architectural lines) continue coherently into the generated
                region. Detects oriented structures crossing the boundary in the
                known latent (structure tensor), affine-extrapolates their
                band-pass cross-section into a shallow generate-side collar, and
                pulls the model's per-step x0 prediction toward that target --
                gated per boundary position by a structure-saliency map so it
                fires only where a real crossing structure touches the boundary.
                x0-space, no extra U-Net forwards, known region bit-exact.
                0 (default) disables the feature (byte-identical). Active
                range ~0.25-0.6.
              example: 0.0
            seam_structure_depth:
              type: number
              default: 6.0
              minimum: 1.0
              description: "SSC generate-side collar depth, in latent cells."
              example: 6.0
            seam_structure_end:
              type: number
              default: 0.70
              minimum: 0.0
              maximum: 1.0
              description: "SSC schedule progress at which the effect decays to 0 (full strength up to 0.45)."
              example: 0.70
            seam_structure_saliency:
              type: number
              default: 2.0
              minimum: 0.0
              description: "SSC saliency-gate midpoint as a multiple of the boundary-ribbon median contrast (0 = apply to the whole seam)."
              example: 2.0
            seam_structure_max_area:
              type: number
              default: 0.25
              minimum: 0.0
              maximum: 1.0
              description: "SSC safety cap: the maximum fraction of the generate region the saliency gate may cover (capped to the highest-confidence structures)."
              example: 0.25
            boundary_relax_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 0.5
              description: |
                SD/SDXL only. Boundary Determinism Relaxation: instead of hard-pinning
                the known boundary each step, soft-pin a narrow SSC-saliency-gated
                keep-side seam band (annealed from soft early to a full hard pin late,
                with a small scheduled noise term), so the immediately-adjacent
                known-side latent can bend to meet the continuation Seam Structure
                Continuity indicates. Deep known content stays hard-pinned. Most
                effective with seam_structure_strength > 0. 0 (default) = off
                (byte-identical). Active range ~0.2-0.35.
              example: 0.0
            boundary_relax_width:
              type: number
              default: 3.0
              minimum: 1.0
              description: "BDR keep-side seam-band width, in latent cells."
              example: 3.0
            boundary_relax_noise:
              type: number
              default: 0.35
              minimum: 0.0
              maximum: 1.0
              description: "BDR band-noise amount as a fraction of the x0-posterior standard deviation at each step."
              example: 0.35
            boundary_relax_full_until:
              type: number
              default: 0.37
              minimum: 0.0
              maximum: 1.0
              description: "BDR: schedule progress up to which the seam band is fully soft (sigma-based threshold)."
              example: 0.37
            boundary_relax_end:
              type: number
              default: 0.55
              minimum: 0.0
              maximum: 1.0
              description: "BDR: schedule progress by which the hard pin is fully restored (sigma-based threshold)."
              example: 0.55
            boundary_relax_paste:
              type: string
              default: "feather"
              enum: ["feather", "exact"]
              description: "BDR seam-strip paste variant: 'feather' keeps a thin model-rendered strip inside the rect at generated-adjacent edges; 'exact' restores the full placed rect byte-exact. Deep interior is byte-exact in both."
              example: "feather"
            outpaint_seam_fix:
              type: boolean
              default: true
              description: |
                Corrects a tonal (exposure) mismatch between the generated
                surroundings and the preserved input rectangle by comparing
                narrow strips just inside/outside each generated-adjacent rect
                edge and applying a smooth, outward-tapered per-channel gain
                to the generated pixels only. Applied after generation and
                before the final unconditional paste, so the preserved rect is
                never altered. Disable to see the model's raw output.
              example: true
            outpaint_boundary_color_strength:
              type: number
              default: 0.25
              minimum: 0.0
              maximum: 1.0
              description: |
                SD/SDXL only. A low-frequency color/illumination correction
                applied during denoising to the generate region, restricted to
                a narrow collar near the preserved rectangle's boundary and
                active mid/late in the schedule. Nudges coarse chroma and
                illumination continuity across the seam without constraining
                composition or content further from the boundary. 0 disables
                the correction.
              example: 0.25
            outpaint_resample_count:
              type: integer
              default: 1
              minimum: 1
              description: |
                SD/SDXL only. RePaint-style time-travel resampling: the
                number of denoise traversals through each resampled band
                segment (mid-schedule). After completing a denoise step
                inside the band, the whole latent (preserved region and
                generate region together) is re-noised back up
                `outpaint_jump_length` steps and re-denoised, repeating this
                count of times, before continuing forward. Re-exposes the
                generate region to the preserved-region constraint while it
                is still malleable, addressing content divergence (invented
                or unrelated composition) that persists with
                `outpaint_boundary_color_strength` alone. 1 (default) disables
                resampling. Values above 1 cost roughly 1.5-2x the requested
                step count in actual denoise passes (e.g. ~2x at a count of
                2). Only takes effect with a resample-compatible sampler
                (Euler, Euler Ancestral, DDIM, DDPM); other samplers run
                without resampling.
              example: 1
            outpaint_jump_length:
              type: integer
              default: 4
              minimum: 1
              description: |
                SD/SDXL only. Number of step indices each time-travel jump
                (see `outpaint_resample_count`) re-noises back across.
              example: 4
            outpaint_reference_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 1.0
              description: |
                SD/SDXL only. Masked self-attention Key/Value injection: a
                noise-matched reference built from the preserved rectangle's
                own clean latents (restricted to the preserved region only,
                via spatial token masking) is captured and its Key/Value are
                injected into the generate region's self-attention, scaled by
                this strength. Lets the generate region directly attend to
                the input's own features instead of only following the
                prompt, addressing content, style, and palette divergence
                that persists with `outpaint_boundary_color_strength` and
                `outpaint_resample_count` alone. Active only mid-schedule and
                on a subset of self-attention layers. 0 disables the
                mechanism entirely.
              example: 0.35
            outpaint_commit_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 1.0
              description: |
                SD/SDXL only. EXPERIMENTAL, off by default. Boundary-outward
                commitment front: augments the in-loop x0-space projection
                with a distance-graded, low-frequency, EMA-anchored proximal
                that makes generate cells near the preserved rectangle commit
                their coarse structure earlier in the denoise schedule than
                far-interior cells, following the boundary outward. Only the
                low-frequency band is nudged (high-frequency detail keeps
                refining every step); this reduces seam-adjacent structural
                artifacts (razor cuts, haze, doubled features) at the cost of
                a mild bias toward the preserved region's layout near the
                boundary. 0 disables the proximal entirely (byte-identical to
                the boundary-color/resample/reference mechanisms alone).
              example: 0.35
            outpaint_commit_near:
              type: number
              default: 0.35
              minimum: 0.0
              maximum: 1.0
              description: |
                SD/SDXL only. Schedule progress fraction (0-1) at which
                generate cells directly touching the preserved rectangle's
                boundary begin committing under `outpaint_commit_strength`.
              example: 0.35
            outpaint_commit_far:
              type: number
              default: 0.80
              minimum: 0.0
              maximum: 1.0
              description: |
                SD/SDXL only. Schedule progress fraction (0-1) at which the
                farthest generate cells (at or beyond
                `outpaint_commit_distance` from the boundary) begin
                committing under `outpaint_commit_strength`.
              example: 0.80
            outpaint_commit_distance:
              type: number
              default: 32.0
              minimum: 1.0
              description: |
                SD/SDXL only. Distance, in latent cells, from the preserved
                rectangle's boundary at which the per-cell commit-progress
                schedule saturates to `outpaint_commit_far`. Cells farther
                than this all commit at `outpaint_commit_far`.
              example: 32.0
            outpaint_controlnet_enable:
              type: boolean
              default: false
              description: |
                SD/SDXL only. Edge-extrapolation ControlNet: detects
                structures in the preserved region that cross the rect
                boundary (a held rod, a limb, architectural lines) and
                extrapolates them a short, confidence-tapered distance into
                the generate region as a synthetic ControlNet control image,
                driving a general structure ControlNet model. The same
                confidence field also spatially gates the ControlNet's
                residual contribution during denoising, so its influence
                tapers to 0 with distance from the boundary instead of
                applying uniformly. This enforces a GUESSED continuation
                geometry (not a learned one), so it is off by default.
                Mutually exclusive with a user-supplied ControlNet or
                LLLite model in this version -- skipped (with a warning) if
                one is already active, never overriding the user's own
                request. When active, forces `boundary_relax_paste` to
                "exact" and disables `seam_structure_strength` to avoid
                double geometry enforcement at the boundary.
              example: false
            outpaint_controlnet_mode:
              type: string
              enum: ["edge_extrapolate", "crop_mask"]
              default: "crop_mask"
              description: |
                Conditioning mode. "edge_extrapolate" (PART A): detect +
                extrapolate boundary-crossing edges to drive a general
                "anytest"-style structure ControlNet over a GUESSED geometry.
                "crop_mask" (default, PART B): build the trained
                outpaint-native 4-channel conditioning (crop RGB + binary
                known-mask) -- requires a ControlNet trained with
                conditioning_mode="outpaint" (4-ch diffusers directory),
                which LEARNED the continuation, so no extrapolation/termination
                heuristic and a flat (untapered) residual gate over the whole
                generate region.
              example: "crop_mask"
            outpaint_controlnet_model:
              type: string
              default: ""
              description: |
                Path to the ControlNet model checkpoint driving Outpaint
                ControlNet. Required (non-empty) for the feature to take
                effect when `outpaint_controlnet_enable` is true. For
                "crop_mask" mode this must be an outpaint-trained diffusers
                directory (4-channel conditioning).
              example: "controlnet/CN-anytest4-canny.safetensors"
            outpaint_controlnet_detector:
              type: string
              enum: [canny, lineart, lineart_anime]
              default: canny
              description: |
                Edge/structure detector run over the preserved region only
                (never the synthetic canvas fill). "canny" (default) uses
                cv2 with no model download; "lineart"/"lineart_anime" use
                controlnet_aux (opt-in) and fall back to canny if
                unavailable offline.
              example: canny
            outpaint_controlnet_scale:
              type: number
              default: 0.6
              minimum: 0.0
              maximum: 2.0
              description: "ControlNet conditioning scale for the synthetic control image."
              example: 0.6
            outpaint_controlnet_guidance_start:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 1.0
              description: "ControlNet guidance window start (schedule progress fraction, 0-1)."
              example: 0.0
            outpaint_controlnet_guidance_end:
              type: number
              default: 0.55
              minimum: 0.0
              maximum: 1.0
              description: "ControlNet guidance window end (schedule progress fraction, 0-1)."
              example: 0.55
            outpaint_controlnet_depth:
              type: integer
              default: 160
              minimum: 4
              description: |
                Maximum extrapolation depth, in canvas pixels, a detected
                boundary-crossing structure is continued into the generate
                region before its confidence tapers to 0.
              example: 160
            outpaint_controlnet_taper:
              type: number
              default: 2.0
              minimum: 0.5
              description: |
                Exponent of the cosine-squared distance taper applied to
                each extrapolated structure's confidence (higher = sharper
                falloff near the taper depth).
              example: 2.0
            outpaint_controlnet_edge_feather_px:
              type: number
              default: 0.0
              minimum: 0.0
              description: |
                Fixed inference-time inward edge-feather (canvas px) applied to
                the crop_mask ControlNet conditioning perimeter. MUST be 0.0 for
                a hard-edge-trained ControlNet (the current live checkpoint) so
                inference matches training byte-for-byte. Set to the training
                feather-range midpoint only once an R1-retrained (soft-edge) CN
                becomes the live model.
              example: 0.0
            outpaint_controlnet_corner_radius_px:
              type: number
              default: 0.0
              minimum: 0.0
              description: |
                crop_mask mode only, opt-in (Feature #3a, secondary lever):
                rounds the ControlNet conditioning's known/unknown boundary
                at each of the 4 rect corners with this radius (canvas px)
                instead of a sharp 90-degree vertex, softening what the
                ControlNet is TOLD near a corner. Only takes effect when
                `outpaint_controlnet_edge_feather_px` > 0.0. Clamped to 25%
                of the shorter placed-rect side. 0.0 (default) = disabled,
                byte-identical to before this feature existed.
              example: 0.0
            outpaint_controlnet_corner_gate_radius_px:
              type: number
              default: 0.0
              minimum: 0.0
              description: |
                crop_mask mode only, opt-in (Feature #2, primary fix for the
                rect-corner seam line): attenuates the ControlNet residual
                in a disk of this radius (canvas px) around each of the 4
                placed-rect vertices, down to
                `outpaint_controlnet_corner_gate_min` at the vertex center;
                the rect edges away from corners keep full residual
                strength. Clamped to 25% of the shorter placed-rect side.
                0.0 (default, paired with `outpaint_controlnet_corner_gate_min`
                defaulting to 1.0) = disabled, byte-identical to before this
                feature existed (no gate is applied for crop_mask mode).
              example: 0.0
            outpaint_controlnet_corner_gate_min:
              type: number
              default: 1.0
              minimum: 0.0
              maximum: 1.0
              description: |
                crop_mask mode only: the ControlNet residual gate value at
                each rect vertex center (see
                `outpaint_controlnet_corner_gate_radius_px`), in [0, 1].
                1.0 (default) = no attenuation = disabled regardless of the
                radius.
              example: 1.0
            outpaint_pin_corner_relax_radius_px:
              type: number
              default: 0.0
              minimum: 0.0
              description: |
                crop_mask mode only, opt-in (L1 four-corner x0-pin
                softening): softens the per-step x0-pin composite's
                keep-weight (a different mechanism from the ControlNet
                residual gate above) in a disk of this radius (canvas px)
                around each of the 4 placed-rect vertices, down to
                `outpaint_pin_corner_relax_min` at the vertex center; the
                rect edges away from corners keep the full hard pin.
                Clamped to 25% of the shorter placed-rect side. 0.0
                (default, paired with `outpaint_pin_corner_relax_min`
                defaulting to 1.0) = disabled, byte-identical to before this
                feature existed. The preserved rect always stays byte-exact
                via the final byte-exact paste, regardless of this setting.
              example: 0.0
            outpaint_pin_corner_relax_min:
              type: number
              default: 1.0
              minimum: 0.0
              maximum: 1.0
              description: |
                crop_mask mode only: the x0-pin keep-weight value at each
                rect vertex center (see
                `outpaint_pin_corner_relax_radius_px`), in [0, 1]. 1.0
                (default) = no relax = disabled regardless of the radius.
              example: 1.0
            outpaint_seam_membrane:
              type: boolean
              default: false
              description: |
                Harmonic boundary-offset blend: adjusts generated pixels to
                meet the preserved boundary exactly; the preserved region
                remains byte-identical. Distinct from `outpaint_seam_fix`
                (a per-edge exposure/tone gain): this solves a smooth
                per-channel offset field over the generated region, equal to
                the preserved rectangle's own pixels at the seam and
                harmonic (smoothly diffused) away from it, tapering to zero
                within `outpaint_seam_membrane_band` pixels. Runs after
                `outpaint_seam_fix` and before the final unconditional
                paste. False = off (the underlying module is not imported).
              example: false
            outpaint_seam_membrane_band:
              type: integer
              default: 0
              minimum: 0
              description: |
                Taper band width, in pixels, over which the seam membrane's
                correction fades to zero. 0 = automatic
                (clamp(max(canvas_width, canvas_height) // 8, 64, 256)).
              example: 0
            outpaint_seam_tone_strength:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 2.0
              description: |
                Cross-seam low-frequency tone membrane ("R2"), a separate
                mechanism from `outpaint_seam_membrane`: measures the
                per-channel tone step between the preserved rectangle's own
                pixels and the decoded generated pixels immediately across
                the seam, subtracts the local content gradient estimated from
                the preserved side so a legitimate ramp is not flattened,
                low-passes the residual along the seam axis, and writes a
                decaying offset into the generated side only, within
                `outpaint_seam_tone_band` pixels of the seam. Runs after
                `outpaint_seam_membrane` and before the final unconditional
                paste; the preserved region remains byte-identical. Scales
                the applied offset; 0 = off (the module is not imported).
              example: 0.0
            outpaint_seam_tone_band:
              type: integer
              default: 0
              minimum: 0
              description: |
                Decay band width, in pixels, over which the cross-seam tone
                membrane's offset fades to zero. 0 = automatic (16 px).
              example: 0
            outpaint_seam_offset_prop:
              type: number
              default: 0.0
              minimum: 0.0
              maximum: 2.0
              description: |
                Boundary-offset propagation ("G_prop16"), a third seam
                mechanism distinct from `outpaint_seam_membrane` and
                `outpaint_seam_tone_strength`. Measures the same per-channel
                offset between the preserved rectangle's own pixels and the
                decoded reconstruction of that same region (the quantity
                `outpaint_seam_membrane` also measures, not the cross-seam
                comparison `outpaint_seam_tone_strength` uses), and writes it
                directly into the generated pixels adjacent to the seam as a
                Gaussian-smoothed low-frequency term plus a short
                high-frequency residual term, each independently tapered to
                zero moving away from the seam. Writes only generated-side
                pixels; the preserved region is unaffected. Runs after
                `outpaint_seam_tone_strength` and before the final
                unconditional paste. Scales the applied offset; 0 = off (the
                module is not imported). Default 0.0: on the trained crop_mask
                CN the real seam is a hard paste-line (removed by
                `outpaint_paste_feather_px`) plus a CN-driven generation frame
                (a training property), which this generated-side propagation
                does not correct cleanly, so it ships off.
              example: 0.0
            outpaint_paste_feather_px:
              type: integer
              default: 24
              minimum: 0
              description: |
                Paste-band reconciliation feather ("Option E"): at the final
                preserved-rectangle paste, the last N rows/columns of the
                preserved rectangle at its generate-adjacent edges are
                blended (raised cosine) from the exact input toward the
                decoded canvas already underneath them, instead of pasted
                byte-exact. Independent of the boundary relaxation feather
                paste (`boundary_relax_strength`/`boundary_relax_paste`) and
                takes precedence over it when both are active; applies to
                every outpaint ControlNet mode. Default 24: the tiled-VAE-style
                blend that removes the hard raw/decoded seam paste-line while
                keeping the rectangle's deep interior byte-exact. 0 = off, the
                preserved rectangle stays byte-identical at the edge (the hard
                seam line returns). Only the N-row/column band loses
                byte-exactness when > 0; the rest of the rectangle is unaffected.
              example: 24
            outpaint_preserve_mode:
              type: string
              enum: [exact, vae_reconstruct, vae_reconstruct_hf]
              default: exact
              description: |
                Preserved-region compositing mode. `exact` (default) is the
                current byte-exact behavior: the preserved rectangle is
                pasted pixel-for-pixel from the input, unchanged by this
                parameter's existence. `vae_reconstruct` outputs a single
                uniform VAE decode of the whole canvas with no paste at all
                -- the preserved region becomes a VAE reconstruction of the
                input rather than byte-identical to it, removing the hard
                raw/decoded pixel discontinuity at the boundary.
                `vae_reconstruct_hf` additionally restores the preserved
                region's own high-frequency detail (its raw pixels minus
                their own VAE roundtrip reconstruction) on top of the
                uniform decode, tapering that restoration to zero over the
                rows/columns closest to the boundary so the boundary itself
                still matches the uniform decode exactly. `vae_reconstruct_hf`
                is implemented for SD1.5/SDXL; on other architectures it
                falls back to the `vae_reconstruct` behavior. Both non-`exact`
                modes make the preserved region not byte-identical to the
                input and emit a warning.
              example: exact
            outpaint_preview_unpinned_x0:
              type: boolean
              default: false
              description: |
                Display-only preview substitution for outpaint generations.
                The sampling loop pins the model's predicted original sample
                to the composite of the preserved region and the model's
                generate-region prediction before it reaches the mid-sampling
                preview decoder, so previews can show a boundary line that
                the actual denoising math never produces. When true, the
                unpinned model prediction is sent to the preview decoder
                instead; the value used by the sampler's own step function is
                unchanged either way, so the final saved image for a given
                seed is byte-identical regardless of this flag. False
                (default) preserves prior preview behavior.
              example: false

    UpscaleRequest:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          format: binary
          description: "Input image to upscale."
        upscaler_backend:
          type: string
          enum: [pil, spandrel, rtx_vsr, diffusion]
          default: spandrel
          description: "Which upscale backend to run: a PIL resample, a spandrel super-resolution model, RTX Video Super Resolution (nvvfx), or diffusion tile upscale (img2img per tile with the currently loaded model)."
          example: spandrel
        upscaler_model:
          type: string
          nullable: true
          default: null
          description: "Filename of the model under models/upscalers/. Required when upscaler_backend=spandrel, or when upscaler_backend=diffusion and diffusion_pre_upscale_mode=model."
          example: "4x-UltraSharp.pth"
        scale_factor:
          type: number
          minimum: 1.0
          maximum: 8.0
          default: 2.0
          description: "Output dimensions = round(input dimensions * scale_factor). If the spandrel model's native scale differs, its output is Lanczos-resized to the target."
          example: 2.0
        pil_resample:
          type: string
          enum: [lanczos, bicubic, nearest]
          default: lanczos
          description: "Resampling filter used by the pil backend."
        tile_size:
          type: integer
          default: 512
          description: "Tile size (px) for spandrel inference. 0 disables tiling (whole image in one pass)."
        tile_overlap:
          type: integer
          default: 32
          description: "Tile overlap (px) for spandrel inference, feather-blended across tile seams."
        rtx_vsr_quality:
          type: string
          enum: [low, medium, high, ultra]
          default: high
          description: "Quality level passed to RTX Video Super Resolution (nvvfx)."
        unsharp_enable:
          type: boolean
          default: false
          description: "Apply an unsharp mask after upscaling, regardless of backend."
        unsharp_radius:
          type: number
          default: 2.0
          description: "Unsharp mask radius."
        unsharp_percent:
          type: integer
          default: 100
          description: "Unsharp mask amount (percent)."
        unsharp_threshold:
          type: integer
          default: 3
          description: "Unsharp mask threshold."
        prompt:
          type: string
          default: ""
          description: "Tile img2img prompt (diffusion backend only)."
          example: "highly detailed, sharp focus"
        negative_prompt:
          type: string
          default: ""
          description: "Tile img2img negative prompt (diffusion backend only)."
        diffusion_denoising_strength:
          type: number
          minimum: 0.05
          maximum: 0.9
          default: 0.3
          description: "img2img denoising strength applied to each tile (diffusion backend only)."
          example: 0.3
        steps:
          type: integer
          default: 20
          description: "Inference steps for each tile's img2img pass (diffusion backend only)."
          example: 20
        cfg_scale:
          type: number
          default: 7.0
          description: "Classifier-free guidance scale for each tile's img2img pass (diffusion backend only)."
          example: 7.0
        sampler:
          type: string
          default: euler
          description: "Sampler used for each tile's img2img pass (diffusion backend only)."
          example: euler
        schedule_type:
          type: string
          default: uniform
          description: "Noise schedule type used for each tile's img2img pass (diffusion backend only)."
          example: uniform
        attention_type:
          type: string
          enum: [normal, native, sdpa, none, sage, flash, tq, sla]
          default: normal
          description: "Attention backend used for each tile's img2img pass when upscaler_backend=diffusion. Unknown values are rejected with HTTP 400; unsupported model/backend combinations report a downgrade warning."
          example: flash
        attention_impl:
          type: string
          enum: [conduit, diffusers]
          default: conduit
          description: "Attention implementation used for each diffusion tile. Currently consumed by FLUX.2; other architectures are conduit-only or ignore it."
          example: conduit
        seed:
          type: integer
          default: -1
          description: "Base seed for diffusion tile upscale; -1 = random. The same base seed is used for all tiles, offset by tile index. The resolved seed is recorded on the returned image (diffusion backend only)."
          example: -1
        diffusion_pre_upscale_mode:
          type: string
          enum: [pil, model]
          default: pil
          description: "How the image is pre-upscaled to the target size before tiling, when upscaler_backend=diffusion: a PIL resample (using pil_resample) or the spandrel model in upscaler_model."
          example: pil

    GenerationResponse:
      type: object
      description: |
        Envelope returned by every `/generate/*` endpoint. `success`,
        `actual_seed`, and `warnings` are always present; exactly one of
        `image`, `latent_id`, or the `filename` + `image_path` pair carries the
        result, depending on the request:

        - normal decode: `image` holds the full gallery record.
        - `loop_decode="none"` (txt2img/img2img): `latent_id` only -- nothing
          was decoded, saved, or written to the gallery.
        - `skip_gallery=true` (txt2img/img2img/inpaint/outpaint): `filename`
          and `image_path` only -- the file was written but no gallery row or
          thumbnail was created.
      required: [success, actual_seed, warnings]
      properties:
        success:
          type: boolean
          description: Always true on a 200 response; failures are returned as an `ErrorResponse` with a 4xx/5xx status.
        actual_seed:
          type: integer
          description: Seed actually used for the generation (the resolved value when the request asked for a random seed).
        warnings:
          type: array
          description: Feature-degradation notices recorded during this generation; empty when nothing was ignored or downgraded.
          items:
            $ref: '#/components/schemas/GenerationWarning'
        image:
          $ref: '#/components/schemas/GeneratedImage'
        latent_id:
          type: string
          nullable: true
          description: |
            Present only when the request had loop_decode="none": an opaque id
            for the cached final latent (no decode/save/gallery happened this
            request). Pass it as the next loop step's input_latent_id. Absent
            (or null) for a normal "full"/"cheap" decode response.
        filename:
          type: string
          description: Output file name. Present only on a `skip_gallery=true` response, in place of `image`.
        image_path:
          type: string
          description: Path of the saved file under the outputs mount. Present only on a `skip_gallery=true` response, in place of `image`.
          example: /outputs/txt2img_20260730_222223_1689850057.png

    GenerationStatusResponse:
      type: object
      description: |
        Snapshot returned by `GET /generation/status`. Complements the
        WebSocket `/api/v1/ws/progress` channel, which has no dedicated
        completion/error message.
      required: [status, generation_type, current_step, total_steps, phase, started_at, updated_at, last_error, last_result]
      properties:
        status:
          type: string
          enum: [idle, running, error]
          description: Current lifecycle state of the most recently started generation.
          example: "running"
        generation_type:
          type: string
          nullable: true
          enum: [txt2img, img2img, inpaint, outpaint, upscale, txt2vid, img2vid, inpaint_vid, outpaint_vid, ref2vid, studio_render, txt2aud, aud2aud, outpaint_aud]
          description: Which endpoint the most recently started generation used; null before any generation has run.
          example: "txt2img"
        current_step:
          type: integer
          nullable: true
          description: Current display step of the active generation, from the same per-step callback that feeds the WS `progress` message.
          example: 15
        total_steps:
          type: integer
          nullable: true
          description: Total display step count for the active generation.
          example: 28
        phase:
          type: string
          nullable: true
          description: Human-readable status text for the current step, matching the WS `progress` message's `message` field.
          example: "Step 15/28"
        started_at:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 UTC timestamp when the current/most recent generation started.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 UTC timestamp of the last update to this snapshot.
        last_error:
          type: string
          nullable: true
          description: Error message from the most recent generation, if it ended in `status=error`.
        last_result:
          type: object
          nullable: true
          description: |
            Result of the most recent successful generation, if any. Its
            `warnings` array is that generation's own `GenerationWarning`
            list, captured when it completed.
          properties:
            image_id:
              type: integer
            filename:
              type: string
            seed:
              type: integer
            warnings:
              type: array
              items:
                $ref: '#/components/schemas/GenerationWarning'
        warnings:
          type: array
          description: |
            Feature-degradation notices recorded so far by the newest
            generation (live while it runs, retained afterwards). The same
            list is persisted per image as `effective_warnings`.
          items:
            $ref: '#/components/schemas/GenerationWarning'
        generation_id:
          type: integer
          nullable: true
          description: |
            Monotonic id of the newest generation, used internally to keep
            each request's warnings separate from an overlapping request's.
            Null before any generation has run.
          example: 42

    GenerationWarning:
      type: object
      description: |
        Feature-degradation notice recorded during a generation by
        `add_warning()` (`backend/api/generation_status.py`): a requested
        option that was ignored, substituted, or downgraded. Entries are
        deduplicated within a single generation.
      required: [code, message]
      properties:
        code:
          type: string
          nullable: true
          description: Machine-readable identifier for the degradation; null when the emitter passed no code.
          example: unsupported_param
        message:
          type: string
          description: Text explanation of what was ignored, substituted, or downgraded.

    GeneratedImage:
      type: object
      description: |
        Full gallery record, produced by `GeneratedImage.to_dict()`
        (`backend/database/models.py`). Returned by `GET /images/{image_id}`
        and as the `image` field of a generation response.

        The properties listed in `required` come from table columns and are
        always present (several may be null). **Every other property is
        conditional**: it is emitted only when the matching key exists in that
        row's `parameters` JSON, so its presence depends on the generation
        type and on which features were enabled for that generation. Most
        conditional values are re-emitted as strings via `str(value)` rather
        than in their original JSON type; the exceptions are noted per
        property. `parameters` itself always carries the full, unstringified
        request parameters, so a client that needs original types can read it
        directly.
      required:
        - id
        - filename
        - prompt
        - negative_prompt
        - model_name
        - sampler
        - steps
        - cfg_scale
        - seed
        - ancestral_seed
        - width
        - height
        - generation_type
        - parameters
        - created_at
        - is_favorite
        - image_hash
        - source_image_hash
        - mask_data
        - lora_names
        - model_hash
      properties:
        # --- Columns (always present) ---
        id:
          type: integer
          description: Gallery row id.
          example: 10749
        filename:
          type: string
          description: |
            Output file name under the outputs directory: `.png` for images,
            `.flac` for audio, `.mp4` for video -- UNLESS the row was
            generated with `video_lossless=true` (outpaint/inpaint video
            only), in which case this is an FFV1-in-`.mkv` master and
            `preview_filename` (see below) carries the browser-playable proxy.
          example: txt2img_20260730_222223_1689850057.png
        prompt:
          type: string
          description: Positive prompt (caption text for audio generations).
        negative_prompt:
          type: string
          nullable: true
          description: Negative prompt.
        model_name:
          type: string
          description: Name of the model that produced the row (checkpoint file name, or a backend label such as `distilled` / `ace-step` for video/audio).
        sampler:
          type: string
          description: Sampler and schedule label used for the generation.
          example: euler_a (uniform)
        steps:
          type: integer
          description: Recorded step count column. Video/audio rows carry the request default here; their effective step count is in `num_inference_steps` / `inference_steps`.
        cfg_scale:
          type: number
          format: float
          description: Recorded CFG scale column. Video/audio rows carry the request default here; their effective value is in `guidance_scale`.
        seed:
          type: integer
          description: Seed actually used for the generation.
        ancestral_seed:
          type: integer
          nullable: true
          description: Seed for the stochastic (ancestral) noise of samplers such as Euler a; null for rows generated before this was recorded.
        width:
          type: integer
          description: Output width in pixels; 0 for audio rows.
        height:
          type: integer
          description: Output height in pixels; 0 for audio rows.
        generation_type:
          type: string
          enum: [txt2img, img2img, inpaint, outpaint, upscale, txt2vid, img2vid, outpaint_vid, inpaint_vid, ref2vid, studio_render, txt2aud, aud2aud, repaint, outpaint_aud]
          description: Endpoint that produced the row. `repaint` is written by `/generate/aud2aud` when `mode=repaint`.
        parameters:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Full generation parameters as stored on the row. Uploaded images are
            replaced by their SHA256 hashes before storage. Omitted from
            `GeneratedImageSummary`.

            It also carries what the generation COST, measured around this
            request: `generation_time` (total wall seconds) plus the
            `time_text_encode` / `time_denoise` / `time_vae_decode` breakdown on
            instrumented architectures, and `peak_vram_gb` (peak CUDA
            allocation, GiB) on the endpoints that arm the measurement. Both are
            informational — they do not affect reproducibility — and
            `peak_vram_gb` is absent rather than stale when it was not measured.
        created_at:
          type: string
          format: date-time
          nullable: true
          description: Local-time ISO 8601 timestamp of the row (no timezone offset).
          example: "2026-07-30T22:22:23.646318"
        is_favorite:
          type: boolean
          description: Whether the row is flagged as a favorite.
        image_hash:
          type: string
          nullable: true
          description: SHA256 hash of the generated image. Empty string on video/audio rows; null on rows written before it was recorded.
        source_image_hash:
          type: string
          nullable: true
          description: SHA256 hash of the input image/clip for img2img, inpaint, outpaint, upscale, img2vid, and aud2aud rows; null otherwise.
        mask_data:
          type: string
          nullable: true
          description: Base64-encoded inpaint mask; null when the row has none. Omitted from `GeneratedImageSummary`.
        lora_names:
          type: string
          nullable: true
          description: Comma-separated LoRA file names applied to the generation; null when none were used.
        model_hash:
          type: string
          nullable: true
          description: SHA256 hash of the model file; null when it could not be determined.

        # --- Conditional: NAG (emitted only when parameters.nag_enable is truthy) ---
        nag_enable:
          type: string
          description: Present only when NAG was enabled for the generation. Stringified boolean.
          example: "True"
        nag_scale:
          type: string
          description: NAG guidance scale. Stringified number; present only alongside `nag_enable`.
        nag_tau:
          type: string
          description: NAG tau. Stringified number; present only alongside `nag_enable`.
        nag_alpha:
          type: string
          description: NAG alpha. Stringified number; present only alongside `nag_enable`.
        nag_sigma_end:
          type: string
          description: Sigma at which NAG stops being applied. Stringified number; present only alongside `nag_enable`.

        # --- Conditional: post-decode options ---
        color_flatten_strength:
          type: string
          description: Color Flatten strength applied after decode. Stringified number; emitted only when non-zero.
        vae_drift_correction:
          type: string
          description: Whether VAE drift correction was applied after decode. Stringified boolean; emitted only when enabled.
        flatten_in_loop:
          type: string
          description: Whether in-loop background flattening was enabled. Stringified boolean; emitted only when enabled.
        flatten_in_loop_last_steps:
          type: string
          description: Number of trailing steps over which in-loop flattening ran. Stringified integer; present only alongside `flatten_in_loop`.
        flatten_in_loop_min_region:
          type: string
          description: Minimum region fraction for in-loop flattening. Stringified number; present only alongside `flatten_in_loop`.

        # --- Conditional: upscale (emitted only when parameters contains upscaler_backend) ---
        upscaler_backend:
          type: string
          description: Upscale backend used. Passed through unstringified.
          example: spandrel
        upscaler_model:
          type: string
          description: Upscaler model file name; emitted only when a model was used.
        upscaler_model_hash:
          type: string
          description: SHA256 hash of the upscaler model file; emitted only when a model was used.
        scale_factor:
          type: string
          description: Requested upscale factor. Stringified number.
        pil_resample:
          type: string
          description: PIL resample filter name. Passed through unstringified.
          example: lanczos
        tile_size:
          type: string
          description: Tile size used for tiled upscaling. Stringified integer.
        tile_overlap:
          type: string
          description: Tile overlap in pixels. Stringified integer.
        rtx_vsr_quality:
          type: string
          description: RTX Video Super Resolution quality level. Passed through unstringified.
        diffusion_denoising_strength:
          type: string
          description: Denoising strength for the diffusion upscale backend. Stringified number.
        diffusion_pre_upscale_mode:
          type: string
          description: Pre-upscale mode for the diffusion upscale backend. Passed through unstringified.

        # --- Conditional: video (emitted only when parameters.is_video is truthy) ---
        is_video:
          type: boolean
          description: |
            Present and true only on video rows. `filename` is an mp4, unless
            this row was generated with `video_lossless=true` (only the
            outpaint/inpaint video endpoints expose that flag), in which case
            `filename` is an FFV1-in-mkv master and `preview_filename` (when
            present) is a browser-playable H.264 mp4 proxy of it.
        preview_filename:
          type: string
          description: |
            Browser-playable H.264 mp4 proxy of `filename`, emitted only when
            `filename` is a `video_lossless` FFV1-in-mkv master. The gallery's
            <video> element should play this instead of `filename`; downloads
            and "send to" actions should keep using `filename` (the
            byte-exact master). Absent when the row was not lossless, or when
            the proxy encode itself failed (master still written).
        num_frames:
          type: string
          description: Frame count of the generated video. Stringified integer.
        fps:
          type: string
          description: Frame rate of the generated video. Stringified number.
        duration:
          type: string
          description: Duration in seconds. Stringified number; also emitted on audio rows.
        audio_enable:
          type: string
          description: Whether an audio track was generated with the video. Stringified boolean.
        guidance_scale:
          type: string
          description: Guidance scale used by the video/audio pipeline. Stringified number.
        num_inference_steps:
          type: string
          description: Step count used by the video pipeline. Stringified integer.
        chain_id:
          type: string
          description: |
            Video chain provenance (emitted as a group on video rows produced as
            one segment of a chained long clip; absent on every other row).
            Identifies the chain. The eight fields below are the rest of the
            group and carry the values the request sent — see
            `Txt2VidRequest.chain_id`.

            The chain's root prompt and canonical timeline are NOT on the row:
            they are held once by the manifest, which `chain_plan_hash` and
            `chain_root_prompt_hash` reference. The row's own `prompt` is this
            segment's compiled prompt, and `seed` the seed it actually ran with.
        chain_manifest_version:
          type: string
          description: Manifest schema version. Stringified integer.
        chain_plan_hash:
          type: string
          description: sha256 hex digest of the plan this segment was compiled from.
        chain_segment_index:
          type: string
          description: 0-based segment index within the plan. Stringified integer.
        chain_segment_count:
          type: string
          description: Number of segments in the plan. Stringified integer.
        chain_global_frame_start:
          type: string
          description: Start of this segment's half-open global frame span. Stringified integer.
        chain_global_frame_end:
          type: string
          description: End (exclusive) of that span. Stringified integer.
        chain_context_mode:
          type: string
          description: "Planning mode that wrote this segment's prompt: timeline, manual or legacy_repeat."
        chain_root_prompt_hash:
          type: string
          description: sha256 hex digest of the chain's root prompt.
        model_variant:
          type: string
          description: |
            Which MiniMax-H3 checkpoint partition (`fl2va` or `ref2va`) actually
            ran. The two partitions share every other component and are
            distinguished only by which file was loaded; this records the
            resolved value from the loader rather than anything derived from
            the request, so the row stays readable if either file is renamed.
            Emitted only on MiniMax-H3 rows.
          example: fl2va

        # --- Conditional: audio (emitted only when parameters.is_audio is truthy) ---
        is_audio:
          type: boolean
          description: Present and true only on audio rows; the file named by `filename` is a flac.
        sample_rate:
          type: string
          description: Sample rate in Hz of the generated audio. Stringified integer.
          example: "48000"
        audio_duration:
          type: string
          description: Requested audio duration in seconds. Stringified number.
        inference_steps:
          type: string
          description: Step count used by the audio pipeline. Stringified integer.

        # --- Conditional: advanced CFG (each key emitted independently) ---
        cfg_schedule_type:
          type: string
          description: CFG schedule shape. Passed through unstringified.
          example: constant
        cfg_schedule_min:
          type: string
          description: Minimum CFG scale of the schedule. Stringified number.
        cfg_schedule_max:
          type: string
          description: Maximum CFG scale of the schedule. Stringified number; a row whose recorded value was null yields the literal string `"None"`.
        cfg_schedule_power:
          type: string
          description: Exponent of the CFG schedule. Stringified number.
        cfg_rescale_snr_alpha:
          type: string
          description: CFG rescale SNR alpha. Stringified number.
        dynamic_threshold_percentile:
          type: string
          description: Dynamic thresholding percentile. Stringified number.
        dynamic_threshold_mimic_scale:
          type: string
          description: Dynamic thresholding mimic scale. Stringified number.

        # --- Conditional: misc ---
        unet_quantization:
          type: string
          nullable: true
          description: U-Net quantization mode recorded for the generation; emitted (possibly as null) whenever the key exists in `parameters`. Passed through unstringified.
          example: fp8_e4m3fn
        quantized_gemm_mode:
          type: string
          enum: [w8a8, dequant]
          description: |
            What the generation REQUEST asked for on the quantized-GEMM axis.
            Emitted only when the request forced a value; omitted when it was
            null and the process-level setting stood. Distinct from `fp8_gemm`,
            which records the path that actually resolved — the pair is what
            makes a rejected `w8a8` request legible after the fact.
          example: w8a8
        effective_warnings:
          type: array
          description: Feature-degradation notices recorded during the generation, kept as a list rather than stringified. Emitted only when the row recorded at least one.
          items:
            $ref: '#/components/schemas/GenerationWarning'
        ref_images:
          type: array
          description: SHA256 hashes of the reference images supplied for a reference-image generation. Emitted whenever the key exists, including as an empty array.
          items:
            type: string
        vision_encoder_name:
          type: string
          description: Vision encoder file name. Emitted only when `ref_images` is non-empty, so rows that merely inherited a loaded encoder do not report one.
        vision_encoder_hash:
          type: string
          description: SHA256 hash of the vision encoder model. Emitted under the same non-empty `ref_images` condition as `vision_encoder_name`.
        vae_name:
          type: string
          description: Identifies the VAE that decoded the image. Emitted whenever the row recorded one; the string format is not part of this contract and should be treated as an opaque label.
        vae_hash:
          type: string
          description: SHA256 hash of the VAE weight file. Suppressed on legacy rows where a per-generation VAE override decoded the image but the recorded hash belongs to the model's own VAE.
        fp8_gemm:
          type: string
          description: |
            Quantized Linear GEMM path that produced the image. Present only on
            rows from a weight-only FP8 checkpoint (Ideogram 4, Krea 2, Anima)
            or a weight-only INT8 checkpoint (Krea 2, Anima -- the Ideogram 4
            loader does not swap `Int8Linear`).
            Opaque mechanism label, kept as ONE field across both formats: the
            FP8 stems are `w8a8_scaled_mm(...)` / `dequant...` and the INT8 stems
            are `w8a8_int_mm(...)` / `int8_dequant...`. A mixed int8/e4m3
            checkpoint reports both, joined with `+`, FP8 label first. A `+fused` marker inside
            the parentheses records that the fused Triton epilogue/quantizer
            served the run (bitwise-identical output, so it does not distinguish
            two sets of pixels). The field name is historical; it is not
            FP8-specific.
          example: "dequant+w8a8_int_mm(int_mm+fused)"

    GeneratedImageSummary:
      type: object
      description: |
        Light per-row payload returned by `GET /images` (the gallery list
        endpoint). Omits the full `parameters` JSON and `mask_data` present on
        `GeneratedImage` -- those can carry embedded base64 (ControlNet/style
        reference images, inpaint masks) up to several MB per row and are only
        needed by the detail view. Fetch `GET /images/{image_id}` for the full
        `GeneratedImage` record when a gallery cell is opened.
      properties:
        id:
          type: integer
          example: 4821
        filename:
          type: string
          example: txt2img_20260711_155444_55555.png
        prompt:
          type: string
        negative_prompt:
          type: string
        generation_type:
          type: string
          enum: [txt2img, img2img, inpaint, outpaint, inpaint_vid, outpaint_vid, ref2vid, studio_render, outpaint_aud, txt2vid, img2vid, txt2aud, aud2aud, repaint, upscale]
        width:
          type: integer
        height:
          type: integer
        seed:
          type: integer
        created_at:
          type: string
          format: date-time
        is_favorite:
          type: boolean
        image_hash:
          type: string
          description: SHA256 hash of the generated image (used for source/reference-image lookups within the current page).
        is_video:
          type: boolean
        is_audio:
          type: boolean

    ImageListResponse:
      type: object
      description: One page of gallery rows returned by `GET /images`.
      required: [images, total, skip, limit]
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedImageSummary'
        total:
          type: integer
          description: Total number of rows matching the filters, before pagination.
        skip:
          type: integer
          description: Echo of the requested `skip` offset.
        limit:
          type: integer
          description: Echo of the requested `limit`.

    ModelInfo:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [safetensors, ckpt, diffusers]
        hash:
          type: string
        size:
          type: integer

    LoadedModelInfo:
      type: object
      additionalProperties: true
      properties:
        source_type:
          type: string
        source:
          type: string
        type:
          type: string
        variant:
          type: string
          nullable: true
        is_video:
          type: boolean
        is_audio:
          type: boolean
        model_revision:
          type: integer
        component_revision:
          type: integer
        text_encoder_file:
          type: string
          nullable: true
          description: |
            MiniMax-H3 only: basename of the text encoder the conditioning is
            produced by.
          example: qwen3vl_4b_heretic_tap24_bf16.safetensors
        clip_projection_file:
          type: string
          nullable: true
          description: |
            MiniMax-H3 only: basename of the trained projection a converted
            small text encoder's hidden state is mapped through, or null when
            a released 32B encoder is loaded (which needs none).
          example: mmh3-4b-ClipProj-celeb-mlp.safetensors
        te_text_only:
          type: boolean
          description: |
            MiniMax-H3 only: true when the loaded text encoder was converted
            without a vision tower. Such an encoder serves prompt-only
            (`/generate/txt2vid`) requests; `/generate/img2vid`,
            `/generate/ref2vid`, `/generate/outpaint/video` and
            `/generate/inpaint/video` are refused with 400.
          example: false

    CurrentModelResponse:
      type: object
      required: [loaded]
      properties:
        loaded:
          type: boolean
        model_info:
          allOf:
            - $ref: '#/components/schemas/LoadedModelInfo'
          nullable: true

    MiniMaxH3TextEncoderCandidate:
      type: object
      required: [path, name, size_bytes, compatible, variant, reason, requires_projection]
      properties:
        path:
          type: string
          description: Absolute path; this is what `text_encoder_file` takes.
          example: "M:/model/minimax_h3/text_encoders/qwen3vl_4b_heretic_tap24_bf16.safetensors"
        name:
          type: string
          example: qwen3vl_4b_heretic_tap24_bf16
        size_bytes:
          type: integer
          nullable: true
          example: 5624901632
        compatible:
          type: boolean
          description: Whether this build's H3 text-encoder loader implements this file.
          example: true
        variant:
          type: string
          description: |
            `bf16`, `int8_convrot`, `nvfp4_awq`, `converted_small`, `gguf_q8_0`,
            `gguf_unsupported` (a GGUF carrying a GGML type this build cannot
            dequantize), or `unknown`.
          example: converted_small
        reason:
          type: string
          description: Why the file is compatible, or why it is not.
        requires_projection:
          type: boolean
          description: |
            True when the file declares its own geometry and is narrower than the
            DiT's conditioning, i.e. it is usable only through a trained
            projection.
          example: true
        hidden_size:
          type: integer
          nullable: true
          description: The file's own declared width; null for the released 32B files.
          example: 2560
        num_hidden_layers:
          type: integer
          nullable: true
          description: |
            The file's own declared block count (the projection's tap). Null for a
            `.gguf`, which is not truncated — see `block_count`.
          example: 24
        block_count:
          type: integer
          nullable: true
          description: |
            `.gguf` only: how many decoder blocks the file carries. It is read to
            the paired projection's `tap`, which must not exceed this.
          example: 36
        projection:
          type: string
          nullable: true
          description: |
            Absolute path of the projection a load would pair with this encoder,
            resolved through the same gates the load path runs. Null when the
            encoder needs none, or when none resolves.
          example: "M:/model/minimax_h3/clip_projections/mmh3-4b-clipproj-celeb-mlp.safetensors"
        projection_reason:
          type: string
          nullable: true
          description: |
            Why no projection resolved for an encoder that requires one (no
            matching `d_in`, several matching, or a failed pairing gate).
        projection_candidates:
          type: array
          description: |
            Every `clip_projections/` file declaring this encoder's width, in
            filename order. Empty for an encoder that needs no projection.
          items:
            $ref: '#/components/schemas/MiniMaxH3ProjectionChoice'
        agreement:
          allOf:
            - $ref: '#/components/schemas/MiniMaxH3TextEncoderAgreement'
          nullable: true
          description: |
            Recorded agreement of this pairing with a released encoder, or null.

    MiniMaxH3TextEncoderAgreement:
      type: object
      additionalProperties: true
      description: Measured agreement of one (encoder, projection) pair.
      properties:
        reference:
          type: string
          example: qwen3vl_32b_minimax_h3_int8_convrot.safetensors
        projection:
          type: string
          description: The projection basename this measurement was taken on.
          example: mmh3-4b-clipproj-celeb-mlp.safetensors
        cosine:
          type: number
          description: Mean-removed cosine, post-`token_refiner`.
          example: 0.826
        rel_rms:
          type: number
          example: 0.214
        rel_rms_floor:
          type: number
          description: The same encoder in another quantization, i.e. the rounding floor.
          example: 0.048
        presentations:
          type: integer
          example: 111

    MiniMaxH3ClipProjectionCandidate:
      type: object
      required: [path, name, size_bytes, d_in, d_out, tap]
      properties:
        path:
          type: string
          description: Absolute path; this is what `clip_projection_file` takes.
          example: "M:/model/minimax_h3/clip_projections/mmh3-4b-clipproj-celeb-mlp.safetensors"
        name:
          type: string
          example: mmh3-4b-clipproj-celeb-mlp
        size_bytes:
          type: integer
          nullable: true
          example: 314572800
        d_in:
          type: integer
          description: Encoder width this projection takes.
          example: 2560
        d_out:
          type: integer
          description: DiT conditioning width it produces.
          example: 5120
        tap:
          type: integer
          description: Encoder block count it was trained against.
          example: 24

    MiniMaxH3ProjectionChoice:
      type: object
      required: [path, name, d_in, d_out, tap, usable, reason]
      description: |
        One projection offered for a specific text encoder. `usable` is the
        load path's own pairing gates run with this file named, so an entry
        matching `d_in` but failing the `d_out` or `tap` gate is listed as
        unusable with its reason rather than omitted.
      properties:
        path:
          type: string
          description: Absolute path; this is what `clip_projection_file` and `projection_path` take.
          example: "M:/model/minimax_h3/clip_projections/mmh3-4b-clipproj-celeb-mlp.safetensors"
        name:
          type: string
          example: mmh3-4b-clipproj-celeb-mlp
        d_in:
          type: integer
          example: 2560
        d_out:
          type: integer
          example: 5120
        tap:
          type: integer
          example: 24
        usable:
          type: boolean
          description: Whether every pairing gate passes for this (encoder, projection) pair.
          example: true
        reason:
          type: string
          nullable: true
          description: The refusal when `usable` is false; null otherwise.

    MiniMaxH3TextEncoderListResponse:
      type: object
      required: [selected, selected_reason, text_encoders, clip_projections]
      properties:
        selected:
          type: string
          nullable: true
          description: The encoder a load with no `text_encoder_file` would build.
        selected_reason:
          type: string
          nullable: true
          description: The loader's own reason string for that selection.
          example: preferred
        text_encoders:
          type: array
          items:
            $ref: '#/components/schemas/MiniMaxH3TextEncoderCandidate'
        clip_projections:
          type: array
          items:
            $ref: '#/components/schemas/MiniMaxH3ClipProjectionCandidate'

    MiniMaxH3ReferenceBankRequest:
      type: object
      required: [text_encoder_path]
      properties:
        text_encoder_path:
          type: string
          description: |
            The released text encoder the client believes is loaded, as a path
            or a bare file name. Cross-checked against the loaded encoder; a
            mismatch is refused rather than relabelled.
          example: "M:/model/minimax_h3/text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
    MiniMaxH3ReferenceBankJob:
      type: object
      description: |
        Reference-bank job document. Before the first build of this backend
        process it is the single key `{"state": "idle"}`.
      required: [state]
      properties:
        job_id:
          type: string
          example: "9c2f1a70b4de"
        state:
          type: string
          enum: [idle, running, completed, cancelled, failed]
          example: running
        reference:
          type: string
          nullable: true
          description: Text encoder the bank is being built from.
          example: qwen3vl_32b_minimax_h3_int8_convrot.safetensors
        processed:
          type: integer
          description: Presentations encoded so far.
          example: 47
        total:
          type: integer
          description: |
            Presentations in the suite corpus. 0 until the first presentation is
            encoded, because the composites are built by tokenizing the prompts.
          example: 111
        message:
          type: string
          example: "encoding presentation p046"
        error:
          type: string
          nullable: true
          example: null
        result:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            The stored bank's manifest when `state` is `completed`: reference
            file and identity, suite version and digest, presentation count,
            token total, and build seconds.
        started_at:
          type: number
          format: double
          example: 1786500123.4
        finished_at:
          type: number
          format: double
          nullable: true
          example: null
    MiniMaxH3ReferenceBankSummary:
      type: object
      description: One stored reference bank.
      required: [reference, suite_version, presentations]
      properties:
        reference:
          type: string
          description: The released text encoder this bank was built from.
          example: qwen3vl_32b_minimax_h3_int8_convrot.safetensors
        suite_version:
          type: string
          example: h3-te-suite-v1
        presentations:
          type: integer
          example: 111
        token_total:
          type: integer
          example: 12480
        hidden_size:
          type: integer
          example: 5120
        built_at:
          type: string
          nullable: true
          example: "2026-08-13T09:14:02"
        is_loaded_encoder:
          type: boolean
          description: |
            True when this bank was built from the encoder loaded right now. A
            bank built from a different released encoder does not answer for it.
          example: true
    MiniMaxH3StoredMeasurement:
      type: object
      description: |
        One stored substitute measurement. `stage` is `token_refiner` when the
        DiT's context embedder and token refiner were available (what the packed
        sequence actually contains) and `raw` when they were not.
      required: [encoder, reference, cosine, rel_rms, presentations, stage]
      properties:
        encoder:
          type: string
          example: qwen3vl_4b_heretic_tap24_bf16.safetensors
        projection:
          type: string
          nullable: true
          example: mmh3-4b-clipproj-celeb-mlp.safetensors
        reference:
          type: string
          example: qwen3vl_32b_minimax_h3_int8_convrot.safetensors
        cosine:
          type: number
          description: Mean-removed cosine, median over non-sink rows.
          example: 0.843
        cosine_baseline:
          type: number
          nullable: true
          description: The same statistic for a constant predictor, measured alongside.
          example: -0.022
        rel_rms:
          type: number
          example: 0.205
        rel_rms_baseline:
          type: number
          nullable: true
          example: 1.02
        presentations:
          type: integer
          example: 111
        stage:
          type: string
          enum: [token_refiner, raw]
          example: token_refiner
        suite_version:
          type: string
          example: h3-te-suite-v1
        measured_at:
          type: string
          nullable: true
          example: "2026-08-13T09:20:41"
    MiniMaxH3TeAgreementStatus:
      type: object
      required: [supported, can_build, suite, cost, banks, measurements, job]
      properties:
        supported:
          type: boolean
          description: True when the loaded model is MiniMax-H3.
          example: true
        can_build:
          type: boolean
          description: True when a build started right now would be accepted.
          example: true
        reason:
          type: string
          nullable: true
          description: Why `can_build` is false; null when it is true.
          example: "an image generation is running"
        model_path:
          type: string
          nullable: true
          description: The tree the `measurements` list was filtered to.
          example: "M:/model/minimax_h3"
        loaded:
          type: object
          nullable: true
          description: The loaded MiniMax-H3 text-encoder pairing; null when none is loaded.
          properties:
            text_encoder:
              type: string
              example: qwen3vl_32b_minimax_h3_int8_convrot.safetensors
            text_encoder_path:
              type: string
              example: "M:/model/minimax_h3/text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
            projection:
              type: string
              nullable: true
              example: null
            is_substitute:
              type: boolean
              description: |
                True when the loaded encoder runs through a projection. Such an
                encoder cannot be a reference.
              example: false
            substitution:
              type: string
              nullable: true
              description: |
                The backend's single wording for a substituted pairing, stating
                whether the number was measured on this installation or comes
                from the compiled-in table measured elsewhere. Null for a
                released encoder.
        suite:
          type: object
          description: The tracked, versioned prompt suite a bank is built from.
          properties:
            version:
              type: string
              example: h3-te-suite-v1
            prompts:
              type: integer
              description: |
                Prompts in the suite. The corpus is these plus the long-form
                composites built from them, so a bank holds more presentations
                than this.
              example: 102
            digest:
              type: string
              description: Content digest; an edited suite at the same version does not match a stored record.
              example: "6b1d0f..."
        cost:
          type: object
          description: |
            What a build costs, measured on the 25 GB released encoder for the
            suite version named here. Reported so a client can state the cost
            before the user commits to it.
          properties:
            suite_version:
              type: string
              example: h3-te-suite-v1
            seconds:
              type: integer
              example: 300
            host_ram_gib_min:
              type: integer
              example: 14
            host_ram_gib_max:
              type: integer
              example: 24
            stored_mb:
              type: integer
              example: 39
        bank:
          allOf:
            - $ref: '#/components/schemas/MiniMaxH3ReferenceBankSummary'
          nullable: true
          description: The stored bank built from the LOADED encoder; null when none was.
        banks:
          type: array
          description: Every readable bank in this installation's store.
          items:
            $ref: '#/components/schemas/MiniMaxH3ReferenceBankSummary'
        measurements:
          type: array
          description: Stored measurements involving a file in `model_path`'s tree.
          items:
            $ref: '#/components/schemas/MiniMaxH3StoredMeasurement'
        measurements_reason:
          type: string
          nullable: true
          description: Why `measurements` could not be filtered to the tree; null when it was.
          example: null
        job:
          $ref: '#/components/schemas/MiniMaxH3ReferenceBankJob'

    ComponentSlotId:
      type: string
      enum: [text_encoder, vision_encoder, backbone, vae, audio_vae]

    ComponentCandidate:
      type: object
      required:
        - candidate_id
        - slot
        - kind
        - display_name
        - origin
        - compatibility
        - switchable
        - is_current
      properties:
        candidate_id:
          type: string
        slot:
          $ref: '#/components/schemas/ComponentSlotId'
        kind:
          type: string
          enum: [text_encoder, vision_encoder, transformer, unet, vae, audio_vae]
        display_name:
          type: string
        origin:
          type: string
          enum: [embedded_checkpoint, model_tree, architecture_default, selected_external, unused, unavailable]
        path_display:
          type: string
          nullable: true
        container_size_bytes:
          type: integer
          nullable: true
        estimated_component_size_bytes:
          type: integer
          nullable: true
        compatibility:
          type: string
          enum: [compatible, unknown, incompatible]
        compatibility_reason:
          type: string
          nullable: true
        switchable:
          type: boolean
        switch_reason:
          type: string
          nullable: true
        is_current:
          type: boolean
        load_strategy:
          type: string
          enum: [none, standalone, embedded_extract, architecture_resolved, unsupported]
        variant:
          type: string
          nullable: true
        requires_projection:
          type: boolean
          description: |
            MiniMax-H3 text encoders only: true when the file is a small stand-in
            encoder (converted or `.gguf`), usable only through a trained
            projection.
          example: true
        projection:
          type: string
          nullable: true
          description: |
            MiniMax-H3 text encoders only: the `clip_projections/` file this
            candidate would be paired with (the loaded one, on the current row),
            or null when the encoder needs none, when several declare its width,
            or when none resolves. A candidate that needs one and has no usable
            one is reported incompatible, with the reason in
            `compatibility_reason`.
          example: mmh3-4b-clipproj-celeb-mlp.safetensors
        projection_candidates:
          type: array
          description: |
            MiniMax-H3 text encoders only: the projections declaring this
            encoder's width. When more than one is usable, `projection` is null
            and the switch request must name one in `projection_path`.
          items:
            $ref: '#/components/schemas/MiniMaxH3ProjectionChoice'
        agreement:
          allOf:
            - $ref: '#/components/schemas/MiniMaxH3TextEncoderAgreement'
          nullable: true
          description: |
            MiniMax-H3 text encoders only: recorded agreement of this
            (encoder, projection) pair with a released encoder, or null when the
            pair is unmeasured.

    EffectiveComponent:
      type: object
      required:
        - candidate_id
        - slot
        - kind
        - display_name
        - origin
        - residency
        - embedded
      properties:
        candidate_id:
          type: string
        slot:
          $ref: '#/components/schemas/ComponentSlotId'
        kind:
          type: string
        display_name:
          type: string
        origin:
          type: string
        residency:
          type: string
          description: >-
            Where the component is right now. `resident` is on the GPU,
            `configured` is a known path that is not currently loaded, and
            `unloaded` is neither. Provenance, which can be unknown, is
            reported by `origin` instead.
          enum: [resident, configured, unloaded]
        embedded:
          type: boolean
        path_display:
          type: string
          nullable: true
        container_size_bytes:
          type: integer
          nullable: true

    ComponentSlotState:
      type: object
      required: [slot, visible, switchable, candidates]
      properties:
        slot:
          $ref: '#/components/schemas/ComponentSlotId'
        visible:
          type: boolean
          description: >-
            Whether the loaded architecture has this slot at all. `audio_vae`
            is shown only for LTX-2.3 and MiniMax-H3, and `vision_encoder` only
            for SD1.5/SDXL, which are the architectures with reference
            conditioning. A hidden slot still carries its state; it just has
            nothing to offer.
        current:
          allOf:
            - $ref: '#/components/schemas/EffectiveComponent'
          nullable: true
        runtime_override:
          allOf:
            - $ref: '#/components/schemas/EffectiveComponent'
          nullable: true
        switchable:
          type: boolean
        reason:
          type: string
          nullable: true
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ComponentCandidate'

    CurrentComponentsResponse:
      type: object
      required: [loaded, model_revision, component_revision, health, architecture, slots]
      properties:
        loaded:
          type: boolean
        model_revision:
          type: integer
        component_revision:
          type: integer
        health:
          type: string
          enum: [ready, mutating, degraded, unloaded]
        architecture:
          type: string
          nullable: true
        operation:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            The most recent component switch, or null if none has run. Carries
            `id`, `slot`, `state` (waiting/running/succeeded/failed), `phase`,
            `started_at`/`finished_at`, and `error` when it failed.
            `discarded_overrides` lists the per-generation overrides an Anima
            switch dropped, since reloading the model releases the components
            those overrides referred to.
        slots:
          type: array
          items:
            $ref: '#/components/schemas/ComponentSlotState'

    ComponentSwitchRequest:
      type: object
      required: [slot, candidate_id, expected_model_revision, expected_component_revision]
      properties:
        slot:
          $ref: '#/components/schemas/ComponentSlotId'
        candidate_id:
          type: string
        expected_model_revision:
          type: integer
        expected_component_revision:
          type: integer
        projection_path:
          type: string
          nullable: true
          description: |
            MiniMax-H3 text-encoder switches only: absolute path of the
            projection to pair with the new encoder, from the candidate's
            `projection_candidates`. Required when several declare that
            encoder's width, since auto-discovery refuses to choose. Sending it
            for any other architecture or slot is rejected with 422.
          example: "M:/model/minimax_h3/clip_projections/mmh3-4b-clipproj-celeb-mlp.safetensors"

    ComponentSwitchResponse:
      type: object
      required: [success, operation, components]
      properties:
        success:
          type: boolean
        operation:
          type: object
          additionalProperties: true
        components:
          $ref: '#/components/schemas/CurrentComponentsResponse'

    ErrorResponse:
      type: object
      required:
        - error
        - status_code
        - timestamp
        - path
      properties:
        error:
          type: string
          description: Error message
          example: "Generation failed"
        detail:
          type: string
          description: Detailed error information
          example: "Invalid parameter: steps must be between 1 and 150"
        status_code:
          type: integer
          description: HTTP status code
          example: 400
        timestamp:
          type: string
          format: date-time
          description: Error occurrence timestamp (ISO 8601)
          example: "2025-11-28T12:34:56.789Z"
        path:
          type: string
          description: Request path that caused the error
          example: "/generate/txt2img"

    VideoChainIssue:
      type: object
      description: >-
        One validator finding. `severity: error` blocks the chain from
        starting; `severity: warning` is advisory (an unused reference, a
        segment left with no reference, a grid-snap overshoot).
      required: [code, severity, message]
      properties:
        code:
          type: string
          description: Stable machine-readable identifier for the finding.
          example: "event_owned_by_no_segment"
        severity:
          type: string
          enum: [error, warning]
          description: Errors block generation; warnings do not.
          example: "error"
        message:
          type: string
          description: Human-readable explanation shown in the plan editor.
          example: "Event 'ev_3' spans frames 990-1020, outside the planned clip."
        segment_index:
          type: integer
          nullable: true
          minimum: 0
          description: Segment the finding belongs to, if any.
          example: 2
        event_id:
          type: string
          nullable: true
          description: Canonical-timeline event the finding belongs to, if any.
          example: "ev_3"
        reference_id:
          type: string
          nullable: true
          description: Reference the finding belongs to, if any.
          example: "ref_0"

    VideoChainSourceSpan:
      type: object
      description: >-
        Character range of the root prompt an event was extracted from, so the
        editor can show provenance and the validator can check that nothing in
        the root prompt was dropped.
      required: [start_char, end_char]
      properties:
        start_char:
          type: integer
          minimum: 0
          description: Inclusive start offset into `root_prompt`.
          example: 128
        end_char:
          type: integer
          minimum: 0
          description: Exclusive end offset into `root_prompt`.
          example: 194

    VideoChainEvent:
      type: object
      description: >-
        One normalized occurrence from the canonical timeline. Frame range is
        half-open `[start_frame, end_frame)` in GLOBAL frames; an event is
        owned by exactly one segment.
      required: [id, kind, start_frame, end_frame, description]
      properties:
        id:
          type: string
          description: Stable identifier, unique within the manifest.
          example: "ev_3"
        kind:
          type: string
          enum:
            - shot
            - visual_action
            - camera
            - dialogue
            - physical_sound
            - music_transition
            - state_change
          description: >-
            What sort of occurrence this is; the same set the planner's
            canonical timeline uses. `shot` is what the deterministic
            MiniMax-H3 path produces for every `[Shot N]` block, and shots are
            the only kind required to tile the clip without gaps or overlaps —
            the other kinds may overlap each other freely (a sound continues
            through a camera move) and are only range-checked. Dialogue,
            on-screen text and lyrics are kept verbatim and placed in exactly
            one segment.
          example: "shot"
        start_frame:
          type: integer
          minimum: 0
          description: Inclusive global start frame.
          example: 720
        end_frame:
          type: integer
          minimum: 0
          description: Exclusive global end frame.
          example: 810
        description:
          type: string
          description: The occurrence itself, in the root prompt's own wording.
          example: "The woman reaches the window and pushes it open."
        subject_ids:
          type: array
          items:
            type: string
          description: Subjects from `persistent_context.subjects` involved here.
          example: ["subj_woman"]
        one_shot:
          type: boolean
          default: true
          description: >-
            True when re-enacting the event in a later segment would be wrong.
            One-shot events are removed from every non-owning segment's prompt
            and folded into the next segment's `incoming_state`.
          example: true
        must_complete:
          type: boolean
          default: false
          description: >-
            True when the event may not be split across a segment boundary.
            A must-complete event straddling a boundary is a hard error.
          example: false
        resulting_state:
          type: string
          description: State that persists after the event, carried forward as incoming state.
          example: "The window is open; the woman stands in front of it."
        source_span:
          allOf:
            - $ref: '#/components/schemas/VideoChainSourceSpan'
          nullable: true
          description: Where in the root prompt this event came from. Null for a manually authored event.
        shot_number:
          type: integer
          nullable: true
          minimum: 1
          default: null
          description: >-
            The `[Shot N]` number this event was parsed from, in the ROOT
            prompt's numbering. Non-null only for `kind: shot`. Segment prompts
            renumber their own shots from 1, so this is provenance, not the
            number that appears in a compiled prompt. Null for any event that
            did not come from a shot marker.
          example: 2
        verbatim:
          type: array
          items:
            type: string
          description: >-
            Quoted spans (dialogue, lyrics, on-screen text) detected inside
            `description`, which the validator requires to appear in exactly
            one segment prompt. Omit it and the server re-derives it from
            `description` with the same detector the planner used, so a client
            never has to author this field.
          example: ["\"Don't open it.\""]

    VideoChainPersistentContext:
      type: object
      description: >-
        Constraints that do not change over the clip. Restated in full in every
        segment prompt — this is the only content that is deliberately repeated.
      properties:
        subjects:
          type: array
          items:
            type: string
          description: Identity/appearance/wardrobe descriptions, one per subject.
          example: ["subj_woman: a woman in a dark green coat, shoulder-length black hair"]
        environment:
          type: array
          items:
            type: string
          description: Location, time of day, weather.
          example: ["A narrow apartment room at dusk, rain on the glass"]
        visual_style:
          type: array
          items:
            type: string
          description: Style, film stock, grade, lens character.
          example: ["Muted anamorphic film look, soft practical lighting"]
        camera_rules:
          type: array
          items:
            type: string
          description: Camera grammar that holds for the whole clip.
          example: ["Handheld, eye level, no whip pans"]
        audio_bed:
          type: array
          items:
            type: string
          description: Ambience that continues across every segment.
          example: ["Continuous rain against the window"]
        hard_constraints:
          type: array
          items:
            type: string
          description: >-
            User constraints with the highest precedence; never overridden by
            planned or observed state.
          example: ["No on-screen text", "No additional characters"]

    VideoChainSegmentState:
      type: object
      description: >-
        Condition of the scene at a segment boundary. `incoming_state` is what
        already holds when the segment starts (past events folded into a state
        rather than re-narrated); `outgoing_state` is what must hold at its end.

        **Round-trip rule.** The planner's compiler produces boundary state as
        plain sentences, not as a slot-filled record, so a planned manifest
        carries them in `ongoing_actions` and leaves the other slots empty
        rather than inventing a `camera` or `lighting` value it did not derive.
        On the way back in every slot is read: an editor that fills `summary`,
        `subjects`, `camera`, `lighting` or `ongoing_audio` keeps that text,
        which is concatenated in the order the properties are listed here. The
        object shape is therefore the contract, and it is lossless in both
        directions; it is not a hint that the planner infers per-slot state.
      properties:
        summary:
          type: string
          description: One-line statement of the boundary condition.
          example: "The woman is mid-stride toward the window."
        subjects:
          type: array
          items:
            type: string
          description: Per-subject pose/position/expression at the boundary.
          example: ["subj_woman: walking, three steps from the window, facing away"]
        camera:
          type: string
          description: Camera position and motion at the boundary.
          example: "Slow push-in from behind, waist height"
        lighting:
          type: string
          description: Lighting state at the boundary.
          example: "Cool window light from frame left, interior lamp off"
        ongoing_actions:
          type: array
          items:
            type: string
          description: Actions in progress across the boundary (not one-shot).
          example: ["walking toward the window"]
        ongoing_audio:
          type: array
          items:
            type: string
          description: Sound continuing across the boundary.
          example: ["rain", "footsteps on wood"]

    VideoChainReference:
      type: object
      description: >-
        A conditioning reference and the segments it is bound to. Binding is
        many-to-many: `segment_indices` may list non-contiguous segments, and a
        segment may appear in several references. `segments[].reference_ids` is
        a read-only inverse of this list — a disagreement between the two is a
        validation error.
      required: [id, kind, label, segment_indices, binding_source]
      properties:
        id:
          type: string
          description: Stable identifier, unique within the manifest.
          example: "ref_0"
        kind:
          type: string
          enum: [image, video, audio]
          description: Reference modality. The bytes themselves are never part of the plan.
          example: "image"
        label:
          type: string
          description: >-
            Display name only (typically the original filename). Not a path and
            not resolved server-side.
          example: "protagonist_sheet.png"
        segment_indices:
          type: array
          items:
            type: integer
            minimum: 0
          description: >-
            Segments this reference is passed to, ascending. With
            `binding_source: default_all` this is the full segment list.
          example: [0, 2]
        binding_source:
          type: string
          enum: [default_all, explicit, token_implied]
          default: default_all
          description: >-
            `default_all` — the request stated no segments, so the reference
            applies to every segment (the backward-compatible carry-to-all
            behaviour). `explicit` — the segment set was chosen by the caller.
            `token_implied` — at least one segment was added because its
            compiled text names this reference's `token`. A segment that
            mentions a reference receives it, so narrowing can never cut a
            token out of the middle of a sentence; the widening is reported in
            `warnings` rather than performed silently.
          example: "explicit"
        token:
          type: string
          nullable: true
          default: null
          description: >-
            The reference token this entry carries in the ROOT prompt, e.g.
            `<Picture 2>`. It is what lets the compiler renumber tokens per
            segment: a segment that receives a subset of the references does
            not inherit the root prompt's numbering. Assigned from the request
            inventory order per kind when the request did not state one.
          example: "<Picture 2>"

    VideoChainReferenceInput:
      type: object
      description: >-
        Reference inventory entry for a plan request: kind and label only. No
        file content, no base64, no server path — the planner needs to know how
        many references a segment carries and in what order, not what they show.
      required: [id, kind, label]
      properties:
        id:
          type: string
          description: Caller-assigned identifier, echoed into the manifest.
          example: "ref_0"
        kind:
          type: string
          enum: [image, video, audio]
          description: Reference modality.
          example: "image"
        label:
          type: string
          description: Display name (typically the original filename).
          example: "protagonist_sheet.png"
        segment_indices:
          type: array
          nullable: true
          items:
            type: integer
            minimum: 0
          default: null
          description: >-
            Segments to bind this reference to. Omit or send null to apply it to
            every segment (`binding_source: default_all`).
          example: [0, 2]
        token:
          type: string
          nullable: true
          default: null
          description: >-
            The token this reference already carries in `root_prompt`, e.g.
            `<Picture 2>`. Omit it and the planner derives it from this
            inventory's order per kind (`<Picture 1>`, `<Picture 2>`, …), which
            is the order the references are passed to the model and therefore
            the order the root prompt numbers them in. Send it only when the
            root prompt's numbering differs from the inventory order.
          example: "<Picture 2>"

    VideoChainVisualContext:
      type: object
      description: >-
        What pixel-side context a segment actually receives from its
        predecessor. `initial`, `boundary_frame`, `pinned_tail` and
        `motion_preroll` are produced today.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [initial, boundary_frame, pinned_tail, motion_preroll, tail_reference_video, sampler_state]
          description: >-
            `initial` — the first segment, which has no predecessor.
            `boundary_frame` — the predecessor's final frame as the anchor.
            `pinned_tail` — its last `shared_context_frames` frames pinned as
            this segment's leading latent frames.
            `motion_preroll` — those same frames regenerated with
            `anchor_count` anchors on them and then discarded.
            The remaining modes are per-architecture capabilities and are only
            valid when the architecture advertises them.
          example: "boundary_frame"
        frames:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Context length in frames for modes that take one (tail
            reference-video window). Null for `initial`/`boundary_frame`; a
            pinned tail and a motion pre-roll state their length in
            `shared_context_frames`, which is the number the frame arithmetic
            used.
          example: null
        anchor_local_frames:
          type: array
          nullable: true
          items:
            type: integer
            minimum: 0
          description: >-
            `motion_preroll` only: the frames of THIS segment's generated span
            the anchors sit on, ascending. Local indices — 0 is the pre-roll's
            oldest frame and `shared_context_frames - 1` is the boundary frame.
            Spread uniformly, and therefore a function of the pre-roll length
            and `anchor_count` alone; fixed here so a retry conditions on the
            same frames. Null for every other mode.
          example: null
        anchor_count:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            `motion_preroll` only: how many anchors were placed, i.e. the length
            of `anchor_local_frames`. Null for every other mode.
          example: null
        source_segment_index:
          type: integer
          nullable: true
          minimum: 0
          description: Segment the context is taken from. Null for `initial`.
          example: 0
        shared_context_frames:
          type: integer
          nullable: true
          minimum: 0
          default: null
          description: >-
            Frames this segment shares in time with its predecessor: 1 under
            `boundary_frame` (the shared anchor), null for `initial`. A mode
            that overlaps several frames reports the overlap here, and
            `segments[].effective_overlap_frames` stays the authoritative
            value used in the frame arithmetic. Omitting it on a
            `boundary_frame` context is read back as 1.
          example: 1

    VideoChainSegment:
      type: object
      description: >-
        One model invocation. `generated_span_frames` includes the shared
        anchor frame, which is the same instant as the previous segment's last
        frame, so this segment adds `generated_span_frames - 1` new frames.
        Ownership is half-open `[owned_start_frame, owned_end_frame)`.
      required:
        - index
        - anchor_global_frame
        - owned_start_frame
        - owned_end_frame
        - generated_span_frames
        - prompt
        - seed
        - visual_context
      properties:
        index:
          type: integer
          minimum: 0
          description: Zero-based position in the chain.
          example: 1
        anchor_global_frame:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Global frame that local index 0 of this segment reproduces
            (`accumulated_frames_before - 1`). Null for segment 0, which has no
            predecessor to share an anchor with.
          example: 361
        owned_start_frame:
          type: integer
          minimum: 0
          description: >-
            Inclusive first global frame this segment owns. For a continuation
            this is `anchor_global_frame + 1` — the shared anchor is owned by
            the previous segment, so a boundary action is never assigned twice.
          example: 362
        owned_end_frame:
          type: integer
          minimum: 0
          description: Exclusive last global frame this segment owns.
          example: 723
        generated_span_frames:
          type: integer
          minimum: 1
          description: >-
            Frames this invocation asks the model for, including the shared
            anchor. Snapped to the architecture's frame grid.
          example: 362
        requested_total_frames:
          type: integer
          nullable: true
          minimum: 1
          default: null
          description: >-
            The `total_frames` this segment's generation request asks for: the
            accumulated clip length after it runs, not its generated span. It
            equals `owned_end_frame` for every segment, segment 0 included, and
            is stated so a client never has to re-derive a request parameter.
            Omit it (or send null) in an edited manifest and the server derives
            it from `owned_end_frame`.
          example: 723
        prompt:
          type: string
          description: >-
            The compiled prompt actually sent for this segment: persistent
            context, incoming state, owned events, outgoing state, and this
            segment's own soundscape, with timestamps rebased so that local
            time zero is the shared anchor.
          example: "[Shot 1] The woman reaches the window and pushes it open. ..."
        negative_prompt:
          type: string
          description: Negative prompt for this segment (usually the root value).
          example: ""
        incoming_state:
          allOf:
            - $ref: '#/components/schemas/VideoChainSegmentState'
          description: >-
            State already established when the segment begins. A planned
            manifest carries the compiler's sentences in `ongoing_actions`; see
            the round-trip rule on `VideoChainSegmentState`.
        outgoing_state:
          allOf:
            - $ref: '#/components/schemas/VideoChainSegmentState'
          description: >-
            State that must hold at the segment's end, filled from the last
            owned event's `resulting_state`. Carried the same way as
            `incoming_state`.
        owned_event_ids:
          type: array
          items:
            type: string
          description: Events this segment performs, once. Every event has exactly one owner.
          example: ["ev_3", "ev_4"]
        reference_ids:
          type: array
          items:
            type: string
          description: >-
            Read-only inverse of `references[].segment_indices`, in the order
            the backend adapter passes them to the model. Prompt reference
            tokens are renumbered to match this order.
          example: ["ref_0"]
        seed:
          type: integer
          description: >-
            Concrete seed frozen at plan time. Never -1 in a manifest and never
            re-drawn at generation time.
          example: 1234567890
        visual_context:
          $ref: '#/components/schemas/VideoChainVisualContext'
        continuation_state_in:
          type: string
          nullable: true
          default: null
          description: >-
            Opaque server-side id of the sampler state imported at the start of
            this segment. Always null in Phase A (no continuation-state
            artifacts exist yet); reserved so the manifest shape does not change
            when they do.
          example: null
        continuation_state_out:
          type: string
          nullable: true
          default: null
          description: >-
            Opaque server-side id of the sampler state captured at the end of
            this segment. Always null in Phase A.
          example: null
        requested_overlap_frames:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Shared frames requested between this segment and its predecessor.
            0 = the single shared anchor frame.
          example: 0
        effective_overlap_frames:
          type: integer
          minimum: 0
          description: >-
            The overlap the plan's frame arithmetic actually used: 0 for
            `boundary_frame` (an anchor is shared, but nothing is pinned) and
            the resolved, VAE-group-aligned pin length for a pinning mode. This
            value, not the requested one, is what
            `anchor_global_frame` / `owned_end_frame` were computed from.
          example: 0
        effective_overlap_samples:
          type: integer
          minimum: 0
          description: >-
            Authoritative audio overlap in samples, matching
            `effective_overlap_frames` in physical time so rounding does not
            accumulate across segments. 0 under `motion_preroll`, which pins
            nothing: its pre-roll's audio is generated and discarded with its
            video.
          example: 0
        requested_anchor_count:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Anchors requested on this segment's pre-roll (`motion_preroll`
            only); 0 for every other mode. Where they landed is
            `visual_context.anchor_local_frames`.
          example: 0

    VideoChainManifest:
      type: object
      description: >-
        The complete, immutable plan for one chain. Fixed before generation
        starts; queued items read from it and never mutate it. Frame ranges are
        half-open and expressed in integer frames — seconds are display-only.
      required:
        - manifest_version
        - chain_id
        - plan_hash
        - architecture
        - root_prompt
        - root_prompt_hash
        - fps
        - target_frames
        - expected_final_frames
        - context_mode
        - continuation_mode
        - seed_policy
        - segments
      properties:
        manifest_version:
          type: integer
          minimum: 1
          default: 1
          description: Manifest schema version. A client holding an older version must re-plan.
          example: 1
        chain_id:
          type: string
          format: uuid
          description: >-
            Identifier for this chain, recorded on every generated segment. A
            fresh one is issued per plan call and it is excluded from
            `plan_hash`: it identifies the run, not the content.
          example: "1f0d2a6e-9a1b-4f0e-9f2c-2a7f0f1c33b4"
        plan_hash:
          type: string
          description: >-
            sha256 over the canonical form of this manifest, excluding
            `plan_hash`, `warnings`, `chain_id` and run-time-written fields.
            Two plans with identical content therefore share a hash, which is
            what makes `seed_policy: derived` reproducible. Computed by one
            backend function; clients display it and never recompute it.
          example: "8f14e45fceea167a5a36dedd4bea2543f1c1b7c8f1d1a0e4c1a0b7f3d2e5a6b7"
        architecture:
          type: string
          description: Architecture the plan was computed for.
          example: "minimax_h3"
        variant:
          type: string
          nullable: true
          description: Loaded variant, which decides the available continuation modes.
          example: "fl2va"
        root_prompt:
          type: string
          description: >-
            The user's original full-length prompt. Kept for provenance; never
            sent verbatim to a segment unless `context_mode` is `legacy_repeat`.
          example: "A woman stands up, walks to the window, opens it and looks outside..."
        root_prompt_hash:
          type: string
          description: >-
            sha256 of `root_prompt`, so gallery rows can reference it without
            copying it. Always present, including on the geometry-only manifest
            a failed plan returns.
          example: "c2b7d0f1a3e4c5b6a7981f0e2d3c4b5a69788796a5b4c3d2e1f0a9b8c7d6e5f4"
        fps:
          type: number
          format: float
          minimum: 1
          maximum: 240
          description: Frame rate the frame/second conversions in this plan assume.
          example: 24.0
        target_frames:
          type: integer
          minimum: 1
          description: Final length the user asked for, before grid snapping.
          example: 1000
        expected_final_frames:
          type: integer
          minimum: 1
          description: >-
            Length the chain will actually produce after grid snapping and
            shared-anchor de-duplication. May exceed `target_frames`.
          example: 1016
        context_mode:
          type: string
          enum: [timeline, manual, legacy_repeat]
          default: timeline
          description: How segment prompts were produced.
          example: "timeline"
        segment_length_mode:
          type: string
          enum: [fixed, shot_aligned]
          default: fixed
          description: >-
            How the segment boundaries in `segments[]` were chosen. This is the
            mode that was APPLIED, which is not always the one requested:
            `shot_aligned` falls back to `fixed` when the prompt has no shot
            boundary inside the clip, and says so in `warnings` when it was
            requested by name. A request that names no mode is resolved from the
            timeline, so this field is where a client reads what happened. The
            `default` here is what a manifest that does not carry the field is
            read as — everything planned before shot alignment existed was
            fixed-length. Under `fixed`
            every segment is the same length (bar the last), so a client may
            re-derive a continuation's length from the cap; under
            `shot_aligned` the lengths differ per segment and the per-segment
            values here are the only source for them.
          example: "fixed"
        continuation_mode:
          type: string
          enum: [boundary_frame, pinned_tail, motion_preroll, tail_reference_video, sampler_state]
          default: boundary_frame
          description: >-
            What each continuation receives from its predecessor.
            `boundary_frame` and `pinned_tail` are implemented; the others
            require an explicit architecture capability. Every mode is checked
            against `chain_context[architecture].chain_continuation_modes`.
          example: "boundary_frame"
        seed_policy:
          type: string
          enum: [fixed, derived, explicit]
          default: fixed
          description: >-
            How `segments[].seed` was assigned. `fixed` reuses the root seed
            everywhere (today's behaviour, and what keeps a text-only A/B
            honest); `derived` hashes root seed, plan hash and segment index;
            `explicit` takes per-segment values from the editor.
          example: "fixed"
        root_seed:
          type: integer
          description: >-
            The resolved root seed. A requested -1 is drawn once during planning
            and frozen here.
          example: 1234567890
        chain_drift_tolerance_frames:
          type: integer
          minimum: 0
          default: 12
          description: >-
            Allowed divergence between planned and actual accumulated frames
            before the chain pauses for a user decision. Exceeding it never
            silently continues. Echoed from the request and **excluded from
            `plan_hash`**: it is a run-time knob that changes no prompt, seed or
            frame range, so two otherwise identical plans must keep the same
            hash across a change to it.
          example: 12
        persistent_context:
          $ref: '#/components/schemas/VideoChainPersistentContext'
        references:
          type: array
          items:
            $ref: '#/components/schemas/VideoChainReference'
          description: Reference inventory and its many-to-many segment binding. Authoritative.
        events:
          type: array
          items:
            $ref: '#/components/schemas/VideoChainEvent'
          description: Canonical timeline. Empty under `legacy_repeat`.
        segments:
          type: array
          items:
            $ref: '#/components/schemas/VideoChainSegment'
          description: Segments in execution order.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/VideoChainIssue'
          description: >-
            Advisory findings, the same objects `/video-chain/plan` returns at
            the top level, repeated here so a stored manifest keeps them.
            Excluded from `plan_hash`, and ignored on input: `/video-chain/validate`
            discards whatever is sent and returns the findings of the
            validators it just re-ran.

    VideoChainPlanRequest:
      type: object
      description: >-
        Input to the planner. Carries no media: references are described by
        kind and label only.
      required: [architecture, root_prompt, target_frames]
      properties:
        architecture:
          type: string
          description: >-
            Architecture to plan for; must match the loaded model. Decides the
            frame grid, the maximum segment span and the legal continuation
            modes.
          example: "minimax_h3"
        variant:
          type: string
          nullable: true
          default: null
          description: Loaded variant (e.g. MiniMax-H3 `fl2va` / `ref2va` / `ia2v`).
          example: "fl2va"
        root_prompt:
          type: string
          description: The user's full-length prompt for the whole clip.
          example: "A woman stands up, walks to the window, opens it and looks outside..."
        negative_prompt:
          type: string
          default: ""
          description: Negative prompt applied to every segment.
          example: ""
        workflow:
          type: string
          nullable: true
          default: null
          description: >-
            Architecture-specific prompt workflow (e.g. MiniMax-H3 `base` vs
            full-reference). Null uses the loaded variant's default.
          example: "base"
        target_frames:
          type: integer
          minimum: 1
          description: >-
            Desired final length in frames. The plan may overshoot this to land
            on the architecture's frame grid.
          example: 1000
        fps:
          type: number
          format: float
          minimum: 1
          maximum: 240
          default: 24.0
          description: Frame rate used for frame/second conversions.
          example: 24.0
        requested_segment_frames:
          type: integer
          nullable: true
          minimum: 1
          default: null
          description: >-
            Preferred per-invocation span, including the shared anchor. Null
            uses the architecture's own maximum. Snapped up to the frame grid.
            Under `segment_length_mode: shot_aligned` this is an UPPER BOUND
            rather than the length of every segment.
          example: 362
        segment_length_mode:
          type: string
          enum: [fixed, shot_aligned]
          nullable: true
          description: >-
            How to choose the segment boundaries. **Deliberately has no schema
            default**: omitted or null means "the caller did not choose" and the
            planner resolves it from the canonical timeline — `shot_aligned`
            when the clip contains a shot boundary to align to, `fixed`
            otherwise. The condition is the timeline, not
            `requested_segment_frames`: on an architecture with no
            single-inference maximum a plan without a requested segment length
            is a single segment, so a rule keyed on that field would never
            apply there. `fixed` gives every segment
            `requested_segment_frames`, with whatever is left in the last one,
            and is the only value that keeps an explicitly requested segment
            length as the length of every segment. `shot_aligned` treats
            `requested_segment_frames` as an upper bound and picks boundaries
            that split as few shots as possible: shots shorter than one segment
            share a segment, shots longer than one segment are split and
            disclosed in `warnings`, and the user's shot timestamps are never
            moved. It changes the segment count and lengths — each extra
            segment is another upload, decode and segment boundary — which
            `frame_plan.segment_count` and `frame_plan.segment_new_output_frames`
            report. A prompt with no shot structure is planned at fixed lengths
            whichever value is sent (with a warning when `shot_aligned` was
            asked for by name). The mode that was APPLIED is
            `manifest.segment_length_mode`.
          example: "fixed"
        boundary_crossing_policy:
          type: string
          enum: [refuse, assign_to_earlier_segment]
          default: refuse
          description: >-
            What to do with a shot (or any timeline event) whose frames cross a
            segment boundary. `refuse` (default) answers with a plan error
            naming the shot, its frame range and the frame it is cut at, and
            plans nothing — the shipped behaviour. `assign_to_earlier_segment`
            gives the whole shot to the earlier segment, which describes it in
            full while the later segment does not restate it; every crossing is
            then reported in `warnings` with the same shot number, frame range
            and cut frame. Nothing is ever cut in two, and the shot timestamps
            are not moved either way. Applies to both `segment_length_mode`
            values, but only decides anything under `fixed`: there the
            boundaries follow from the frame arithmetic, so a caller cannot
            place timestamps on them before planning. Under `shot_aligned` the
            planner chose the boundaries itself and already keeps whole the
            shots it could fit, so the shots it could not fit on the frame grid
            are disclosed as warnings whichever policy is sent — which is also
            what a request naming no `segment_length_mode` gets whenever the
            timeline has a shot boundary to align to. It is not part of
            `plan_hash`: it decides whether a plan is produced, not what the
            produced plan contains.
          example: "refuse"
        context_mode:
          type: string
          enum: [timeline, manual, legacy_repeat]
          nullable: true
          description: >-
            How to turn the root prompt into segment prompts. **Deliberately
            has no schema default**: the server must be able to tell "the
            caller chose `timeline`" from "the caller chose nothing", so an
            omitted or null value is not the same request as `timeline`.
            Omitted, the planner applies `timeline` only when the root prompt
            parses structurally (`[Shot N]` markers); for free-form prose it
            refuses to choose and returns a 400 asking the caller to pick, and
            it never silently falls back to `legacy_repeat`. Sending
            `timeline` explicitly for a prompt that does not parse and without
            a `canonical_timeline` is also a 400. `manual` requires
            `canonical_timeline`.
          example: "timeline"
        seed_policy:
          type: string
          enum: [fixed, derived]
          default: fixed
          description: >-
            Per-segment seeding. `fixed` (default) reuses the root seed
            everywhere, matching today's behaviour; `derived` hashes root seed,
            plan hash and segment index. `explicit` — a member of the manifest's
            `seed_policy` enum — is **not accepted here** and is answered with a
            400: this request has no field that carries per-segment seeds, so
            planning with it would freeze seeds the caller never chose. Reach it
            by planning with `fixed` or `derived`, setting `segments[].seed` in
            the editor and re-validating.
          example: "fixed"
        root_seed:
          type: integer
          minimum: -1
          default: -1
          description: >-
            Root seed. -1 draws a real seed once during planning and freezes it
            in the manifest, so a re-run of the same plan is reproducible.
          example: -1
        continuation_mode:
          type: string
          enum: [boundary_frame, pinned_tail, motion_preroll, tail_reference_video, sampler_state]
          default: boundary_frame
          description: >-
            Requested continuation context. A mode absent from
            `GET /schema/arch-capabilities`'s
            `chain_context[architecture].chain_continuation_modes` (or from the
            `variants[variant]` entry when one exists) is a 400, never a
            downgrade. The enum here is the wire vocabulary, which is wider than
            what any architecture advertises: the unimplemented candidates are
            named so they can be refused by name.
          example: "boundary_frame"
        requested_overlap_frames:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Requested shared frames between neighbouring segments, and the
            `continuation_overlap_frames` every continuation of this plan will
            be sent. 0 = the single shared anchor frame, which is what
            `continuation_mode: boundary_frame` shares; a mode that PINS an
            overlap requires a value inside
            `chain_context[architecture].chain_context_min_frames` ..
            `chain_context_max_frames` and on the VAE group grid, and refuses
            anything else with a 400 (the same refusal
            `POST /generate/outpaint/video` gives) rather than snapping it.
            `motion_preroll` uses the same field for its PRE-ROLL length, with
            its own bounds (`chain_motion_preroll_min_frames` ..
            `chain_motion_preroll_max_frames`) and no alignment requirement. The
            plan's frame ranges are computed WITH this overlap, so
            `segments[].owned_end_frame` is the length the chain actually
            reaches, not the length a 1-frame anchor would have reached.
          example: 0
        requested_anchor_count:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Anchors every `motion_preroll` continuation of this plan places on
            its pre-roll, and the `continuation_anchor_count` each one is sent.
            Required by that mode, inside
            `chain_context[architecture].chain_motion_preroll_min_anchors` ..
            `chain_motion_preroll_max_anchors`; a non-zero value with any other
            continuation mode is a 400, since that mode places no anchors and
            the field would otherwise be dropped silently. The resolved
            positions are fixed in the manifest
            (`segments[].visual_context.anchor_local_frames`), and the plan
            discloses that the pre-roll is generated and thrown away.
          example: 0
        chain_drift_tolerance_frames:
          type: integer
          minimum: 0
          maximum: 240
          default: 12
          description: >-
            Allowed planned-vs-actual accumulated-frame divergence before the
            chain pauses. In frames, so it does not depend on `fps`. Carried
            through to the manifest unchanged and excluded from `plan_hash` —
            it changes nothing the plan is made of.
          example: 12
        references:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/VideoChainReferenceInput'
          description: >-
            Reference inventory (kind and label only). Entries without
            `segment_indices` bind to every segment.
        canonical_timeline:
          type: object
          nullable: true
          default: null
          description: >-
            Caller-supplied timeline, required when `context_mode` is `manual`
            and ignored otherwise. Same shape the planner would have produced.
          properties:
            persistent_context:
              $ref: '#/components/schemas/VideoChainPersistentContext'
            events:
              type: array
              items:
                $ref: '#/components/schemas/VideoChainEvent'
              description: Events in global frames, each owned by exactly one segment after planning.

    VideoChainSegmentPreview:
      type: object
      description: >-
        Flattened per-segment view for the plan editor, so a client can render
        the segment list without walking the manifest.
      required: [index, prompt, global_frame_start, global_frame_end, generated_span_frames]
      properties:
        index:
          type: integer
          minimum: 0
          description: Segment index.
          example: 1
        prompt:
          type: string
          description: Compiled prompt for this segment.
          example: "[Shot 1] The woman reaches the window and pushes it open. ..."
        negative_prompt:
          type: string
          description: Negative prompt for this segment.
          example: ""
        global_frame_start:
          type: integer
          minimum: 0
          description: Inclusive first owned global frame.
          example: 362
        global_frame_end:
          type: integer
          minimum: 0
          description: Exclusive last owned global frame.
          example: 723
        generated_span_frames:
          type: integer
          minimum: 1
          description: Frames requested from the model, including the shared anchor.
          example: 362
        new_output_frames:
          type: integer
          minimum: 0
          description: Frames this segment adds (`generated_span_frames - 1` for a continuation).
          example: 361
        reference_count:
          type: integer
          minimum: 0
          description: >-
            References bound to this segment. Shown because reference rows are
            carried through every denoise step, so this is a cost as well as a
            quality knob.
          example: 1
        seed:
          type: integer
          description: Frozen seed for this segment.
          example: 1234567890

    VideoChainFramePlan:
      type: object
      description: Frame arithmetic after grid snapping, summarised for display.
      required: [target_frames, expected_final_frames, overshoot_frames, segment_frames]
      properties:
        target_frames:
          type: integer
          minimum: 1
          description: Requested final length.
          example: 1000
        expected_final_frames:
          type: integer
          minimum: 1
          description: Final length after snapping and shared-anchor de-duplication.
          example: 1016
        overshoot_frames:
          type: integer
          description: >-
            `expected_final_frames - target_frames`. Positive when the frame
            grid forces a longer clip than requested.
          example: 16
        segment_frames:
          type: array
          items:
            type: integer
            minimum: 1
          description: Per-segment `generated_span_frames`, in order.
          example: [362, 362, 294]
        segment_count:
          type: integer
          minimum: 1
          description: >-
            Number of generation requests this plan makes. Shown alongside the
            per-segment lengths because the two are the trade-off a
            shot-aligned plan asks the user to weigh: each segment is one more
            upload, decode and segment boundary.
          example: 3
        segment_new_output_frames:
          type: array
          items:
            type: integer
            minimum: 0
          description: >-
            Frames each segment ADDS to the clip, in order
            (`owned_end_frame - owned_start_frame`). Differs from
            `segment_frames` by the shared region of each continuation.
          example: [362, 361, 293]
        segment_length_mode:
          type: string
          enum: [fixed, shot_aligned]
          description: The mode that produced these lengths (the manifest's applied value).
          example: "fixed"
        frame_grid:
          type: string
          nullable: true
          description: >-
            Human-readable description of the architecture's legal span lengths,
            for explaining the overshoot.
          example: "17n+5, capped at 362"

    VideoChainPlanResponse:
      type: object
      description: >-
        Planner output. `success: false` with populated `errors` is a normal
        200: content problems belong next to the offending segment in the
        editor, not in an HTTP status.
      required: [success, manifest, segments, frame_plan, errors, warnings, plan_schema_version]
      properties:
        success:
          type: boolean
          description: True when the plan has no hard errors and may be started.
          example: true
        manifest:
          allOf:
            - $ref: '#/components/schemas/VideoChainManifest'
          description: >-
            The Chain Manifest. Always present, `success: false` included:
            frame geometry is computed before any prompt work, so when
            compiling the prompts fails the response still carries a
            **geometry-only manifest** — real segment spans, ownership ranges,
            reference bindings, seeds and `plan_hash`, but every
            `segments[].prompt` empty — and the reason is in `errors`. That
            gives the editor somewhere to show the error next to the offending
            segment. A manifest whose prompts are empty must never be started;
            gate on `success`, not on the manifest's presence.
        segments:
          type: array
          items:
            $ref: '#/components/schemas/VideoChainSegmentPreview'
          description: Per-segment prompt previews in execution order.
        frame_plan:
          $ref: '#/components/schemas/VideoChainFramePlan'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/VideoChainIssue'
          description: Hard errors. Non-empty means the chain must not start.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/VideoChainIssue'
          description: Advisory findings (grid overshoot, unused reference, unreferenced segment).
        plan_schema_version:
          type: integer
          minimum: 1
          description: Version of the planner's request/response contract.
          example: 1
        planner_cache_key:
          type: string
          nullable: true
          description: >-
            Cache key for the timeline-extraction step, so an unchanged root
            prompt and settings can reuse the previous extraction. Null when no
            extraction was needed (the deterministic path) or nothing was
            cached.
          example: "h3-timeline:v1:9f2c1a...:8f14e4"

    VideoChainValidateRequest:
      type: object
      description: Re-validate a manifest the user edited in the plan editor.
      required: [manifest]
      properties:
        manifest:
          allOf:
            - $ref: '#/components/schemas/VideoChainManifest'
          description: The edited manifest, in the shape `/video-chain/plan` returned.
        recompute_plan_hash:
          type: boolean
          default: true
          description: >-
            Recompute `plan_hash` over the edited manifest and return it. The
            backend is the only implementation of this hash.
          example: true

    VideoChainValidateResponse:
      type: object
      description: Validation result for an edited manifest.
      required: [valid, errors, warnings]
      properties:
        valid:
          type: boolean
          description: True when `errors` is empty; the editor gates "Start chain" on this.
          example: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/VideoChainIssue'
          description: >-
            Hard errors: an event owned by no segment or by more than one, a
            timestamp outside its segment's span, a reference token for a
            reference not bound to that segment, or a mismatch between
            `references[].segment_indices` and `segments[].reference_ids`.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/VideoChainIssue'
          description: >-
            Advisory findings, e.g. a reference bound to no segment at all, or a
            segment left with no references on a variant whose identity
            retention depends on them.
        plan_hash:
          type: string
          nullable: true
          description: >-
            Hash of the edited manifest when `recompute_plan_hash` is true, else
            null. This is the value recorded as provenance on generated segments.
          example: "8f14e45fceea167a5a36dedd4bea2543f1c1b7c8f1d1a0e4c1a0b7f3d2e5a6b7"
        manifest:
          allOf:
            - $ref: '#/components/schemas/VideoChainManifest'
          nullable: true
          description: >-
            The normalized manifest (derived fields such as
            `segments[].reference_ids` recomputed) when validation succeeded,
            else null.

    ControlNetInfo:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
          description: ControlNet model name
          example: "control_canny-fp16"
        path:
          type: string
          description: Relative path to model file
          example: "controlnet/control_canny-fp16.safetensors"
        type:
          type: string
          enum: [standard, lllite]
          description: ControlNet type
          default: standard
        size:
          type: integer
          description: File size in bytes
          example: 1456734208
        hash:
          type: string
          description: Model hash (SHA256)
          example: "a1b2c3d4e5f6..."

    ControlNetListResponse:
      type: object
      properties:
        controlnets:
          type: array
          items:
            $ref: '#/components/schemas/ControlNetInfo'

    LoRAInfo:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
          description: LoRA model name
          example: "my_style_lora"
        path:
          type: string
          description: |
            LoRA identifier, used as `loras[].path` in generation requests and
            as the `{lora_name}` path parameter of `GET /loras/{lora_name}`.

            Usually a path relative to the directory it was found in (default
            LoRA directory, the `training/` directory, or a user-configured /
            auto-discovered additional directory) -- this is the historical
            format and remains stable for identifiers already stored in
            presets, gallery rows, or loop-generation configs.

            When the SAME relative path exists under more than one registered
            directory (a real collision), every occurrence except the
            highest-priority one is instead returned as a disambiguated
            `"{dir_tag}::{relative_path}"` identifier, where `dir_tag` is an
            opaque per-directory tag. Both forms are valid inputs everywhere a
            LoRA identifier is accepted.
          example: "lora/my_style_lora.safetensors"
        arch:
          type: string
          description: |
            Model architecture detected from the LoRA file's own key names at
            scan time (NOT the currently loaded model). `"unknown"` is a
            first-class value for LoRA files whose key structure doesn't match
            any recognized signature -- it is not an error.
          enum: [sd15, sdxl, zimage, flux2, minimax_h3, unknown]
          example: "sdxl"
        size:
          type: integer
          description: File size in bytes
          example: 143654912
        hash:
          type: string
          description: Model hash (SHA256)
          example: "f1e2d3c4b5a6..."
        exists:
          type: boolean
          description: Whether the resolved file still exists on disk (GET /loras/{lora_name} only)
          example: true
        layers:
          type: array
          description: |
            Block/layer labels detected in the LoRA file (GET /loras/{lora_name}
            only). Format depends on `arch`: BASE/IN00-.../MID/OUT00-... for
            sd15/sdxl, NRef.../CRef.../FDiT... for zimage, DUAL.../SING... for
            flux2, MMB.../TREF.../FINAL for minimax_h3.
          items:
            type: string
          example: ["IN00", "IN01", "MID", "OUT00"]
        recommended:
          allOf:
            - $ref: '#/components/schemas/LoRARecommendedSettings'
          nullable: true
          description: |
            Sampling settings this LoRA declares itself distilled for, parsed
            from the file's own safetensors `__metadata__` (GET
            /loras/{lora_name} only). `null` when the file's metadata declares
            nothing recognized -- never a guessed/invented recommendation.

    LoRARecommendedSettings:
      type: object
      description: |
        Recommendation for a step-distillation LoRA, derived only from fields
        the LoRA file's own metadata declares (currently `student_steps`).
      required:
        - num_inference_steps
        - fbcache_enable
        - spectrum_enable
        - source
      properties:
        num_inference_steps:
          type: integer
          description: |
            `student_steps + 1` from the file's metadata. `num_inference_steps`
            in this API counts sigma grid points INCLUDING the terminal 0, one
            more than the number of model evaluations the LoRA declares it was
            distilled for.
          example: 5
        fbcache_enable:
          type: boolean
          description: |
            Recommended off -- First Block Cache assumes dozens of evaluations
            to amortize its own bookkeeping, meaningless at a handful of
            distilled steps.
          example: false
        spectrum_enable:
          type: boolean
          description: Recommended off, for the same reason as fbcache_enable.
          example: false
        source:
          type: string
          description: Which metadata field this recommendation was derived from.
          enum: [student_steps]
          example: "student_steps"

