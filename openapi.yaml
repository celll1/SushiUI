          description: "Outpaint conditioning: maximum area fraction of the canvas for the sampled known-region crop."
          default: 0.8
          example: 0.8
        outpaint_edge_anchor_prob:
          type: 'number'
          description: "Outpaint conditioning: probability the known-region crop is flush against a canvas edge (one-directional extend)."
          default: 0.34
          example: 0.34
        outpaint_corner_anchor_prob:
          type: 'number'
          description: "Outpaint conditioning: probability the known-region crop is flush into a canvas corner (two-directional extend)."
          default: 0.33
          example: 0.33
        outpaint_mask_channel:
          type: 'boolean'
          description: "Outpaint conditioning: include the binary known-mask as a 4th conditioning channel (crop RGB + mask). False = 3-channel RGB only (ablation)."
          default: true
          example: true
        outpaint_known_loss_weight:
          type: 'number'
          description: "Outpaint conditioning: loss weight applied to the KNOWN (given-crop) region; the generate region stays at 1.0. Down-weighting focuses capacity on the continuation. Must stay below 0.5 (the gen-region metric threshold); values outside [0.0, 0.5) are clamped."
          default: 0.3
          minimum: 0.0
          exclusiveMaximum: 0.5
          example: 0.3
        outpaint_seam_loss_boost:
          type: 'number'
          description: "Outpaint conditioning: additional loss weight added on the generate-side cells adjacent to the known/unknown boundary. 0 = off."
          default: 0.0
          example: 0.0
        outpaint_seam_ring_width:
          type: 'integer'
          description: "Outpaint conditioning: number of seam rings outpaint_seam_loss_boost covers. 1 (default) applies the boost to the single generate-side latent cell adjacent to the known region. 2 adds a second ring (one more cell outward) weighted at half the boost increment. No effect when outpaint_seam_loss_boost is 0."
          default: 1
          minimum: 1
          maximum: 2
          example: 1
        outpaint_seam_grad_lambda:
          type: 'number'
          description: "Outpaint conditioning: weight of the cross-seam prediction-error continuity term, computed on the native prediction (model output minus target) across known/generate boundary pairs and added to the per-sample loss before Min-SNR weighting. 0.0 (default) disables the term entirely."
          default: 0.0
          minimum: 0.0
          example: 0.0
        outpaint_loss_normalize:
          type: 'boolean'
          description: "Outpaint conditioning: when true, divides each sample's weighted loss by that sample's own mean loss-weight before averaging, decoupling per-sample loss scale from the known/generate rect area. False (default) keeps the existing behavior (weighted loss averaged over all elements)."
          default: false
          example: false
        outpaint_edge_feather_min_px:
          type: 'number'
          description: "Outpaint crop_mask ControlNet conditioning: lower bound (canvas px) of the per-sample RANDOM inward edge-feather drawn during training. The known/unknown rect perimeter is softened INWARD over a randomly drawn width in [min, max] px so the ControlNet does not learn the razor-sharp axis-aligned edge as scene structure (a 'frame'). 0.0 (default) = razor-sharp/off (byte-identical resume-safe conditioning)."
          default: 0.0
          minimum: 0.0
          example: 0.0
        outpaint_edge_feather_max_px:
          type: 'number'
          description: "Outpaint crop_mask ControlNet conditioning: upper bound (canvas px) of the per-sample RANDOM inward edge-feather drawn during training (paired with outpaint_edge_feather_min_px). Must be >= min. 0.0 (default) = razor-sharp/off (byte-identical resume-safe conditioning)."
          default: 0.0
          minimum: 0.0
          example: 0.0
        rescan_before_training:
          description: |
            Pre-flight dataset drift check / rescan mode, run before the trainer
            subprocess starts. Persisted into the run's config YAML under
            config.process[0].train.rescan_before_training.
            "off" skips it; "path" detects added/missing files; "smart" adds a
            caption sidecar mtime check; "force" always rescans.
            Legacy booleans are accepted (true -> "path", false -> "off").
          oneOf:
            - type: string
              enum: [off, path, smart, force]
            - type: boolean
          default: "off"
          example: "off"
    VaeTrainingDefaults:
      type: object
      description: |
        Options for a decoder-only VAE fine-tune (`training_method:
        "vae_decoder"` / `network.type: vae_decoder`). Single source of truth:
        `backend/api/param_defaults.py` `VAE_TRAINING_DEFAULTS`, served by
        `GET /schema/vae-training-defaults`.

        The default trains the DECODER with the ENCODER FROZEN, which is the
        shape of the only published, shipped recipe (`stabilityai/sd-vae-ft-mse`:
        decoder only, encoder frozen, MSE + 0.1*LPIPS). Under a frozen encoder
        the KL term is constant w.r.t. every trainable parameter, so it is not
        constructed at all and `kl_weight` is ignored.

        Encoder training is available behind a double gate (`train_encoder` AND
        `acknowledge_latent_space_break`, both true, or the run is refused).
        It changes the latent distribution, so cached latents, LoRAs and
        diffusion checkpoints built against the original VAE no longer match the
        result; the export is written to a differently-named directory, the
        provenance sidecar records `encoder_trained: true`, and
        `export_bare_ldm` is refused.
      properties:
        batch_size:
          type: integer
          minimum: 1
          default: 1
          description: Images per optimizer micro-step. Written to `process.train.batch_size`.
          example: 4
        total_steps:
          type: integer
          minimum: 1
          default: 2000
          description: Total optimizer steps. Written to `process.train.steps`.
          example: 8000
        gradient_accumulation_steps:
          type: integer
          minimum: 1
          default: 1
          example: 1
        learning_rate:
          type: number
          exclusiveMinimum: 0
          default: 1.0e-5
          description: |
            Written to `process.train.lr`. Must be > 0: at 0 every optimizer
            step is a no-op, so the run would finish, report success and export
            the base VAE unchanged; a negative value ascends the loss.
          example: 1.0e-5
        optimizer:
          type: string
          enum: ["adamw", "adamw8bit", "adafactor", "lion8bit", "paged_adamw", "paged_adamw8bit", "paged_lion8bit", "adamw8bit_ringbuffer", "lion8bit_ringbuffer"]
          default: "adamw"
          description: |
            Resolved by `core/training/optimizer_factory.OptimizerFactory`; the
            enum is exactly the set that factory knows, checked here so an
            unknown name does not raise only after the base VAE has been loaded.

            The two `*_ringbuffer` entries run, but not as their name suggests:
            this trainer passes no ring-buffer allocator, and both
            implementations then fall back to allocating their 8-bit state on
            the GPU — the same placement as plain `adamw8bit` / `lion8bit`. The
            trainer logs that at startup. Prefer the plain names unless you are
            reproducing an existing run.
          example: "adamw"
        optimizer_weight_decay:
          type: number
          minimum: 0
          default: 0.001
          description: |
            Decoupled weight decay. Must be >= 0: a negative decay multiplies
            every weight by more than 1 on each step, which grows the VAE's
            weights without bound and is not reported until the loss stops
            being finite.
          example: 0.001
        max_grad_norm:
          type: number
          minimum: 0
          default: 0.1
          description: |
            Gradient-norm clip applied to the trainable parameters. **0 disables
            clipping**, which is the same meaning the key has in the diffusion
            trainers (`base_trainer`, `optimizers/fused_optimizer_groups`).
            Passing 0 to `clip_grad_norm_` directly would instead scale every
            gradient by `0 / total_norm`, i.e. to exactly zero, leaving only
            AdamW's decoupled weight decay to change the weights — a run that
            reports success while decaying rather than training. A negative
            value is refused: the clip factor is clamped only from above, so it
            would negate every gradient.
          example: 0.1
        lr_scheduler:
          type: string
          enum: ["constant", "constant_with_warmup", "linear", "cosine", "cosine_with_restarts", "polynomial"]
          default: "constant"
          description: |
            `diffusers.optimization.get_scheduler` name. Restricted to the
            schedules this trainer can actually run: `piecewise_constant`
            requires a `step_rules` argument that is never passed, and an
            unrecognised name is not a run-time error either — the trainer
            catches the failure and continues at a CONSTANT learning rate, so
            the run would silently ignore the schedule its config records.

            `constant` together with `lr_warmup_steps > 0` is REFUSED:
            `get_scheduler`'s `CONSTANT` branch returns before
            `num_warmup_steps` is passed to anything, so the run would train at
            the full learning rate from step 0 while the YAML, the sidecar and
            the LR chart all record a warmup. Use `constant_with_warmup`.
          example: "constant"
        lr_warmup_steps:
          type: integer
          minimum: 0
          default: 0
          description: |
            Linear warmup length. Must be strictly below `total_steps`:
            otherwise the entire run is warmup and `learning_rate` is never
            reached, while the YAML, the provenance sidecar and the LR chart
            all still report it. Requires an `lr_scheduler` that consumes it —
            above 0 with `lr_scheduler: constant` is refused, since that
            schedule never receives the value.
          example: 0
        seed:
          type: integer
          minimum: 0
          maximum: 4294967295
          default: 42
          description: |
            Seeds python `random`, `numpy` and `torch`, and keys the dataset
            crop RNG.

            Bounded because outside this range the run does not use the seed it
            records: the trainer seeds python and torch with the literal value
            but numpy with `seed % 2**32`, so `-1` reaches numpy as 4294967295
            and `2**32 + 7` as 7, while `train_state.json` and the export
            sidecar keep the original — the generators disagree and the recorded
            seed no longer reproduces the run. Note there is no
            `-1 means random` convention here (unlike the generation seeds):
            a negative value would run as a literal seed.
          example: 42
        num_workers:
          type: integer
          minimum: 0
          default: 2
          description: DataLoader worker processes for raw-image loading.
          example: 2
        save_every:
          type: integer
          minimum: 0
          default: 500
          description: Checkpoint interval in steps. Written to `process.save.save_every`.
          example: 500
        max_step_saves_to_keep:
          type: integer
          minimum: 0
          default: 3
          description: |
            Checkpoint-keep pruning (0 = keep all). Written to
            `process.save.max_step_saves_to_keep`, i.e. the same field the
            existing training UI already exposes.
          example: 3
        vae_source:
          type: string
          enum: ["model", "path", "store"]
          default: "model"
          description: |
            Where the base VAE comes from. `model` (default) = the run's own
            `base_model_path`, which the create route already validates; `path` =
            an explicit diffusers directory or bare `.safetensors` in `vae_path`;
            `store` = the shared VAE store, keyed by `vae_arch`.

            Note the store's `sdxl` entry is `madebyollin/sdxl-vae-fp16-fix`,
            whose fp16 safety comes from a weight rescaling that fine-tuning does
            not preserve; the trainer warns when it detects that base.
          example: "model"
        vae_path:
          type: string
          default: ""
          description: |
            Explicit VAE path, used when `vae_source` is `path`: either a
            diffusers VAE directory (which carries its own `config.json`) or a
            single weight file. Any file `AutoencoderKL.from_single_file` accepts
            is loaded — `.safetensors`, and also `.ckpt` / `.pt` / `.bin`, which
            have their own handling because their contents cannot be inspected
            without unpickling them. A single file also requires `vae_arch`,
            which is what states the exported `scaling_factor`.
          example: "M:/model/sdxl/VAE/sdxl_vae.safetensors"
        vae_arch:
          type: string
          default: ""
          description: |
            VAE-store key naming the architecture of the base VAE — one of
            `sdxl`, `sd15`, `flux1`, `flux2`, `qwen_image` (the keys of
            `core/models/common/vae_store.VAE_REGISTRY`). Empty means "not
            stated", which is the default.

            It is read in two places:

            - with `vae_source: "store"` it selects the store entry to load, and
              an empty value is refused;
            - for a base VAE that comes from a SINGLE FILE (any `vae_source`,
              including a `.safetensors` / `.ckpt` `base_model_path`), it is the
              only thing that can say which family the file belongs to. Such a
              file carries no `config.json`, and `from_single_file` falls back to
              0.18215 for every 4-channel VAE, while `save_pretrained` bakes
              whatever ends up on the config into the exported `config.json`
              that the inference-side VAE override then trusts (SD1.5 0.18215 vs
              SDXL 0.13025 is a 1.40x latent-scale difference).

            The trainer therefore refuses a single-file base VAE whose
            `vae_arch` is empty or is not one of the keys above, refuses a key
            whose latent-channel count contradicts the loaded file, and never
            overwrites a value that the file itself provided (a full checkpoint,
            where `from_single_file` identified the family) — but a stated key
            whose scaling factor contradicts such a file is refused as well,
            since one of the two must be wrong. `flux2` and
            `qwen_image` have no scalar scaling factor at all, so for those the
            loaded value is left as it is and recorded as unverified in the
            export's provenance sidecar.
          example: "sdxl"
        train_decoder:
          type: boolean
          default: true
          description: |
            Train the decoder. `false` together with `train_encoder: false` is
            refused (nothing trainable), and so is `false` together with
            `train_encoder: true` (encoder-only training under a frozen decoder).
          example: true
        decoder_blocks:
          type: string
          enum: ["all", "up_blocks", "mid_block", "conv_out"]
          default: "all"
          description: |
            Which part of the decoder to unfreeze (ai-toolkit's `blocks_to_train`).
            `all` also includes `post_quant_conv`, which is part of the decode path.
          example: "all"
        train_encoder:
          type: boolean
          default: false
          description: |
            Train the encoder as well as the decoder. Requires
            `acknowledge_latent_space_break: true` in the same config; either key
            without the other is refused.

            The encoder defines the latent distribution, so training it means
            existing latent caches, LoRAs and diffusion checkpoints no longer
            match this VAE. The result is exported to
            `<run_name>_vae_encoder_trained/` rather than `<run_name>_vae/`, its
            `sushi_vae_training.json` records `encoder_trained: true`, and
            `export_bare_ldm` is refused for the run.
          example: false
        acknowledge_latent_space_break:
          type: boolean
          default: false
          description: |
            Acknowledgement gate for `train_encoder`. Both must be true.
            `true` on its own (with `train_encoder: false`) is also refused, so
            the flag cannot be left set from a previous configuration and then
            silently apply to a later one.
          example: false
        encoder_blocks:
          type: string
          enum: ["all", "down_blocks", "mid_block", "conv_out"]
          default: "all"
          description: |
            The encoder mirror of `decoder_blocks`; read only when
            `train_encoder` is true. `all` also includes `quant_conv`, which is
            part of the encode path.
          example: "all"
        resolution:
          type: integer
          multipleOf: 8
          minimum: 64
          default: 512
          description: |
            Square random-crop size for training. No aspect-ratio bucketing: the
            decoder's only non-local terms (one flattened mid-block attention and
            30 GroupNorms) reduce over the spatial axes, so they observe latent
            AREA and never aspect — and constant-area bucketing would leave that
            unchanged.
          example: 512
        crop_scale_policy:
          type: string
          enum: ["downscale", "native", "mixed"]
          default: "downscale"
          description: |
            How much an image is resampled BEFORE the square crop is taken —
            measured to be the dominant control on what the fine-tune learns.

            - `downscale` (default, the historical behaviour): the short side is
              scaled to exactly `resolution`. Over the 22 datasets in use
              (3,842,897 items) that downscales 95.79% of images by a median
              2.30x. LANCZOS downscaling *concentrates* high frequency rather
              than blunting it (the resulting crop carries 4.06x the top-octave
              power of a native crop), and the measured cost is calibration: the
              fine-tune's accuracy gain is ~30% smaller on native-resolution
              content (edge residual -7.7% vs -12.5%, positive on 19/19).
            - `native`: never downscale — crop a `resolution`-sized window out of
              the full-size pixels, upscaling only images whose short side is
              genuinely below `resolution` (4.21% of the corpus).
            - `mixed`: draw the downscale factor per sample, log-uniformly over
              `[1, min(short/resolution, crop_scale_max_downscale)]`, so the
              decoder sees the whole range including 1x (what inference presents).

            Free either way: a native crop is 44% cheaper in the dataloader
            (17.4 vs 30.8 ms) and every policy has 8-30x headroom over the GPU;
            `mixed` is ~15% dearer than `downscale`. Validation is unaffected —
            it is always a deterministic centre crop under the `downscale`
            policy, so `vae_val_psnr` keeps one meaning.

            Every figure here is measured and recorded, with its method and
            sample size, in `scratchpad/vae_training/results_crop_geometry.md`
            (corpus census §1.2, mechanism §2, dose-response §3, loader cost
            §5.2 and §8.4); see also `docs/guides/VAE_TRAINING.md`.
          example: "downscale"
        crop_scale_max_downscale:
          type: number
          minimum: 0
          default: 0.0
          description: |
            Upper bound on the per-sample downscale factor under
            `crop_scale_policy: mixed`; `0` means the image's own
            `short/resolution` ratio (unbounded). Must be `0` or `>= 1.0`.

            REFUSED when `crop_scale_policy` is not `mixed`: only the per-sample
            draw consults it, so under the other policies it would be a knob the
            caller set and nothing read.
          example: 0.0
        dtype:
          type: string
          enum: ["bf16", "fp32"]
          default: "bf16"
          description: |
            Compute dtype for the autocast forward. The weights are always held
            in fp32 (they are the optimizer's master copy). `fp16` is refused
            outright: SD1.5/SDXL-family VAEs overflow it in their decoder
            activations, and this trainer has no gradient scaler, so on any other
            family fp16 gradients would silently underflow.
          example: "bf16"
        ema_enabled:
          type: boolean
          default: true
          description: |
            Exponential moving average over the trainable parameters. Both
            `sd-vae-ft-ema` and PiD use EMA.

            The decay is warmup-ramped (`min(ema_decay, (1+n)/(10+n))`) so a
            short run is not dominated by the base weights, and the retained
            base-VAE fraction is written to the `sushi_vae_training.json`
            sidecar and logged at save time. The run always writes BOTH
            `<run_name>_vae` (EMA) and `<run_name>_vae_noema` (live weights).
          example: true
        ema_decay:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
          default: 0.999
          description: Target EMA decay; the effective decay ramps up to this over the first updates.
          example: 0.999
        mse_weight:
          type: number
          minimum: 0
          default: 1.0
          description: L2 reconstruction term (ft-MSE's base term).
          example: 1.0
        l1_weight:
          type: number
          minimum: 0
          default: 0.0
          description: L1 reconstruction term (the LDM / ft-EMA term). Off by default.
          example: 0.0
        lpips_weight:
          type: number
          minimum: 0
          default: 0.1
          description: |
            LPIPS perceptual term. 0.1 is ft-MSE's weight; the term is what
            *creates* plausible high frequency, so a larger weight works against
            the artifact this fine-tune targets. Requires the `lpips` package
            when > 0 (checked before training starts).
          example: 0.1
        lpips_net:
          type: string
          enum: ["vgg", "alex", "squeeze"]
          default: "vgg"
          example: "vgg"
        ycbcr_dc_weight:
          type: number
          minimum: 0
          default: 0.1
          description: |
            Colour-drift term, under a single weight: a per-pixel Charbonnier on
            YCbCr with the luma channel downweighted (PiD's own formulation) PLUS
            a Charbonnier on the per-image, per-channel spatial-mean (DC)
            difference. Phase 0 measured 39-51/255 of red DC drift over 8
            encode/decode roundtrips on the SDXL VAEs; that is a spatial-mean
            defect, which a purely per-pixel penalty barely constrains.
          example: 0.1
        ycbcr_dc_y_weight:
          type: number
          minimum: 0
          default: 0.25
          description: |
            Luma channel weight inside `ycbcr_dc_weight`. Must be >= 0: the term
            is summed over its channels, so a negative channel weight pays the
            run for INCREASING that channel's colour error while the total loss
            still falls. Setting this and `ycbcr_dc_chroma_weight` both to 0
            while `ycbcr_dc_weight` is above 0 is refused — the term would be
            identically zero, and the "at least one active loss" check only
            looks at the top-level weight.
          example: 0.25
        ycbcr_dc_chroma_weight:
          type: number
          minimum: 0
          default: 1.0
          description: Chroma (Cb/Cr) channel weight inside `ycbcr_dc_weight`; same rules as `ycbcr_dc_y_weight`.
          example: 1.0
        ycbcr_dc_eps:
          type: number
          exclusiveMinimum: 0
          default: 0.001
          description: |
            Charbonnier smoothing constant in `sqrt(d^2 + eps^2) - eps`. Must be
            > 0: at 0 the term degenerates to `|d|`, whose gradient at an
            exactly-zero residual is NaN (and identical pixels are common in the
            flat regions this term exists for), and a negative value adds a
            constant offset to the reported loss instead of subtracting one.
          example: 0.001
        pattern_weight:
          type: number
          minimum: 0
          default: 0.0
          description: |
            Latent-cell grid-phase penalty. Default 0 (opt-in only): Phase 0
            measured the 8 px grid artifact at ratio ~1.0 on all four production
            VAEs under three independent metric definitions, i.e. the defect this
            term targets is not present at a measurable level.
          example: 0.0
        pattern_size:
          type: integer
          minimum: 1
          default: 8
          description: |
            Latent-cell size in pixels for `pattern_weight`. While
            `pattern_weight` is above 0 it must also be <= `resolution`: the
            term crops to whole cells, so a cell larger than the image leaves it
            none and it returns exactly 0 on every step while the config says it
            is active.
          example: 8
        l_invented_weight:
          type: number
          minimum: 0
          maximum: 10
          default: 0.0
          description: |
            Weight of the flat-region invented-HF penalty. Penalises
            high-frequency energy in the decode that a least-squares projection
            onto the source's own high-frequency content cannot explain, inside
            plane-fit flat/gradient windows. The projection coefficient is
            detached from the gradient, so the term is reduced by emitting less
            unexplained energy rather than by correlating more with the source.
            Not a standalone objective: its own minimum inside a flat window is
            emitting no high frequency at all, so it is meant to run alongside
            an agreement-with-source term (`mse_weight` / `lpips_weight`).
            0 disables the term.
          example: 0.0
        l_invented_y_weight:
          type: number
          minimum: 0
          maximum: 4
          default: 1.0
          description: Luma channel weight inside `l_invented_weight`.
          example: 1.0
        l_invented_chroma_weight:
          type: number
          minimum: 0
          maximum: 4
          default: 0.25
          description: Chroma (Cb/Cr) channel weight inside `l_invented_weight`.
          example: 0.25
        l_invented_flat_t_y:
          type: number
          minimum: 0
          maximum: 8
          default: 2.0
          description: |
            Flat-window luma plane-residual threshold, in 8-bit levels. A window
            counts as flat when the RMS residual of a least-squares plane fit is
            at or below this, so a smooth gradient qualifies as well as a
            constant region.

            While `l_invented_weight` is above 0 it must be strictly > 0: a
            threshold of 0 selects no window on real data, so the term would be
            inert for the whole run. With the term off the value is not read at
            all, so 0 is accepted there — "off by default" stays completely
            inert, and the remediation the refusal would name (`set
            l_invented_weight=0`) would already be true.
          example: 2.0
        l_invented_flat_t_c:
          type: number
          minimum: 0
          maximum: 8
          default: 1.25
          description: |
            Flat-window chroma plane-residual threshold, in 8-bit levels;
            applied to the larger of the Cb and Cr residuals. Same
            active/inactive rule as `l_invented_flat_t_y`.
          example: 1.25
        kl_weight:
          type: number
          minimum: 0
          default: 1.0e-6
          description: |
            Posterior KL weight, applied to a KL that is normalised by the
            per-image element count (C*H*W) so that it sits in the same
            reduction as the mean-reduced reconstruction terms. That
            normalisation is what makes 1e-6 mean here what it means in LDM,
            whose reconstruction term is summed rather than averaged over
            C*H*W; it also makes the knob resolution-invariant. The raw
            (unnormalised) KL is logged for comparability; the value charted as
            `vae_kl_loss` is the weighted contribution to the total loss.

            Constructed ONLY when `train_encoder` is true; under a frozen
            encoder it is constant w.r.t. every trainable parameter, so the term
            is skipped entirely and this value is ignored (the trainer logs
            that it is).
          example: 1.0e-6
        export_bare_ldm:
          type: boolean
          default: false
          description: |
            Also write the fine-tuned VAE as a bare LDM-format `.safetensors`
            next to the diffusers directory (`AutoencoderKL` only). REFUSED when
            `train_encoder` is true: a bare `.safetensors` carries no
            `config.json`, so the consumer inherits `scaling_factor` /
            `shift_factor` from the model it is plugged into, and those are
            exactly what an encoder fine-tune invalidates.
          example: false
        validation_every:
          type: integer
          minimum: 0
          default: 100
          description: |
            Steps between held-out validation passes (0 disables). The validation
            PSNR / blockiness chart is the user's only signal that a fine-tune is
            going wrong.
          example: 100
        validation_num_images:
          type: integer
          minimum: 1
          default: 8
          description: |
            Held-out images (taken from the tail of the dataset, excluded from
            training). Must be >= 1: the split is `items[-validation_num_images:]`,
            so 0 leaves the TRAINING split empty (`items[:-0]` is `items[:0]`)
            while validating on the whole dataset, and a negative value trains
            on the first few images only.
          example: 8
        validation_resolution:
          type: integer
          multipleOf: 8
          minimum: 64
          default: 1024
          description: |
            Resolution of the deterministic held-out centre crops. 1024 rather
            than 512: validation always uses the `downscale` policy (so the
            metric cannot change meaning when `crop_scale_policy` does), and at
            1024 the corpus's median 1131 px source is downscaled only ~1.1x,
            i.e. nearly native — whereas 512 measures the most flattering and
            least representative regime available (the same fine-tune gains
            +1.15 dB there against +0.81 dB on native content). Native crops from
            512 to 1536 showed the PSNR advantage holding at +0.93..+1.20 dB with
            no significant trend, so the change costs nothing in signal quality.

            Changing this MID-RUN puts a step in the `vae_val_psnr` chart.
          example: 1024
      example:
        batch_size: 1
        total_steps: 2000
        gradient_accumulation_steps: 1
        learning_rate: 1.0e-5
        optimizer: "adamw"
        optimizer_weight_decay: 0.001
        max_grad_norm: 0.1
        lr_scheduler: "constant"
        lr_warmup_steps: 0
        seed: 42
        num_workers: 2
        save_every: 500
        max_step_saves_to_keep: 3
        vae_source: "model"
        vae_path: ""
        vae_arch: ""
        train_decoder: true
        decoder_blocks: "all"
        train_encoder: false
        acknowledge_latent_space_break: false
        encoder_blocks: "all"
        resolution: 512
        crop_scale_policy: "downscale"
        crop_scale_max_downscale: 0.0
        dtype: "bf16"
        ema_enabled: true
        ema_decay: 0.999
        mse_weight: 1.0
        l1_weight: 0.0
        lpips_weight: 0.1
        lpips_net: "vgg"
        ycbcr_dc_weight: 0.1
        ycbcr_dc_y_weight: 0.25
        ycbcr_dc_chroma_weight: 1.0
        ycbcr_dc_eps: 0.001
        pattern_weight: 0.0
        pattern_size: 8
        l_invented_weight: 0.0
        l_invented_y_weight: 1.0
        l_invented_chroma_weight: 0.25
        l_invented_flat_t_y: 2.0
        l_invented_flat_t_c: 1.25
        kl_weight: 1.0e-6
        export_bare_ldm: false
        validation_every: 100
        validation_num_images: 8
        validation_resolution: 1024
